   6. Building the room from the description
   --------------------------------------------------------------------- */
const toRadians = degrees => (degrees || 0) * Math.PI / 180;

// The shell: floor, ceiling and four walls.
function buildShell(scene, textures, raycastTargets) {
  const { width, depth, height } = ROOM.size;
  const floor = new THREE.Mesh(
    new THREE.PlaneGeometry(width, depth).rotateX(-Math.PI / 2),
    new THREE.MeshStandardMaterial({ map: textures.floor, roughness: 0.75 }),
  );
  const ceiling = new THREE.Mesh(
    new THREE.PlaneGeometry(width, depth).rotateX(Math.PI / 2).translate(0, height, 0),
    new THREE.MeshStandardMaterial({ color: ROOM.colors.ceiling, map: textures.ceiling || null, emissive: ROOM.colors.ceilingGlow || '#000000', roughness: 1 }),
  );
  scene.add(floor, ceiling);
  raycastTargets.push(floor, ceiling);

  const wallMaterial = new THREE.MeshStandardMaterial({ map: textures.walls, roughness: 0.95 });
  if (ROOM.surfaces?.walls === 'concrete') {
    wallMaterial.normalMap = concreteRelief(seededRandom(77));
    wallMaterial.normalMap.repeat.copy(textures.walls.repeat).multiplyScalar(2);
    wallMaterial.normalScale.set(0.3, 0.3);                // barely there
  }
  const walls = [
    { w: width, x: 0, z: -depth / 2, turn: 0 },              // far
    { w: width, x: 0, z: depth / 2, turn: 180 },             // near
    { w: depth, x: -width / 2, z: 0, turn: 90 },             // left
    { w: depth, x: width / 2, z: 0, turn: -90 },             // right
  ];
  for (const wall of walls) {
    const hole = wall.turn === 0 ? ROOM.windowHole : ROOM.wallHoles?.[{ 180: 'near', 90: 'left', [-90]: 'right' }[wall.turn]];
    const holed = !!hole;                                 // the far wall has the window; the left wall the stairwell doorway
    const geometry = holed ? wallWithHole(wall.w, height, hole) : new THREE.PlaneGeometry(wall.w, height);
    const mesh = new THREE.Mesh(geometry, wallMaterial);
    mesh.position.set(wall.x, holed ? 0 : height / 2, wall.z);
    mesh.rotation.y = toRadians(wall.turn);
    scene.add(mesh);
    raycastTargets.push(mesh);
  }
  // skirting boards: a dark strip along the bottom of each wall
  const skirtMaterial = new THREE.MeshStandardMaterial({ color: '#141216', roughness: 0.6 });
  for (const wall of walls) {
    const mesh = new THREE.Mesh(new THREE.BoxGeometry(wall.w, 0.1, 0.02), skirtMaterial);
    mesh.position.set(wall.x, 0.05, wall.z);
    mesh.rotation.y = toRadians(wall.turn);
    mesh.translateZ(0.01);
    scene.add(mesh);
  }
}

// The glass in the window: raindrops beading and running down, a little mist at the bottom.
// It's see-through; the real 3D city is behind it (see buildCity).
function glassMaterial(shared, size) {
  return new THREE.ShaderMaterial({
    uniforms: { uTime: shared.uTime, uFlash: shared.uFlash, uAspect: { value: size[0] / size[1] }, ...shared.roomWave },
    transparent: true,
    depthWrite: false,
    fog: false,
    vertexShader: /* glsl */`
      varying vec2 vUv;
      varying vec3 vGlassWorld;
      void main() { vUv = uv; vGlassWorld = (modelMatrix * vec4(position, 1.0)).xyz; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
    fragmentShader: WAVE_GLSL + /* glsl */`
      uniform float uTime, uFlash, uAspect;
      varying vec2 vUv;
      varying vec3 vGlassWorld;
      float h1(float n) { return fract(sin(n * 127.1) * 43758.5453); }
      float h2(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
      void main() {
        if (waveCode(vGlassWorld)) discard;
        vec2 uv = vUv;
        float t = uTime;
        // beads stuck to the glass
        vec2 bp = uv * vec2(uAspect * 38.0, 38.0);
        vec2 bid = floor(bp);
        vec2 bf = fract(bp) - 0.5;
        vec2 bc = (vec2(h2(bid), h2(bid + 3.1)) - 0.5) * 0.6;
        float br = 0.05 + 0.13 * h2(bid + 7.7);
        float bd = length(bf - bc);
        float bead = smoothstep(br, br * 0.55, bd) * step(0.45, h2(bid + 1.3));
        float beadRim = smoothstep(br * 0.5, br, bd) * bead;
        // drops sliding down, leaving a wet trail
        vec2 sp = vec2(uv.x * uAspect * 6.0, uv.y);
        float sid = floor(sp.x);
        float sn = h1(sid + 11.0);
        float fx = fract(sp.x) - 0.5 - (sn - 0.5) * 0.5 + sin(uv.y * 30.0 + sn * 9.0) * 0.02;
        float yy = 1.1 - fract(t * (0.04 + sn * 0.07) + sn) * 1.3;
        float dy = uv.y - yy;
        float drop = smoothstep(0.075, 0.04, length(vec2(fx, dy * 6.0 * 0.8))) * step(0.35, sn);
        float trail = smoothstep(0.02, 0.006, abs(fx)) * step(0.0, dy) * smoothstep(0.35, 0.0, dy) * step(0.35, sn);
        float mist = smoothstep(0.22, 0.0, uv.y) * 0.12 + 0.015;
        float alpha = mist + bead * 0.07 + beadRim * 0.16 + drop * 0.3 + trail * 0.08;
        vec3 col = vec3(0.72, 0.76, 1.0) + vec3(0.3) * (beadRim + drop * 0.6);
        col += vec3(0.5, 0.55, 0.9) * uFlash;
        gl_FragColor = vec4(col, min(alpha, 0.85));
      }`,
  });
}

// A wall with a rectangular opening (for the window), with the same texture mapping as a plain wall.
function wallWithHole(w, h, hole) {
  const shape = new THREE.Shape();
  shape.moveTo(-w / 2, 0); shape.lineTo(w / 2, 0); shape.lineTo(w / 2, h); shape.lineTo(-w / 2, h); shape.closePath();
  const x0 = hole.x - hole.w / 2, x1 = hole.x + hole.w / 2, y0 = hole.y, y1 = hole.y + hole.h;
  const opening = new THREE.Path();
  opening.moveTo(x0, y0); opening.lineTo(x0, y1); opening.lineTo(x1, y1); opening.lineTo(x1, y0); opening.closePath();
  shape.holes.push(opening);
  const geometry = new THREE.ShapeGeometry(shape);
  const pos = geometry.attributes.position, uv = geometry.attributes.uv;
  for (let i = 0; i < pos.count; i++) uv.setXY(i, (pos.getX(i) + w / 2) / w, pos.getY(i) / h);
  return geometry;
}

/* ---------------------------------------------------------------------
   The city outside: real 3D buildings, streets far below with traffic,
   a cloudy sky, rain falling through the air and haze that thickens with
   distance. Because it's all real geometry, it shifts with you as you walk
   up to the window (near towers slide past far ones).
   --------------------------------------------------------------------- */
const WAVE_GLSL = /* glsl */`
  uniform vec3 uWaveFrom;
  uniform float uWaveR, uWaveTarget;
  bool waveCode(vec3 w) {                       // true where this point shows code right now
    bool inside = distance(w, uWaveFrom) < uWaveR;
    return uWaveTarget > 0.5 ? inside : !inside;
  }
  float waveEdge(vec3 w) {                      // a bright band riding the front of the wave
    return 1.0 - smoothstep(0.0, 0.18 + uWaveR * 0.012, abs(distance(w, uWaveFrom) - uWaveR));
  }`;

const CITY_GLSL = WAVE_GLSL + /* glsl */`
  uniform vec3 uFogColor;
  uniform float uFogDensity, uTime, uFlash;
  float hash(vec2 p) { p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
  vec3 cityFog(vec3 col, vec3 world, float keep) {
    float d = length(world - cameraPosition);
    float f = 1.0 - exp(-uFogDensity * uFogDensity * d * d);
    return mix(col, uFogColor, f * keep);
  }`;

function buildCity(scene, shared) {
  const spec = ROOM.city;
  const street = spec.streetLevel ?? -45;
  const R = seededRandom(spec.seed ?? 4242);
  const common = {
    ...shared.cityWave,
    uTime: shared.uTime, uFlash: shared.uFlash,
    uFogColor: { value: new THREE.Color(spec.fogColor || '#1f1a40') },
    uFogDensity: { value: spec.fogDensity ?? 0.0056 },
  };
  const group = new THREE.Group();
  group.userData.city = true;
  const BLOCK = 34;                 // a city block plus its streets, in metres

  // ---- buildings: lots on a grid of blocks, a few towers with setbacks and antennas
  const boxes = [], beacons = [];
  const addBox = (x, y, z, w, h, d, seed) => boxes.push([x, y, z, w, h, d, seed]);
  const addBuilding = (x, z, w, d, h) => {
    const seed = R();
    addBox(x, street, z, w, h, d, seed);
    let top = street + h;
    if (h > 70 && R() < 0.6) {      // a setback crown on tall towers
      const ch = 8 + R() * h * 0.15;
      addBox(x, top, z, w * 0.66, ch, d * 0.66, seed * 0.5 + 0.25);
      top += ch;
    }
    if (h > 55 && R() < 0.55) {     // an antenna with a red light
      const ah = 6 + R() * 14;
      addBox(x, top, z, 0.5, ah, 0.5, -1);
      top += ah;
      beacons.push(x, top + 0.3, z, R());
    } else if (h > 40 && R() < 0.5) {
      beacons.push(x + w * 0.4, top + 0.3, z + d * 0.4, R());
    }
  };
  for (let bz = -1; bz < 11; bz++) {
    for (let bx = -10; bx <= 10; bx++) {
      const cx = bx * BLOCK, cz = -26 - bz * BLOCK;
      if (bz === -1 && bx === 0) continue;              // that's our own building
      const near = bz <= 0;
      let base = near ? 20 + R() * 32 : 22 + R() * 45;
      if (!near && R() < 0.24) base += 45 + R() * 120;   // downtown towers
      if (Math.abs(bx) <= 3 && bz >= 2 && bz <= 6 && R() < 0.5) base += 40 + R() * 70;
      const kind = R();
      if (kind < 0.35) {
        addBuilding(cx + (R() - 0.5) * 3, cz + (R() - 0.5) * 3, 16 + R() * 8, 16 + R() * 8, base);
      } else if (kind < 0.7) {
        for (const s of [-1, 1]) addBuilding(cx + s * 6.3, cz + (R() - 0.5) * 2, 10.5 + R() * 1.5, 17 + R() * 7, base * (0.55 + R() * 0.7));
      } else {
        for (const sx of [-1, 1]) for (const sz of [-1, 1]) addBuilding(cx + sx * 6.3, cz + sz * 6.3, 9 + R() * 2.5, 9 + R() * 2.5, base * (0.4 + R() * 0.8));
      }
    }
  }

  const boxGeometry = new THREE.BoxGeometry(1, 1, 1).translate(0, 0.5, 0);
  const seeds = new Float32Array(boxes.length);
  const buildingMaterial = new THREE.ShaderMaterial({
    uniforms: common,
    vertexShader: /* glsl */`
      attribute float aSeed;
      varying vec3 vLocal, vWorld, vNormal, vSize;
      varying float vSeed;
      void main() {
        vSize = vec3(length(instanceMatrix[0].xyz), length(instanceMatrix[1].xyz), length(instanceMatrix[2].xyz));
        vLocal = position * vSize;
        vNormal = normal;
        vSeed = aSeed;
        vec4 world = modelMatrix * instanceMatrix * vec4(position, 1.0);
        vWorld = world.xyz;
        gl_Position = projectionMatrix * viewMatrix * world;
      }`,
    fragmentShader: CITY_GLSL + /* glsl */`
      varying vec3 vLocal, vWorld, vNormal, vSize;
      varying float vSeed;
      void main() {
        if (waveCode(vWorld)) discard;
        float tone = hash(vec2(vSeed, 1.0));
        vec3 col = mix(vec3(0.022, 0.022, 0.055), vec3(0.055, 0.045, 0.1), tone);
        col += vec3(0.35, 0.14, 0.3) * exp(-vLocal.y * 0.06) * 0.35;
        if (vNormal.y > 0.5) col *= 0.6;                                          // rooftops           // glow from the street below
        col *= 0.75 + 0.25 * max(0.0, vNormal.z);                              // faces turned to us a touch lighter
        if (vSeed >= 0.0 && abs(vNormal.y) < 0.5) {
          bool sideX = abs(vNormal.x) > 0.5;
          float u = sideX ? vLocal.z : vLocal.x;
          float faceW = sideX ? vSize.z : vSize.x;
          float face = sideX ? vNormal.x : 2.0 + vNormal.z;
          float style = hash(vec2(vSeed, 7.0));
          float colW = style < 0.5 ? 2.3 : 3.4;
          vec2 g = vec2((u + faceW * 0.5) / colW, vLocal.y / 3.3);
          vec2 cell = floor(g), f = fract(g);
          float win = style < 0.78
            ? step(0.18, f.x) * step(f.x, 0.82) * step(0.28, f.y) * step(f.y, 0.78)
            : step(0.25, f.y) * step(f.y, 0.8);                                   // ribbon windows
          win *= step(4.0, vLocal.y) * step(vLocal.y, vSize.y - 1.5) * step(0.6, u + faceW * 0.5) * step(u + faceW * 0.5, faceW - 0.6);
          float threshold = 0.58 + 0.34 * hash(vec2(vSeed, 3.0));
          float lit = step(threshold, hash(cell + vec2(vSeed * 13.1 + face * 7.0, vSeed * 3.7)));
          float pick = hash(cell * 1.7 + vSeed);
          vec3 wc = pick < 0.55 ? vec3(1.0, 0.74, 0.45) : pick < 0.75 ? vec3(0.85, 0.9, 1.0) : pick < 0.88 ? vec3(1.0, 0.35, 0.7) : vec3(0.35, 0.85, 1.0);
          wc *= 0.55 + 0.6 * hash(cell + 2.0);
          float twinkle = step(0.985, hash(cell + floor(uTime * 0.2 + vSeed * 10.0)));
          lit = max(lit - twinkle, 0.0);
          vec3 glass = vec3(0.045, 0.05, 0.11);
          vec3 lightOn = wc * 1.6;
          vec3 pattern = mix(col, glass, win * 0.7) + lightOn * win * lit;
          // far away the grid of windows would shimmer, so blend toward its average glow
          float blur = clamp(max(fwidth(g.x), fwidth(g.y)) * 1.4 - 0.25, 0.0, 1.0);
          vec3 average = col * 0.8 + vec3(1.0, 0.72, 0.55) * (1.0 - threshold) * 0.32;
          col = mix(pattern, average, blur);
          // neon strip down one face, glowing crown on some towers
          vec3 neonColor = hash(vec2(vSeed, 13.0)) > 0.5 ? vec3(1.0, 0.22, 0.6) : vec3(0.2, 0.9, 1.0);
          float neon = step(0.84, hash(vec2(vSeed, 11.0))) * step(abs(u), 0.35) * step(vSize.y * 0.45, vLocal.y) * step(vLocal.y, vSize.y - 2.0) * step(0.5, hash(vec2(vSeed, face)));
          float crown = step(0.72, hash(vec2(vSeed, 17.0))) * smoothstep(vSize.y - 1.4, vSize.y - 0.6, vLocal.y) * step(vLocal.y, vSize.y - 0.25);
          col += neonColor * (neon * 2.4 + crown * 1.6);
        }
        col += vec3(0.32, 0.36, 0.6) * uFlash * (0.4 + 0.6 * max(0.0, vNormal.z));
        float keep = vSeed >= 0.0 ? 0.92 : 1.0;
        gl_FragColor = vec4(cityFog(col, vWorld, keep), 1.0);
      }`,
  });
  const buildings = new THREE.InstancedMesh(boxGeometry, buildingMaterial, boxes.length);
  const matrix = new THREE.Matrix4(), q = new THREE.Quaternion(), p = new THREE.Vector3(), s = new THREE.Vector3();
  boxes.forEach(([x, y, z, w, h, d, seed], i) => {
    buildings.setMatrixAt(i, matrix.compose(p.set(x, y, z), q, s.set(w, h, d)));
    seeds[i] = seed;
  });
  boxGeometry.setAttribute('aSeed', new THREE.InstancedBufferAttribute(seeds, 1));
  buildings.frustumCulled = false;
  group.add(buildings);

  // ---- red lights blinking on the rooftops
  const beaconGeometry = new THREE.BufferGeometry();
  const beaconData = new Float32Array(beacons);
  beaconGeometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array(beacons.length / 4 * 3).map((_, i) => beaconData[Math.floor(i / 3) * 4 + (i % 3)]), 3));
  beaconGeometry.setAttribute('aPhase', new THREE.BufferAttribute(new Float32Array(beacons.length / 4).map((_, i) => beaconData[i * 4 + 3]), 1));
  const beaconPoints = new THREE.Points(beaconGeometry, new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    uniforms: { ...common, uScale: shared.uScale },
    vertexShader: /* glsl */`
      attribute float aPhase;
      uniform float uTime, uScale;
      varying float vOn;
      void main() {
        vOn = step(0.45, fract(uTime * 0.5 + aPhase));
        vec4 mv = modelViewMatrix * vec4(position, 1.0);
        gl_PointSize = clamp(1.6 * uScale / -mv.z, 3.0, 14.0);
        gl_Position = projectionMatrix * mv;
      }`,
    fragmentShader: /* glsl */`
      varying float vOn;
      void main() {
        float r = length(gl_PointCoord - 0.5);
        gl_FragColor = vec4(vec3(1.0, 0.12, 0.18) * (1.0 - smoothstep(0.0, 0.5, r)) * vOn * 1.4, 1.0);
      }`,
  }));
  beaconPoints.frustumCulled = false;
  group.add(beaconPoints);

  // ---- the street grid far below: wet asphalt, street lamps, headlights and tail lights moving
  const groundMaterial = new THREE.ShaderMaterial({
    uniforms: common,
    vertexShader: /* glsl */`
      varying vec3 vWorld;
      void main() { vec4 w = modelMatrix * vec4(position, 1.0); vWorld = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }`,
    fragmentShader: CITY_GLSL + /* glsl */`
      varying vec3 vWorld;
      // cars along one lane: dir is +1 or -1, along is the distance along the road
      float cars(float along, float lane, float dir) {
        float k = along / 7.0 + uTime * 1.1 * dir + lane * 3.7;
        float on = step(0.55, hash(vec2(floor(k), lane)));
        return on * smoothstep(0.18, 0.0, abs(fract(k) - 0.5));
      }
      void main() {
        if (waveCode(vWorld)) discard;
        vec2 p = vWorld.xz;
        vec2 b = vec2(p.x / ${BLOCK.toFixed(1)}, (p.y + 26.0) / ${BLOCK.toFixed(1)});
        vec2 s = (fract(b + 0.5) - 0.5) * ${BLOCK.toFixed(1)};          // position within the block, -17..17
        vec2 lane = floor(b + 0.5);
        float roadX = step(13.0, abs(s.y)), roadZ = step(13.0, abs(s.x));
        float road = max(roadX, roadZ);
        vec3 col = mix(vec3(0.05, 0.04, 0.08), vec3(0.08, 0.07, 0.12), road);
        // sidewalk lamps
        float lampRow = smoothstep(1.2, 0.0, abs(abs(s.y) - 13.2)) * roadX + smoothstep(1.2, 0.0, abs(abs(s.x) - 13.2)) * roadZ;
        col += vec3(1.0, 0.6, 0.3) * lampRow * 0.35;
        // traffic: white headlights one way, red tail lights the other
        float laneX = smoothstep(0.7, 0.0, abs(abs(s.y) - 15.3)) * roadX * (1.0 - roadZ);
        float laneZ = smoothstep(0.7, 0.0, abs(abs(s.x) - 15.3)) * roadZ * (1.0 - roadX);
        float dirX = sign(s.y), dirZ = sign(s.x);
        float cx = cars(p.x, lane.y + (dirX > 0.0 ? 0.5 : 0.0), dirX) * laneX;
        float cz = cars(p.y, lane.x + (dirZ > 0.0 ? 0.25 : 0.75), dirZ) * laneZ;
        col += (dirX > 0.0 ? vec3(1.0, 0.92, 0.8) : vec3(1.0, 0.1, 0.15)) * cx * 2.2;
        col += (dirZ > 0.0 ? vec3(1.0, 0.92, 0.8) : vec3(1.0, 0.1, 0.15)) * cz * 2.2;
        col += vec3(0.3, 0.32, 0.5) * uFlash * 0.4;
        gl_FragColor = vec4(cityFog(col, vWorld, 0.95), 1.0);
      }`,
  });
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(1200, 1200).rotateX(-Math.PI / 2), groundMaterial);
  ground.position.set(0, street, -250);
  group.add(ground);

  // ---- the sky: haze at the horizon lit by the city, slow clouds overhead
  const sky = new THREE.Mesh(new THREE.SphereGeometry(700, 32, 16), new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false,
    uniforms: common,
    vertexShader: /* glsl */`
      varying vec3 vWorld;
      void main() { vec4 w = modelMatrix * vec4(position, 1.0); vWorld = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }`,
    fragmentShader: CITY_GLSL + /* glsl */`
      varying vec3 vWorld;
      float noise(vec2 p) {
        vec2 i = floor(p), f = fract(p);
        f = f * f * (3.0 - 2.0 * f);
        return mix(mix(hash(i), hash(i + vec2(1, 0)), f.x), mix(hash(i + vec2(0, 1)), hash(i + vec2(1, 1)), f.x), f.y);
      }
      void main() {
        if (waveCode(vWorld)) discard;
        vec3 dir = normalize(vWorld - cameraPosition);
        float y = dir.y;
        vec3 col = mix(uFogColor, vec3(0.03, 0.03, 0.08), smoothstep(0.0, 0.5, y));
        col = mix(col, uFogColor * 0.85, step(y, 0.0));
        vec2 uv = dir.xz / max(y + 0.12, 0.04) * 1.2 + vec2(uTime * 0.01, uTime * 0.004);
        float c = noise(uv) * 0.55 + noise(uv * 2.3) * 0.3 + noise(uv * 5.1) * 0.15;
        c = smoothstep(0.35, 0.85, c) * smoothstep(-0.02, 0.25, y);
        col += vec3(0.17, 0.12, 0.28) * c;
        col += vec3(0.6, 0.65, 0.95) * uFlash * (0.25 + c);
        gl_FragColor = vec4(col, 1.0);
      }`,
  }));
  sky.renderOrder = -10;
  sky.frustumCulled = false;
  sky.userData.holoHide = true;
  group.add(sky);

  // ---- rain falling through the air outside, in depth
  const drops = IS_PHONE ? 2500 : 5000;
  const positions = new Float32Array(drops * 6), ends = new Float32Array(drops * 2);
  for (let i = 0; i < drops; i++) {
    const x = (R() - 0.5) * 60, y = R() * 50 - 25, z = -4.5 - Math.pow(R(), 1.6) * 50;
    positions.set([x, y, z, x, y, z], i * 6);
    ends[i * 2 + 1] = 1;
  }
  const rainGeometry = new THREE.BufferGeometry();
  rainGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  rainGeometry.setAttribute('aEnd', new THREE.BufferAttribute(ends, 1));
  const rain = new THREE.LineSegments(rainGeometry, new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    uniforms: common,
    vertexShader: /* glsl */`
      attribute float aEnd;
      uniform float uTime;
      varying float vAlpha;
      void main() {
        vec3 p = position;
        p.y = mod(p.y - uTime * 12.0, 50.0) - 25.0;
        p.x += p.y * 0.06;
        p += aEnd * vec3(0.04, 0.6, 0.0);
        vec4 mv = modelViewMatrix * vec4(p, 1.0);
        vAlpha = (1.0 - smoothstep(3.0, 45.0, -mv.z)) * (0.45 + 0.55 * aEnd);
        gl_Position = projectionMatrix * mv;
      }`,
    fragmentShader: /* glsl */`
      uniform float uFlash;
      varying float vAlpha;
      void main() { gl_FragColor = vec4(vec3(0.6, 0.66, 0.95) * vAlpha * (0.32 + uFlash), 1.0); }`,
  }));
  rain.frustumCulled = false;
  group.add(rain);

  scene.add(group);
  return group;
}

// A rumpled sheet of fabric: waves for the creases, and edges that hang over the side of things.
function clothGeometry(part) {
  const [w, d] = part.size;
  const segments = part.segments ?? 30;
  const geometry = new THREE.PlaneGeometry(w, d, segments, segments).rotateX(-Math.PI / 2);
  const r = seededRandom(part.seed ?? 7);
  const waves = Array.from({ length: 7 }, () => ({ fx: (r() * 2 - 1) * 11, fz: (r() * 2 - 1) * 11, ph: r() * 6.28, a: 0.3 + r() }));
  const total = waves.reduce((s, v) => s + v.a, 0);
  const drape = part.drape || {};
  const rate = drape.rate ?? 2.4;
  const pos = geometry.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), z = pos.getZ(i);
    let n = 0;
    for (const v of waves) n += Math.sin(x * v.fx + z * v.fz + v.ph) * v.a;
    n /= total;
    let y = n * (part.bump ?? 0.03);
    let drop = 0;
    if (drape.right != null && x > drape.right) drop += x - drape.right;
    if (drape.left != null && x < -drape.left) drop += -drape.left - x;
    if (drape.foot != null && z > drape.foot) drop += z - drape.foot;
    if (drape.head != null && z < -drape.head) drop += -drape.head - z;
    y -= drop * rate;
    if (drape.floor != null) y = Math.max(y, drape.floor + Math.abs(n) * 0.04 + 0.01);
    pos.setY(i, y);
  }
  geometry.computeVertexNormals();
  return geometry;
}

// Steam curling up from a mug: a handful of soft puffs that rise and fade.
function buildSteam(part, shared) {
  const count = 16;
  const seeds = new Float32Array(count), positions = new Float32Array(count * 3);
  for (let i = 0; i < count; i++) seeds[i] = i / count + Math.random() * 0.05;
  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geometry.setAttribute('aSeed', new THREE.BufferAttribute(seeds, 1));
  const points = new THREE.Points(geometry, new THREE.ShaderMaterial({
    transparent: true, depthWrite: false,
    uniforms: { uTime: shared.uTime, uScale: shared.uScale },
    vertexShader: /* glsl */`
      attribute float aSeed;
      uniform float uTime, uScale;
      varying float vAlpha;
      void main() {
        float age = fract(uTime * 0.22 + aSeed);
        vec3 p = position + vec3(sin(age * 5.0 + aSeed * 20.0) * 0.025 * age * 2.0, age * 0.26, age * 0.16 + cos(age * 4.0 + aSeed * 13.0) * 0.02 * age * 2.0);
        vec4 mv = modelViewMatrix * vec4(p, 1.0);
        vAlpha = sin(age * 3.14159) * 0.3;
        gl_PointSize = clamp((0.025 + age * 0.07) * uScale / max(-mv.z, 0.05), 0.0, 120.0);
        gl_Position = projectionMatrix * mv;
      }`,
    fragmentShader: /* glsl */`
      varying float vAlpha;
      void main() {
        float r = length(gl_PointCoord - 0.5);
        gl_FragColor = vec4(vec3(0.95, 0.93, 1.0), (1.0 - smoothstep(0.1, 0.5, r)) * vAlpha);
      }`,
  }));
  points.position.fromArray(part.offset || [0, 0, 0]);
  points.frustumCulled = false;
  return points;
}

// ---- Lofi-anime look: flat toon shading in three steps, with a dark ink outline.
let toonGradient = null, outlineMaterial = null;
function toonify(root) {
  if (!toonGradient) {
    toonGradient = new THREE.DataTexture(new Uint8Array([85, 160, 220]), 3, 1, THREE.RedFormat);
    toonGradient.minFilter = toonGradient.magFilter = THREE.NearestFilter;
    toonGradient.needsUpdate = true;
    outlineMaterial = new THREE.MeshBasicMaterial({ color: '#120c1a', side: THREE.BackSide });
    outlineMaterial.onBeforeCompile = shader => {
      shader.vertexShader = shader.vertexShader.replace('#include <begin_vertex>', 'vec3 transformed = position + normal * 0.0055;');
    };
  }
  const meshes = [];
  root.traverse(o => { if (o.isMesh && !o.userData.outline) meshes.push(o); });
  for (const mesh of meshes) {
    const m = mesh.material;
    if (mesh.userData.keepMaterial || !m.isMeshStandardMaterial) continue;
    mesh.material = new THREE.MeshToonMaterial({
      color: m.color, map: m.map, gradientMap: toonGradient,
      emissive: m.emissive, emissiveIntensity: m.emissiveIntensity,
      transparent: m.transparent, opacity: m.opacity, side: m.side,
    });
    m.dispose();
    mesh.geometry.computeBoundingSphere();
    if (mesh.geometry.boundingSphere.radius > 0.02 && !m.transparent) {
      const outline = new THREE.Mesh(mesh.geometry, outlineMaterial);
      outline.userData.outline = true;
      outline.raycast = () => {};
      mesh.add(outline);
    }
  }
}

// ---- An arm that can reach: shoulder, elbow and hand found each frame (two-bone IK),
//      optionally holding a lit cigarette.
const UP = new THREE.Vector3(0, 1, 0), FORWARD = new THREE.Vector3(0, 0, 1);
function buildArm(part, textures, shared, animated) {
  const group = new THREE.Group();
  const mat = color => new THREE.MeshStandardMaterial({ color, roughness: 0.9 });
  const [r1, r2] = part.radius || [0.055, 0.05];
  const upper = new THREE.Mesh(new THREE.CapsuleGeometry(r1, part.upper, 6, 14), mat(part.color));
  const lower = new THREE.Mesh(new THREE.CapsuleGeometry(r2, part.lower, 6, 14), mat(part.color));
  const hand = new THREE.Mesh(new THREE.SphereGeometry(0.04, 20, 14), mat(part.handColor));
  hand.scale.set(0.8, 0.95, 1.2);
  group.add(upper, lower, hand);
  const arm = { part, upper, lower, hand, cig: null, ember: null };
  if (part.stick) {
    // a drumstick held in the fist, pointing on along the forearm and a little down
    const stick = new THREE.Mesh(new THREE.CylinderGeometry(0.0075, 0.0055, 0.4, 10), new THREE.MeshStandardMaterial({ color: '#d8b886', roughness: 0.6 }));
    stick.rotation.x = toRadians(118);                 // pointing on and down, toward the drums
    stick.position.set(0, -0.06, 0.09);
    stick.scale.set(1 / 0.8, 1 / 0.95, 1 / 1.2);
    const tip = new THREE.Mesh(new THREE.SphereGeometry(0.009, 10, 8), stick.material);
    tip.position.y = 0.2;
    stick.add(tip);
    const band = new THREE.Mesh(new THREE.CylinderGeometry(0.052, 0.052, 0.05, 16, 1, true), new THREE.MeshStandardMaterial({ color: '#1a1a1e', roughness: 0.8 }));
    band.rotation.x = toRadians(90);
    band.position.z = -0.045;
    hand.add(stick, band);
  }
  if (part.cigarette) {
    const cig = new THREE.Group();
    const paper = new THREE.Mesh(new THREE.CylinderGeometry(0.0045, 0.0045, 0.06, 10), new THREE.MeshStandardMaterial({ color: '#f2eee8', roughness: 0.8 }));
    paper.position.y = 0.012;
    const filter = new THREE.Mesh(new THREE.CylinderGeometry(0.0047, 0.0047, 0.024, 10), new THREE.MeshStandardMaterial({ color: '#d9a35b', roughness: 0.8 }));
    filter.position.y = -0.03;
    const ember = new THREE.Mesh(new THREE.SphereGeometry(0.0052, 10, 8), new THREE.MeshStandardMaterial({ color: '#331100', emissive: '#ff5a1f', emissiveIntensity: 3 }));
    ember.position.y = 0.043;
    const tip = new THREE.Object3D();
    tip.name = 'cigTip';
    tip.position.y = 0.05;
    cig.add(paper, filter, ember, tip);
    group.add(cig);
    arm.cig = cig; arm.ember = ember;
  }
  group.userData.arm = arm;
  solveArm(arm, new THREE.Vector3().fromArray(part.hand), part.cigDir ? new THREE.Vector3().fromArray(part.cigDir).normalize() : null);
  if (part.anim) animated.push({ kind: part.anim, object: group, arm });
  return group;
}

const ik = { S: new THREE.Vector3(), E: new THREE.Vector3(), H: new THREE.Vector3(), dir: new THREE.Vector3(), pole: new THREE.Vector3(), tmp: new THREE.Vector3() };
function placeBone(mesh, a, b) {
  mesh.position.copy(a).lerp(b, 0.5);
  mesh.quaternion.setFromUnitVectors(UP, ik.tmp.copy(b).sub(a).normalize());
}
function solveArm(arm, target, cigDir) {
  const { part } = arm, L1 = part.upper, L2 = part.lower;
  const S = ik.S.fromArray(part.shoulder);
  const dir = ik.dir.copy(target).sub(S);
  let d = dir.length();
  dir.divideScalar(d || 1);
  d = Math.min(Math.max(d, Math.abs(L1 - L2) + 0.01), (L1 + L2) * 0.999);
  const a = (L1 * L1 - L2 * L2 + d * d) / (2 * d), h = Math.sqrt(Math.max(0, L1 * L1 - a * a));
  const pole = ik.pole.fromArray(part.pole);
  pole.addScaledVector(dir, -pole.dot(dir)).normalize();
  const E = ik.E.copy(S).addScaledVector(dir, a).addScaledVector(pole, h);
  const H = ik.H.copy(S).addScaledVector(dir, d);
  placeBone(arm.upper, S, E);
  placeBone(arm.lower, E, H);
  arm.hand.position.copy(H);
  arm.hand.quaternion.setFromUnitVectors(FORWARD, ik.tmp.copy(H).sub(E).normalize());
  if (arm.cig && cigDir) {
    arm.cig.position.copy(H).addScaledVector(cigDir, 0.03);
    arm.cig.position.y += 0.012;
    arm.cig.quaternion.setFromUnitVectors(UP, cigDir);
  }
}

// ---- Smoke: soft puffs from the cigarette and her breath, drifting toward the open window.
function buildSmoke(scene, shared) {
  const N = IS_PHONE ? 120 : 200;
  const positions = new Float32Array(N * 3), ages = new Float32Array(N).fill(-1), sizes = new Float32Array(N);
  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geometry.setAttribute('aAge', new THREE.BufferAttribute(ages, 1));
  geometry.setAttribute('aSize', new THREE.BufferAttribute(sizes, 1));
  const points = new THREE.Points(geometry, new THREE.ShaderMaterial({
    transparent: true, depthWrite: false,
    uniforms: { uScale: shared.uScale },
    vertexShader: /* glsl */`
      attribute float aAge, aSize;
      uniform float uScale;
      varying float vAlpha;
      void main() {
        vec4 mv = modelViewMatrix * vec4(position, 1.0);
        vAlpha = aAge < 0.0 ? 0.0 : smoothstep(0.0, 0.08, aAge) * (1.0 - smoothstep(0.45, 1.0, aAge));
        gl_PointSize = aAge < 0.0 ? 0.0 : clamp(aSize * (0.35 + aAge * 2.6) * uScale / max(-mv.z, 0.05), 0.0, 260.0);
        gl_Position = projectionMatrix * mv;
      }`,
    fragmentShader: /* glsl */`
      varying float vAlpha;
      void main() {
        float r = length(gl_PointCoord - 0.5);
        gl_FragColor = vec4(vec3(0.88, 0.86, 0.96), (1.0 - smoothstep(0.05, 0.5, r)) * vAlpha * 0.26);
      }`,
  }));
  points.frustumCulled = false;
  scene.add(points);

  const particles = Array.from({ length: N }, () => ({ p: new THREE.Vector3(), v: new THREE.Vector3(), age: -1, life: 1 }));
  let next = 0;
  const pull = new THREE.Vector3();
  return {
    emit(origin, velocity, size, life) {
      const i = next;
      next = (next + 1) % N;
      const q = particles[i];
      q.p.copy(origin);
      q.v.copy(velocity);
      q.age = 0;
      q.life = life;
      sizes[i] = size;
    },
    update(dt, t, gap) {
      for (let i = 0; i < N; i++) {
        const q = particles[i];
        if (q.age < 0) continue;
        q.age += dt / q.life;
        if (q.age >= 1) { q.age = -1; ages[i] = -1; continue; }
        // drawn toward the gap in the window, rising, curling
        pull.copy(gap).sub(q.p);
        const dist = pull.length();
        pull.multiplyScalar(0.22 / Math.max(dist, 0.3));
        pull.x += Math.sin(t * 1.7 + i * 1.3) * 0.05;
        pull.z += Math.cos(t * 1.3 + i * 2.1) * 0.05;
        pull.y += 0.05;
        if (q.p.z < -3.95) pull.set(0, 0.15, -0.6);   // out it goes
        q.v.lerp(pull, 1 - Math.exp(-dt * 0.9));
        q.p.addScaledVector(q.v, dt);
        positions[i * 3] = q.p.x; positions[i * 3 + 1] = q.p.y; positions[i * 3 + 2] = q.p.z;
        ages[i] = q.age;
      }
      geometry.attributes.position.needsUpdate = true;
      geometry.attributes.aAge.needsUpdate = true;
      geometry.attributes.aSize.needsUpdate = true;
    },
  };
}

/* ---------------------------------------------------------------------
   Hologram view: the whole room (and the city) turns into falling code.
   Every surface gets the same shader: columns of glyphs raining down in
   blue, purple and white, glowing edges, a faint grid and a scan line.
   The lofi materials are kept and put back when you switch back.
   --------------------------------------------------------------------- */
function makeGlyphAtlas() {
  const chars = 'アイウカキクサシスタチツナニハヒマミムヤラリワン' + 'ABCDEFGHIJKLMNOPQRSTUVWXYZ' + '0123456789' + '<>=+';   // 24 + 26 + 10 + 4 = 64
  const size = 512, cell = 64;
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = size;
  const g = canvas.getContext('2d');
  g.fillStyle = '#000';
  g.fillRect(0, 0, size, size);
  g.fillStyle = '#fff';
  g.font = '600 44px ui-monospace, "SF Mono", Menlo, Consolas, "Hiragino Kaku Gothic Pro", "Yu Gothic", "Noto Sans JP", monospace';
  g.textAlign = 'center';
  g.textBaseline = 'middle';
  for (let i = 0; i < 64; i++) {
    g.save();
    g.translate((i % 8) * cell + cell / 2, Math.floor(i / 8) * cell + cell / 2 + 2);
    if (i < 24 && i % 2 === 1) g.scale(-1, 1);       // some katakana mirrored, like the films
    g.fillText(chars[i % chars.length], 0, 0);
    g.restore();
  }
  const texture = new THREE.CanvasTexture(canvas);
  texture.generateMipmaps = false;
  texture.minFilter = THREE.LinearFilter;
  texture.magFilter = THREE.LinearFilter;
  return texture;
}

const HOLO_GLSL = /* glsl */`
  uniform float uTime;
  uniform sampler2D uAtlas;
  float hhash(vec2 p) { p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
  // x: the falling trail, y: the bright white head of each column
  vec2 codeRain(vec2 uv, float cell, float seed) {
    vec2 g = uv / cell;
    vec2 c = floor(g), f = fract(g);
    float colSeed = hhash(vec2(c.x, seed));
    float speed = 3.0 + colSeed * 8.0;
    float len = 5.0 + colSeed * 14.0;
    float period = len * 3.2 + 8.0;
    float colOn = step(0.35, hhash(vec2(c.x, seed + 3.3)));     // about a third of the columns are empty
    float k = fract((c.y + uTime * speed) / period + colSeed) * period;
    float trail = k < len ? 1.0 - k / len : 0.0;
    float head = step(k, 1.0);
    float gi = floor(hhash(c + floor(uTime * (1.5 + colSeed * 5.0) + hhash(c) * 10.0)) * 64.0);
    vec2 a = vec2(mod(gi, 8.0), floor(gi / 8.0));
    vec2 fu = clamp(f, 0.06, 0.94);
    float m = texture2D(uAtlas, vec2((a.x + fu.x) / 8.0, 1.0 - (a.y + 1.0 - fu.y) / 8.0)).r;
    return vec2(m * trail * trail, m * head) * colOn;
  }`;

function makeHoloMaterial(shared, atlas, wave, boost = 1) {
  return new THREE.ShaderMaterial({
    side: THREE.DoubleSide,
    uniforms: { uTime: shared.uTime, uAtlas: { value: atlas }, uBoost: { value: boost }, ...wave },
    vertexShader: /* glsl */`
      varying vec3 vWorld, vNormal;
      void main() {
        vec4 local = vec4(position, 1.0);
        vec3 n = normal;
        #ifdef USE_INSTANCING
          local = instanceMatrix * local;
          n = mat3(instanceMatrix) * n;
        #endif
        vec4 world = modelMatrix * local;
        vWorld = world.xyz;
        vNormal = normalize(mat3(modelMatrix) * n);
        gl_Position = projectionMatrix * viewMatrix * world;
      }`,
    fragmentShader: HOLO_GLSL + WAVE_GLSL + /* glsl */`
      uniform float uBoost;
      varying vec3 vWorld, vNormal;
      void main() {
        if (!waveCode(vWorld)) discard;
        vec3 n = normalize(vNormal) * (gl_FrontFacing ? 1.0 : -1.0);
        vec3 V = normalize(cameraPosition - vWorld);
        float dist = length(cameraPosition - vWorld);
        // glyphs stay about the same size on screen: they step up in size with distance
        float cell = 0.045 * exp2(floor(log2(max(dist, 1.0) * 0.9)));
        vec3 an = abs(n);
        vec2 uv; float seed;
        if (an.y > an.x && an.y > an.z) { uv = vWorld.xz; seed = 1.0; }
        else if (an.x > an.z) { uv = vec2(-vWorld.z * sign(n.x), vWorld.y); seed = 2.0; }
        else { uv = vec2(vWorld.x * sign(n.z), vWorld.y); seed = 3.0; }
        vec2 rain = codeRain(uv, cell, seed);
        float hue = hhash(vec2(floor(uv.x / cell), seed + 7.0));
        vec3 rainColor = mix(vec3(0.28, 0.42, 1.0), vec3(0.68, 0.3, 1.0), hue);
        float facing = abs(dot(n, V));
        float rim = pow(1.0 - facing, 5.0) * smoothstep(0.0, 0.6, facing + 0.2);
        vec3 col = vec3(0.004, 0.005, 0.018) + vec3(0.01, 0.012, 0.04) * (an.x * 0.6 + max(n.y, 0.0) + an.z * 0.3);
        col += rainColor * rain.x * 1.2 + vec3(0.85, 0.9, 1.0) * rain.y * 1.8;
        col += vec3(0.42, 0.48, 1.0) * rim * 0.3;
        // a faint grid, like a wireframe
        vec2 gp = uv / (cell * 8.0);
        vec2 gw = abs(fract(gp - 0.5) - 0.5) / max(fwidth(gp), vec2(1e-4));
        col += vec3(0.3, 0.32, 0.85) * (1.0 - min(min(gw.x, gw.y), 1.0)) * 0.1;
        col += vec3(0.75, 0.82, 1.0) * waveEdge(vWorld) * 1.6;      // the glowing front of the scan wave
        col *= exp(-dist * 0.0032 / uBoost) * uBoost;
        gl_FragColor = vec4(col, 1.0);
      }`,
  });
}

// The void behind the city in hologram view: dim code falling across the whole sky.
function makeHoloSky(shared, atlas, wave) {
  const sky = new THREE.Mesh(new THREE.SphereGeometry(650, 32, 16), new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false,
    uniforms: { uTime: shared.uTime, uAtlas: { value: atlas }, ...wave },
    vertexShader: /* glsl */`
      varying vec3 vWorld;
      void main() { vec4 w = modelMatrix * vec4(position, 1.0); vWorld = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }`,
    fragmentShader: HOLO_GLSL + WAVE_GLSL + /* glsl */`
      varying vec3 vWorld;
      void main() {
        if (!waveCode(vWorld)) discard;
        vec3 dir = normalize(vWorld - cameraPosition);
        vec2 uv = vec2(atan(dir.z, dir.x) / 6.2832 * 220.0, dir.y * 70.0);
        vec2 rain = codeRain(uv, 1.0, 9.0);
        float hue = hhash(vec2(floor(uv.x), 16.0));
        vec3 col = vec3(0.004, 0.005, 0.02) + mix(vec3(0.25, 0.35, 0.9), vec3(0.55, 0.25, 0.9), hue) * rain.x * 0.5 + vec3(0.8) * rain.y * 0.7;
        col *= 0.4 + 0.6 * smoothstep(-0.3, 0.4, dir.y);
        gl_FragColor = vec4(col, 1.0);
      }`,
  }));
  sky.renderOrder = -10;
  sky.frustumCulled = false;
  sky.visible = false;
  sky.userData.holoSkip = true;
  return sky;
}

/* ---------------------------------------------------------------------
   Lofi / Mix / Code views, and the scan wave between them.
   The world is in two parts, the room and the city. Each part has a wave:
   a sphere that grows outward from where you stand. Inside it, that part
   shows its new look; outside, the old one. Every lofi surface has a code
   twin (same shape, code material) and each hides wherever the other shows.
   --------------------------------------------------------------------- */
function makeWave() {
  return { uWaveFrom: { value: new THREE.Vector3() }, uWaveR: { value: 1e6 }, uWaveTarget: { value: 0 } };
}


// Teach a built-in material (standard, toon, basic) to step aside where its part of the world is code.
function patchLofi(material, wave) {
  if (material.userData.wavePatched) return;
  material.userData.wavePatched = true;
  const previous = material.onBeforeCompile;
  material.onBeforeCompile = (shader, renderer) => {
    previous.call(material, shader, renderer);
    Object.assign(shader.uniforms, wave);
    shader.vertexShader = 'varying vec3 vWaveWorld;\n' + shader.vertexShader.replace('#include <project_vertex>', `#include <project_vertex>
      #ifdef USE_INSTANCING
        vWaveWorld = (modelMatrix * instanceMatrix * vec4(transformed, 1.0)).xyz;
      #else
        vWaveWorld = (modelMatrix * vec4(transformed, 1.0)).xyz;
      #endif`);
    shader.fragmentShader = 'varying vec3 vWaveWorld;\n' + WAVE_GLSL + '\n' + shader.fragmentShader.replace(
      '#include <clipping_planes_fragment>', '#include <clipping_planes_fragment>\n  if (waveCode(vWaveWorld)) discard;');
  };
  const previousKey = previous.toString();
  material.customProgramCacheKey = () => 'wave|' + previousKey;
  material.needsUpdate = true;
}

// Give every surface a code twin and wire both to their wave. Returns the materials to show/hide.
function makeCodeTwins(scene, waves, holo) {
  const lofi = { room: new Set(), city: new Set() };
  const meshes = [];
  scene.traverse(o => { if (o.isMesh && !o.userData.holoTwin && !o.userData.holoSkip) meshes.push(o); });
  for (const o of meshes) {
    let part = 'room';
    for (let p = o; p; p = p.parent) if (p.userData.city) { part = 'city'; break; }
    const m = o.material;
    if (!m.isShaderMaterial) { patchLofi(m, waves[part]); lofi[part].add(m); }
    else if (m.uniforms?.uWaveR) lofi[part].add(m);
    // things that only exist in the lofi look get no twin
    if (o.userData.outline || o.userData.keepMaterial || o.userData.holoHide || (m.isShaderMaterial && m.transparent)) continue;
    const twin = o.isInstancedMesh ? new THREE.InstancedMesh(o.geometry, holo[part], o.count) : new THREE.Mesh(o.geometry, holo[part]);
    if (o.isInstancedMesh) twin.instanceMatrix = o.instanceMatrix;
    twin.userData.holoTwin = true;
    twin.raycast = () => {};
    twin.frustumCulled = o.frustumCulled;
    o.add(twin);
  }
  return lofi;
}

// Static clutter (books, papers, furniture without hotspots) baked into a few meshes, like the city's instancing:
// fewer separate things for the graphics card to draw.
function mergeStatic(scene, built, raycastTargets, mergeGeometries) {
  const buckets = new Map(), merged = [];
  const keep = new Set(['position', 'normal', 'uv']);
  for (const { group, spec } of built) {
    if (spec.hotspot || spec.style || spec.outside) continue;   // outside things stay apart so Mix mode can find them
    group.updateMatrixWorld(true);
    const take = [];
    group.traverse(o => {
      if (!o.isMesh || o.isInstancedMesh || o.children.length) return;
      const m = o.material;
      if (!m.isMeshStandardMaterial || m.transparent) return;            // textured pieces merge too, grouped by texture
      if (m.emissive.getHex() !== 0 && m.emissiveIntensity > 0) return;
      for (let p = o.parent; p && p !== group; p = p.parent) if (p.userData.anim) return;
      take.push(o);
    });
    for (const o of take) {
      const m = o.material;
      let g = o.geometry.clone().applyMatrix4(o.matrixWorld);
      if (g.index) g = g.toNonIndexed();
      for (const name of Object.keys(g.attributes)) if (!keep.has(name)) g.deleteAttribute(name);
      const n = g.attributes.position.count;
      if (!g.attributes.uv) g.setAttribute('uv', new THREE.BufferAttribute(new Float32Array(n * 2), 2));
      const colors = new Float32Array(n * 3);
      for (let i = 0; i < n; i++) colors.set([m.color.r, m.color.g, m.color.b], i * 3);
      g.setAttribute('color', new THREE.BufferAttribute(colors, 3));
      // close-enough surfaces share a batch: roughness in steps of 0.25, metal or not
      const rough = Math.min(1, Math.max(0.25, Math.round(m.roughness * 4) / 4)), metal = m.metalness >= 0.35 ? 0.55 : 0;
      const key = `${rough}|${metal}|${m.side}|${m.map ? m.map.uuid : ''}`;
      if (!buckets.has(key)) buckets.set(key, { roughness: rough, metalness: metal, side: m.side, map: m.map, list: [] });
      buckets.get(key).list.push(g);
      o.parent.remove(o);
      o.geometry.dispose();
      m.dispose();
      const at = raycastTargets.indexOf(o);
      if (at >= 0) raycastTargets.splice(at, 1);
    }
  }
  for (const { roughness, metalness, side, map, list } of buckets.values()) {
    const geometry = mergeGeometries(list, false);
    list.forEach(g => g.dispose());
    const mesh = new THREE.Mesh(geometry, new THREE.MeshStandardMaterial({ vertexColors: true, roughness, metalness, side, map }));
    mesh.name = 'merged';
    scene.add(mesh);
    raycastTargets.push(mesh);
    merged.push(mesh);
  }
  return merged;
}

// A neon sign: glowing script drawn on a transparent sheet.
function makeNeonTexture({ text = 'lofi', color = '#ff4fb0', moon = true, moonColor = '#6fb8ff' } = {}) {
  const W = 1024, H = 384;
  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  const g = canvas.getContext('2d');
  g.lineCap = 'round'; g.lineJoin = 'round';
  const glowText = (text, x, y, font, color) => {
    g.font = font;
    g.textAlign = 'center'; g.textBaseline = 'middle';
    for (const [blur, width, alpha] of [[60, 14, 0.5], [30, 9, 0.8], [12, 5, 1]]) {
      g.shadowColor = color; g.shadowBlur = blur; g.strokeStyle = color; g.globalAlpha = alpha; g.lineWidth = width;
      g.strokeText(text, x, y);
    }
    g.shadowBlur = 0; g.globalAlpha = 1; g.strokeStyle = '#fff4fb'; g.lineWidth = 3;
    g.strokeText(text, x, y);
  };
  const font = px => `italic 700 ${px}px "Brush Script MT", "Segoe Script", "Snell Roundhand", cursive`;
  const room = moon ? 700 : 940;
  let px = 230;
  g.font = font(px);
  while (px > 60 && g.measureText(text).width > room) g.font = font(px -= 10);     // long words get smaller
  glowText(text, moon ? 430 : 512, 205, font(px), color);
  if (!moon) {
    const texture = new THREE.CanvasTexture(canvas);
    texture.colorSpace = THREE.SRGBColorSpace;
    return texture;
  }
  // a crescent moon in blue neon
  g.save();
  g.translate(800, 175);
  for (const [blur, width, alpha] of [[60, 14, 0.5], [30, 9, 0.8], [12, 5, 1]]) {
    g.shadowColor = moonColor; g.shadowBlur = blur; g.strokeStyle = moonColor; g.globalAlpha = alpha; g.lineWidth = width;
    g.beginPath(); g.arc(0, 0, 90, 0.55 * Math.PI, 1.95 * Math.PI); g.arc(38, -18, 74, 1.86 * Math.PI, 0.62 * Math.PI, true); g.closePath(); g.stroke();
  }
  g.shadowBlur = 0; g.globalAlpha = 1; g.strokeStyle = '#f2f8ff'; g.lineWidth = 3;
  g.beginPath(); g.arc(0, 0, 90, 0.55 * Math.PI, 1.95 * Math.PI); g.arc(38, -18, 74, 1.86 * Math.PI, 0.62 * Math.PI, true); g.closePath(); g.stroke();
  g.restore();
  const texture = new THREE.CanvasTexture(canvas);
  texture.colorSpace = THREE.SRGBColorSpace;
  return texture;
}

/* ---------------------------------------------------------------------
   The Basement's own part shapes
     corrugated [rx, rz, h]   a half-oval of ribbed steel (the window well's wall)
     wellFloor [rx, rz]       the half-oval floor of the well
     groundHole [w, d] hole [rx, rz]   the yard, with the well cut out of it
     cable { points, radius } a cable lying where you put it
     shaft { from, to, radius [r0, r1], color, strength }   a soft, dusty beam of light
     motes { from, to, radius, count }   dust drifting in that beam
     glow [w, h] { color, opacity, face }   a soft additive glow (face: always turned to you)
     rain { box [x0, x1, y0, y1, z0, z1], count }   rain falling outside
     sky                       the night sky over the yard
   Shader parts use the wave of their side of the world (room or outside),
   so the Lofi / Mix / Code views treat them like everything else.
   --------------------------------------------------------------------- */
function corrugatedGeometry(part) {
  const [rx, rz, h] = part.size, pitch = part.pitch ?? 0.068, depth = part.depth ?? 0.013;
  const geometry = new THREE.CylinderGeometry(1, 1, h, 72, Math.ceil(h / pitch * 8), true, Math.PI / 2, Math.PI);
  const pos = geometry.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
    const d = Math.sin((y + h / 2) / pitch * Math.PI * 2) * depth;
    pos.setXYZ(i, x * (rx + d), y, z * (rz + d));
  }
  geometry.computeVertexNormals();
  return geometry;
}
function halfOvalGeometry([rx, rz]) {
  const shape = new THREE.Shape();
  shape.moveTo(rx, 0);
  shape.absellipse(0, 0, rx, rz, 0, Math.PI, false);
  shape.closePath();
  return new THREE.ShapeGeometry(shape, 24).rotateX(-Math.PI / 2);
}
function groundHoleGeometry(part) {
  const [w, d] = part.size, [rx, rz] = part.hole;
  const shape = new THREE.Shape();
  shape.moveTo(-w / 2, -0.15); shape.lineTo(w / 2, -0.15); shape.lineTo(w / 2, d); shape.lineTo(-w / 2, d); shape.closePath();
  const hole = new THREE.Path();
  hole.moveTo(rx, -0.06);
  hole.lineTo(rx, 0);
  hole.absellipse(0, 0, rx, rz, 0, Math.PI, false);
  hole.lineTo(-rx, -0.06);
  hole.closePath();
  shape.holes.push(hole);
  return new THREE.ShapeGeometry(shape, 24).rotateX(-Math.PI / 2);
}

const noRaycast = () => {};

function buildGlow(part, shared) {
  const material = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide, fog: false,
    uniforms: { uColor: { value: new THREE.Color(part.color || '#ffffff') }, uOpacity: { value: part.opacity ?? 0.5 }, uFace: { value: part.face ? 1 : 0 }, ...shared.wave },
    vertexShader: /* glsl */`
      uniform float uFace;
      varying vec2 vUv;
      varying vec3 vWorld;
      void main() {
        vUv = uv;
        vec4 world;
        if (uFace > 0.5) {                     // turned to face the camera, like a sprite
          vec3 centre = (modelMatrix * vec4(0.0, 0.0, 0.0, 1.0)).xyz;
          vec3 right = vec3(viewMatrix[0][0], viewMatrix[1][0], viewMatrix[2][0]);
          vec3 up = vec3(viewMatrix[0][1], viewMatrix[1][1], viewMatrix[2][1]);
          world = vec4(centre + right * position.x + up * position.y, 1.0);
        } else world = modelMatrix * vec4(position, 1.0);
        vWorld = world.xyz;
        gl_Position = projectionMatrix * viewMatrix * world;
      }`,
    fragmentShader: WAVE_GLSL + /* glsl */`
      uniform vec3 uColor;
      uniform float uOpacity;
      varying vec2 vUv;
      varying vec3 vWorld;
      void main() {
        if (waveCode(vWorld)) discard;
        float d = length(vUv - 0.5) * 2.0;
        float a = exp(-d * d * 3.5) * (1.0 - smoothstep(0.75, 1.0, d));
        gl_FragColor = vec4(uColor, a * uOpacity);
      }`,
  });
  material.userData.glow = true;
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(part.size[0], part.size[1]), material);
  mesh.position.fromArray(part.offset || [0, 0, 0]);
  const [rx, ry, rz] = part.rotation || [0, 0, 0];
  mesh.rotation.set(toRadians(rx), toRadians(ry), toRadians(rz));
  if (part.name) mesh.name = part.name;
  mesh.raycast = noRaycast;
  mesh.frustumCulled = !part.face;
  mesh.renderOrder = 2;
  return mesh;
}

// A beam of light: a soft ribbon along the beam that turns about its own axis to face you,
// brightest in the middle, fading at the ends, with slow streaks drifting through it.
function buildShaft(part, shared) {
  const material = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide, fog: false,
    uniforms: {
      uA: { value: new THREE.Vector3().fromArray(part.from) }, uB: { value: new THREE.Vector3().fromArray(part.to) },
      uR: { value: new THREE.Vector2(...part.radius) }, uColor: { value: new THREE.Color(part.color || '#a0b4e0') },
      uStrength: { value: part.strength ?? 0.3 }, uTime: shared.uTime, uFlash: shared.uFlash, ...shared.wave,
    },
    vertexShader: /* glsl */`
      uniform vec3 uA, uB;
      uniform vec2 uR;
      varying vec2 vP;
      varying vec3 vWorld;
      varying float vSide;
      void main() {
        float t = position.y + 0.5;                       // 0 at the window, 1 on the floor
        vec3 axis = normalize(uB - uA);
        vec3 c = mix(uA, uB, t);
        vec3 toCam = normalize(cameraPosition - c);
        vec3 side = cross(axis, toCam);
        vSide = length(side);                             // side-on (1) or looking along the beam (0)
        side = vSide > 1e-4 ? side / vSide : vec3(1.0, 0.0, 0.0);
        vec3 world = c + side * position.x * 2.0 * mix(uR.x, uR.y, t);
        vP = vec2(position.x * 2.0, t);
        vWorld = world;
        gl_Position = projectionMatrix * viewMatrix * vec4(world, 1.0);
      }`,
    fragmentShader: WAVE_GLSL + /* glsl */`
      uniform vec3 uColor;
      uniform float uStrength, uTime, uFlash;
      varying vec2 vP;
      varying vec3 vWorld;
      varying float vSide;
      float h1(float n) { return fract(sin(n * 127.1) * 43758.5453); }
      float n1(float x) { float i = floor(x), f = fract(x); f = f * f * (3.0 - 2.0 * f); return mix(h1(i), h1(i + 1.0), f); }
      void main() {
        if (waveCode(vWorld)) discard;
        float across = vP.x, t = vP.y;
        float core = exp(-across * across * 2.4) * (1.0 - smoothstep(0.75, 1.0, abs(across)));
        float ends = smoothstep(0.0, 0.12, t) * (1.0 - smoothstep(0.78, 1.0, t));
        float streak = 0.6 + 0.4 * n1(across * 6.0 + uTime * 0.12) * n1(across * 2.7 - uTime * 0.05 + t * 3.0 + 4.0);
        float fall = mix(1.0, 0.6, t);
        float near = smoothstep(0.25, 1.1, distance(vWorld, cameraPosition));
        float a = core * ends * streak * fall * near * mix(0.4, 1.0, vSide);
        gl_FragColor = vec4(uColor * (1.0 + uFlash * 2.5), a * uStrength);
      }`,
  });
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(1, 1, 1, 24), material);
  mesh.frustumCulled = false;
  mesh.raycast = noRaycast;
  mesh.renderOrder = 3;
  return mesh;
}

// Dust motes drifting slowly inside the beam, catching the light as they turn.
function buildMotes(part, shared) {
  const count = Math.round((part.count || 200) * (IS_PHONE ? 0.55 : 1));
  const R = seededRandom(9091), seeds = new Float32Array(count * 4), positions = new Float32Array(count * 3);
  for (let i = 0; i < count; i++) {
    const a = R() * Math.PI * 2, r = Math.sqrt(R());
    seeds.set([R(), Math.cos(a) * r, Math.sin(a) * r, R()], i * 4);
  }
  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geometry.setAttribute('aSeed', new THREE.BufferAttribute(seeds, 4));
  const material = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, fog: false,
    uniforms: {
      uA: { value: new THREE.Vector3().fromArray(part.from) }, uB: { value: new THREE.Vector3().fromArray(part.to) },
      uR: { value: new THREE.Vector2(...part.radius) }, uTime: shared.uTime, uScale: shared.uScale, uFlash: shared.uFlash, ...shared.wave,
    },
    vertexShader: /* glsl */`
      attribute vec4 aSeed;
      uniform vec3 uA, uB;
      uniform vec2 uR;
      uniform float uTime, uScale;
      varying float vAlpha;
      varying vec3 vWorld;
      void main() {
        vec3 axis = normalize(uB - uA);
        vec3 u = normalize(cross(axis, vec3(0.0, 1.0, 0.0)));
        vec3 v = cross(u, axis);
        float t = fract(aSeed.x + uTime * (0.003 + aSeed.w * 0.004));          // a slow drift down the beam
        float r = mix(uR.x, uR.y, t);
        vec2 d = aSeed.yz + vec2(sin(uTime * 0.21 + aSeed.w * 40.0), cos(uTime * 0.17 + aSeed.w * 23.0)) * 0.12;
        vec3 p = mix(uA, uB, t) + (u * d.x + v * d.y) * r;
        p.y += sin(uTime * 0.3 + aSeed.w * 17.0) * 0.03;
        vWorld = p;
        vec4 mv = viewMatrix * vec4(p, 1.0);
        float inside = 1.0 - smoothstep(0.55, 1.0, length(d));
        float twinkle = 0.45 + 0.55 * sin(uTime * (0.6 + aSeed.w * 1.4) + aSeed.w * 30.0);
        vAlpha = inside * twinkle * smoothstep(0.05, 0.15, t) * (1.0 - smoothstep(0.85, 1.0, t)) * smoothstep(0.3, 0.9, -mv.z);
        gl_PointSize = clamp((0.005 + aSeed.w * 0.007) * uScale / max(-mv.z, 0.05), 1.0, 7.0);
        gl_Position = projectionMatrix * mv;
      }`,
    fragmentShader: WAVE_GLSL + /* glsl */`
      uniform float uFlash;
      varying float vAlpha;
      varying vec3 vWorld;
      void main() {
        if (waveCode(vWorld)) discard;
        float r = length(gl_PointCoord - 0.5);
        gl_FragColor = vec4(vec3(0.85, 0.9, 1.0) * (1.0 + uFlash * 2.0), (1.0 - smoothstep(0.1, 0.5, r)) * vAlpha * 0.55);
      }`,
  });
  const points = new THREE.Points(geometry, material);
  points.frustumCulled = false;
  return points;
}

// Rain falling past the streetlamp and into the well.
function buildRain(part, shared) {
  const count = Math.round((part.count || 1000) * (IS_PHONE ? 0.5 : 1));
  const [x0, x1, y0, y1, z0, z1] = part.box, R = seededRandom(5150);
  const positions = new Float32Array(count * 6), ends = new Float32Array(count * 2);
  for (let i = 0; i < count; i++) {
    const x = x0 + R() * (x1 - x0), y = y0 + R() * (y1 - y0);
    const z = z0 + Math.pow(R(), 1.4) * (z1 - z0);       // more of them close to the window
    positions.set([x, y, z, x, y, z], i * 6);
    ends[i * 2 + 1] = 1;
  }
  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geometry.setAttribute('aEnd', new THREE.BufferAttribute(ends, 1));
  const material = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, fog: false,
    uniforms: { uTime: shared.uTime, uFlash: shared.uFlash, uY: { value: new THREE.Vector2(y0, y1 - y0) }, uLamp: { value: new THREE.Vector3(2.25, 4.05, -8.05) }, ...shared.wave },
    vertexShader: /* glsl */`
      attribute float aEnd;
      uniform float uTime;
      uniform vec2 uY;
      varying float vAlpha;
      varying vec3 vWorld;
      void main() {
        vec3 p = position;
        p.y = uY.x + mod(p.y - uY.x - uTime * 7.5, uY.y);
        p.x += (p.y - uY.x) * 0.05;
        p += aEnd * vec3(0.012, 0.22, 0.0);
        vec4 world = modelMatrix * vec4(p, 1.0);
        vWorld = world.xyz;
        vec4 mv = viewMatrix * world;
        vAlpha = (1.0 - smoothstep(4.0, 16.0, -mv.z)) * (0.35 + 0.65 * aEnd);
        gl_Position = projectionMatrix * mv;
      }`,
    fragmentShader: WAVE_GLSL + /* glsl */`
      uniform float uFlash;
      uniform vec3 uLamp;
      varying float vAlpha;
      varying vec3 vWorld;
      void main() {
        if (waveCode(vWorld)) discard;
        float lamp = exp(-pow(distance(vWorld, uLamp), 2.0) / 6.0);
        gl_FragColor = vec4(vec3(0.62, 0.7, 0.95) * (0.35 + lamp * 1.2 + uFlash * 1.5), vAlpha * 0.8);
      }`,
  });
  const lines = new THREE.LineSegments(geometry, material);
  lines.frustumCulled = false;
  return lines;
}

// The night sky above the yard: deep blue, low clouds lit orange by the town, a few stars, lightning.
function buildSky(part, shared) {
  const sky = new THREE.Mesh(new THREE.SphereGeometry(300, 32, 16), new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false, fog: false,
    uniforms: { uTime: shared.uTime, uFlash: shared.uFlash, ...shared.wave },
    vertexShader: /* glsl */`
      varying vec3 vWorld;
      void main() { vec4 w = modelMatrix * vec4(position, 1.0); vWorld = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }`,
    fragmentShader: WAVE_GLSL + /* glsl */`
      uniform float uTime, uFlash;
      varying vec3 vWorld;
      float hash(vec2 p) { p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
      float noise(vec2 p) {
        vec2 i = floor(p), f = fract(p);
        f = f * f * (3.0 - 2.0 * f);
        return mix(mix(hash(i), hash(i + vec2(1, 0)), f.x), mix(hash(i + vec2(0, 1)), hash(i + vec2(1, 1)), f.x), f.y);
      }
      void main() {
        if (waveCode(vWorld)) discard;
        vec3 dir = normalize(vWorld - cameraPosition);
        float y = max(dir.y, 0.0);
        vec3 col = mix(vec3(0.16, 0.09, 0.12), vec3(0.025, 0.03, 0.075), smoothstep(0.0, 0.45, y));
        vec2 uv = dir.xz / max(dir.y + 0.15, 0.05) * 1.3 + vec2(uTime * 0.012, uTime * 0.005);
        float c = noise(uv) * 0.55 + noise(uv * 2.3) * 0.3 + noise(uv * 5.1) * 0.15;
        c = smoothstep(0.4, 0.85, c);
        col = mix(col, vec3(0.2, 0.13, 0.2) * (1.0 - y * 0.5), c * 0.8);
        vec2 sp = vec2(atan(dir.z, dir.x) * 220.0, dir.y * 220.0);
        vec2 cell = floor(sp), f = fract(sp) - 0.5;
        float star = step(0.985, hash(cell)) * smoothstep(0.22, 0.05, length(f)) * (1.0 - c) * smoothstep(0.15, 0.4, y);
        col += vec3(0.9, 0.9, 1.0) * star * 0.6;
        col += vec3(0.55, 0.6, 0.95) * uFlash * (0.3 + c);
        gl_FragColor = vec4(col, 1.0);
      }`,
  }));
  sky.renderOrder = -10;
  sky.frustumCulled = false;
  sky.userData.holoHide = true;
  sky.raycast = noRaycast;
  return sky;
}

// The flicker of a tired bulb: a faint buzz, now and then a dip, every so often a stutter.
// The light and the glass read the same clock, so they flicker together.
const flick = { burstUntil: 0, steadyUntil: 0 };
function flickerLevel(t, amount) {
  const h = n => { const x = Math.sin(n * 91.345 + 7.13) * 47453.5453; return x - Math.floor(x); };
  if (t < flick.steadyUntil && t > flick.burstUntil) return 1;
  let k = 0.93 + 0.07 * Math.sin(t * 47.0) * Math.sin(t * 13.3);
  const burst = t < flick.burstUntil || (t % 13.7) < 0.85;
  if (burst) k *= h(Math.floor(t * 17)) < 0.45 ? 0.06 : 1;
  else if (h(Math.floor(t * 8)) < 0.05) k *= 0.3;
  return 1 - amount + amount * k;
}

// Things you can click (and the moving bits inside them) can't be baked into the room's big static
// meshes, but their own still parts can be baked together: one mesh per object (or per moving part)
// and per kind of surface. Far fewer draw calls for the kit, the amp, the couch, the bassist.
function mergeLocal(root, raycastTargets, mergeGeometries) {
  const containers = [root];
  root.traverse(o => { if (o !== root && !o.isMesh && (o.userData.anim || o.userData.arm || o.name)) containers.push(o); });
  const isContainer = new Set(containers);
  const keep = new Set(['position', 'normal', 'uv']);
  const relative = new THREE.Matrix4(), inverse = new THREE.Matrix4();
  root.updateMatrixWorld(true);
  for (const c of containers) {
    if (c.userData.arm) continue;                          // arms are re-posed every frame
    inverse.copy(c.matrixWorld).invert();
    const buckets = new Map(), take = [];
    c.traverse(o => {
      if (!o.isMesh || o.isInstancedMesh || o.name || o.userData.outline || o.userData.keepMaterial && !o.material.isMeshStandardMaterial) return;
      if (o.children.some(ch => !ch.userData.outline)) return;
      for (let p = o.parent; p && p !== c; p = p.parent) if (isContainer.has(p)) return;   // belongs to an inner moving part
      const m = o.material, toon = m.isMeshToonMaterial;
      if (!(m.isMeshStandardMaterial || toon) || m.map || m.transparent) return;
      if (m.emissive.getHex() !== 0 && m.emissiveIntensity > 0) return;
      take.push(o);
    });
    if (take.length < 2) continue;
    for (const o of take) {
      const m = o.material, toon = !!m.isMeshToonMaterial;
      relative.multiplyMatrices(inverse, o.matrixWorld);
      let g = o.geometry.clone().applyMatrix4(relative);
      if (g.index) g = g.toNonIndexed();
      for (const name of Object.keys(g.attributes)) if (!keep.has(name)) g.deleteAttribute(name);
      const n = g.attributes.position.count;
      if (!g.attributes.uv) g.setAttribute('uv', new THREE.BufferAttribute(new Float32Array(n * 2), 2));
      const colors = new Float32Array(n * 3);
      for (let i = 0; i < n; i++) colors.set([m.color.r, m.color.g, m.color.b], i * 3);
      g.setAttribute('color', new THREE.BufferAttribute(colors, 3));
      const key = toon ? `toon|${m.side}` : `${m.roughness.toFixed(2)}|${m.metalness.toFixed(2)}|${m.side}`;
      if (!buckets.has(key)) buckets.set(key, { toon, roughness: m.roughness, metalness: m.metalness, side: m.side, list: [] });
      buckets.get(key).list.push(g);
      o.parent.remove(o);
      for (const ch of o.children) ch.geometry === o.geometry || ch.geometry.dispose();
      o.geometry.dispose();
      m.dispose();
      const at = raycastTargets.indexOf(o);
      if (at >= 0) raycastTargets.splice(at, 1);
    }
    for (const { toon, roughness, metalness, side, list } of buckets.values()) {
      const geometry = mergeGeometries(list, false);
      list.forEach(g => g.dispose());
      const material = toon
        ? new THREE.MeshToonMaterial({ vertexColors: true, gradientMap: toonGradient, side })
        : new THREE.MeshStandardMaterial({ vertexColors: true, roughness, metalness, side });
      const mesh = new THREE.Mesh(geometry, material);
      if (toon) {
        const outline = new THREE.Mesh(geometry, outlineMaterial);
        outline.userData.outline = true;
        outline.raycast = noRaycast;
        mesh.add(outline);
      }
      c.add(mesh);
      raycastTargets.push(mesh);
    }
  }
}

// One part of an object (see the list at the top of ROOM).
function buildPart(part, textures, shared, animated) {
  const size = part.size || [];
  if (part.shape === 'light') {
    const light = new THREE.PointLight(part.color || '#ffffff', part.intensity ?? 3, part.distance ?? 0, 2);
    light.position.fromArray(part.offset || [0, 0, 0]);
    if (part.flicker) animated.push({ kind: 'flicker', object: light, base: light.intensity, amount: part.flicker });
    if (part.pulse) animated.push({ kind: 'pulse', object: light, base: light.intensity, amount: part.pulse });
    return light;
  }
  if (part.shape === 'string') return buildString(part, animated);
  if (part.shape === 'glow') {
    const glow = buildGlow(part, shared);
    if (part.pulse) animated.push({ kind: 'pulse', object: glow, base: part.opacity ?? 0.5, amount: part.pulse });
    if (part.flicker) animated.push({ kind: 'flicker', object: glow, base: part.opacity ?? 0.5, amount: part.flicker });
    return glow;
  }
  if (part.shape === 'shaft') return buildShaft(part, shared);
  if (part.shape === 'motes') return buildMotes(part, shared);
  if (part.shape === 'rain') return buildRain(part, shared);
  if (part.shape === 'sky') return buildSky(part, shared);
  if (part.shape === 'steam') return buildSteam(part, shared);
  if (part.shape === 'arm') return buildArm(part, textures, shared, animated);
  if (part.shape === 'marker') {
    const marker = new THREE.Object3D();
    marker.name = part.name || '';
    marker.position.fromArray(part.offset || [0, 0, 0]);
    return marker;
  }
  if (part.shape === 'neon') {
    const material = new THREE.MeshBasicMaterial({ map: textures.neon, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, color: '#ffffff', opacity: 0.62 * (part.brightness ?? 1) });
    material.userData.neon = true;
    material.userData.baseOpacity = material.opacity;
    const mesh = new THREE.Mesh(new THREE.PlaneGeometry(size[0], size[1]), material);
    mesh.position.fromArray(part.offset || [0, 0, 0]);
    mesh.userData.holoHide = true;
    return mesh;
  }
  if (part.shape === 'face') {
    // a painted face wrapped over the front of the head
    const geometry = new THREE.SphereGeometry(size[0], 40, 32, toRadians(40), toRadians(100), toRadians(50), toRadians(80));
    const material = new THREE.MeshBasicMaterial({ map: textures.faceOpen, color: '#c4bad0', transparent: true, depthWrite: false, polygonOffset: true, polygonOffsetFactor: -2 });
    const mesh = new THREE.Mesh(geometry, material);
    mesh.position.fromArray(part.offset || [0, 0, 0]);
    if (part.scale) mesh.scale.fromArray(part.scale);
    mesh.userData.keepMaterial = true;
    mesh.userData.anim = 'blink';
    animated.push({ kind: 'blinkFace', object: mesh, period: part.period || 4, open: textures.faceOpen, closed: textures.faceClosed });
    return mesh;
  }
  if (part.shape === 'group') {
    const group = new THREE.Group();
    if (part.name) group.name = part.name;
    group.position.fromArray(part.offset || [0, 0, 0]);
    const [rx, ry, rz] = part.rotation || [0, 0, 0];
    group.rotation.set(toRadians(rx), toRadians(ry), toRadians(rz));
    if (part.scale) group.scale.fromArray(part.scale);
    for (const child of part.parts || []) group.add(buildPart(child, textures, shared, animated));
    if (part.anim) {
      const anim = typeof part.anim === 'string' ? { type: part.anim } : part.anim;
      group.userData.anim = anim.type;
      animated.push({ kind: anim.type, object: group, ...anim, base: { position: group.position.clone(), rotation: group.rotation.clone() } });
    }
    return group;
  }

  const deg = v => toRadians(v);
  let geometry, material;
  if (part.shape === 'glass') {
    geometry = new THREE.PlaneGeometry(size[0], size[1]);
    material = glassMaterial(shared, size);
  } else if (part.shape === 'screen') {
    geometry = new THREE.PlaneGeometry(size[0], size[1]);
    material = new THREE.MeshBasicMaterial({ map: textures.screen, color: '#ffffff' });
  } else {
    if (part.shape === 'box') geometry = new THREE.BoxGeometry(size[0], size[1], size[2]);
    else if (part.shape === 'cylinder') geometry = new THREE.CylinderGeometry(size[0], size[1], size[2], part.segments ?? 32, 1, !!part.open, deg(size[3] ?? 0), deg(size[4] ?? 360));
    else if (part.shape === 'sphere') geometry = new THREE.SphereGeometry(size[0], 28, 18, deg(size[1] ?? 0), deg(size[2] ?? 360), deg(size[3] ?? 0), deg(size[4] ?? 180));
    else if (part.shape === 'disc') geometry = new THREE.CircleGeometry(size[0], 48).rotateX(-Math.PI / 2);
    else if (part.shape === 'cone') geometry = new THREE.ConeGeometry(size[0], size[1], part.segments ?? 20);
    else if (part.shape === 'torus') geometry = new THREE.TorusGeometry(size[0], size[1], 10, 32, deg(size[2] ?? 360));
    else if (part.shape === 'plane') geometry = new THREE.PlaneGeometry(size[0], size[1]);
    else if (part.shape === 'limb') geometry = new THREE.CapsuleGeometry(part.radius, Math.max(0.001, new THREE.Vector3().fromArray(part.from).distanceTo(new THREE.Vector3().fromArray(part.to))), 6, 14);
    else if (part.shape === 'cloth') geometry = clothGeometry(part);
    else if (part.shape === 'cable') geometry = new THREE.TubeGeometry(new THREE.CatmullRomCurve3(part.points.map(p => new THREE.Vector3().fromArray(p))), part.points.length * 10, part.radius, 6, false);
    else if (part.shape === 'corrugated') geometry = corrugatedGeometry(part);
    else if (part.shape === 'wellFloor') geometry = halfOvalGeometry(size);
    else if (part.shape === 'groundHole') geometry = groundHoleGeometry(part);
    else throw new Error(`Unknown part shape: ${part.shape}`);
    if (part.segments && part.segments <= 6) { geometry = geometry.toNonIndexed(); geometry.computeVertexNormals(); }   // faceted: flat shading
    const doubleSided = part.open || part.shape === 'cloth' || part.shape === 'corrugated' || (part.shape === 'sphere' && size[4] != null);
    material = new THREE.MeshStandardMaterial({
      color: part.texture ? '#ffffff' : (part.color || '#888888'),
      map: part.texture ? textures[part.texture] : null,
      roughness: part.roughness ?? 0.85,
      metalness: part.metalness ?? 0,
      emissive: part.emissive || '#000000',
      emissiveIntensity: part.emissiveIntensity ?? 1,
      transparent: !!part.transparent,
      opacity: part.opacity ?? 1,
      side: doubleSided ? THREE.DoubleSide : THREE.FrontSide,
    });
  }
  const mesh = new THREE.Mesh(geometry, material);
  if (part.shape === 'limb') {
    const a = new THREE.Vector3().fromArray(part.from), b = new THREE.Vector3().fromArray(part.to);
    mesh.position.copy(a).lerp(b, 0.5);
    mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), b.clone().sub(a).normalize());
  } else {
    mesh.position.fromArray(part.offset || [0, 0, 0]);
    const [rx, ry, rz] = part.rotation || [0, 0, 0];
    mesh.rotation.set(toRadians(rx), toRadians(ry), toRadians(rz));
  }
  if (part.scale) mesh.scale.fromArray(part.scale);
  if (part.name) mesh.name = part.name;
  if (part.keep) mesh.userData.keepMaterial = true;          // keeps its own look in toon style (no outline)
  if (part.flicker) animated.push({ kind: 'flicker', object: mesh, base: material.emissiveIntensity, amount: part.flicker });
  if (part.spin) animated.push({ kind: 'spin', object: mesh, speed: part.spin });
  if (part.pulse) animated.push({ kind: 'pulse', object: mesh, base: material.emissiveIntensity, amount: part.pulse });
  return mesh;
}

// A strand of little bulbs hanging between two points, gently twinkling.
function buildString(part, animated) {
  const group = new THREE.Group();
  const from = new THREE.Vector3().fromArray(part.from), to = new THREE.Vector3().fromArray(part.to);
  const count = part.count || 20, points = [];
  for (let i = 0; i <= 40; i++) {
    const t = i / 40;
    points.push(from.clone().lerp(to, t).add(new THREE.Vector3(0, -part.sag * 4 * t * (1 - t), 0)));
  }
  group.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(points), new THREE.LineBasicMaterial({ color: '#1a1714' })));

  const bulbs = new THREE.InstancedMesh(new THREE.SphereGeometry(0.028, 10, 8), new THREE.MeshBasicMaterial({ color: '#ffffff' }), count);
  const matrix = new THREE.Matrix4(), color = new THREE.Color(part.color || '#ffcf8a');
  for (let i = 0; i < count; i++) {
    const t = (i + 0.5) / count;
    const p = from.clone().lerp(to, t).add(new THREE.Vector3(0, -part.sag * 4 * t * (1 - t) - 0.03, 0));
    bulbs.setMatrixAt(i, matrix.makeTranslation(p.x, p.y, p.z));
    bulbs.setColorAt(i, color);
  }
  group.add(bulbs);
  // one soft light in the middle so the wall picks up the glow
  if (part.glow !== 0) {
    const glow = new THREE.PointLight(part.color || '#ffcf8a', part.glow ?? 5, 8, 2);
    glow.position.copy(from.clone().lerp(to, 0.5)).add(new THREE.Vector3(0, -part.sag - 0.1, 0.3));
    group.add(glow);
  }
  animated.push({ kind: 'twinkle', object: bulbs, color, count });
  return group;
}

// Every object in ROOM.objects: a group of parts, maybe a hotspot, maybe solid.
function buildObjects(scene, textures, shared, animated, colliders, raycastTargets, hotspots) {
  const built = [];
  for (const spec of ROOM.objects) {
    const group = new THREE.Group();
    group.name = spec.id || '';
    group.position.fromArray(spec.position || [0, 0, 0]);
    group.rotation.y = toRadians(spec.rotationY);
    shared.wave = spec.outside ? shared.cityWave : shared.roomWave;     // shader parts follow their side of the world
    for (const part of spec.parts || []) group.add(buildPart(part, textures, shared, animated));
    if (spec.style === 'toon') toonify(group);
    scene.add(group);
    registerObject(group, spec, colliders, raycastTargets, hotspots);
    built.push({ group, spec });
  }
  return built;
}

// Shared by built objects and loaded models: collisions, clickability.
function registerObject(group, spec, colliders, raycastTargets, hotspots) {
  if (spec.outside) group.userData.city = true;     // turns to code in Mix mode, like the city
  group.updateMatrixWorld(true);
  group.traverse(child => { if (child.isMesh && !child.isInstancedMesh) raycastTargets.push(child); });
  if (spec.hotspot) {
    group.userData.hotspot = spec.hotspot;
    hotspots.push(group);
  }
  if (spec.collide !== false) {
    const box = new THREE.Box3().setFromObject(group);
    if (box.min.y < SETTINGS.eyeHeight) colliders.push({ minX: box.min.x, maxX: box.max.x, minZ: box.min.z, maxZ: box.max.z });
  }
}

// GLB models listed in ROOM.models (the loader is only downloaded if there are any).
async function loadModels(scene, manager, colliders, raycastTargets, hotspots) {
  if (!ROOM.models?.length) return;
  const { GLTFLoader } = await import('three/addons/loaders/GLTFLoader.js');
  const loader = new GLTFLoader(manager);
  await Promise.all(ROOM.models.map(async spec => {
    try {
      const gltf = await loader.loadAsync(spec.url);
      const model = gltf.scene;
      model.position.fromArray(spec.position || [0, 0, 0]);
      model.rotation.y = toRadians(spec.rotationY);
      model.scale.setScalar(spec.scale ?? 1);
      scene.add(model);
      registerObject(model, spec, colliders, raycastTargets, hotspots);
    } catch (error) {
      console.warn(`Room: couldn't load model ${spec.url}`, error);
    }
  }));
}

// Floating dust in the room, drifting slowly (frozen while paused).
function buildDust(scene, rand, shared) {
  const { width, depth, height } = ROOM.size, count = SETTINGS.dustCount;
  const positions = new Float32Array(count * 3), seeds = new Float32Array(count);
  for (let i = 0; i < count; i++) {
    positions.set([(rand() - 0.5) * width, rand() * height, (rand() - 0.5) * depth], i * 3);
    seeds[i] = rand();
  }
  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geometry.setAttribute('aSeed', new THREE.BufferAttribute(seeds, 1));
  const dust = new THREE.Points(geometry, new THREE.ShaderMaterial({
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
    uniforms: { uTime: shared.uTime, uScale: shared.uScale, uRoom: { value: new THREE.Vector3(width, height, depth) } },
    vertexShader: /* glsl */`
      attribute float aSeed;
      uniform float uTime, uScale;
      uniform vec3 uRoom;
      varying float vAlpha;
      void main() {
        vec3 p = position + vec3(sin(uTime * 0.13 + aSeed * 20.0) * 0.4, uTime * (0.02 + aSeed * 0.04), cos(uTime * 0.11 + aSeed * 13.0) * 0.4);
        p.xz = mod(p.xz + uRoom.xz * 0.5, uRoom.xz) - uRoom.xz * 0.5;
        p.y = mod(p.y, uRoom.y);
        vec4 mv = modelViewMatrix * vec4(p, 1.0);
        float dist = -mv.z;
        vAlpha = (1.0 - smoothstep(1.5, 4.5, dist)) * smoothstep(0.3, 0.8, dist) * (0.3 + 0.7 * aSeed);
        gl_PointSize = clamp((0.004 + aSeed * 0.006) * uScale / max(dist, 0.01), 0.0, 4.0);
        gl_Position = projectionMatrix * mv;
      }`,
    fragmentShader: /* glsl */`
      varying float vAlpha;
      void main() {
        float r = length(gl_PointCoord - 0.5);
        gl_FragColor = vec4(vec3(1.0, 0.93, 0.82), (1.0 - smoothstep(0.0, 0.5, r)) * vAlpha * 0.28);
      }`,
  }));
  dust.frustumCulled = false;
  scene.add(dust);
  return dust;
}

function buildLights(scene) {
  for (const spec of ROOM.lights || []) {
    let light;
    if (spec.type === 'hemisphere') light = new THREE.HemisphereLight(spec.sky, spec.ground, spec.intensity);
    else if (spec.type === 'point') light = new THREE.PointLight(spec.color, spec.intensity, spec.distance ?? 0, 2);
    else if (spec.type === 'ambient') light = new THREE.AmbientLight(spec.color, spec.intensity);
    else continue;
    if (spec.position) light.position.fromArray(spec.position);
    scene.add(light);
  }
}


/* ---------------------------------------------------------------------
   7. Post-processing: film grain, a soft vignette and a faint split-RGB
   that grows a little while you run. (Same finish as The Garden.)
   --------------------------------------------------------------------- */
function showGraphicsNote(title, detail, reload = true) {
  const note = document.createElement('div');
  note.setAttribute('role', 'alert');
  note.style.cssText = 'position:fixed;inset:0;z-index:50;display:grid;place-content:center;gap:10px;text-align:center;padding:24px;background:rgba(10,8,16,0.86);color:#f5efe2;font:16px/1.5 system-ui,sans-serif;' + (reload ? 'cursor:pointer;' : '');
  note.innerHTML = `<strong style="font-size:20px">${title}</strong><span style="opacity:0.75">${detail}</span>`;
  if (reload) note.addEventListener('click', () => location.reload());
  document.body.appendChild(note);
}

function buildPostProcessing(renderer, scene, camera, pixelRatio) {
  const composer = new EffectComposer(renderer);
  composer.setPixelRatio(pixelRatio);
  composer.setSize(innerWidth, innerHeight);
  composer.addPass(new RenderPass(scene, camera));
  const finish = new ShaderPass({
    uniforms: { tDiffuse: { value: null }, uTime: { value: 0 }, uSpeed: { value: 0 }, uHolo: { value: 0 }, uGlitch: { value: 0 } },
    vertexShader: /* glsl */`
      varying vec2 vUv;
      void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
    fragmentShader: /* glsl */`
      uniform sampler2D tDiffuse;
