<!DOCTYPE html>
<!--
  THE BASEMENT  (three.js r186, built on Room Template v2).
  A band's jam space under the house at night: poured concrete, acoustic foam, mismatched rugs, string lights
  along the joists, a bare bulb that flickers, and one dusty shaft of streetlight from the window well.
  Everything is walkable and the gear is playable, all sound made live in the browser (no audio files):
    drums (click each piece, or keys 1-5), a guitar (click or G) through an amp (off / clean / crunch),
    a loop pedal (click or L: record, loop, overdub, clear; hold to clear), a mic, the laptop plays the playlist.

  Making your own copy
  - Put a room.json next to this page to change the title, the door's link, the songs, the posters, the colours,
    the band's name, the band members' looks and what the guitarist says, without touching the code:
      { "title": "...", "band": "THE STUMPS",
        "doors": { "door": { "href": "https://example.com", "label": "Upstairs" } },
        "playlist": ["music/song.mp3"],
        "posters": { "posterBand": "posters/flyer.jpg", "posterMildew": "...", "posterFurnace": "...", "posterCardboard": "..." },
        "colors": { "floor": "#4e4a4a", "walls": "#5a5552", "ceiling": "#8a7a6c", "couch": "#6b4a3e" },
        "guitarist": { "show": true, "hair": "#b09460", "skin": "#dcbba6", "eyes": "#86b8c2", "flannel": "#8c3242",
                       "beanie": "#2f5a35", "jeans": "#3e4c6a", "guitar": "#c98a4e" },
        "bassist": { "show": true, "skin": "#e3b896", "hair": "#4a3222", "beard": "#5a3a24", "shirt": "#2a2a31",
                     "pants": "#4e5a66", "cap": "#b8352a", "bass": "#25222c" },
        "drummer": { "show": true, "skin": "#e6c2a6", "hair": "#f1d35a", "shirt": "#141217", "pants": "#2c2c33", "gauges": "#0e0e10" },
        "talk": ["line one", "line two"] }
    A room.json containing "objects" replaces ROOM entirely.
  - Things you can use are "hotspots": give an object  hotspot: { label, action }  and add the action to ACTIONS.

  Controls
  - Desktop: WASD / arrow keys to walk (Shift to run), mouse wheel to step, drag to look, click things,
    1-8 drums, G strum, L loop pedal (hold to clear), H switch view, P pause, F FPS readout, N / B next / previous song.
  - Phone: drag one finger to look; slide two fingers to walk, or use the thumb joystick; tap things (or the label).
    Long-press the loop pedal to clear it.

  Keep the three.js addresses below identical in every room so phones download three.js only once.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Basement</title>
<meta name="description" content="A band's basement jam room at night: concrete, foam, rugs, a flickering bulb and a dusty shaft of streetlight. Play the drums, the guitar and the loop pedal.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500&display=swap" rel="stylesheet">

<style>
/* ===================================================================
   Base
   =================================================================== */
:root {
  --u: min(calc(100vw / 1600), calc(100vh / 900));   /* 1u = 1px on a 1600×900 screen; scales with the window */
  --cream: #f5efe2;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
[hidden] { display: none !important; }

html, body {
  height: 100%;
  background: #000;
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-user-select: none;
  user-select: none;
}
html { cursor: grab; }
html.dragging { cursor: grabbing; }
html.can-use { cursor: pointer; }
body {
  color: var(--cream);
  font-family: Manrope, system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
  touch-action: none;              /* the page handles all touch gestures itself */
}
body.no-webgl { background: radial-gradient(120% 80% at 50% 100%, #2a1f2e 0%, #100c12 45%, #000 80%); }

a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
a:focus-visible, button:focus-visible { outline: 2px solid var(--cream); outline-offset: 3px; }

/* ===================================================================
   3D view and the black fade used for the intro and for doors
   =================================================================== */
#view { position: fixed; inset: 0; }
#view canvas { display: block; width: 100% !important; height: 100% !important; }
#fade { position: fixed; inset: 0; z-index: 5; background: #000; pointer-events: none; transition: opacity 1.2s ease; }
#fade.out { opacity: 0; }
#fade.leaving { opacity: 1; transition-duration: 0.6s; }

/* ===================================================================
   Interface layer (fades in after the intro)
   =================================================================== */
.ui {
  position: fixed;
  inset: 0;
  z-index: 2;
  pointer-events: none;            /* clicks pass through to the 3D view... */
  opacity: 0;
  transition: opacity 1.2s ease;
}
.ui.on { opacity: 1; }
.ui a, .ui button, .stick {
  pointer-events: auto;            /* ...except on links, buttons and the joystick */
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;     /* no long-press menu on phones */
  -webkit-tap-highlight-color: transparent;
  touch-action: none;
}

header {
  position: absolute;
  top: env(safe-area-inset-top, 0);
  left: 0;
  right: 0;
  padding: calc(24 * var(--u)) calc(44 * var(--u)) 0;
}
.logo { display: block; width: fit-content; font-size: calc(26 * var(--u)); font-weight: 500; letter-spacing: -0.02em; }

/* "Paused" chip and short messages, top centre */
.chip {
  position: absolute;
  top: calc(28 * var(--u) + env(safe-area-inset-top, 0px));
  left: 50%;
  transform: translateX(-50%);
  padding: 7px 14px;
  border-radius: 99px;
  background: rgba(0, 0, 0, 0.5);
  border: 1px solid rgba(245, 239, 226, 0.25);
  font-size: 12px;
  font-weight: 500;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  transition: opacity 0.4s;
}
#toast { top: calc(72 * var(--u) + env(safe-area-inset-top, 0px)); letter-spacing: 0.04em; text-transform: none; font-size: 13px; opacity: 0; }
#toast.show { opacity: 1; }

/* Label for the thing you're looking at / pointing at; tap it on a phone to use it */
.prompt {
  position: absolute;
  left: 50%;
  bottom: calc(120 * var(--u) + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%);
  padding: 9px 16px;
  border-radius: 99px;
  background: rgba(0, 0, 0, 0.55);
  border: 1px solid rgba(245, 239, 226, 0.35);
  font-size: 14px;
  font-weight: 500;
  white-space: nowrap;
}
.prompt b { font-weight: 500; opacity: 0.6; margin-left: 8px; }

/* Centre dot on touch screens: what's under it can be used */
.reticle {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 6px;
  height: 6px;
  margin: -3px 0 0 -3px;
  border-radius: 50%;
  background: rgba(245, 239, 226, 0.55);
  transition: transform 0.2s, background 0.2s;
  display: none;
}
.reticle.on { transform: scale(2.2); background: var(--cream); }

/* Bottom right: hints, pause and sound */
.corner {
  position: absolute;
  right: calc(44 * var(--u));
  bottom: calc(44 * var(--u) + env(safe-area-inset-bottom, 0px));
  display: flex;
  align-items: center;
  gap: calc(18 * var(--u));
  font-size: calc(12.5 * var(--u));
  font-weight: 500;
  letter-spacing: 0.16em;
  text-transform: uppercase;
}
.corner i { width: 1px; height: calc(26 * var(--u)); background: rgba(245, 239, 226, 0.45); }
.icon-btn { display: grid; place-items: center; width: calc(28 * var(--u)); height: calc(28 * var(--u)); }
.icon-btn svg { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.icon-btn svg .solid { fill: currentColor; stroke: none; }
.sound .waves, .sound .cross { transition: opacity 0.3s; }
.sound[aria-pressed="false"] .waves { opacity: 0; }
.sound[aria-pressed="true"] .cross { opacity: 0; }
.pause[aria-pressed="false"] .play { display: none; }
/* the card a door shows for a link to another site */
.door-card {
  position: fixed;
  left: 50%; top: 50%;
  transform: translate(-50%, -50%);
  z-index: 30;
  min-width: 260px;
  padding: 22px 24px 18px;
  border-radius: 18px;
  background: rgba(18, 12, 34, 0.86);
  border: 1px solid rgba(245, 239, 226, 0.18);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  color: #f5efe2;
  text-align: center;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
}
.door-card[hidden] { display: none; }
.door-title { margin: 0; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: rgba(245, 239, 226, 0.6); }
.door-where { margin: 8px 0 18px; font-size: 20px; font-weight: 600; word-break: break-all; }
.door-actions { display: flex; gap: 10px; justify-content: center; }
.door-go, .door-stay { padding: 9px 18px; border-radius: 999px; font: inherit; font-size: 14px; cursor: pointer; text-decoration: none; }
.door-go { background: linear-gradient(135deg, #8c4fe3, #4f6bff); color: #fff; border: 0; }
.door-stay { background: none; color: rgba(245, 239, 226, 0.8); border: 1px solid rgba(245, 239, 226, 0.25); }
/* music player, under the title */
.player {
  display: flex;
  width: fit-content;
  align-items: center;
  gap: 6px;
  margin-top: calc(12 * var(--u));
  padding: 5px 8px 5px 6px;
  max-width: min(440px, 70vw);
  border-radius: 999px;
  background: rgba(18, 12, 34, 0.55);
  border: 1px solid rgba(245, 239, 226, 0.16);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  pointer-events: auto;
}
.player .icon-btn { width: 26px; height: 26px; padding: 4px; border: 0; background: none; color: inherit; cursor: pointer; border-radius: 50%; }
.player .icon-btn:hover { background: rgba(245, 239, 226, 0.1); }
.player label.icon-btn { pointer-events: auto; }
#playSong[aria-pressed="false"] .bars, #playSong[aria-pressed="true"] .play { display: none; }
.player .now {
  min-width: 0;
  padding: 0 6px;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
  font-size: 13px;
  color: rgba(245, 239, 226, 0.85);
}
.player.drop { outline: 2px dashed #b9c4ff; outline-offset: 3px; }
#musicVolume { width: 70px; flex: none; margin: 0 4px 0 2px; accent-color: #b9a4ff; cursor: pointer; pointer-events: auto; }
/* Lofi / Mix / Code switch, top right */
.modes {
  position: absolute;
  top: calc(18 * var(--u));
  right: calc(44 * var(--u));
  display: flex;
  padding: 4px;
  border-radius: 999px;
  background: rgba(18, 12, 34, 0.55);
  border: 1px solid rgba(245, 239, 226, 0.16);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}
.modes button {
  position: relative;
  z-index: 1;
  padding: 7px 15px;
  border: 0;
  border-radius: 999px;
  background: none;
  color: rgba(245, 239, 226, 0.7);
  font: inherit;
  font-size: 13px;
  letter-spacing: 0.04em;
  cursor: pointer;
  transition: color 0.3s;
}
.modes button[aria-checked="true"] { color: #fff; }
.modes button:focus-visible { outline: 2px solid #b9c4ff; outline-offset: 1px; }
.modes-thumb {
  position: absolute;
  top: 4px; bottom: 4px; left: 0;
  width: 0;
  border-radius: 999px;
  background: linear-gradient(135deg, #8c4fe3, #4f6bff);
  box-shadow: 0 0 14px rgba(140, 79, 227, 0.55);
  transition: transform 0.4s cubic-bezier(.3,.7,.2,1), width 0.4s cubic-bezier(.3,.7,.2,1);
}
.rain .drops, .rain .cross { transition: opacity 0.3s; }
.rain[aria-pressed="false"] .drops { opacity: 0; }
.rain[aria-pressed="true"] .cross { opacity: 0; }
.pause[aria-pressed="true"] .bars { display: none; }

/* Thumb joystick (touch screens only) */
.stick {
  position: absolute;
  left: calc(26px + env(safe-area-inset-left, 0px));
  bottom: calc(26px + env(safe-area-inset-bottom, 0px));
  width: 150px;
  height: 150px;
  border-radius: 50%;
  border: 1.5px solid rgba(245, 239, 226, 0.35);
  background: rgba(0, 0, 0, 0.22);
  display: none;
}
.stick-knob {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 50px;
  height: 50px;
  margin: -25px 0 0 -25px;
  border-radius: 50%;
  background: rgba(245, 239, 226, 0.85);
  transition: transform 0.18s ease;
}
.stick.active .stick-knob { transition: none; }

.hint-touch { display: none; }
@media (hover: none) and (pointer: coarse) {
  .hint-desk { display: none !important; }
  .hint-touch { display: inline; }
  .stick, .reticle { display: block; }
}

/* ===================================================================
   Loading screen (with progress for models, and a message if three.js can't load)
   =================================================================== */
.loader {
  position: fixed;
  inset: 0;
  z-index: 6;
  display: grid;
  place-items: center;
  background: #000;
  transition: opacity 0.8s ease;
  pointer-events: none;
}
.loader.gone { opacity: 0; }
.loader.failed { pointer-events: auto; }
.loader.failed .loader-dot { display: none; }
.loader-dot {
  width: calc(9 * var(--u));
  height: calc(9 * var(--u));
  min-width: 6px;
  min-height: 6px;
  border-radius: 50%;
  background: var(--cream);
  animation: pulse 1.2s ease-in-out infinite;
}
@keyframes pulse { 50% { transform: scale(0.4); opacity: 0.4; } }
.loader-note {
  position: absolute;
  top: calc(50% + 26px);
  left: 0;
  right: 0;
  text-align: center;
  font-size: 13px;
  letter-spacing: 0.04em;
  opacity: 0.6;
}
.loader-error { display: grid; gap: 8px; justify-items: center; padding: 0 24px; text-align: center; font-size: 15px; }
.loader-error .sub { font-size: 13px; opacity: 0.65; }
.loader-error button {
  margin-top: 10px;
  height: 40px;
  padding: 0 20px;
  border-radius: 99px;
  background: var(--cream);
  color: #151510;
  font-weight: 500;
}

/* Frames-per-second readout */
#fps {
  position: fixed;
  z-index: 4;
  top: calc(70 * var(--u) + env(safe-area-inset-top, 0px));
  right: calc(44 * var(--u));
  padding: 6px 9px;
  border-radius: 6px;
  background: rgba(0, 0, 0, 0.45);
  color: var(--cream);
  font: 500 12px/1 ui-monospace, Menlo, monospace;
  letter-spacing: 0.06em;
  pointer-events: none;
}

/* ===================================================================
   Phones and narrow windows
   =================================================================== */
@media (max-width: 820px) {
  :root { --u: 1px; }
  header { padding: 18px 18px 0; }
  .corner { right: 20px; bottom: calc(30px + env(safe-area-inset-bottom)); font-size: 11px; }
  .icon-btn { width: 30px; height: 30px; }
  .prompt { bottom: calc(170px + env(safe-area-inset-bottom)); }
  #fps { top: calc(64px + env(safe-area-inset-top, 0px)); right: 18px; }
  .logo { font-size: 22px; }
  .modes { right: 14px; }
  .modes button { padding: 6px 10px; font-size: 12px; }
}
/* ===================================================================
   Touch screens: a clean screen. No instructions on top of the room (the showcase page has them);
   a small title, the view switch top right, just the buttons bottom right.
   =================================================================== */
@media (hover: none) and (pointer: coarse) {
  .hint-touch, .corner > i, .prompt, .reticle, #musicVolume { display: none !important; }
  header { padding: 12px calc(12px + env(safe-area-inset-right, 0px)) 0 calc(14px + env(safe-area-inset-left, 0px)); }
  .logo { font-size: 15px; font-weight: 500; letter-spacing: -0.01em; }
  .player { margin-top: 10px; max-width: calc(100vw - 28px); }
  .modes { top: 8px; right: calc(10px + env(safe-area-inset-right, 0px)); padding: 3px; }
  .modes button { padding: 5px 10px; font-size: 12px; }
  #pausedChip { top: calc(84px + env(safe-area-inset-top, 0px)); }
  #toast { top: calc(84px + env(safe-area-inset-top, 0px)); font-size: 12px; max-width: calc(100vw - 40px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .corner { right: calc(12px + env(safe-area-inset-right, 0px)); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); gap: 4px; }
  .corner .icon-btn { width: 30px; height: 30px; }
  .corner { gap: 10px; }
  .stick { left: calc(18px + env(safe-area-inset-left, 0px)); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); }
}
@media (prefers-reduced-motion: reduce) {
  .loader-dot { animation: none; }
}
</style>

<!-- three.js (keep these addresses identical in every room so phones reuse the cached copy) -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/"
  }
}
</script>
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js">
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.core.js">
</head>

<body>
<div id="view" aria-hidden="true"></div>

<div class="ui" id="ui">
  <header>
    <a class="logo" href="#" id="roomName">Room</a>
    <div class="player" id="player" aria-label="Music">
      <button class="icon-btn" id="prevSong" aria-label="Previous song (B)">
        <svg viewBox="0 0 24 24"><path class="solid" d="M17 6.5v11a.7.7 0 0 1-1.1.6L9 12.6a.7.7 0 0 1 0-1.2l6.9-5.5a.7.7 0 0 1 1.1.6Z"/><path d="M7 6v12"/></svg>
      </button>
      <button class="icon-btn" id="playSong" aria-pressed="false" aria-label="Play music">
        <svg viewBox="0 0 24 24">
          <path class="play solid" d="M8 6.2v11.6a.8.8 0 0 0 1.2.7l9.2-5.8a.8.8 0 0 0 0-1.4L9.2 5.5A.8.8 0 0 0 8 6.2Z"/>
          <g class="bars"><rect class="solid" x="7" y="6" width="3.2" height="12" rx="1"/><rect class="solid" x="13.8" y="6" width="3.2" height="12" rx="1"/></g>
        </svg>
      </button>
      <button class="icon-btn" id="nextSong" aria-label="Next song (N)">
        <svg viewBox="0 0 24 24"><path class="solid" d="M7 6.5v11a.7.7 0 0 0 1.1.6l6.9-5.5a.7.7 0 0 0 0-1.2L8.1 5.9A.7.7 0 0 0 7 6.5Z"/><path d="M17 6v12"/></svg>
      </button>
      <span class="now" id="nowPlaying">low ceiling</span>
      <label class="icon-btn add" for="songFile" title="Add songs, or drop MP3s anywhere in the room" aria-label="Add songs">

      <button class="icon-btn" id="removeSong" aria-label="Remove this song from the playlist" title="Remove this song" hidden>
        <svg viewBox="0 0 24 24"><path d="M5 7h14M10 7V5h4v2M7 7l1 12h8l1-12"/></svg>
      </button>
      <input type="file" id="songFile" accept="audio/*,.mp3,.m4a,.ogg,.wav,.flac" multiple hidden>

  <div class="corner">
    <span class="hint-desk">WASD to walk</span><i class="hint-desk"></i><span class="hint-desk">Drag to look</span><i class="hint-desk"></i><span class="hint-desk">H to switch view</span><i class="hint-desk"></i><span class="hint-desk">Drop an MP3 to play it</span><i class="hint-desk"></i><span class="hint-desk">1–8 drums · G strum · L loop</span>
    <span class="hint-touch">Drag to look</span>
    <i></i>

      <svg viewBox="0 0 24 24">

      <svg viewBox="0 0 24 24">
        <g class="bars"><rect class="solid" x="7" y="6" width="3.2" height="12" rx="1"/><rect class="solid" x="13.8" y="6" width="3.2" height="12" rx="1"/></g>
        <path class="play solid" d="M8 6.2v11.6a.8.8 0 0 0 1.2.7l9.2-5.8a.8.8 0 0 0 0-1.4L9.2 5.5A.8.8 0 0 0 8 6.2Z"/>

<div id="fade"></div>

<div class="door-card" id="doorCard" role="dialog" aria-label="Door" hidden>
  <p class="door-title" id="doorTitle">This door leads to</p>

<script type="module">
/* =====================================================================
   Contents
     1. The room (data: edit this to make a new room)
     2. Settings and page elements
     3. Loading three.js and room.json
     4. Sound: room tone, music file or built-in beat, chimes, level meter
     5. Randomness and textures
     6. Building the room from the description
     7. Post-processing
     8. The room: input, walking, hotspots, frame loop, clean-up
   ===================================================================== */


/* ---------------------------------------------------------------------
   1. The room
   Units are metres. Positions are [x, y, z]: x left/right, y up, z toward
   you (the far wall is at negative z). Angles are in degrees.
   Parts: box [w, h, d] · cylinder [radiusTop, radiusBottom, height, thetaStart?, thetaLength?] ·
          sphere [radius, phiStart?, phiLength?, thetaStart?, thetaLength?] · disc [radius] ·
          cone [radius, height] · torus [radius, tube, arcDegrees?] · plane [w, h] ·
          limb { from, to, radius } (a capsule between two points) ·
          cloth [w, d] (a rumpled sheet: bump, drape { left, right, foot, head, rate, floor }) ·
          glass [w, h] (rain on a window pane) · screen [w, h] (the computer screen) ·
          steam (rising from a mug) · light (point light) · string (a strand of little bulbs) ·
          group { parts, anim } (moves its parts together: breathe, nod, tap, blink, tail, look).
   Part extras: color, emissive, emissiveIntensity, roughness, metalness, scale [x, y, z],
          texture (a texture name), spin, pulse (glows with the music), flicker, open (hollow).
   --------------------------------------------------------------------- */

// ---- Your copy's settings. A room.json next to this page can change the songs, posters, the girl,
//      the cat, the neon sign, colours and what she says (see the kit's README). Anything left out
//      keeps this showcase's look. A room.json that has "objects" replaces the whole room instead.
let CUSTOM = {};
try {
  const response = await fetch('room.json', { cache: 'no-cache' });
  if (response.ok) CUSTOM = await response.json();
} catch { /* no room.json: the showcase room */ }
const LOOK = { guitarist: { ...CUSTOM.guitarist }, bassist: { ...CUSTOM.bassist }, drummer: { ...CUSTOM.drummer }, neon: CUSTOM.neon || {} };

// Lighten (amount > 0) or darken (amount < 0) a #rrggbb colour.
function shade(hex, amount) {
  const n = parseInt(String(hex).replace('#', ''), 16);
  const mix = c => Math.round(amount >= 0 ? c + (255 - c) * amount : c * (1 + amount));
  return '#' + [n >> 16 & 255, n >> 8 & 255, n & 255].map(c => mix(c).toString(16).padStart(2, '0')).join('');
}

// colours used again and again
const C = {
  skin: LOOK.guitarist.skin || '#dcbba6', shirt: LOOK.guitarist.flannel || '#8c3242', hair: LOOK.guitarist.hair || '#b09460',
  eyes: LOOK.guitarist.eyes || '#86b8c2', lips: '#6a3e3e', beanie: LOOK.guitarist.beanie || '#2f5a35',
  jeans: LOOK.guitarist.jeans || '#3e4c6a', guitar: LOOK.guitarist.guitar || '#c98a4e', bass: LOOK.bassist.bass || '#25222c',
  couch: CUSTOM.colors?.couch || '#6b4a3e', couch2: CUSTOM.colors?.couch2 || '#55613f', black: '#121016', paper: '#ece8f2',
};
C.hairGlow = shade(C.hair, -0.55);
// the big bassist on the green loveseat
const BS = {
  skin: LOOK.bassist.skin || '#e3b896', hair: LOOK.bassist.hair || '#4a3222', beard: LOOK.bassist.beard || '#5a3a24',
  shirt: LOOK.bassist.shirt || '#2a2a31', pants: LOOK.bassist.pants || '#4e5a66', cap: LOOK.bassist.cap || '#b8352a',
};
// the drummer
const DR = {
  skin: LOOK.drummer.skin || '#e6c2a6', hair: LOOK.drummer.hair || '#f1d35a', shirt: LOOK.drummer.shirt || '#141217',
  pants: LOOK.drummer.pants || '#2c2c33', gauges: LOOK.drummer.gauges || '#0e0e10',
};

// Flip a list of parts left-to-right (for furniture moved to the other wall).
function mirrorX(parts) {
  return parts.map(p => {
    const q = { ...p };
    if (p.offset) q.offset = [-p.offset[0], p.offset[1], p.offset[2]];
    if (p.from) q.from = [-p.from[0], p.from[1], p.from[2]];
    if (p.to) q.to = [-p.to[0], p.to[1], p.to[2]];
    if (p.rotation) q.rotation = [p.rotation[0], -p.rotation[1], -p.rotation[2]];
    if (p.parts) q.parts = mirrorX(p.parts);
    return q;
  });
}

/* THE BASEMENT: a band's jam space under the house, at night.
   Concrete, foam on the walls, rugs on the floor, a bare bulb that won't stop flickering and one
   dusty shaft of streetlight slanting in from the window well. Everything here is invented:
   the band (The Stumps), the posters, the amp brand. */
const D2R = Math.PI / 180;
const MESS_SEED = 31337;                 // the mess lands in the same place on every visit
const BAND = String(CUSTOM.band || 'THE STUMPS').toUpperCase().slice(0, 18);

// Point a list of [x, y, z] by a turn about y (degrees) and a shift: used to lay out the kit and the gear.
function turnPoint([x, y, z], turn, at = [0, 0, 0]) {
  const a = turn * D2R;
  return [at[0] + x * Math.cos(a) + z * Math.sin(a), at[1] + y, at[2] - x * Math.sin(a) + z * Math.cos(a)];
}

/* ---- The drum kit, back-left, turned to face the room. Kit space: the drummer sits at -z looking
        toward +z; their left hand is +x (hi-hat, crash), their right is -x (floor tom, ride). */
const KIT = { at: [-2.05, 0, -2.5], turn: 35 };
const kitAt = (x, z) => turnPoint([x, 0, z], KIT.turn, KIT.at);
const SHELL = '#7c2a35', HEAD = '#ebe4d6', CHROME = '#b4bac6', BRASS = '#d0a650';
const metal = { metalness: 0.55, roughness: 0.3 };

// a drum: shell, two hoops, a head on top and the lugs; it squashes a little when hit
function drumParts(r, depth, { logo = null, squash = [0.035, -0.09, 0.035], lugs = 8 } = {}) {
  const parts = [
    { shape: 'cylinder', size: [r, r, depth], color: SHELL, roughness: 0.32, metalness: 0.15 },
    { shape: 'cylinder', size: [r + 0.007, r + 0.007, 0.022], offset: [0, depth / 2 - 0.006, 0], color: CHROME, ...metal, open: true },
    { shape: 'cylinder', size: [r + 0.007, r + 0.007, 0.022], offset: [0, -depth / 2 + 0.006, 0], color: CHROME, ...metal, open: true },
    { shape: 'disc', size: [r + 0.001], offset: [0, depth / 2 + 0.003, 0], color: HEAD, roughness: 0.75, ...(logo && { texture: logo }) },
    { shape: 'disc', size: [r + 0.001], offset: [0, -depth / 2 - 0.003, 0], rotation: [180, 0, 0], color: '#d9d2c4', roughness: 0.8 },
  ];
  for (let i = 0; i < lugs; i++) {
    const a = (i + 0.5) / lugs * Math.PI * 2;
    parts.push({ shape: 'box', size: [0.016, depth * 0.42, 0.02], offset: [Math.cos(a) * (r + 0.009), 0, Math.sin(a) * (r + 0.009)], rotation: [0, -a / D2R, 0], color: CHROME, ...metal });
  }
  return [{ shape: 'group', anim: { type: 'hit', squash }, parts }];
}

// a cymbal: a shallow brass cone with a bell; it wobbles when hit
function cymbalParts(r, { tilt = -10, amp = 0.3, rate = 1.8, speed = 15 } = {}) {
  return [{ shape: 'group', anim: { type: 'wobble', amp, rate, speed }, rotation: [tilt, 0, 0], parts: [
    { shape: 'cylinder', size: [0.05, r, 0.022], offset: [0, 0, 0], color: BRASS, metalness: 0.5, roughness: 0.28, open: true },
    { shape: 'sphere', size: [0.05, 0, 360, 0, 90], offset: [0, 0.009, 0], scale: [1, 0.7, 1], color: BRASS, metalness: 0.5, roughness: 0.28 },
    { shape: 'cylinder', size: [0.006, 0.006, 0.05], offset: [0, 0.03, 0], color: CHROME, ...metal },
  ]}];
}

// the stands, pedals and the throne (all static: baked together for speed), in kit space
function kitHardware() {
  const p = [];
  const leg = (x, z, h, spread = 0.2, r = 0.008) => {
    for (let i = 0; i < 3; i++) {
      const a = i / 3 * Math.PI * 2 + 0.5;
      p.push({ shape: 'limb', from: [x, h * 0.32, z], to: [x + Math.cos(a) * spread, 0.01, z + Math.sin(a) * spread], radius: r, color: CHROME, ...metal });
    }
    p.push({ shape: 'limb', from: [x, h * 0.32, z], to: [x, h, z], radius: r + 0.003, color: CHROME, ...metal });
  };
  leg(0, -0.62, 0.42, 0.22, 0.01);                                        // throne
  p.push({ shape: 'cylinder', size: [0.18, 0.17, 0.09], offset: [0, 0.48, -0.62], color: '#18161a', roughness: 0.6 });
  p.push({ shape: 'cylinder', size: [0.12, 0.12, 0.015], offset: [0, 0.53, -0.62], color: '#2a2629', roughness: 0.5 });
  leg(0.24, -0.32, 0.56, 0.2);                                            // snare stand
  p.push({ shape: 'torus', size: [0.12, 0.006], offset: [0.24, 0.56, -0.32], rotation: [90, 0, 0], color: CHROME, ...metal });
  leg(0.58, -0.26, 0.9, 0.22);                                            // hi-hat stand and pedal
  p.push({ shape: 'box', size: [0.09, 0.015, 0.24], offset: [0.58, 0.02, -0.42], rotation: [8, 0, 0], color: '#222026', ...metal });
  leg(0.62, 0.32, 1.05, 0.25);                                            // crash stand, boom
  p.push({ shape: 'limb', from: [0.62, 1.05, 0.32], to: [0.56, 1.1, 0.22], radius: 0.009, color: CHROME, ...metal });
  leg(-0.7, 0.08, 0.94, 0.2);                                             // ride stand: low, on his right, tucked in
  leg(-0.44, 0.5, 1.1, 0.25);                                             // second crash stand, boom
  p.push({ shape: 'limb', from: [-0.44, 1.1, 0.5], to: [-0.36, 1.15, 0.36], radius: 0.009, color: CHROME, ...metal });
  p.push({ shape: 'box', size: [0.08, 0.015, 0.22], offset: [0, 0.02, -0.18], rotation: [12, 0, 0], color: '#222026', ...metal });   // kick pedal
  p.push({ shape: 'limb', from: [0, 0.04, -0.1], to: [0, 0.2, -0.13], radius: 0.006, color: CHROME, ...metal });
  p.push({ shape: 'sphere', size: [0.028], offset: [0, 0.22, -0.11], scale: [1, 1, 0.6], color: '#e8e1d0' });
  // kick spurs and the rack tom mount
  p.push({ shape: 'limb', from: [0.22, 0.2, 0.15], to: [0.36, 0.01, 0.18], radius: 0.008, color: CHROME, ...metal });
  p.push({ shape: 'limb', from: [-0.22, 0.2, 0.15], to: [-0.36, 0.01, 0.18], radius: 0.008, color: CHROME, ...metal });
  p.push({ shape: 'limb', from: [0.05, 0.56, 0.08], to: [0.12, 0.72, 0.02], radius: 0.011, color: CHROME, ...metal });
  p.push({ shape: 'limb', from: [-0.05, 0.56, 0.08], to: [-0.17, 0.72, 0.02], radius: 0.011, color: CHROME, ...metal });   // second tom's mount
  // floor tom legs
  for (const [dx, dz] of [[0.16, 0.08], [-0.15, 0.1], [0.0, -0.18]]) p.push({ shape: 'limb', from: [-0.46 + dx, 0.36, -0.26 + dz], to: [-0.46 + dx * 1.2, 0.01, -0.26 + dz * 1.2], radius: 0.008, color: CHROME, ...metal });
  // a stick bag hooked on the floor tom, drumsticks in it
  p.push({ shape: 'box', size: [0.1, 0.42, 0.04], offset: [-0.66, 0.36, -0.26], rotation: [0, 70, -6], color: '#1f1d24', roughness: 0.9 });
  for (let i = 0; i < 4; i++) p.push({ shape: 'limb', from: [-0.67 + i * 0.008, 0.5, -0.27 + i * 0.012], to: [-0.67 + i * 0.008, 0.68 + i * 0.01, -0.27 + i * 0.012], radius: 0.007, color: '#d8b98a' });
  return p;
}

/* ---- Acoustic foam on the walls behind the kit: wedge panels and pyramid panels, two colours,
        some missing, some crooked, one hanging off. Wall space: x along the wall, +z out into the room. */
function foamWall({ x0, y0, cols, rows, kind, colors, seed, missing = [], crooked = {} }) {
  const R = seededRandom(seed), parts = [], S = 0.5;
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    const key = `${r},${c}`;
    const cx = x0 + c * S + S / 2, cy = y0 + r * S + S / 2;
    if (missing.includes(key)) {                           // a gap: just the glue marks left behind
      for (let k = 0; k < 3; k++) parts.push({ shape: 'box', size: [0.08 + R() * 0.06, 0.05 + R() * 0.05, 0.004], offset: [cx + (R() - 0.5) * 0.3, cy + (R() - 0.5) * 0.3, 0.002], color: '#8a7a5e', roughness: 1 });
      continue;
    }
    const color = colors[(r + c) % 2];
    const tilt = crooked[key] ?? (R() - 0.5) * 2.5;
    const drop = Math.abs(tilt) > 10 ? -0.05 : 0;
    const panel = [];
    panel.push({ shape: 'box', size: [S - 0.02, S - 0.02, 0.025], offset: [0, 0, 0.0125], color: shade(color, -0.25), roughness: 1 });
    if (kind === 'wedge') {
      const across = (r + c) % 2 === 0;                    // ridges alternate direction, like a checkerboard
      for (let k = 0; k < 6; k++) {
        const o = -S / 2 + 0.01 + 0.04 + k * 0.078;
        panel.push({ shape: 'cylinder', size: [0.045, 0.045, S - 0.03], segments: 3, offset: across ? [0, o, 0.047] : [o, 0, 0.047], rotation: across ? [0, 0, 90] : [0, 0, 0], color, roughness: 1 });
      }
    } else {
      for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++) {
        panel.push({ shape: 'cone', size: [0.083, 0.07], segments: 4, offset: [-0.18 + i * 0.12, -0.18 + j * 0.12, 0.06], rotation: [90, 45, 0], color, roughness: 1 });
      }
    }
    parts.push({ shape: 'group', offset: [cx + (R() - 0.5) * 0.02, cy + drop, 0.004], rotation: [0, 0, tilt], parts: panel });
  }
  return parts;
}

/* ---- The guitarist, slumped on the couch with an acoustic guitar across his lap. Toon style:
        outlines, a painted face, a breathing body, a head that nods and turns to you.
        Long emo hair (dirty blonde, a fringe over one eye) under a forest-green beanie. */
function guitaristParts() {
  const hip = [0, 0.5, 0.12], tilt = -24;                 // leaning back into the cushions
  const lean = ([x, y, z]) => {
    const a = tilt * D2R;
    return [hip[0] + x, hip[1] + y * Math.cos(a) - z * Math.sin(a), hip[2] + y * Math.sin(a) + z * Math.cos(a)];
  };
  const shoulderR = lean([-0.19, 0.42, -0.04]), shoulderL = lean([0.19, 0.42, -0.04]);
  const hair = { texture: 'hairBob', emissive: C.hairGlow, emissiveIntensity: 0.05, roughness: 0.6 };
  return [
    // legs, knees apart, boots planted
    { shape: 'sphere', size: [0.17], offset: [0, 0.5, 0.1], scale: [1.05, 0.55, 0.9], color: C.jeans },
    { shape: 'limb', from: [0.1, 0.5, 0.12], to: [0.21, 0.55, 0.52], radius: 0.08, color: C.jeans },
    { shape: 'limb', from: [-0.1, 0.5, 0.12], to: [-0.2, 0.55, 0.52], radius: 0.08, color: C.jeans },
    { shape: 'limb', from: [0.21, 0.55, 0.53], to: [0.29, 0.11, 0.66], radius: 0.062, color: C.jeans },
    { shape: 'limb', from: [-0.2, 0.55, 0.53], to: [-0.27, 0.11, 0.68], radius: 0.062, color: C.jeans },
    { shape: 'sphere', size: [0.05], offset: [0.225, 0.565, 0.6], scale: [1, 0.5, 0.35], rotation: [-30, 0, 0], color: shade(C.skin, -0.08) },   // ripped knee
    { shape: 'box', size: [0.12, 0.13, 0.26], offset: [0.3, 0.065, 0.72], rotation: [0, 8, 0], color: '#1c1714', roughness: 0.6 },
    { shape: 'box', size: [0.12, 0.13, 0.26], offset: [-0.28, 0.065, 0.74], rotation: [0, -10, 0], color: '#1c1714', roughness: 0.6 },
    { shape: 'box', size: [0.13, 0.03, 0.28], offset: [0.3, 0.015, 0.73], rotation: [0, 8, 0], color: '#0e0c0c', roughness: 0.6 },
    { shape: 'box', size: [0.13, 0.03, 0.28], offset: [-0.28, 0.015, 0.75], rotation: [0, -10, 0], color: '#0e0c0c', roughness: 0.6 },
    // upper body leans back and breathes
    { shape: 'group', anim: 'breathe', offset: hip, rotation: [tilt, 0, 0], parts: [

      { shape: 'limb', from: [0, 0.12, 0.0], to: [0, 0.41, 0.015], radius: 0.13, scale: [0.52, 1, 0.82], color: '#17151b', roughness: 0.95 },   // black tee under the open flannel
      { shape: 'disc', size: [0.04], offset: [0, 0.32, 0.118], rotation: [84, 0, 0], color: '#e8e0cc', emissive: '#e8e0cc', emissiveIntensity: 0.1 },   // the tee's print
      { shape: 'cylinder', size: [0.044, 0.05, 0.12], offset: [0, 0.55, 0], color: C.skin },
      // head: looks down at the bass, nods along, turns to you when you say hi
      { shape: 'group', anim: { type: 'nod', yaw: 0.1 }, offset: [0, 0.57, 0.02], rotation: [22, 0, 0], parts: [
        { shape: 'sphere', size: [0.12], offset: [0, 0.13, 0.03], scale: [0.82, 1.04, 0.92], color: C.skin, roughness: 0.7 },
        { shape: 'sphere', size: [0.062], offset: [0, 0.062, 0.068], scale: [0.84, 1, 1], color: C.skin, roughness: 0.7 },
        { shape: 'face', size: [0.1222], offset: [0, 0.13, 0.03], scale: [0.82, 1.04, 0.92], period: 5.1 },
        { shape: 'sphere', size: [0.0085], offset: [0, 0.064, 0.128], scale: [1.6, 0.35, 0.5], color: C.lips, roughness: 0.4 },
        // long emo hair: down past the jaw, a heavy side-swept fringe over his right eye
        { shape: 'sphere', size: [0.137, 0, 360, 0, 80], offset: [0, 0.14, 0.02], texture: 'hairCap', emissive: C.hairGlow, emissiveIntensity: 0.05, roughness: 0.6 },
        { shape: 'sphere', size: [0.142, 135, 270, 55, 95], offset: [0, 0.12, 0.01], scale: [1.04, 1.3, 1.0], ...hair },
        { shape: 'sphere', size: [0.131, 40, 100, 44, 30], offset: [0, 0.128, 0.03], scale: [0.88, 1.05, 0.96], ...hair },   // fringe across the forehead
        { shape: 'sphere', size: [0.07], offset: [-0.035, 0.155, 0.112], rotation: [0, 0, 32], scale: [1.25, 0.5, 0.3], ...hair },   // the swoop over one eye
        { shape: 'sphere', size: [0.05], offset: [-0.075, 0.115, 0.098], rotation: [0, 0, 62], scale: [1.2, 0.45, 0.3], ...hair },
        ...[[0.118, 0.02, 0.04, -6], [-0.118, 0.02, 0.05, 6], [0.11, 0.0, -0.04, -4], [-0.11, 0.0, -0.04, 4], [0.07, -0.01, -0.1, -4], [-0.07, -0.01, -0.1, 4], [0.0, -0.01, -0.12, 0], [-0.1, 0.02, 0.085, 10]].map(([x, y, z, rz]) =>
          ({ shape: 'cone', size: [0.048, 0.24], offset: [x, y, z], rotation: [180 + (z < 0 ? -10 : 4), 0, rz], ...hair })),
        { shape: 'sphere', size: [0.146, 0, 360, 0, 66], offset: [0, 0.158, 0.012], scale: [1, 1.08, 1], color: C.beanie, roughness: 1 },
        { shape: 'cylinder', size: [0.143, 0.145, 0.05], offset: [0, 0.2, 0.012], color: shade(C.beanie, -0.12), roughness: 1, open: true },
        { shape: 'torus', size: [0.012, 0.004], offset: [0.098, 0.1, 0.02], rotation: [0, 90, 0], color: '#d8d8e0', metalness: 0.8, roughness: 0.3 },   // earring
      ]},
    ]},
    // arms: relaxed, hands resting on his thighs (the guitar's on the couch beside him)
    { shape: 'arm', shoulder: shoulderR, hand: [-0.16, 0.6, 0.4], pole: [-1, -0.6, -0.2], upper: 0.27, lower: 0.26, radius: [0.058, 0.05],
      color: shade(C.shirt, -0.22), handColor: C.skin },
    { shape: 'arm', shoulder: shoulderL, hand: [0.16, 0.6, 0.38], pole: [1, -0.6, -0.2], upper: 0.27, lower: 0.26, radius: [0.058, 0.05],
      color: shade(C.shirt, -0.22), handColor: C.skin },
  ];
}

/* ---- The acoustic guitar. Body centre at the origin, neck up +y, top and strings toward +z. */
function acousticGuitarParts() {
  const strings = [];
  for (let i = 0; i < 6; i++) strings.push({ shape: 'box', size: [0.0016, 1.02, 0.0016], offset: [-0.018 + i * 0.0072, 0.43, 0.064], color: '#e2d8c4', metalness: 0.7, roughness: 0.3, keep: true });
  return [
    { shape: 'sphere', size: [0.205], scale: [1, 0.92, 0.25], color: shade(C.guitar, -0.42), roughness: 0.5 },        // sides, lower bout
    { shape: 'sphere', size: [0.155], offset: [0, 0.24, 0], scale: [1, 0.9, 0.32], color: shade(C.guitar, -0.42), roughness: 0.5 },   // upper bout
    { shape: 'sphere', size: [0.2], offset: [0, 0, 0.048], scale: [1, 0.92, 0.02], color: C.guitar, roughness: 0.45 },   // the top

/* ---- The stairwell behind the left wall: through the doorway at the top of the landing, turn right,
        and climb along the outside of the bassist's wall to a door at the top. You can walk all of it. */
const STAIRS = {
  wallX: -3.5, outX: -4.77, mid: -4.155,        // the stairwell runs between the room wall and an outer wall
  door: [2.82, 3.82],                            // the doorway in the room wall (z range), at the landing
  landing: 0.57,                                 // top of the landing (in the room and beyond the doorway)
  turn: 2.85, run: 0.27, rise: 0.18, steps: 12,  // the flight starts at z = turn and climbs toward -z
  end: -0.95, ceiling: 5.2,
};
STAIRS.topFloor = STAIRS.landing + (STAIRS.steps + 1) * STAIRS.rise;
function stairwellParts() {
  const S = STAIRS, wall = '#615b56', tread = '#6a5444', riser = '#4a4440';
  const inX = -3.56, w = inX - S.outX, cx = (inX + S.outX) / 2, len = 4.0 - S.end, cz = (4.0 + S.end) / 2;
  const parts = [
    // walls and ceiling of the stairwell (the shared wall has the doorway in it)
    { shape: 'box', size: [0.05, S.ceiling, S.door[0] - S.end], offset: [-3.535, S.ceiling / 2, (S.door[0] + S.end) / 2], color: wall, roughness: 1 },
    { shape: 'box', size: [0.05, S.ceiling, 4.02 - S.door[1]], offset: [-3.535, S.ceiling / 2, (4.02 + S.door[1]) / 2], color: wall, roughness: 1 },
    { shape: 'box', size: [0.05, S.ceiling - 2.6, S.door[1] - S.door[0]], offset: [-3.535, (S.ceiling + 2.6) / 2, (S.door[0] + S.door[1]) / 2], color: wall, roughness: 1 },
    { shape: 'box', size: [0.05, S.ceiling, len + 0.1], offset: [S.outX - 0.025, S.ceiling / 2, cz], color: wall, roughness: 1 },
    { shape: 'box', size: [w + 0.1, S.ceiling, 0.05], offset: [cx, S.ceiling / 2, 4.03], color: wall, roughness: 1 },
    { shape: 'box', size: [w + 0.1, S.ceiling, 0.05], offset: [cx, S.ceiling / 2, S.end - 0.025], color: wall, roughness: 1 },
    { shape: 'box', size: [w + 0.1, 0.05, len + 0.1], offset: [cx, S.ceiling + 0.025, cz], color: '#4e4842', roughness: 1 },
    // the landing beyond the doorway
    { shape: 'box', size: [w, S.landing - 0.015, 4.0 - S.turn], offset: [cx, (S.landing - 0.015) / 2, (4.0 + S.turn) / 2], color: riser, roughness: 1 },
    { shape: 'box', size: [w, 0.03, 4.0 - S.turn], offset: [cx, S.landing - 0.015, (4.0 + S.turn) / 2], color: tread, roughness: 0.9 },
  ];
  // the flight: solid steps climbing toward -z, then the top landing
  for (let i = 0; i <= S.steps; i++) {
    const top = S.landing + (i + 1) * S.rise;
    const z1 = S.turn - i * S.run, z0 = i === S.steps ? S.end : S.turn - (i + 1) * S.run;
    parts.push({ shape: 'box', size: [w, top - 0.015, z1 - z0], offset: [cx, (top - 0.015) / 2, (z0 + z1) / 2], color: riser, roughness: 1 });
    parts.push({ shape: 'box', size: [w, 0.03, z1 - z0 + 0.02], offset: [cx, top - 0.015, (z0 + z1) / 2 + 0.01], color: tread, roughness: 0.9 });
  }
  // a pipe handrail on the outer wall, following the flight
  const railX = S.outX + 0.07, h = 0.9;
  parts.push({ shape: 'limb', from: [railX, S.landing + h, S.turn + 0.1], to: [railX, S.topFloor + h, S.turn - S.steps * S.run], radius: 0.02, color: '#2a2a30', metalness: 0.5, roughness: 0.4 });
  for (const i of [0, 6, 12]) {
    const z = S.turn - i * S.run, y = S.landing + i * S.rise + h;
    parts.push({ shape: 'limb', from: [S.outX, y, z], to: [railX, y, z], radius: 0.012, color: '#2a2a30', metalness: 0.5, roughness: 0.4 });
  }
  return parts;
}
// how high the floor is at any spot (the steps and landings), and where you may walk
function floorAt(x, z) {
  const S = STAIRS;
  if (x < S.wallX) {
    if (z >= S.turn) return S.landing;
    return S.landing + (Math.min(S.steps, Math.floor((S.turn - z) / S.run)) + 1) * S.rise;
  }
  if (z > 2.87 && z < 3.97) {
    if (x >= -2.25 && x < -1.95) return 0.21;
    if (x >= -2.55 && x < -2.25) return 0.39;
  }
  if (x < -2.55 && z > 2.7) return S.landing;
  return 0;
}
const WALKABLE = [

/* ---- The rugs, and how high their top is at any spot (so cables lie on them, not through them). */
const RUGS = {
  persian: { at: [0.55, -1.5], turn: 8, w: 2.8, d: 2.0, y: 0.008, bump: 0.005, drape: { left: 1.27, right: 1.27, foot: 0.87, head: 0.87, rate: -0.4 } },
  shag: { at: [2.05, -3.05], turn: -12, w: 1.7, d: 1.35, y: 0.008, bump: 0.009, drape: { left: 0.78, right: 0.78, foot: 0.6, head: 0.6, rate: -0.5 } },
  couch: { at: [2.0, 0.75], turn: 4, w: 1.5, d: 2.3, y: 0.006, bump: 0.005, drape: { left: 0.7, foot: 1.08, rate: -0.45 } },
};
function rugTop(x, z) {
  let top = 0;
  for (const r of Object.values(RUGS)) {
    const a = r.turn * D2R, dx = x - r.at[0], dz = z - r.at[1];
    const lx = dx * Math.cos(a) - dz * Math.sin(a), lz = dx * Math.sin(a) + dz * Math.cos(a);
    if (Math.abs(lx) > r.w / 2 || Math.abs(lz) > r.d / 2) continue;
    const d = r.drape, up = -d.rate;
    let h = r.y + r.bump;
    if (d.right != null) h += Math.max(0, lx - d.right) * up;
    if (d.left != null) h += Math.max(0, -d.left - lx) * up;
    if (d.foot != null) h += Math.max(0, lz - d.foot) * up;
    if (d.head != null) h += Math.max(0, -d.head - lz) * up;
    top = Math.max(top, h);
  }
  // the braided oval under the kit
  const a = 35 * D2R, dx = x - -2.2, dz = z - -2.75;
  const lx = dx * Math.cos(a) - dz * Math.sin(a), lz = dx * Math.sin(a) + dz * Math.cos(a);
  if ((lx / 1.2) ** 2 + (lz / 0.95) ** 2 <= 1) top = Math.max(top, 0.03);
  return top;
}

  // They lie on whatever is under them: the concrete, or the top of a rug and up over its curled edge.
  const snake = (from, to, bends, seed, radius = 0.008) => {
    const r = seededRandom(seed), pts = [];
    for (let i = 0; i <= bends; i++) {
      const t = i / bends;
      const x = from[0] + (to[0] - from[0]) * t, z = from[2] + (to[2] - from[2]) * t;
      const j = i === 0 || i === bends ? 0 : 0.35;

    }
    return out;
  };

  ] });

}

function canColor(x) { return ['#3fb8b0', '#e0508a', '#c9c24a', '#d9d9d9'][Math.abs(Math.round(x * 100)) % 4]; }

// Settings from room.json, applied over the showcase room.
function findPart(parts = [], test) {
  for (const p of parts) {
    if (test(p)) return p;
    const inner = findPart(p.parts, test);
    if (inner) return inner;
  }
  return null;
}
function applyCustom(room, c) {
  if (c.title) room.name = c.title;
  if (Array.isArray(c.playlist)) room.playlist = c.playlist;
  if (c.colors) Object.assign(room.colors, c.colors);
  if (Array.isArray(c.talk) && c.talk.length) room.talk = c.talk;
  if (c.city?.seed && room.city) room.city.seed = c.city.seed;
  if (c.posters) room.posterImages = c.posters;
  const drop = id => { room.objects = room.objects.filter(o => o.id !== id); };
  for (const [id, value] of Object.entries(c.doors || {})) {
    const door = room.objects.find(o => o.id === id && o.hotspot);
    if (!door) { console.warn(`room.json: no door with id "${id}"`); continue; }
    const set = typeof value === 'string' ? { href: value } : value || {};
    door.hotspot = { ...door.hotspot, action: 'door', ...(set.href !== undefined && { href: set.href }), ...(set.label && { label: set.label }) };
  }
  if (c.guitarist?.show === false) drop('guitarist');
  if (c.bassist?.show === false) { drop('bassist'); }
  if (c.drummer?.show === false) drop('drummer');
}

/* ---------------------------------------------------------------------

   works with no files at all). After it come the songs listed in
   ROOM.playlist (files shipped next to the page), then any songs you add

const playlist = {

  index: 0,
  db: null,

  get current() { return this.tracks[this.index]; },

  // songs that ship with the room
  addShipped(list = []) {
    for (const item of list) {
      const entry = typeof item === 'string' ? { src: item } : item;
      const track = { src: entry.src, title: entry.title || titleFromName(entry.src), artist: entry.artist || '', shipped: true };

        title: tags?.title || titleFromName(file.name),
        artist: tags?.artist || 'your music',
        art: tags?.art || null,

  async openDb() {
    if (this.db) return this.db;

  async loadSaved() {

        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);

// Reads title, artist and cover art from an MP3's ID3v2 tags (other formats just use the file name).
async function readTags(blob) {
  const head = new Uint8Array(await blob.slice(0, 10).arrayBuffer());
  if (head[0] !== 0x49 || head[1] !== 0x44 || head[2] !== 0x33) return null;          // "ID3"
  const version = head[3];
  const size = (head[6] << 21) | (head[7] << 14) | (head[8] << 7) | head[9];
  const bytes = new Uint8Array(await blob.slice(10, 10 + Math.min(size, 4e6)).arrayBuffer());
  const out = {};
  const text = (b, encoding) => {
    const label = encoding === 0 ? 'latin1' : encoding === 1 ? 'utf-16' : encoding === 2 ? 'utf-16be' : 'utf-8';
    return new TextDecoder(label).decode(b).replace(/\0+$/, '').replace(/\0/g, ' / ').trim();
  };
  let p = 0;
  while (p + 10 < bytes.length) {
    const id = String.fromCharCode(bytes[p], bytes[p + 1], bytes[p + 2], bytes[p + 3]);
    if (!/^[A-Z0-9]{4}$/.test(id)) break;
    const frameSize = version === 4
      ? (bytes[p + 4] << 21) | (bytes[p + 5] << 14) | (bytes[p + 6] << 7) | bytes[p + 7]
      : ((bytes[p + 4] << 24) | (bytes[p + 5] << 16) | (bytes[p + 6] << 8) | bytes[p + 7]) >>> 0;
    const body = bytes.subarray(p + 10, p + 10 + frameSize);
    if (id === 'TIT2') out.title = text(body.subarray(1), body[0]);
    else if (id === 'TPE1') out.artist = text(body.subarray(1), body[0]);
    else if (id === 'APIC' && !out.art) {
      const encoding = body[0];
      let q = 1;
      while (q < body.length && body[q] !== 0) q++;                   // mime type
      const mime = new TextDecoder('latin1').decode(body.subarray(1, q)) || 'image/jpeg';
      q += 2;                                                         // the null and the picture type
      if (encoding === 1 || encoding === 2) { while (q + 1 < body.length && (body[q] || body[q + 1])) q += 2; q += 2; }
      else { while (q < body.length && body[q] !== 0) q++; q += 1; }
      try { out.art = await createImageBitmap(new Blob([body.subarray(q)], { type: mime.includes('/') ? mime : 'image/' + mime })); } catch { /* no art */ }
    }
    if (frameSize <= 0) break;
    p += 10 + frameSize;
  }
  return out;
}

      g.gain.setTargetAtTime(muted ? 0.25 : 0.6, at + 0.01, muted ? 0.05 : length * 0.8);   // chugs choke, but ring to the next pick
      g.gain.setTargetAtTime(0.0001, at + length, 0.015);
      tone.connect(g); g.connect(rig);
      [1, 1.4983, 2].forEach((ratio, k) => {
        const s = c.createBufferSource();
        s.buffer = jam.string(root * ratio * detune);
        s.connect(tone);
        s.start(at + k * 0.004);                              // a fast downstroke
        s.stop(at + length + 0.08);
      });
    }
  },
  bassHit(t, root, length) {
    const c = this.ctx, s = c.createBufferSource(), g = c.createGain();
    s.buffer = jam.string(root / 2);
    g.gain.setValueAtTime(1, t);
    g.gain.setTargetAtTime(0.7, t + 0.02, 0.15);              // held, not plucked-and-gone
    g.gain.setTargetAtTime(0.0001, t + length * 0.95, 0.015);
    s.connect(g); g.connect(this.punk.bass);
    s.start(t); s.stop(t + length + 0.1);
  },
  playStep(step, t) {
    const s = step % 128, bar = Math.floor(s / 16) % 4, b = s % 16, chorus = s >= 64;
    const E = 82.41, G = 98.0, A = 110.0, C = 65.41, D = 73.42;
    const root = chorus ? [C, D, E, E][bar] : [E, E, G, A][bar];
    const eighth = 60 / 172 / 2;
    if (b % 2 === 0) {
      // guitars and bass hammer straight eighths, punk style
      if (chorus) this.guitarHit(t, root, eighth * 0.95, false);
      else this.guitarHit(t, root, eighth * (b === 0 || b === 8 ? 1.9 : 1), b !== 0 && b !== 8);   // accents ring on 1 and 3
      this.bassHit(t, root, eighth);
    }
    if (!chorus) {
      if (b === 0 || b === 8 || b === 10) jam.kick(t);
      if (b === 4 || b === 12) jam.snare(t);
      if (b % 2 === 0) jam.hat(t);
      if (s >= 56 && b % 2 === 0) jam.snare(t);               // snare build into the chorus
    } else {
      if (b % 4 === 0 || b === 6 || b === 14) jam.kick(t);
      if (b === 4 || b === 12) jam.snare(t);
      if (b === 0 && (bar === 0 || bar === 2)) jam.crash(t);
      else if (b % 2 === 0) jam.ride(t);
      if (s >= 120 && b >= 8) { jam.snare(t); if (b === 8 || b === 12) jam.tomHit(t, 98); }   // a fill to go round again
    }
  },
  kick(t) {
    const osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
    osc.frequency.setValueAtTime(120, t);
    osc.frequency.exponentialRampToValueAtTime(42, t + 0.14);
    gain.gain.setValueAtTime(0.55, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.32);
    osc.connect(gain);
    gain.connect(this.musicBus);
    osc.start(t);
    osc.stop(t + 0.35);
  },
  snare(t) {
    const noise = this.ctx.createBufferSource(), band = this.ctx.createBiquadFilter(), gain = this.ctx.createGain();
    noise.buffer = this.noise;
    band.type = 'highpass';
    band.frequency.value = 1400;
    gain.gain.setValueAtTime(0.16, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.16);
    noise.connect(band);
    band.connect(gain);
    gain.connect(this.musicBus);
    noise.start(t, Math.random());
    noise.stop(t + 0.2);
  },
  hat(t, volume) {
    const noise = this.ctx.createBufferSource(), band = this.ctx.createBiquadFilter(), gain = this.ctx.createGain();
    noise.buffer = this.noise;
    band.type = 'highpass';
    band.frequency.value = 7000;
    gain.gain.setValueAtTime(volume, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.045);
    noise.connect(band);
    band.connect(gain);
    gain.connect(this.musicBus);
    noise.start(t, Math.random());
    noise.stop(t + 0.06);
  },
  chord(t, notes) {
    const warm = this.ctx.createBiquadFilter(), gain = this.ctx.createGain();
    warm.type = 'lowpass';
    warm.frequency.value = 1100;
    gain.gain.setValueAtTime(0, t);
    gain.gain.linearRampToValueAtTime(0.05, t + 0.06);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 2.6);
    warm.connect(gain);
    gain.connect(this.musicBus);
    for (const frequency of notes) {
      const osc = this.ctx.createOscillator();
      osc.type = 'triangle';
      osc.frequency.value = frequency;
      osc.detune.value = (Math.random() - 0.5) * 8;
      osc.connect(warm);
      osc.start(t);
      osc.stop(t + 2.7);
    }
  },

  // a soft bell, for small interactions
  chime() {
    if (!this.ctx) return;
    const t = this.ctx.currentTime, envelope = this.ctx.createGain();
    envelope.gain.setValueAtTime(0, t);
    envelope.gain.linearRampToValueAtTime(0.06, t + 0.01);
    envelope.gain.exponentialRampToValueAtTime(0.0001, t + 2.5);
    envelope.connect(this.master);
    [[1, 1], [2.76, 0.25]].forEach(([ratio, volume]) => {
      const osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
      osc.frequency.value = 880 * ratio;
      gain.gain.value = volume;
      osc.connect(gain);
      gain.connect(envelope);
      osc.start(t);
      osc.stop(t + 2.6);
    });
  },

  // read the level meter (bass-heavy), once per frame
  update(dt) {
    let target = 0;
    if (this.analyser && this.on && !this.paused) {
      this.analyser.getByteFrequencyData(this.bins);
      let sum = 0;
      for (let i = 0; i < 10; i++) sum += this.bins[i];
      target = Math.min(1, sum / (10 * 255) * 1.4);
    }
    // jump up quickly, fall back slowly
    this.level += (target - this.level) * (1 - Math.exp(-dt * (target > this.level ? 30 : 6)));
  },

  dispose() {
    this.stopBeat();
    clearInterval(this.dripTimer);
    clearTimeout(this.suspendTimer);
    this.musicFile?.pause();
    this.ctx?.close();
    this.ctx = null;
  },
};


/* ---------------------------------------------------------------------
   The band's gear, all made live with Web Audio (no sound files):
   - drums: kick (a pitch-dropping sine and a click), snare (noise and a
     tone), hi-hat (metallic squares, short), crash (long and bright), toms
   - guitar: six plucked strings (Karplus-Strong), strummed a few ms apart,
     through an amp that's off (unplugged), clean or crunchy (a WaveShaper)
   - a loop pedal: record, loop, overdub a layer, clear
   Everything musical goes through sound.musicBus, so the level meter (and
   every light that pulses with it) hears it.
   --------------------------------------------------------------------- */
const CHORDS = [
  { name: 'Em', notes: [82.41, 123.47, 164.81, 196.0, 246.94, 329.63] },
  { name: 'C', notes: [98.0, 130.81, 164.81, 196.0, 261.63, 329.63] },
  { name: 'G', notes: [98.0, 123.47, 146.83, 196.0, 246.94, 392.0] },
  { name: 'D', notes: [73.42, 110.0, 146.83, 220.0, 293.66, 369.99] },
];
const jam = {
  amp: 1,                  // 0 off (unplugged), 1 clean, 2 crunch
  chord: 0,
  lastHit: -10,            // performance.now() / 1000 of the last thing played
  loop: { state: 'idle', events: [], start: 0, length: 0, until: 0, timer: 0 },
  onHit: null,             // set by the room: (kind, arg, when) so the gear can react when it sounds
  chainFor: null,

  get ctx() { return sound.ctx; },

  // the buses, built once per audio context
  ready() {
    if (!sound.ctx) return false;
    if (this.chainFor === sound.ctx) return true;
    const c = sound.ctx;
    this.chainFor = c;
    this.ks = new Map();
    this.drums = c.createGain();
    this.drums.gain.value = 0.85;
    this.drums.connect(sound.musicBus);
    this.fx = c.createGain();                  // little noises (fridge, bulb, records): not music
    this.fx.gain.value = 1;
    this.fx.connect(sound.master);
    // guitar → drive → shaper → tone → cab → out
    this.gtrIn = c.createGain();
    this.drive = c.createGain();
    this.shaper = c.createWaveShaper();
    this.shaper.oversample = '4x';
    this.toneFilter = c.createBiquadFilter();
    this.toneFilter.type = 'lowpass';
    this.toneFilter.Q.value = 0.8;
    this.cab = c.createBiquadFilter();
    this.cab.type = 'peaking';
    this.cab.frequency.value = 900;
    this.cab.gain.value = 3;
    this.gtrOut = c.createGain();
    this.gtrIn.connect(this.drive); this.drive.connect(this.shaper); this.shaper.connect(this.toneFilter);
    this.toneFilter.connect(this.cab); this.cab.connect(this.gtrOut); this.gtrOut.connect(sound.musicBus);
    const n = 2048, curve = new Float32Array(n);
    for (let i = 0; i < n; i++) { const x = i * 2 / n - 1; curve[i] = Math.tanh(x * 2.6) * 0.92 + 0.04 * x * x; }
    this.crunchCurve = curve;
    this.setAmp(this.amp);
    return true;
  },

  setAmp(level) {
    this.amp = level;
    if (this.chainFor !== sound.ctx || !sound.ctx) return;
    const t = sound.ctx.currentTime;
    this.drive.gain.setTargetAtTime([1, 1, 9][level], t, 0.02);
    this.shaper.curve = level === 2 ? this.crunchCurve : null;
    this.toneFilter.frequency.setTargetAtTime([1600, 5200, 3300][level], t, 0.02);
    this.gtrOut.gain.setTargetAtTime([0.16, 0.7, 0.3][level], t, 0.03);
  },

  // ---- drums
  env(g, t, peak, decay, attack = 0.002) {
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t + decay);
  },
  noiseHit(t, type, frequency, peak, decay, { q = 0.7, attack = 0.001, out = this.drums } = {}) {
    const c = this.ctx, src = c.createBufferSource(), filter = c.createBiquadFilter(), g = c.createGain();
    src.buffer = sound.noise;
    filter.type = type; filter.frequency.value = frequency; filter.Q.value = q;
    this.env(g, t, peak, decay, attack);
    src.connect(filter); filter.connect(g); g.connect(out);
    src.start(t, Math.random() * 1.5); src.stop(t + decay + 0.05);
  },
  // ---- bass: a low plucked string, rounded off, with a sine underneath
  bass(t, index) {
    const c = this.ctx, root = CHORDS[index % CHORDS.length].notes[0] / 2;
    const src = c.createBufferSource(), low = c.createBiquadFilter(), g = c.createGain();
    src.buffer = this.string(root);
    low.type = 'lowpass'; low.frequency.value = 650; low.Q.value = 0.8;
    g.gain.setValueAtTime(0.9, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 2.2);
    src.connect(low); low.connect(g); g.connect(this.drums);
    src.start(t); src.stop(t + 2.3);
    this.tone(t, 'sine', root, root, 0.01, 0.55, 1.2);
  },
  tone(t, type, f0, f1, glide, peak, decay, out = this.drums) {
    const c = this.ctx, osc = c.createOscillator(), g = c.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(f0, t);
    osc.frequency.exponentialRampToValueAtTime(f1, t + glide);
    this.env(g, t, peak, decay);
    osc.connect(g); g.connect(out);
    osc.start(t); osc.stop(t + decay + 0.05);
  },
  metal(t, peak, decay, highpass) {           // six detuned squares: the classic metallic cymbal
    const c = this.ctx, band = c.createBiquadFilter(), high = c.createBiquadFilter(), g = c.createGain();
    band.type = 'bandpass'; band.frequency.value = 10000; band.Q.value = 0.8;
    high.type = 'highpass'; high.frequency.value = highpass;
    this.env(g, t, peak, decay, 0.001);
    band.connect(high); high.connect(g); g.connect(this.drums);
    for (const ratio of [2, 3, 4.16, 5.43, 6.79, 8.21]) {
      const osc = c.createOscillator();
      osc.type = 'square'; osc.frequency.value = 40 * ratio;
      osc.connect(band); osc.start(t); osc.stop(t + decay + 0.05);
    }
  },
  kick(t) {
    this.tone(t, 'sine', 165, 46, 0.12, 1.0, 0.5);
    this.noiseHit(t, 'highpass', 2600, 0.32, 0.02);
  },
  snare(t) {
    this.tone(t, 'triangle', 240, 180, 0.08, 0.38, 0.12);
    this.noiseHit(t, 'bandpass', 3200, 0.55, 0.22, { q: 0.6 });
    this.noiseHit(t, 'highpass', 6500, 0.22, 0.14);
  },
  hat(t) {
    this.metal(t, 0.16, 0.06, 7200);
    this.noiseHit(t, 'highpass', 9000, 0.08, 0.04);
  },
  crash(t) {
    this.metal(t, 0.16, 2.2, 4500);
    this.noiseHit(t, 'highpass', 5200, 0.28, 1.9, { attack: 0.003 });
    this.noiseHit(t, 'bandpass', 2500, 0.08, 0.6);
  },
  ride(t) {
    this.metal(t, 0.09, 1.6, 6200);
    this.tone(t, 'sine', 2350, 2300, 0.4, 0.07, 1.2);                 // the bell
    this.noiseHit(t, 'bandpass', 7500, 0.12, 0.08, { q: 1.4 });       // the stick's ping
  },
  tomHit(t, f0) {
    this.tone(t, 'sine', f0, f0 * 0.62, 0.28, 0.85, 0.6);
    this.noiseHit(t, 'bandpass', f0 * 3, 0.18, 0.05, { q: 1.2 });
  },

  // ---- guitar: a plucked string is a burst of noise fed round a short delay loop that softens each pass
  string(freq) {
    const key = Math.round(freq * 10);
    if (this.ks.has(key)) return this.ks.get(key);
    const c = this.ctx, sr = c.sampleRate, length = Math.floor(sr * 2.4);
    const buffer = c.createBuffer(1, length, sr), out = buffer.getChannelData(0);
    const period = Math.max(2, Math.round(sr / freq)), ring = new Float32Array(period);
    let last = 0;
    for (let i = 0; i < period; i++) { const v = Math.random() * 2 - 1; last = last * 0.45 + v * 0.55; ring[i] = last; }   // a slightly soft pick
    const keep = 0.4985 + Math.min(0.0012, freq / 400000);
    for (let i = 0, p = 0; i < length; i++) {
      const a = ring[p], b = ring[(p + 1) % period];
      out[i] = a;
      ring[p] = (a + b) * keep;
      p = (p + 1) % period;
    }
    this.ks.set(key, buffer);
    return buffer;
  },
  strum(t, index) {
    const c = this.ctx, chord = CHORDS[index % CHORDS.length];
    chord.notes.forEach((f, k) => {
      const src = c.createBufferSource(), g = c.createGain();
      src.buffer = this.string(f);
      g.gain.value = 0.32 * (1 - k * 0.05);
      src.connect(g); g.connect(this.gtrIn);
      const at = t + k * 0.011 + Math.random() * 0.003;    // down-strum, low string first
      src.start(at); src.stop(at + 2.4);
    });
  },

  // ---- play anything (now, or at a scheduled time for the loop)
  play(kind, arg, t, fromLoop = false) {
    if (kind === 'kick') this.kick(t);
    else if (kind === 'snare') this.snare(t);
    else if (kind === 'hat') this.hat(t);
    else if (kind === 'crash') this.crash(t);
    else if (kind === 'ride') this.ride(t);
    else if (kind === 'tom') this.tomHit(t, 150);
    else if (kind === 'tom2') this.tomHit(t, 124);
    else if (kind === 'crash2') { this.crash(t); this.tone(t, 'sine', 3100, 3050, 0.3, 0.05, 0.9); }
    else if (kind === 'floor') this.tomHit(t, 98);
    else if (kind === 'strum') this.strum(t, arg);
    else if (kind === 'bass') this.bass(t, arg);
    this.onHit?.(kind, arg, t, fromLoop);
  },
  hit(kind, arg) {
    if (!this.ready()) return;
    const t = this.ctx.currentTime + 0.005;
    this.lastHit = performance.now() / 1000;
    this.play(kind, arg, t);
    this.record(kind, arg, t);
  },
  nextChord() { const i = this.chord; this.chord = (this.chord + 1) % CHORDS.length; return i; },
  busy() { return this.loop.state === 'play' || this.loop.state === 'dub' || performance.now() / 1000 - this.lastHit < 2.5; },

  // ---- the loop pedal: idle → recording → looping → overdubbing → cleared
  loopClick() {
    if (!this.ready()) return '';
    const L = this.loop, now = this.ctx.currentTime;
    if (L.state === 'idle') {
      L.events = []; L.start = now; L.state = 'rec';
      return 'Loop: recording… play something';
    }
    if (L.state === 'rec') {
      if (!L.events.length) { L.state = 'idle'; return 'Loop: nothing recorded yet'; }
      L.length = Math.max(0.5, now - L.start);
      L.start = now;                                       // the loop starts over from this click
      L.until = now;
      L.state = 'play';
      clearInterval(L.timer);
      L.timer = setInterval(() => this.tick(), 25);
      return `Loop: playing (${L.length.toFixed(1)} s)`;
    }
    if (L.state === 'play') { L.state = 'dub'; return 'Loop: overdub, add a layer'; }
    this.loopClear();
    return 'Loop cleared';
  },
  loopClear() {
    const L = this.loop;
    L.state = 'idle'; L.events = [];
    clearInterval(L.timer); L.timer = 0;
  },
  record(kind, arg, t) {
    const L = this.loop;
    if (L.state === 'rec') L.events.push({ t: t - L.start, kind, arg });
    else if (L.state === 'dub') L.events.push({ t: ((t - L.start) % L.length + L.length) % L.length, kind, arg });
    if (L.events.length > 400) L.events.shift();
  },
  // schedule every loop event that falls in the next slice of time
  tick() {
    const L = this.loop;
    if ((L.state !== 'play' && L.state !== 'dub') || !this.ctx || sound.paused || !sound.on) return;
    const now = this.ctx.currentTime, from = Math.max(L.until, now - 0.08), end = now + 0.25;   // a late tick still plays what's just due
    for (const e of L.events) {
      let T = L.start + e.t + Math.ceil((from - L.start - e.t) / L.length) * L.length;
      for (; T < end; T += L.length) if (T >= from) this.play(e.kind, e.arg, T, true);
    }
    L.until = end;
  },
  loopPosition() {                                       // 0..1 through the loop, for the screen
    const L = this.loop;
    if (!this.ctx || (L.state !== 'play' && L.state !== 'dub')) return 0;
    return (((this.ctx.currentTime - L.start) % L.length) + L.length) % L.length / L.length;
  },

  // ---- little noises
  micCheck() {
    if (!this.ready()) return;
    const c = this.ctx, t = c.currentTime;
    this.tone(t, 'sine', 120, 70, 0.1, 0.5, 0.2, sound.musicBus);           // a tap on the grille
    this.tone(t + 0.18, 'sine', 110, 70, 0.1, 0.4, 0.18, sound.musicBus);
    const osc = c.createOscillator(), wob = c.createOscillator(), depth = c.createGain(), g = c.createGain();
    osc.frequency.value = 2380; wob.frequency.value = 5.5; depth.gain.value = 14;
    wob.connect(depth); depth.connect(osc.frequency);
    g.gain.setValueAtTime(0.0001, t + 0.4);
    g.gain.exponentialRampToValueAtTime(0.05, t + 1.0);                    // feedback creeping up
    g.gain.setValueAtTime(0.05, t + 1.25);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 1.4);                  // and someone turns it down
    osc.connect(g); g.connect(sound.musicBus);
    osc.start(t + 0.4); wob.start(t + 0.4); osc.stop(t + 1.5); wob.stop(t + 1.5);
  },
  ampSwitch() {
    if (!this.ready()) return;
    const t = this.ctx.currentTime;
    this.tone(t, 'sine', 70, 40, 0.06, 0.35, 0.18, this.fx);
    this.noiseHit(t, 'lowpass', 400, 0.15, 0.05, { out: this.fx });
  },
  clink() {
    if (!this.ready()) return;
    const t = this.ctx.currentTime;
    this.noiseHit(t, 'lowpass', 220, 0.3, 0.12, { out: this.fx });       // the door seal
    this.tone(t + 0.35, 'sine', 2900, 2880, 0.1, 0.05, 0.25, this.fx);   // cans knocking
    this.tone(t + 0.42, 'sine', 4300, 4280, 0.1, 0.03, 0.2, this.fx);
    this.noiseHit(t + 1.1, 'highpass', 3000, 0.12, 0.25, { out: this.fx });   // pssht
  },
  buzz() {
    if (!this.ready()) return;
    const c = this.ctx, t = c.currentTime;
    this.tone(t, 'sine', 3400, 3380, 0.05, 0.04, 0.08, this.fx);         // tink
    const osc = c.createOscillator(), band = c.createBiquadFilter(), g = c.createGain();
    osc.type = 'sawtooth'; osc.frequency.value = 120;
    band.type = 'bandpass'; band.frequency.value = 900; band.Q.value = 2;
    g.gain.setValueAtTime(0.0001, t);
    for (let k = 0; k < 6; k++) { g.gain.setValueAtTime(k % 2 ? 0.0001 : 0.025, t + 0.05 + k * 0.09); }
    g.gain.setValueAtTime(0.0001, t + 0.7);
    osc.connect(band); band.connect(g); g.connect(this.fx);
    osc.start(t); osc.stop(t + 0.75);
  },
  flip() {
    if (!this.ready()) return;
    const t = this.ctx.currentTime;
    for (let k = 0; k < 4; k++) this.noiseHit(t + k * 0.13, 'bandpass', 1400 + k * 200, 0.1, 0.1, { q: 1.5, out: this.fx });
  },
};


/* ---------------------------------------------------------------------
   5. Randomness and textures
   --------------------------------------------------------------------- */
// Seeded random numbers: the same seed always gives the same result.
function seededRandom(seed) {
  return () => {
    seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// Draw a texture on a canvas.
function canvasTexture(size, draw, repeat = [1, 1]) {
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = size;
  draw(canvas.getContext('2d'), size);
  const texture = new THREE.CanvasTexture(canvas);
  texture.colorSpace = THREE.SRGBColorSpace;
  texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
  texture.repeat.set(repeat[0], repeat[1]);
  texture.anisotropy = 8;
  return texture;
}

// Poured concrete: the base colour, soft blotches, speckle, hairline cracks and dark stains.
function drawConcrete(g, size, base, rand, { seams = 0, stains = 6 } = {}) {
  g.fillStyle = base;
  g.fillRect(0, 0, size, size);
  for (let i = 0; i < 260; i++) {
    const r = 10 + rand() * 70;
    const grad = g.createRadialGradient(0, 0, 0, 0, 0, r);
    const light = rand() < 0.5;
    grad.addColorStop(0, light ? `rgba(255,255,255,${rand() * 0.05})` : `rgba(0,0,0,${rand() * 0.08})`);

  for (let i = 0; i < 9000; i++) {

    g.fillRect(rand() * size, rand() * size, 1 + rand() * 1.5, 1 + rand() * 1.5);
  }
  for (let i = 0; i < stains; i++) {                       // water stains running down
    const x = rand() * size, w = 20 + rand() * 60, h = 60 + rand() * size * 0.5;
    const grad = g.createLinearGradient(0, 0, 0, h);
    grad.addColorStop(0, 'rgba(20,16,10,0.22)'); grad.addColorStop(1, 'rgba(20,16,10,0)');

  }
  g.strokeStyle = 'rgba(0,0,0,0.35)'; g.lineWidth = 1;
  for (let i = 0; i < 7; i++) {                            // hairline cracks
    let x = rand() * size, y = rand() * size;
    g.beginPath(); g.moveTo(x, y);
    for (let k = 0; k < 9; k++) { x += (rand() - 0.5) * 40; y += (rand() - 0.3) * 30; g.lineTo(x, y); }

  }
  if (seams) {                                             // form-tie holes and pour lines, like a basement wall
    g.fillStyle = 'rgba(0,0,0,0.28)';
    for (let r = 1; r < seams; r++) g.fillRect(0, r * size / seams, size, 2);
    for (let r = 0; r < seams; r++) for (let c = 0; c < 4; c++) {
      g.beginPath(); g.arc((c + 0.5) * size / 4, (r + 0.5) * size / seams, 3, 0, Math.PI * 2); g.fill();
    }
  }
}

// A normal map for the concrete walls: soft unevenness, chipped indents, tiny bumps and pores.
// It only catches the light a little, so the walls feel rough without looking textured.
function concreteRelief(rand, size = 512) {
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = size;
  const g = canvas.getContext('2d');
  g.fillStyle = 'rgb(128,128,128)';
  g.fillRect(0, 0, size, size);
  const blob = (x, y, r, v) => {
    const grad = g.createRadialGradient(x, y, 0, x, y, r);
    grad.addColorStop(0, `rgba(${v},${v},${v},0.5)`); grad.addColorStop(1, `rgba(${v},${v},${v},0)`);
    g.fillStyle = grad; g.fillRect(x - r, y - r, r * 2, r * 2);
  };
  for (let i = 0; i < 140; i++) blob(rand() * size, rand() * size, 20 + rand() * 60, rand() < 0.5 ? 150 : 106);   // gentle waviness
  for (let i = 0; i < 90; i++) blob(rand() * size, rand() * size, 2 + rand() * 5, 175);                          // little bumps
  for (let i = 0; i < 26; i++) {                                                                                // chipped indents
    const x = rand() * size, y = rand() * size, r = 3 + rand() * 9, n = 5 + Math.floor(rand() * 4);
    g.fillStyle = `rgb(${70 + rand() * 25},${70 + rand() * 25},${70 + rand() * 25})`;
    g.beginPath();
    for (let k = 0; k < n; k++) { const a = k / n * Math.PI * 2, rr = r * (0.55 + rand() * 0.6); g.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); }
    g.closePath(); g.fill();
  }
  for (let i = 0; i < 1400; i++) { g.fillStyle = `rgba(80,80,80,${0.3 + rand() * 0.4})`; g.fillRect(rand() * size, rand() * size, 1, 1); }   // pores
  // heights → normals (wrapping at the edges so the tile repeats seamlessly)
  const h = g.getImageData(0, 0, size, size).data, out = g.createImageData(size, size), o = out.data;
  const H = (x, y) => h[(((y + size) % size) * size + ((x + size) % size)) * 4] / 255;
  const strength = 2.2;
  for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
    const dx = (H(x + 1, y) - H(x - 1, y)) * strength, dy = (H(x, y + 1) - H(x, y - 1)) * strength;
    const len = Math.hypot(dx, dy, 1), i = (y * size + x) * 4;
    o[i] = (-dx / len * 0.5 + 0.5) * 255; o[i + 1] = (dy / len * 0.5 + 0.5) * 255; o[i + 2] = (1 / len * 0.5 + 0.5) * 255; o[i + 3] = 255;
  }
  g.putImageData(out, 0, 0);
  const texture = new THREE.CanvasTexture(canvas);
  texture.colorSpace = THREE.NoColorSpace;
  texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
  return texture;
}

// Swap posters for pictures (room.json "posters": { "posterMoon": "posters/mine.jpg", ... }).
async function loadPosterImages(textures, posters) {
  const loader = new THREE.TextureLoader();
  await Promise.all(Object.entries(posters).map(async ([name, path]) => {
    const old = textures[name];
    if (!old || !path) return;
    try {
      const texture = await loader.loadAsync(path);
      texture.colorSpace = THREE.SRGBColorSpace;
      texture.anisotropy = 8;
      const want = old.image.width / old.image.height, have = texture.image.width / texture.image.height;
      if (have > want) { texture.repeat.x = want / have; texture.offset.x = (1 - texture.repeat.x) / 2; }
      else { texture.repeat.y = have / want; texture.offset.y = (1 - texture.repeat.y) / 2; }
      textures[name] = texture;
      old.dispose();
    } catch { console.warn(`Poster image not found: ${path}`); }
  }));
}

// A canvas texture that isn't square (posters, photos).
function sizedTexture(w, h, draw) {
  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  draw(canvas.getContext('2d'), w, h);
  const texture = new THREE.CanvasTexture(canvas);
  texture.colorSpace = THREE.SRGBColorSpace;
  texture.anisotropy = 8;
  return texture;
}

// The laptop screen: a little radio player and the loop pedal's state, redrawn while the room runs.
function makeScreenTexture() {
  const W = 512, H = 294;
  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  const g = canvas.getContext('2d');
  const texture = new THREE.CanvasTexture(canvas);
  texture.colorSpace = THREE.SRGBColorSpace;
  texture.anisotropy = 4;
  const bars = new Float32Array(32);
  const AMBER = '#ffbf5a', TEAL = '#6fe6cf', INK = '#110e12', DIM = 'rgba(255,191,90,0.55)';
  texture.userData.update = (t, level, playing) => {
    g.fillStyle = INK; g.fillRect(0, 0, W, H);
    g.fillStyle = '#211a1c'; g.fillRect(0, 0, W, 26);
    [['#ff6b6b', 14], ['#ffd36b', 30], ['#6fe6cf', 46]].forEach(([c, x]) => { g.fillStyle = c; g.beginPath(); g.arc(x, 13, 5, 0, Math.PI * 2); g.fill(); });
    g.fillStyle = AMBER; g.font = '600 13px ui-monospace, Menlo, monospace'; g.textAlign = 'left';
    g.fillText('basement.fm', 64, 18);
    g.fillStyle = DIM; g.textAlign = 'right';
    g.fillText(new Date().toTimeString().slice(0, 5), W - 12, 18);
    const track = playlist.current, audio = sound.musicFile;
    const fit = (text, max) => { let s = text; while (s.length > 1 && g.measureText(s).width > max) s = s.slice(0, -2) + '…'; return s; };
    // cover: the song's art, or a tiny drawing of the room's window well in the rain
    const ax = 20, ay = 44, as = 120;
    if (track.art) g.drawImage(track.art, ax, ay, as, as);
    else {
      g.fillStyle = '#1c2236'; g.fillRect(ax, ay, as, as);
      g.fillStyle = '#5a5552'; g.fillRect(ax, ay + 70, as, 50);
      g.fillStyle = '#2a3048'; g.fillRect(ax + 22, ay + 30, 76, 34);
      g.strokeStyle = '#8a8e96'; g.lineWidth = 3; g.strokeRect(ax + 22, ay + 30, 76, 34);
      g.strokeStyle = 'rgba(200,215,255,0.5)'; g.lineWidth = 1;
      for (let i = 0; i < 14; i++) { const x = ax + 26 + ((i * 37) % 70), y = ay + 32 + ((t * 30 + i * 13) % 28); g.beginPath(); g.moveTo(x, y); g.lineTo(x - 1, y + 5); g.stroke(); }
      g.fillStyle = AMBER; g.beginPath(); g.arc(ax + 60, ay + 12, 6, 0, Math.PI * 2); g.fill();
      g.fillStyle = 'rgba(255,191,90,0.25)'; g.beginPath(); g.moveTo(ax + 50, ay + 64); g.lineTo(ax + 75, ay + 64); g.lineTo(ax + 100, ay + 120); g.lineTo(ax + 30, ay + 120); g.fill();
    }
    g.textAlign = 'left';
    g.fillStyle = DIM; g.font = '500 12px ui-monospace, Menlo, monospace';
    g.fillText(`${playing ? 'NOW PLAYING' : 'PAUSED'} · ${playlist.index + 1}/${playlist.tracks.length}`, 160, 54);
    g.fillStyle = '#f5ead8'; g.font = '600 20px system-ui, sans-serif';
    g.fillText(fit(track.title, W - 180), 160, 78);
    g.fillStyle = 'rgba(245,234,216,0.6)'; g.font = '400 14px system-ui, sans-serif';
    g.fillText(fit(track.artist || '', W - 180), 160, 99);
    const live = playing || jam.busy();
    for (let i = 0; i < bars.length; i++) {
      const wave = 0.5 + 0.5 * Math.sin(t * (3 + (i % 7)) + i * 1.3);
      const target = live ? 0.1 + level * 0.9 * (0.35 + 0.65 * wave) * (1 - i / bars.length * 0.5) : 0.04 + 0.03 * wave;
      bars[i] += (target - bars[i]) * 0.35;
      const bh = bars[i] * 46;
      g.fillStyle = i < 22 ? TEAL : i < 28 ? AMBER : '#ff6b6b';
      g.fillRect(160 + i * 10.5, 164 - bh, 7, bh);
    }
    let progress, timeText;
    if (track.builtin) { progress = (t * 0.02) % 1; timeText = 'live · ∞'; }
    else { progress = audio.duration ? audio.currentTime / audio.duration : 0; timeText = `${formatTime(audio.currentTime)} / ${formatTime(audio.duration)}`; }
    g.fillStyle = 'rgba(255,191,90,0.18)'; g.fillRect(20, 190, W - 40, 4);
    g.fillStyle = AMBER; g.fillRect(20, 190, (W - 40) * progress, 4);
    g.beginPath(); g.arc(20 + (W - 40) * progress, 192, 6, 0, Math.PI * 2); g.fill();
    g.fillStyle = DIM; g.font = '500 11px ui-monospace, Menlo, monospace'; g.textAlign = 'right';
    g.fillText(timeText, W - 20, 212);
    // the loop pedal, mirrored here: state and a playhead
    const L = jam.loop, state = { idle: ['LOOP · ready', '#6a6a6a'], rec: ['● REC', '#ff4a4a'], play: ['▶ LOOP', '#5aff8a'], dub: ['◉ OVERDUB', '#ffa53a'] }[L.state];
    g.textAlign = 'left'; g.font = '700 14px ui-monospace, Menlo, monospace';
    g.fillStyle = L.state === 'rec' && Math.sin(t * 8) < 0 ? 'rgba(255,74,74,0.35)' : state[1];
    g.fillText(state[0], 20, 238);
    g.fillStyle = 'rgba(255,255,255,0.08)'; g.fillRect(140, 228, W - 160, 12);
    if (L.state === 'play' || L.state === 'dub') {
      for (const e of L.events) { g.fillStyle = e.kind === 'strum' ? AMBER : TEAL; g.fillRect(140 + (e.t / L.length) * (W - 160), 228, 2, 12); }
      g.fillStyle = '#ffffff'; g.fillRect(140 + jam.loopPosition() * (W - 160), 224, 2, 20);
    } else if (L.state === 'rec') {
      g.fillStyle = 'rgba(255,74,74,0.5)'; g.fillRect(140, 228, Math.min(W - 160, ((sound.ctx?.currentTime ?? 0) - L.start) * 40), 12);
    }
    g.fillStyle = DIM; g.font = '500 12px ui-monospace, Menlo, monospace';
    g.fillText(`amp: ${['off', 'clean', 'crunch'][jam.amp]}`, 20, 276);
    const next = playlist.tracks[(playlist.index + 1) % playlist.tracks.length];
    g.textAlign = 'right';
    g.fillText(playlist.tracks.length > 1 ? fit('next: ' + next.title, W / 2) : '1-5 drums · G strum · L loop', W - 20, 276);
    texture.needsUpdate = true;
  };
  texture.userData.update(0, 0, false);
  return texture;
}


/* ---------------------------------------------------------------------
