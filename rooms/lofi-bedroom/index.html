<!DOCTYPE html>
<!--
  LOFI BEDROOM  (three.js r186, built from the Room Template)
  A messy bedroom on a rainy night: the girl at her computer, her black cat on the windowsill,
  an unmade bed and a big window onto a rainy city. Click the computer, the cat, the window, the lamp, or her.

  Making your own copy
  - Put a room.json next to this page to change the songs, posters, the girl's look, the cat, the neon
    sign, the colours and what she says, without touching the code. Anything left out stays as in the
    showcase. (See README.md in the kit for every setting.)
  - For bigger changes, edit the ROOM description near the top of the script: size, colours, lights,
    objects. A room.json containing "objects" replaces ROOM entirely.
  - Things you can use are "hotspots": give an object  hotspot: { label, action }  and add the action
    to ACTIONS in the script. Doors use  action: 'door'  with  href: 'other-room.html'.
  - Optional files next to this page: music.mp3 (played by the record player), and any GLB models
    listed in ROOM.models.

  Controls
  - Desktop: WASD / arrow keys to walk (Shift to run), mouse wheel to step, drag to look, click things,
    P to pause, F for the FPS readout. Double-click faces the start direction again.
  - Phone: drag one finger to look; slide two fingers to walk (up = forward, sideways = step), or use the
    thumb joystick bottom-left; tap things (or the label that appears). Double-tap faces the start direction.
  - Pause freezes everything that moves and the music; you can still walk around the frozen moment.

  Keep the three.js addresses below identical in every room so phones download three.js only once.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lofi Bedroom</title>
<meta name="description" content="A messy little bedroom on a rainy night: a girl, her cat, a computer and the city in the rain.">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500&display=swap" rel="stylesheet">

<style>
/* ===================================================================
   Base
   =================================================================== */
:root {
  --u: min(calc(100vw / 1600), calc(100vh / 900));   /* 1u = 1px on a 1600×900 screen; scales with the window */
  --cream: #f5efe2;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
[hidden] { display: none !important; }

html, body {
  height: 100%;
  background: #000;
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-user-select: none;
  user-select: none;
}
html { cursor: grab; }
html.dragging { cursor: grabbing; }
html.can-use { cursor: pointer; }
body {
  color: var(--cream);
  font-family: Manrope, system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
  touch-action: none;              /* the page handles all touch gestures itself */
}
body.no-webgl { background: radial-gradient(120% 80% at 50% 100%, #2a1f2e 0%, #100c12 45%, #000 80%); }

a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
a:focus-visible, button:focus-visible { outline: 2px solid var(--cream); outline-offset: 3px; }

/* ===================================================================
   3D view and the black fade used for the intro and for doors
   =================================================================== */
#view { position: fixed; inset: 0; }
#view canvas { display: block; width: 100% !important; height: 100% !important; }
#fade { position: fixed; inset: 0; z-index: 5; background: #000; pointer-events: none; transition: opacity 1.2s ease; }
#fade.out { opacity: 0; }
#fade.leaving { opacity: 1; transition-duration: 0.6s; }

/* ===================================================================
   Interface layer (fades in after the intro)
   =================================================================== */
.ui {
  position: fixed;
  inset: 0;
  z-index: 2;
  pointer-events: none;            /* clicks pass through to the 3D view... */
  opacity: 0;
  transition: opacity 1.2s ease;
}
.ui.on { opacity: 1; }
.ui a, .ui button, .stick {
  pointer-events: auto;            /* ...except on links, buttons and the joystick */
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;     /* no long-press menu on phones */
  -webkit-tap-highlight-color: transparent;
  touch-action: none;
}

header {
  position: absolute;
  top: env(safe-area-inset-top, 0);
  left: 0;
  right: 0;
  padding: calc(24 * var(--u)) calc(44 * var(--u)) 0;
}
.logo { display: block; width: fit-content; font-size: calc(26 * var(--u)); font-weight: 500; letter-spacing: -0.02em; }

/* "Paused" chip and short messages, top centre */
.chip {
  position: absolute;
  top: calc(28 * var(--u) + env(safe-area-inset-top, 0px));
  left: 50%;
  transform: translateX(-50%);
  padding: 7px 14px;
  border-radius: 99px;
  background: rgba(0, 0, 0, 0.5);
  border: 1px solid rgba(245, 239, 226, 0.25);
  font-size: 12px;
  font-weight: 500;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  transition: opacity 0.4s;
}
#toast { top: calc(72 * var(--u) + env(safe-area-inset-top, 0px)); letter-spacing: 0.04em; text-transform: none; font-size: 13px; opacity: 0; }
#toast.show { opacity: 1; }

/* Label for the thing you're looking at / pointing at; tap it on a phone to use it */
.prompt {
  position: absolute;
  left: 50%;
  bottom: calc(120 * var(--u) + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%);
  padding: 9px 16px;
  border-radius: 99px;
  background: rgba(0, 0, 0, 0.55);
  border: 1px solid rgba(245, 239, 226, 0.35);
  font-size: 14px;
  font-weight: 500;
  white-space: nowrap;
}
.prompt b { font-weight: 500; opacity: 0.6; margin-left: 8px; }

/* Centre dot on touch screens: what's under it can be used */
.reticle {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 6px;
  height: 6px;
  margin: -3px 0 0 -3px;
  border-radius: 50%;
  background: rgba(245, 239, 226, 0.55);
  transition: transform 0.2s, background 0.2s;
  display: none;
}
.reticle.on { transform: scale(2.2); background: var(--cream); }

/* Bottom right: hints, pause and sound */
.corner {
  position: absolute;
  right: calc(44 * var(--u));
  bottom: calc(44 * var(--u) + env(safe-area-inset-bottom, 0px));
  display: flex;
  align-items: center;
  gap: calc(18 * var(--u));
  font-size: calc(12.5 * var(--u));
  font-weight: 500;
  letter-spacing: 0.16em;
  text-transform: uppercase;
}
.corner i { width: 1px; height: calc(26 * var(--u)); background: rgba(245, 239, 226, 0.45); }
.icon-btn { display: grid; place-items: center; width: calc(28 * var(--u)); height: calc(28 * var(--u)); }
.icon-btn svg { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.icon-btn svg .solid { fill: currentColor; stroke: none; }
.sound .waves, .sound .cross { transition: opacity 0.3s; }
.sound[aria-pressed="false"] .waves { opacity: 0; }
.sound[aria-pressed="true"] .cross { opacity: 0; }
.pause[aria-pressed="false"] .play { display: none; }
/* the card a door shows for a link to another site */
.door-card {
  position: fixed;
  left: 50%; top: 50%;
  transform: translate(-50%, -50%);
  z-index: 30;
  min-width: 260px;
  padding: 22px 24px 18px;
  border-radius: 18px;
  background: rgba(18, 12, 34, 0.86);
  border: 1px solid rgba(245, 239, 226, 0.18);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  color: #f5efe2;
  text-align: center;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
}
.door-card[hidden] { display: none; }
.door-title { margin: 0; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: rgba(245, 239, 226, 0.6); }
.door-where { margin: 8px 0 18px; font-size: 20px; font-weight: 600; word-break: break-all; }
.door-actions { display: flex; gap: 10px; justify-content: center; }
.door-go, .door-stay { padding: 9px 18px; border-radius: 999px; font: inherit; font-size: 14px; cursor: pointer; text-decoration: none; }
.door-go { background: linear-gradient(135deg, #8c4fe3, #4f6bff); color: #fff; border: 0; }
.door-stay { background: none; color: rgba(245, 239, 226, 0.8); border: 1px solid rgba(245, 239, 226, 0.25); }
/* music player, under the title */
.player {
  display: flex;
  width: fit-content;
  align-items: center;
  gap: 6px;
  margin-top: calc(12 * var(--u));
  padding: 5px 8px 5px 6px;
  max-width: min(440px, 70vw);
  border-radius: 999px;
  background: rgba(18, 12, 34, 0.55);
  border: 1px solid rgba(245, 239, 226, 0.16);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  pointer-events: auto;
}
.player .icon-btn { width: 26px; height: 26px; padding: 4px; border: 0; background: none; color: inherit; cursor: pointer; border-radius: 50%; }
.player .icon-btn:hover { background: rgba(245, 239, 226, 0.1); }
.player label.icon-btn { pointer-events: auto; }
#playSong[aria-pressed="false"] .bars, #playSong[aria-pressed="true"] .play { display: none; }
.player .now {
  min-width: 0;
  padding: 0 6px;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
  font-size: 13px;
  color: rgba(245, 239, 226, 0.85);
}
.player.drop { outline: 2px dashed #b9c4ff; outline-offset: 3px; }
#musicVolume { width: 70px; flex: none; margin: 0 4px 0 2px; accent-color: #b9a4ff; cursor: pointer; pointer-events: auto; }
/* Lofi / Mix / Code switch, top right */
.modes {
  position: absolute;
  top: calc(18 * var(--u));
  right: calc(44 * var(--u));
  display: flex;
  padding: 4px;
  border-radius: 999px;
  background: rgba(18, 12, 34, 0.55);
  border: 1px solid rgba(245, 239, 226, 0.16);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}
.modes button {
  position: relative;
  z-index: 1;
  padding: 7px 15px;
  border: 0;
  border-radius: 999px;
  background: none;
  color: rgba(245, 239, 226, 0.7);
  font: inherit;
  font-size: 13px;
  letter-spacing: 0.04em;
  cursor: pointer;

}
.modes button[aria-checked="true"] { color: #fff; }
.modes button:focus-visible { outline: 2px solid #b9c4ff; outline-offset: 1px; }
.modes-thumb {
  position: absolute;
  top: 4px; bottom: 4px; left: 0;
  width: 0;
  border-radius: 999px;
  background: linear-gradient(135deg, #8c4fe3, #4f6bff);

}
.rain .drops, .rain .cross { transition: opacity 0.3s; }
.rain[aria-pressed="false"] .drops { opacity: 0; }
.rain[aria-pressed="true"] .cross { opacity: 0; }
.pause[aria-pressed="true"] .bars { display: none; }

/* Thumb joystick (touch screens only) */
.stick {
  position: absolute;
  left: calc(26px + env(safe-area-inset-left, 0px));
  bottom: calc(26px + env(safe-area-inset-bottom, 0px));
  width: 124px;
  height: 124px;
  border-radius: 50%;
  border: 1.5px solid rgba(245, 239, 226, 0.35);
  background: rgba(0, 0, 0, 0.22);
  display: none;
}
.stick-knob {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 50px;
  height: 50px;
  margin: -25px 0 0 -25px;
  border-radius: 50%;
  background: rgba(245, 239, 226, 0.85);
  transition: transform 0.18s ease;
}
.stick.active .stick-knob { transition: none; }

.hint-touch { display: none; }
@media (hover: none) and (pointer: coarse) {
  .hint-desk { display: none !important; }
  .hint-touch { display: inline; }
  .stick, .reticle { display: block; }
}

/* ===================================================================
   Loading screen (with progress for models, and a message if three.js can't load)
   =================================================================== */
.loader {
  position: fixed;
  inset: 0;
  z-index: 6;
  display: grid;
  place-items: center;
  background: #000;
  transition: opacity 0.8s ease;
  pointer-events: none;
}
.loader.gone { opacity: 0; }
.loader.failed { pointer-events: auto; }
.loader.failed .loader-dot { display: none; }
.loader-dot {
  width: calc(9 * var(--u));
  height: calc(9 * var(--u));
  min-width: 6px;
  min-height: 6px;
  border-radius: 50%;
  background: var(--cream);
  animation: pulse 1.2s ease-in-out infinite;
}
@keyframes pulse { 50% { transform: scale(0.4); opacity: 0.4; } }
.loader-note {
  position: absolute;
  top: calc(50% + 26px);
  left: 0;
  right: 0;
  text-align: center;
  font-size: 13px;
  letter-spacing: 0.04em;
  opacity: 0.6;
}
.loader-error { display: grid; gap: 8px; justify-items: center; padding: 0 24px; text-align: center; font-size: 15px; }
.loader-error .sub { font-size: 13px; opacity: 0.65; }
.loader-error button {
  margin-top: 10px;
  height: 40px;
  padding: 0 20px;
  border-radius: 99px;
  background: var(--cream);
  color: #151510;
  font-weight: 500;
}

/* Frames-per-second readout */
#fps {
  position: fixed;
  z-index: 4;
  top: calc(70 * var(--u) + env(safe-area-inset-top, 0px));
  right: calc(44 * var(--u));
  padding: 6px 9px;
  border-radius: 6px;
  background: rgba(0, 0, 0, 0.45);
  color: var(--cream);
  font: 500 12px/1 ui-monospace, Menlo, monospace;
  letter-spacing: 0.06em;
  pointer-events: none;
}

/* ===================================================================
   Phones and narrow windows
   =================================================================== */
@media (max-width: 820px) {
  :root { --u: 1px; }
  header { padding: 18px 18px 0; }
  .corner { right: 20px; bottom: calc(30px + env(safe-area-inset-bottom)); font-size: 11px; }
  .icon-btn { width: 30px; height: 30px; }
  .prompt { bottom: calc(170px + env(safe-area-inset-bottom)); }
  #fps { top: calc(64px + env(safe-area-inset-top, 0px)); right: 18px; }
}
@media (prefers-reduced-motion: reduce) {
  .loader-dot { animation: none; }
}
</style>

<script type="module">
/* =====================================================================
   Contents
     1. The room (data: edit this to make a new room)
     2. Settings and page elements
     3. Loading three.js and room.json
     4. Sound: room tone, music file or built-in beat, chimes, level meter
     5. Randomness and textures
     6. Building the room from the description
     7. Post-processing
     8. The room: input, walking, hotspots, frame loop, clean-up
   ===================================================================== */


/* ---------------------------------------------------------------------
   1. The room
   Units are metres. Positions are [x, y, z]: x left/right, y up, z toward
   you (the far wall is at negative z). Angles are in degrees.
   Parts: box [w, h, d] · cylinder [radiusTop, radiusBottom, height, thetaStart?, thetaLength?] ·
          sphere [radius, phiStart?, phiLength?, thetaStart?, thetaLength?] · disc [radius] ·
          cone [radius, height] · torus [radius, tube, arcDegrees?] · plane [w, h] ·
          limb { from, to, radius } (a capsule between two points) ·
          cloth [w, d] (a rumpled sheet: bump, drape { left, right, foot, head, rate, floor }) ·
          glass [w, h] (rain on a window pane) · screen [w, h] (the computer screen) ·
          steam (rising from a mug) · light (point light) · string (a strand of little bulbs) ·
          group { parts, anim } (moves its parts together: breathe, nod, tap, blink, tail, look).
   Part extras: color, emissive, emissiveIntensity, roughness, metalness, scale [x, y, z],
          texture (a texture name), spin, pulse (glows with the music), flicker, open (hollow).
   --------------------------------------------------------------------- */

// ---- Your copy's settings. A room.json next to this page can change the songs, posters, the girl,
//      the cat, the neon sign, colours and what she says (see the kit's README). Anything left out
//      keeps this showcase's look. A room.json that has "objects" replaces the whole room instead.
let CUSTOM = {};
try {
  const response = await fetch('room.json', { cache: 'no-cache' });
  if (response.ok) CUSTOM = await response.json();
} catch { /* no room.json: the showcase room */ }
const LOOK = { girl: { ...CUSTOM.girl }, cat: { ...CUSTOM.cat }, neon: CUSTOM.neon || {} };
// a colour set to the showcase's own value counts as unchanged (keeps the exact hand-picked shades)
for (const [group, key, value] of [['girl', 'hair', '#7b3fd8'], ['girl', 'eyes', '#90b0ea'], ['cat', 'eyes', '#ffd23a']]) {
  if (String(LOOK[group][key] || '').toLowerCase() === value) delete LOOK[group][key];
}

// Lighten (amount > 0) or darken (amount < 0) a #rrggbb colour.
function shade(hex, amount) {
  const n = parseInt(String(hex).replace('#', ''), 16);
  const mix = c => Math.round(amount >= 0 ? c + (255 - c) * amount : c * (1 + amount));
  return '#' + [n >> 16 & 255, n >> 8 & 255, n & 255].map(c => mix(c).toString(16).padStart(2, '0')).join('');
}

// colours used again and again
const C = {
  skin: LOOK.girl.skin || '#c9b4c8', sweater: LOOK.girl.sweater || '#1f1c28',
  hair: LOOK.girl.hair || '#7b3fd8', hairGlow: LOOK.girl.hair ? shade(LOOK.girl.hair, -0.55) : '#3d1278',
  eyes: LOOK.girl.eyes || '#90b0ea', lips: LOOK.girl.lips || '#2a1426',
  cat: LOOK.cat.color || '#17151d', catEyes: LOOK.cat.eyes || '#ffd23a', catGlow: LOOK.cat.eyes ? shade(LOOK.cat.eyes, -0.2) : '#ffbf00',
  black: '#121016', wood: '#3b2c3f', woodDark: '#2a2030',
  paper: '#ece8f2', maroon: '#6e2333',
};

// Flip a list of parts left-to-right (for furniture moved to the other wall).
function mirrorX(parts) {
  return parts.map(p => {
    const q = { ...p };
    if (p.offset) q.offset = [-p.offset[0], p.offset[1], p.offset[2]];
    if (p.from) q.from = [-p.from[0], p.from[1], p.from[2]];
    if (p.to) q.to = [-p.to[0], p.to[1], p.to[2]];
    if (p.rotation) q.rotation = [p.rotation[0], -p.rotation[1], -p.rotation[2]];
    if (p.parts) q.parts = mirrorX(p.parts);
    return q;
  });
}

// A seeded generator so the mess lands in the same place on every visit.
const MESS_SEED = 90210;

// Books and candles for the bookshelf (seeded, so it's always the same shelf).
function bookshelfParts() {
  const R = seededRandom(MESS_SEED + 1);
  const W = 1.0, H = 1.9, D = 0.32;
  const palette = ['#5b3f6e', '#2e4a6b', '#7a2f45', '#3e5c4a', '#c9b78f', '#1f1d2b', '#8a6fb8', '#b85a7a', '#d8d0e4', '#44395c', '#a4486a'];
  const pick = () => palette[Math.floor(R() * palette.length)];
  const parts = [
    { shape: 'box', size: [W, H, 0.02], offset: [0, H / 2, -D / 2 + 0.01], color: C.woodDark },
    { shape: 'box', size: [0.03, H, D], offset: [-W / 2 + 0.015, H / 2, 0], color: C.wood },
    { shape: 'box', size: [0.03, H, D], offset: [W / 2 - 0.015, H / 2, 0], color: C.wood },
  ];
  const shelves = [0.03, 0.49, 0.95, 1.41, 1.88];
  for (const y of shelves) parts.push({ shape: 'box', size: [W, 0.03, D], offset: [0, y, 0], color: C.wood });
  for (let s = 0; s < 4; s++) {
    const base = shelves[s] + 0.015;
    let x = -W / 2 + 0.05;
    while (x < W / 2 - 0.1) {
      const roll = R();
      if (roll < 0.1) {                      // a pile lying flat
        let y = base;
        const n = 2 + Math.floor(R() * 3);
        for (let i = 0; i < n; i++) {
          const t = 0.03 + R() * 0.03;
          parts.push({ shape: 'box', size: [0.2 + R() * 0.05, t, 0.15 + R() * 0.05], offset: [x + 0.12, y + t / 2, (R() - 0.5) * 0.03], rotation: [0, (R() - 0.5) * 14, 0], color: pick() });
          y += t;
        }
        x += 0.27;
      } else if (roll < 0.17) {
        x += 0.07;                           // a gap where a book is missing
      } else {
        const w = 0.025 + R() * 0.035, h = 0.18 + R() * 0.17, d = 0.16 + R() * 0.08;
        const lean = R() < 0.12 ? 8 + R() * 10 : 0;
        parts.push({ shape: 'box', size: [w, h, d], offset: [x + w / 2 + lean * 0.004, base + h / 2, (R() - 0.5) * 0.04], rotation: [0, 0, -lean], color: pick(), roughness: 0.8 });
        x += w + 0.004 + lean * 0.006;
      }
    }
  }
  // the top: candles and a little plant
  const top = shelves[4] + 0.015;
  [[-0.32, 0.12], [-0.24, 0.08], [-0.17, 0.15]].forEach(([x, h]) => {
    parts.push({ shape: 'cylinder', size: [0.025, 0.025, h], offset: [x, top + h / 2, 0.02], color: '#e9dfcf' });
    parts.push({ shape: 'sphere', size: [0.009], offset: [x, top + h + 0.012, 0.02], scale: [1, 1.8, 1], color: '#fff3d0', emissive: '#ffb04a', emissiveIntensity: 3 });
  });
  parts.push({ shape: 'cylinder', size: [0.07, 0.055, 0.1], offset: [0.28, top + 0.05, 0], color: '#b9684a' });
  parts.push({ shape: 'sphere', size: [0.1], offset: [0.28, top + 0.15, 0], scale: [1.2, 0.9, 1], color: '#355f43' });
  parts.push({ shape: 'limb', from: [0.34, top + 0.12, 0.05], to: [0.45, top - 0.2, 0.12], radius: 0.018, color: '#3e6e4c' });
  return parts;
}

function findPart(parts = [], test) {
  for (const p of parts) {
    if (test(p)) return p;
    const inner = findPart(p.parts, test);
    if (inner) return inner;
  }
  return null;
}
function applyCustom(room, c) {
  if (c.title) room.name = c.title;
  if (Array.isArray(c.playlist)) room.playlist = c.playlist;
  if (c.colors) Object.assign(room.colors, c.colors);
  if (Array.isArray(c.talk) && c.talk.length) room.talk = c.talk;
  if (c.city?.seed) room.city.seed = c.city.seed;
  if (c.posters) room.posterImages = c.posters;
  const drop = id => { room.objects = room.objects.filter(o => o.id !== id); };
  for (const [id, value] of Object.entries(c.doors || {})) {
    const door = room.objects.find(o => o.id === id && o.hotspot);
    if (!door) { console.warn(`room.json: no door with id "${id}"`); continue; }
    const set = typeof value === 'string' ? { href: value } : value || {};
    door.hotspot = { ...door.hotspot, action: 'door', ...(set.href !== undefined && { href: set.href }), ...(set.label && { label: set.label }) };
  }
  if (c.girl?.show === false) drop('girl');
  if (c.girl?.smoking === false) {
    const arm = findPart(room.objects.find(o => o.id === 'girl')?.parts, p => p.cigarette);
    if (arm) { arm.cigarette = false; delete arm.anim; }
    drop('ashtray');
  }
  if (c.cat?.show === false) drop('cat');
  if (c.neon?.show === false) drop('neonSign');
}

/* ---------------------------------------------------------------------
   4. Sound
   - Room tone: a quiet, low hum of air, always there while sound is on.
   - Music: a playlist (see `playlist` above). Track 1 is a small built-in
     beat (kick, snare, hats and chords) made live, so music always works.
   - Everything musical goes through a level meter (`sound.level`, 0–1)
     so lights and objects can pulse with it.
   - Pause stops the music; muting pauses the whole audio engine.
   --------------------------------------------------------------------- */
/* ---------------------------------------------------------------------
   Playlist: the built-in beat is always track 1 (it's made live, so it
   works with no files at all). After it come the songs listed in
   ROOM.playlist (files shipped next to the page), then any songs you add
   with the + button or by dropping audio files on the room. Songs you add
   are remembered in this browser only. Titles, artists and cover art are
   read from the files' tags when they have them.
   --------------------------------------------------------------------- */
const playlist = {
  tracks: [{ title: 'rain on the window', artist: 'lofi.radio · built in', builtin: true }],
  index: 0,
  db: null,

  add(track) { this.tracks.push(track); return this.tracks.length - 1; },
  get current() { return this.tracks[this.index]; },

  // songs that ship with the room
  addShipped(list = []) {
    for (const item of list) {
      const entry = typeof item === 'string' ? { src: item } : item;
      const track = { src: entry.src, title: entry.title || titleFromName(entry.src), artist: entry.artist || '', shipped: true };
      this.add(track);
      if (!entry.title || !entry.artist) {
        fetch(entry.src).then(r => (r.ok ? r.blob() : null)).then(blob => blob && readTags(blob)).then(tags => {
          if (!tags) return;
          if (!entry.title && tags.title) track.title = tags.title;
          if (!entry.artist && tags.artist) track.artist = tags.artist;
          if (tags.art) track.art = tags.art;
        }).catch(() => {});
      }
    }
  },

  // songs you add: kept as blob URLs, and saved in this browser if it lets us
  async addFiles(files, save = true) {
    const added = [];
    for (const file of files) {
      if (!file.type.startsWith('audio/') && !/\.(mp3|m4a|aac|ogg|oga|opus|wav|flac|webm)$/i.test(file.name)) continue;
      const tags = await readTags(file).catch(() => null);
      const track = {
        src: URL.createObjectURL(file), mine: true, id: file.id,
        title: tags?.title || titleFromName(file.name),
        artist: tags?.artist || 'your music',
        art: tags?.art || null,
      };
      if (save && !file.id) this.save(file).then(id => { track.id = id; });   // remembered in this browser, in the background
      added.push(this.add(track));
    }
    return added;
  },

  async openDb() {
    if (this.db) return this.db;
    this.db = await new Promise((resolve, reject) => {
      const request = indexedDB.open('lofi-bedroom', 1);
      request.onupgradeneeded = () => request.result.createObjectStore('songs', { keyPath: 'id', autoIncrement: true });
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error);
    });
    return this.db;
  },
  async save(file) {
    try {
      const db = await this.openDb();
      return await new Promise((resolve, reject) => {
        const tx = db.transaction('songs', 'readwrite');
        const request = tx.objectStore('songs').add({ name: file.name, type: file.type, blob: file });
        request.onsuccess = () => resolve(request.result);
        tx.onerror = () => reject(tx.error);
      });
    } catch { return undefined; }
  },
  async loadSaved() {
    try {
      const db = await this.openDb();
      const rows = await new Promise((resolve, reject) => {
        const request = db.transaction('songs').objectStore('songs').getAll();
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
      const files = rows.map(row => Object.assign(new File([row.blob], row.name, { type: row.type }), { id: row.id }));
      return await this.addFiles(files, false);
    } catch { return []; }
  },
  async remove(i) {
    const track = this.tracks[i];
    if (!track?.mine) return;
    URL.revokeObjectURL(track.src);
    this.tracks.splice(i, 1);
    if (this.index >= i) this.index = Math.max(0, this.index - 1);
    try {
      const db = await this.openDb();
      db.transaction('songs', 'readwrite').objectStore('songs').delete(track.id);
    } catch { /* nothing saved */ }
  },
};

function titleFromName(name = '') {
  return decodeURIComponent(name.split('/').pop()).replace(/\.[a-z0-9]+$/i, '').replace(/[_]+/g, ' ').trim() || 'untitled';
}

// Reads title, artist and cover art from an MP3's ID3v2 tags (other formats just use the file name).
async function readTags(blob) {
  const head = new Uint8Array(await blob.slice(0, 10).arrayBuffer());
  if (head[0] !== 0x49 || head[1] !== 0x44 || head[2] !== 0x33) return null;          // "ID3"
  const version = head[3];
  const size = (head[6] << 21) | (head[7] << 14) | (head[8] << 7) | head[9];
  const bytes = new Uint8Array(await blob.slice(10, 10 + Math.min(size, 4e6)).arrayBuffer());
  const out = {};
  const text = (b, encoding) => {
    const label = encoding === 0 ? 'latin1' : encoding === 1 ? 'utf-16' : encoding === 2 ? 'utf-16be' : 'utf-8';
    return new TextDecoder(label).decode(b).replace(/\0+$/, '').replace(/\0/g, ' / ').trim();
  };
  let p = 0;
  while (p + 10 < bytes.length) {
    const id = String.fromCharCode(bytes[p], bytes[p + 1], bytes[p + 2], bytes[p + 3]);
    if (!/^[A-Z0-9]{4}$/.test(id)) break;
    const frameSize = version === 4
      ? (bytes[p + 4] << 21) | (bytes[p + 5] << 14) | (bytes[p + 6] << 7) | bytes[p + 7]
      : ((bytes[p + 4] << 24) | (bytes[p + 5] << 16) | (bytes[p + 6] << 8) | bytes[p + 7]) >>> 0;
    const body = bytes.subarray(p + 10, p + 10 + frameSize);
    if (id === 'TIT2') out.title = text(body.subarray(1), body[0]);
    else if (id === 'TPE1') out.artist = text(body.subarray(1), body[0]);
    else if (id === 'APIC' && !out.art) {
      const encoding = body[0];
      let q = 1;
      while (q < body.length && body[q] !== 0) q++;                   // mime type
      const mime = new TextDecoder('latin1').decode(body.subarray(1, q)) || 'image/jpeg';
      q += 2;                                                         // the null and the picture type
      if (encoding === 1 || encoding === 2) { while (q + 1 < body.length && (body[q] || body[q + 1])) q += 2; q += 2; }
      else { while (q < body.length && body[q] !== 0) q++; q += 1; }
      try { out.art = await createImageBitmap(new Blob([body.subarray(q)], { type: mime.includes('/') ? mime : 'image/' + mime })); } catch { /* no art */ }
    }
    if (frameSize <= 0) break;
    p += 10 + frameSize;
  }
  return out;
}

const sound = {
  ctx: null, master: null, musicBus: null, musicVolume: null, analyser: null, bins: null,
  volume: (() => { try { const v = parseFloat(localStorage.getItem('lofiBedroomVolume')); return v >= 0 && v <= 1 ? v : 0.8; } catch { return 0.8; } })(),
  setVolume(v) {
    this.volume = v;
    try { localStorage.setItem('lofiBedroomVolume', String(v)); } catch {}
    if (this.musicVolume) this.musicVolume.gain.setTargetAtTime(v * v, this.ctx.currentTime, 0.05);
  },
  on: false,              // sound switched on
  wantMusic: false,       // the record player is on
  paused: false,          // the scene is paused
  level: 0,               // how loud the music is right now, 0–1
  musicFile: null,        // <audio> that plays the playlist's songs
  musicSource: null,
  beatTimer: 0, step: 0, nextStepTime: 0,
  suspendTimer: 0,

  // One <audio> element plays every song in the playlist (it only plays after a click).
  prepareMusic() {
    const audio = new Audio();
    audio.preload = 'auto';
    audio.addEventListener('ended', () => this.onEnded?.());
    audio.addEventListener('error', () => { if (audio.getAttribute('src')) this.onError?.(); });
    this.musicFile = audio;
  },

  // switch to track i of the playlist (keeps playing if music was on)
  selectTrack(i) {
    const n = playlist.tracks.length;
    playlist.index = ((i % n) + n) % n;
    const track = playlist.current;
    this.musicFile.pause();
    if (track.builtin) this.musicFile.removeAttribute('src');
    else this.musicFile.src = track.src;
    this.refresh();
  },

  build() {
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    if (!AudioContext) return false;
    const ctx = this.ctx = new AudioContext();

    this.master = ctx.createGain();
    this.master.gain.value = 0;
    const compressor = ctx.createDynamicsCompressor();
    compressor.threshold.value = -16;
    compressor.ratio.value = 3;
    this.master.connect(compressor);
    compressor.connect(ctx.destination);

    // music goes through the level meter on its way to the speakers
    this.musicBus = ctx.createGain();
    this.analyser = ctx.createAnalyser();
    this.analyser.fftSize = 256;
    this.bins = new Uint8Array(this.analyser.frequencyBinCount);
    this.musicBus.connect(this.analyser);
    this.musicVolume = ctx.createGain();
    this.musicVolume.gain.value = this.volume ** 2;               // feels even across the slider
    this.analyser.connect(this.musicVolume);
    this.musicVolume.connect(this.master);
    if (this.musicFile) {
      this.musicSource = ctx.createMediaElementSource(this.musicFile);
      this.musicSource.connect(this.musicBus);
    }

    this.noise = this.noiseBuffer(2);

    // room tone: low, filtered noise that slowly breathes
    const air = ctx.createBufferSource();
    air.buffer = this.noise;
    air.loop = true;
    const low = ctx.createBiquadFilter();
    low.type = 'lowpass';
    low.frequency.value = 240;
    const airLevel = ctx.createGain();
    airLevel.gain.value = 0.05;
    const breath = ctx.createOscillator(), breathDepth = ctx.createGain();
    breath.frequency.value = 0.08;
    breathDepth.gain.value = 0.015;
    breath.connect(breathDepth);
    breathDepth.connect(airLevel.gain);
    breath.start();
    air.connect(low);
    low.connect(airLevel);
    airLevel.connect(this.master);
    air.start();

    // rain on the window: a soft hiss that swells and fades, plus a patter of drops.
    // It has its own switch (rainOn) and stays silent until that's on.
    const rain = ctx.createBufferSource();
    rain.buffer = this.noise;
    rain.loop = true;
    const rainHigh = ctx.createBiquadFilter(), rainLow = ctx.createBiquadFilter(), rainLevel = ctx.createGain();
    rainHigh.type = 'highpass'; rainHigh.frequency.value = 450;
    rainLow.type = 'lowpass'; rainLow.frequency.value = 3800;
    rainLevel.gain.value = 0.03;
    const swell = ctx.createOscillator(), swellDepth = ctx.createGain();
    swell.frequency.value = 0.06;
    swellDepth.gain.value = 0.008;
    swell.connect(swellDepth);
    swellDepth.connect(rainLevel.gain);
    swell.start();
    this.rainSwitch = ctx.createGain();
    this.rainSwitch.gain.value = this.rainOn ? 1 : 0;
    rain.connect(rainHigh); rainHigh.connect(rainLow); rainLow.connect(rainLevel); rainLevel.connect(this.rainSwitch); this.rainSwitch.connect(this.master);
    rain.start(0, 0.7);
    this.dripTimer = setInterval(() => {
      if (!this.on || !this.rainOn) return;
      const t = this.ctx.currentTime;
      for (let i = 0; i < 3; i++) if (Math.random() < 0.5) this.drip(t + Math.random() * 0.25);
    }, 250);
    return true;
  },

  // one drop tapping the glass
  drip(t) {
    const noise = this.ctx.createBufferSource(), band = this.ctx.createBiquadFilter(), gain = this.ctx.createGain();
    noise.buffer = this.noise;
    band.type = 'bandpass';
    band.frequency.value = 1800 + Math.random() * 3500;
    band.Q.value = 6;
    gain.gain.setValueAtTime(0.012 + Math.random() * 0.016, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.03);
    noise.connect(band); band.connect(gain); gain.connect(this.master);
    noise.start(t, Math.random() * 1.5);
    noise.stop(t + 0.05);
  },

  // a cat purring: low rumble pulsing about 25 times a second
  purr() {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    const noise = this.ctx.createBufferSource(), low = this.ctx.createBiquadFilter(), body = this.ctx.createGain(), env = this.ctx.createGain();
    noise.buffer = this.noise;
    noise.loop = true;
    low.type = 'bandpass';
    low.frequency.value = 650;
    low.Q.value = 0.9;
    body.gain.value = 0.5;
    const flutter = this.ctx.createOscillator(), flutterDepth = this.ctx.createGain();
    flutter.frequency.value = 30;
    flutterDepth.gain.value = 0.5;
    flutter.connect(flutterDepth); flutterDepth.connect(body.gain);
    env.gain.setValueAtTime(0, t);
    env.gain.linearRampToValueAtTime(0.45, t + 0.35);
    env.gain.setValueAtTime(0.45, t + 2.2);
    env.gain.exponentialRampToValueAtTime(0.0001, t + 3.0);
    noise.connect(low); low.connect(body); body.connect(env); env.connect(this.master);
    noise.start(t); flutter.start(t);
    noise.stop(t + 3.1); flutter.stop(t + 3.1);
  },

  // thunder rolling in a moment after the flash
  thunder(delay = 0.8) {
    if (!this.ctx) return;
    const t = this.ctx.currentTime + delay;
    const noise = this.ctx.createBufferSource(), low = this.ctx.createBiquadFilter(), env = this.ctx.createGain();
    noise.buffer = this.noise;
    noise.loop = true;
    low.type = 'lowpass';
    low.frequency.setValueAtTime(260, t);
    low.frequency.exponentialRampToValueAtTime(70, t + 4);
    env.gain.setValueAtTime(0.0001, t);
    env.gain.exponentialRampToValueAtTime(0.4, t + 0.25);
    env.gain.exponentialRampToValueAtTime(0.15, t + 1.2);
    env.gain.exponentialRampToValueAtTime(0.0001, t + 4.5);
    noise.connect(low); low.connect(env); env.connect(this.master);
    noise.start(t, Math.random());
    noise.stop(t + 4.6);
  },

  noiseBuffer(seconds) {
    const length = Math.floor(this.ctx.sampleRate * seconds);
    const buffer = this.ctx.createBuffer(1, length, this.ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < length; i++) data[i] = Math.random() * 2 - 1;
    return buffer;
  },

  // Start or stop the music so it matches: sound on, record on, not paused.
  refresh() {
    const play = this.on && this.wantMusic && !this.paused;
    const track = playlist.current;
    if (play && !track.builtin) {
      this.stopBeat();
      if (this.musicFile.getAttribute('src') !== track.src) this.musicFile.src = track.src;
      this.musicFile.play().catch(() => {});
    } else if (play) {
      this.musicFile.pause();
      this.startBeat();
    } else {
      this.musicFile?.pause();
      this.stopBeat();
    }
  },

  // Sound on/off with a fade. Returns whether it's now on.
  toggle() {
    if (!this.ctx && !this.build()) return false;
    this.on = !this.on;
    clearTimeout(this.suspendTimer);
    const t = this.ctx.currentTime, gain = this.master.gain;
    gain.cancelScheduledValues(t);
    gain.setValueAtTime(gain.value, t);
    if (this.on) {
      this.ctx.resume?.().catch(() => {});
      gain.setTargetAtTime(0.8, t, 0.5);
    } else {
      gain.setTargetAtTime(0, t, 0.3);
      this.suspendTimer = setTimeout(() => { if (!this.on) this.ctx.suspend?.().catch(() => {}); }, 1800);
    }
    this.refresh();
    return this.on;
  },

  // rain sound on/off (turning it on also turns sound on)
  rainOn: false,
  setRain(on) {
    this.rainOn = on;
    if (on && !this.on) this.toggle();
    if (this.rainSwitch) {
      const t = this.ctx.currentTime;
      this.rainSwitch.gain.cancelScheduledValues(t);
      this.rainSwitch.gain.setTargetAtTime(on ? 1 : 0, t, 0.4);
    }
  },

  setMusic(on) {
    this.wantMusic = on;
    if (on && !this.on) this.toggle();   // turning on the music turns sound on
    else this.refresh();
  },

  setPaused(paused) {
    this.paused = paused;
    if (this.ctx) this.refresh();
  },

  // ---- built-in beat: 84 bpm, a 2-bar loop of kick, snare, hats and two chords
  startBeat() {
    if (this.beatTimer) return;
    const stepLength = 60 / 84 / 4;
    this.nextStepTime = this.ctx.currentTime + 0.06;
    this.beatTimer = setInterval(() => {
      while (this.nextStepTime < this.ctx.currentTime + 0.12) {
        this.playStep(this.step, this.nextStepTime);
        this.nextStepTime += stepLength;
        this.step = (this.step + 1) % 32;
      }
    }, 25);
  },
  stopBeat() {
    clearInterval(this.beatTimer);
    this.beatTimer = 0;
  },
  playStep(step, t) {
    const s = step % 16;
    if (s === 0 || s === 10) this.kick(t);
    if (s === 4 || s === 12) this.snare(t);
    if (s % 2 === 0) this.hat(t, s % 4 === 2 ? 0.05 : 0.028);
    if (step === 0) this.chord(t, [146.83, 174.61, 220, 261.63]);    // D minor 7
    if (step === 16) this.chord(t, [116.54, 146.83, 174.61, 220]);   // B♭ major 7
  },
  kick(t) {
    const osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
    osc.frequency.setValueAtTime(120, t);
    osc.frequency.exponentialRampToValueAtTime(42, t + 0.14);
    gain.gain.setValueAtTime(0.55, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.32);
    osc.connect(gain);
    gain.connect(this.musicBus);
    osc.start(t);
    osc.stop(t + 0.35);
  },
  snare(t) {
    const noise = this.ctx.createBufferSource(), band = this.ctx.createBiquadFilter(), gain = this.ctx.createGain();
    noise.buffer = this.noise;
    band.type = 'highpass';
    band.frequency.value = 1400;
    gain.gain.setValueAtTime(0.16, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.16);
    noise.connect(band);
    band.connect(gain);
    gain.connect(this.musicBus);
    noise.start(t, Math.random());
    noise.stop(t + 0.2);
  },
  hat(t, volume) {
    const noise = this.ctx.createBufferSource(), band = this.ctx.createBiquadFilter(), gain = this.ctx.createGain();
    noise.buffer = this.noise;
    band.type = 'highpass';
    band.frequency.value = 7000;
    gain.gain.setValueAtTime(volume, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.045);
    noise.connect(band);
    band.connect(gain);
    gain.connect(this.musicBus);
    noise.start(t, Math.random());
    noise.stop(t + 0.06);
  },
  chord(t, notes) {
    const warm = this.ctx.createBiquadFilter(), gain = this.ctx.createGain();
    warm.type = 'lowpass';
    warm.frequency.value = 1100;
    gain.gain.setValueAtTime(0, t);
    gain.gain.linearRampToValueAtTime(0.05, t + 0.06);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 2.6);
    warm.connect(gain);
    gain.connect(this.musicBus);
    for (const frequency of notes) {
      const osc = this.ctx.createOscillator();
      osc.type = 'triangle';
      osc.frequency.value = frequency;
      osc.detune.value = (Math.random() - 0.5) * 8;
      osc.connect(warm);
      osc.start(t);
      osc.stop(t + 2.7);
    }
  },

  // a soft bell, for small interactions
  chime() {
    if (!this.ctx) return;
    const t = this.ctx.currentTime, envelope = this.ctx.createGain();
    envelope.gain.setValueAtTime(0, t);
    envelope.gain.linearRampToValueAtTime(0.06, t + 0.01);
    envelope.gain.exponentialRampToValueAtTime(0.0001, t + 2.5);
    envelope.connect(this.master);
    [[1, 1], [2.76, 0.25]].forEach(([ratio, volume]) => {
      const osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
      osc.frequency.value = 880 * ratio;
      gain.gain.value = volume;
      osc.connect(gain);
      gain.connect(envelope);
      osc.start(t);
      osc.stop(t + 2.6);
    });
  },

  // read the level meter (bass-heavy), once per frame
  update(dt) {
    let target = 0;
    if (this.analyser && this.on && !this.paused) {
      this.analyser.getByteFrequencyData(this.bins);
      let sum = 0;
      for (let i = 0; i < 10; i++) sum += this.bins[i];
      target = Math.min(1, sum / (10 * 255) * 1.4);
    }
    // jump up quickly, fall back slowly
    this.level += (target - this.level) * (1 - Math.exp(-dt * (target > this.level ? 30 : 6)));
  },

  dispose() {
    this.stopBeat();
    clearInterval(this.dripTimer);
    clearTimeout(this.suspendTimer);
    this.musicFile?.pause();
    this.ctx?.close();
    this.ctx = null;
  },
};


/* ---------------------------------------------------------------------
   5. Randomness and textures
   --------------------------------------------------------------------- */
// Seeded random numbers: the same seed always gives the same result.
function seededRandom(seed) {
  return () => {
    seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// Draw a texture on a canvas.
function canvasTexture(size, draw, repeat = [1, 1]) {
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = size;
  draw(canvas.getContext('2d'), size);
  const texture = new THREE.CanvasTexture(canvas);
  texture.colorSpace = THREE.SRGBColorSpace;
  texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
  texture.repeat.set(repeat[0], repeat[1]);
  texture.anisotropy = 8;
  return texture;
}

function makeTextures(rand) {
  const { width, depth, height } = ROOM.size;
  return {
    // wooden floorboards: rows of planks, each slightly lighter or darker, with fine grain
    floor: canvasTexture(1024, (g, size) => {
      g.fillStyle = ROOM.colors.floor;
      g.fillRect(0, 0, size, size);
      const rows = 8, rowHeight = size / rows;
      for (let r = 0; r < rows; r++) {
        let x = -rand() * size * 0.6;
        while (x < size) {
          const length = size * (0.35 + rand() * 0.5);
          const shade = (rand() - 0.5) * 0.16;
          g.fillStyle = shade > 0 ? `rgba(255,235,210,${shade})` : `rgba(0,0,0,${-shade})`;
          g.fillRect(x, r * rowHeight, length, rowHeight);
          for (let k = 0; k < 6; k++) {   // grain
            g.fillStyle = `rgba(0,0,0,${0.04 + rand() * 0.05})`;
            g.fillRect(x, r * rowHeight + rand() * rowHeight, length, 1 + rand() * 1.5);
          }
          g.fillStyle = 'rgba(0,0,0,0.45)';
          g.fillRect(x, r * rowHeight, 2, rowHeight);   // plank end
          x += length;
        }
        g.fillStyle = 'rgba(0,0,0,0.5)';
        g.fillRect(0, r * rowHeight, size, 2);          // gap between rows
      }
    }, [width / 2.4, depth / 2.4]),

    // plaster: the wall colour with faint mottling
    walls: canvasTexture(512, (g, size) => {
      g.fillStyle = ROOM.colors.walls;
      g.fillRect(0, 0, size, size);
      for (let i = 0; i < 2600; i++) {
        g.fillStyle = rand() < 0.5 ? `rgba(255,255,255,${rand() * 0.035})` : `rgba(0,0,0,${rand() * 0.05})`;
        const r = 2 + rand() * 9;
        g.fillRect(rand() * size, rand() * size, r, r);
      }
    }, [Math.max(width, depth) / 2.5, height / 2.5]),

    // a vinyl record: grooves, a red label, and a sheen so you can see it turn
    record: canvasTexture(512, (g, size) => {
      const c = size / 2;
      g.fillStyle = '#0c0c0e';
      g.beginPath(); g.arc(c, c, c, 0, Math.PI * 2); g.fill();
      for (let r = c * 0.36; r < c * 0.97; r += 3) {
        g.strokeStyle = `rgba(255,255,255,${0.02 + rand() * 0.04})`;
        g.beginPath(); g.arc(c, c, r, 0, Math.PI * 2); g.stroke();
      }
      const sheen = g.createConicGradient(0, c, c);
      sheen.addColorStop(0, 'rgba(255,255,255,0)');
      sheen.addColorStop(0.08, 'rgba(255,255,255,0.18)');
      sheen.addColorStop(0.16, 'rgba(255,255,255,0)');
      sheen.addColorStop(0.58, 'rgba(255,255,255,0)');
      sheen.addColorStop(0.64, 'rgba(255,255,255,0.1)');
      sheen.addColorStop(0.7, 'rgba(255,255,255,0)');
      g.fillStyle = sheen;
      g.beginPath(); g.arc(c, c, c * 0.97, 0, Math.PI * 2); g.fill();
      g.fillStyle = '#c2412f';
      g.beginPath(); g.arc(c, c, c * 0.33, 0, Math.PI * 2); g.fill();
      g.fillStyle = '#f0e2c8';
      g.fillRect(c - c * 0.18, c - c * 0.05, c * 0.36, c * 0.06);
      g.fillStyle = '#111';
      g.beginPath(); g.arc(c, c, c * 0.03, 0, Math.PI * 2); g.fill();
    }),

    // ---- posters (all invented, drawn here)
    posterMoon: sizedTexture(360, 500, (g, w, h) => {
      const sky = g.createLinearGradient(0, 0, 0, h);
      sky.addColorStop(0, '#1b1840'); sky.addColorStop(1, '#3a2466');
      g.fillStyle = sky; g.fillRect(0, 0, w, h);
      for (let i = 0; i < 90; i++) {
        g.fillStyle = `rgba(255,245,230,${0.3 + rand() * 0.7})`;
        const r = rand() * 1.8 + 0.4;
        g.beginPath(); g.arc(rand() * w, rand() * h * 0.8, r, 0, Math.PI * 2); g.fill();
      }
      g.fillStyle = '#f5ead0';
      g.beginPath(); g.arc(w * 0.5, h * 0.4, 110, 0, Math.PI * 2); g.fill();
      g.fillStyle = '#25204c';
      g.beginPath(); g.arc(w * 0.5 + 48, h * 0.4 - 26, 100, 0, Math.PI * 2); g.fill();
      g.fillStyle = '#f5ead0';
      g.font = '600 34px system-ui, sans-serif'; g.textAlign = 'center';
      g.fillText('L U N A', w / 2, h * 0.82);
      g.font = '400 14px system-ui, sans-serif'; g.globalAlpha = 0.7;
      g.fillText('night owls club', w / 2, h * 0.88); g.globalAlpha = 1;
      g.strokeStyle = '#f5ead0'; g.lineWidth = 3; g.strokeRect(14, 14, w - 28, h - 28);
    }),
    posterBand: sizedTexture(360, 510, (g, w, h) => {
      const bg = g.createLinearGradient(0, 0, 0, h);
      bg.addColorStop(0, '#120c24'); bg.addColorStop(0.55, '#5a1e6e'); bg.addColorStop(1, '#ff4f9a');
      g.fillStyle = bg; g.fillRect(0, 0, w, h);
      const sun = g.createLinearGradient(0, h * 0.25, 0, h * 0.62);
      sun.addColorStop(0, '#ffd36b'); sun.addColorStop(1, '#ff4f9a');
      g.fillStyle = sun;
      g.beginPath(); g.arc(w / 2, h * 0.45, 120, 0, Math.PI * 2); g.fill();
      g.fillStyle = '#3a1550';
      for (let i = 0; i < 7; i++) g.fillRect(0, h * 0.47 + i * 15, w, 3 + i * 1.3);
      g.strokeStyle = 'rgba(111, 216, 255, 0.7)'; g.lineWidth = 1.5;
      for (let i = 0; i < 10; i++) { const y = h * 0.62 + i * i * 2.4; g.beginPath(); g.moveTo(0, y); g.lineTo(w, y); g.stroke(); }
      for (let i = -8; i <= 8; i++) { g.beginPath(); g.moveTo(w / 2 + i * 10, h * 0.62); g.lineTo(w / 2 + i * 70, h); g.stroke(); }
      g.fillStyle = '#ffffff'; g.textAlign = 'center';
      g.font = '800 42px system-ui, sans-serif'; g.fillText('NIGHT', w / 2, 70);
      g.fillText('SIGNAL', w / 2, 112);
      g.font = '500 13px system-ui, sans-serif'; g.globalAlpha = 0.8;
      g.fillText('LIVE · ONE NIGHT ONLY', w / 2, 140); g.globalAlpha = 1;
    }),
    posterCat: sizedTexture(400, 400, (g, w, h) => {
      g.fillStyle = '#efe6d6'; g.fillRect(0, 0, w, h);
      g.fillStyle = '#16141c';
      g.beginPath(); g.ellipse(w / 2, h * 0.66, 85, 105, 0, 0, Math.PI * 2); g.fill();
      g.beginPath(); g.arc(w / 2, h * 0.33, 60, 0, Math.PI * 2); g.fill();
      g.beginPath(); g.moveTo(w / 2 - 55, h * 0.3); g.lineTo(w / 2 - 45, h * 0.12); g.lineTo(w / 2 - 15, h * 0.24); g.fill();
      g.beginPath(); g.moveTo(w / 2 + 55, h * 0.3); g.lineTo(w / 2 + 45, h * 0.12); g.lineTo(w / 2 + 15, h * 0.24); g.fill();
      g.lineWidth = 16; g.lineCap = 'round'; g.strokeStyle = '#16141c';
      g.beginPath(); g.moveTo(w / 2 + 70, h * 0.85); g.quadraticCurveTo(w * 0.92, h * 0.8, w * 0.85, h * 0.5); g.stroke();
      g.fillStyle = '#ffd23a';
      g.beginPath(); g.ellipse(w / 2 - 24, h * 0.33, 11, 13, 0, 0, Math.PI * 2); g.fill();
      g.beginPath(); g.ellipse(w / 2 + 24, h * 0.33, 11, 13, 0, 0, Math.PI * 2); g.fill();
      g.fillStyle = '#16141c';
      g.fillRect(w / 2 - 26, h * 0.33 - 10, 4, 20); g.fillRect(w / 2 + 22, h * 0.33 - 10, 4, 20);
      g.font = 'italic 600 26px Georgia, serif'; g.textAlign = 'center';
      g.fillText('nine lives', w / 2, h * 0.96);
    }),
    posterSketch: sizedTexture(300, 390, (g, w, h) => {

    faceOpen: sizedTexture(512, 512, (g, w, h) => drawFace(g, w, h, false)),
    faceClosed: sizedTexture(512, 512, (g, w, h) => drawFace(g, w, h, true)),

    // ---- hair: purple with darker strands, a soft shine and magenta tips
    hairCap: sizedTexture(1024, 256, (g, w, h) => {

      g.fillStyle = ring; g.fillRect(0, h * 0.38, w, h * 0.24);
      hairStrands(g, w, h, 160);
    }),
    hairBob: sizedTexture(1024, 256, (g, w, h) => {
      const base = g.createLinearGradient(0, 0, 0, h);
      const [c0, c1, c2] = LOOK.girl.hair ? [shade(C.hair, -0.25), shade(C.hair, -0.38), shade(C.hair, 0.18)] : ['#5a2aae', '#4c2398', '#9a48c8'];
      base.addColorStop(0, c0); base.addColorStop(0.7, c1); base.addColorStop(1, c2);
