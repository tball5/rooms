      mouth.getWorldPosition(smokeAt);
      mouth.getWorldQuaternion(smokeQ);
      smokeForward.set(0, -0.15, 1).normalize().applyQuaternion(smokeQ);

        smokeVel.copy(smokeForward).multiplyScalar(0.28 + Math.random() * 0.15);
        smokeVel.x += (Math.random() - 0.5) * 0.06; smokeVel.y += (Math.random() - 0.5) * 0.04; smokeVel.z += (Math.random() - 0.5) * 0.06;
        smoke.emit(smokeAt, smokeVel, 0.055, 4 + Math.random() * 2);
      }
    }
    smoke.update(dt, state.time, SMOKE_GAP);
  }

  // groups that move: breathing, nodding along, typing, blinking, a cat's tail
  function animateGroup(item, dt) {
    const o = item.object, t = state.time, base = item.base;
    if (state.paused && item.kind !== 'nod') return;
    const music = state.recordOn && sound.on && !state.paused;
    if (item.kind === 'breathe') {
      o.scale.y = 1 + Math.sin(t * 1.7) * 0.012;
      o.scale.x = o.scale.z = 1 + Math.sin(t * 1.7) * 0.006;
    } else if (item.kind === 'nod') {
      if (state.paused) return;
      let yaw = (item.yaw || 0) + Math.sin(t * 0.21) * 0.1 + Math.sin(t * 0.07) * 0.08;
      let pitch = base.rotation.x;
      if (o.userData.lookUntil > t) {
        o.parent.updateMatrixWorld();
        lookPoint.copy(camera.position);
        o.parent.worldToLocal(lookPoint);
        lookPoint.sub(o.position);
        yaw = Math.max(-1.15, Math.min(1.15, Math.atan2(lookPoint.x, lookPoint.z)));
        pitch = -Math.atan2(lookPoint.y, Math.hypot(lookPoint.x, lookPoint.z)) * 0.6;
      } else if (music) {
        pitch += Math.max(0, Math.sin(t * Math.PI * 2 * 1.4)) * (0.05 + sound.level * 0.06);
      }
      const k = approach(4, dt);
      o.rotation.y += (yaw - o.rotation.y) * k;
      o.rotation.x += (pitch - o.rotation.x) * approach(music ? 14 : 4, dt);
    } else if (item.kind === 'tap') {
      const typing = Math.sin(t * 0.45 + item.phase * 0.2) > -0.3 ? 1 : 0;
      o.position.y = base.position.y + Math.max(0, Math.sin(t * 11 + item.phase)) * 0.011 * typing;
    } else if (item.kind === 'blink') {
      const period = item.period || 4;
      const phase = (t / period + (item.period || 0) * 0.37) % 1;
      const closed = o.userData.closedUntil > t;
      const target = closed ? 0.12 : phase < 0.035 ? 0.1 : 1;
      o.scale.y += (target - o.scale.y) * approach(closed ? 10 : 40, dt);
    } else if (item.kind === 'smokeArm') {
      // a drag every 14 seconds: raise, inhale (ember glows), lower, breathe the smoke out
      const p = (t + 7) % 14;
      const ease = x => x * x * (3 - 2 * x);
      let k = 0;
      if (p < 1.3) k = ease(p / 1.3); else if (p < 3.0) k = 1; else if (p < 4.2) k = 1 - ease((p - 3.0) / 1.2);
      const part = item.arm.part;
      armTarget.fromArray(part.hand).lerp(armTmp.fromArray(part.reach), k);
      if (p > 8 && p < 8.45) armTarget.y += Math.sin((p - 8) / 0.45 * Math.PI * 2) * 0.012;   // flick the ash
      armDir.fromArray(part.cigDir).normalize().lerp(armTmp.fromArray(part.cigDirMouth).normalize(), k).normalize();
      solveArm(item.arm, armTarget, armDir);
      item.arm.ember.material.emissiveIntensity = (p > 1.2 && p < 3.0 ? 8 : 2.6) * (0.85 + 0.15 * Math.sin(t * 9));
      state.inhaling = p > 1.4 && p < 2.8;
      state.exhaling = p > 3.4 && p < 5.6;
    } else if (item.kind === 'blinkFace') {
      const phase = (t / item.period + 0.31) % 1;
      const closed = phase < 0.03 || state.inhaling || o.userData.closedUntil > t;
      o.material.map = closed ? item.closed : item.open;
    } else if (item.kind === 'tail') {
      o.rotation.y = Math.sin(t * 1.3) * 0.18;               // small swish: the tail stays on our side of the glass
      o.rotation.z = Math.sin(t * 0.9 + 1.0) * 0.1;
    } else if (item.kind === 'look') {
      o.rotation.y = (item.yaw || 0) + Math.sin(t * 0.37) * 0.2 + Math.sin(t * 0.11) * 0.12;
      o.rotation.z = Math.sin(t * 0.29) * 0.08;
    }
  }

  const FRAME_MS = 1000 / 30;          // cap at 30 frames a second
  let lastFrameAt = -Infinity;
  let lastDrawAt = 0;
  function frame(now) {
    frameId = requestAnimationFrame(frame);
    if (now - lastFrameAt < FRAME_MS - 1.5) return;
    lastFrameAt = Math.max(lastFrameAt + FRAME_MS, now - FRAME_MS);
    if (lastDrawAt && !document.hidden) watchFrameTime(Math.min(now - lastDrawAt, 400));
    lastDrawAt = now;
    timer.update(now);
    const dt = Math.min(timer.getDelta(), 0.05);
    if (!state.paused) state.time += dt;
    shared.uTime.value = state.time;

    // look (with the glide after a flick)
    if (!look.drag && (look.yawSpeed || look.pitchSpeed)) {
      look.yawTarget += look.yawSpeed * dt;
      look.pitchTarget = clampPitch(look.pitchTarget + look.pitchSpeed * dt);
      const friction = Math.exp(-dt * 7.5);
      look.yawSpeed *= friction;
      look.pitchSpeed *= friction;
      if (Math.abs(look.yawSpeed) + Math.abs(look.pitchSpeed) < 0.01) look.yawSpeed = look.pitchSpeed = 0;
    }
    const follow = approach(look.drag ? 22 : 12, dt);
    look.yaw += (look.yawTarget - look.yaw) * follow;
    look.pitch += (look.pitchTarget - look.pitch) * follow;

    // walking direction from keys, joystick and wheel (relative to where you face)
    const ahead = (keys.has('KeyW') || keys.has('ArrowUp') ? 1 : 0) - (keys.has('KeyS') || keys.has('ArrowDown') ? 1 : 0) - stick.y - twoFinger.y;
    const across = (keys.has('KeyD') || keys.has('ArrowRight') ? 1 : 0) - (keys.has('KeyA') || keys.has('ArrowLeft') ? 1 : 0) + stick.x + twoFinger.x;
    const running = keys.has('ShiftLeft') || keys.has('ShiftRight') || Math.hypot(stick.x, stick.y) > 0.95 || Math.hypot(twoFinger.x, twoFinger.y) > 0.95;
    forward.set(-Math.sin(look.yaw), 0, -Math.cos(look.yaw));
    right.set(Math.cos(look.yaw), 0, -Math.sin(look.yaw));
    wish.set(0, 0, 0).addScaledVector(forward, ahead).addScaledVector(right, across);
    if (wish.lengthSq() > 1) wish.normalize();
    wish.multiplyScalar(running ? SETTINGS.runSpeed : SETTINGS.walkSpeed).addScaledVector(forward, player.wheel);
    player.wheel *= Math.exp(-dt * 5);
    player.velocity.lerp(wish, approach(10, dt));
    player.position.addScaledVector(player.velocity, dt);
    collide(player.position);

    // camera at eye height with a little head bob while walking
    const speed = player.velocity.length();
    player.bob += dt * speed * 5.5;
    const bob = 0;   // no head bob: walking is perfectly smooth
    camera.position.set(player.position.x, SETTINGS.eyeHeight + bob, player.position.z);
    camera.rotation.set(look.pitch, look.yaw, 0);
    camera.updateMatrixWorld();

    // what you're pointing at (mouse) or looking at (centre of the screen on touch)
    const next = look.drag ? null : hotspotAt(!IS_TOUCH && mouse.inside ? mouse.ndc : centre);
    if (next !== focused) {
      focused = next;
      page.prompt.hidden = !focused;
      if (focused) page.prompt.innerHTML = `${focused.userData.hotspot.label}<b>${IS_TOUCH ? 'Tap' : 'Click'}</b>`;
      document.documentElement.classList.toggle('can-use', !!focused && !IS_TOUCH);
      page.reticle.classList.toggle('on', !!focused);
    }

    // things that move (frozen while paused)
    sound.update(dt);
    for (const item of animated) {
      if (item.kind === 'spin' && state.recordOn && !state.paused) item.object.rotation.y -= item.speed * dt;
      else if (item.kind === 'pulse') {
        if (item.object.isLight) { if (!item.object.parent?.userData.off) item.object.intensity = item.base + sound.level * item.amount; }
        else item.object.material.emissiveIntensity = item.base + sound.level * item.amount;
      }

      else if (item.kind === 'flicker') {
        const t = state.time;
        item.object.intensity = item.base * (1 - item.amount + item.amount * (Math.sin(t * 13.1) * Math.sin(t * 7.7 + 1.3) * 0.5 + 0.5));
      } else if (item.kind === 'twinkle') {
        for (let i = 0; i < item.count; i++) {
          const k = 0.75 + 0.25 * Math.sin(state.time * (0.8 + (i % 5) * 0.37) + i * 1.7);
          item.object.setColorAt(i, twinkleColor.copy(item.color).multiplyScalar(k * 1.6));
        }
        item.object.instanceColor.needsUpdate = true;
      } else if (item.kind !== 'spin') animateGroup(item, dt);
    }

    updateSmoke(dt);

    // lightning: now and then on its own, or when you click the window
    if (!state.paused && state.time > state.nextLightning) lightning();
    if (!state.paused) state.flash *= Math.exp(-dt * 3.2);
    const flash = state.flash * (0.55 + 0.45 * Math.abs(Math.sin(state.time * 31.0)));
    shared.uFlash.value = flash;
    flashLight.intensity = flash * 40;

    // the computer screen, about 24 times a second
    screenClock += dt;
    if (screenClock > 1 / 24) {
      screenClock = 0;
      textures.screen.userData.update(state.time, sound.level, state.recordOn && sound.on && !state.paused);
    }

    state.glitch = Math.max(0, state.glitch - dt * 2.2);
    post.uniforms.uGlitch.value = state.glitch;
    updateWaves(dt);
    const holoAmount = MODES[state.mode].room ? 1 : MODES[state.mode].city ? 0.25 : 0;
    post.uniforms.uHolo.value += (holoAmount - post.uniforms.uHolo.value) * approach(6, dt);
    post.uniforms.uTime.value = state.time;
    post.uniforms.uSpeed.value = Math.min(1, speed / SETTINGS.runSpeed);
    post.composer.render();

    // FPS readout, twice a second
    fpsFrames++;
    if (now - fpsSince >= 500) {
      if (!page.fps.hidden) page.fps.textContent = Math.round((fpsFrames * 1000) / (now - fpsSince)) + ' FPS';
      fpsFrames = 0;
      fpsSince = now;
    }

    // first frame: drop the loader, fade in from black, then show the interface
    if (firstFrame) {
      firstFrame = false;
      requestAnimationFrame(() => {
        page.loader.classList.add('gone');
        page.fade.classList.add('out');
        uiTimer = setTimeout(() => {
          page.ui.classList.add('on');
          toast(IS_TOUCH ? 'Drag to look · slide two fingers to walk' : 'Click things: the computer, the cat, the window…');
        }, 700);
      });
    }
  }
  frameId = requestAnimationFrame(frame);

  // coming back with the browser's Back button after leaving through a door
  listen(window, 'pageshow', e => { if (e.persisted) page.fade.classList.remove('leaving'); });

  // ---- clean-up: stop everything and free graphics memory
  function dispose() {
    cancelAnimationFrame(frameId);
    clearTimeout(uiTimer);
    clearTimeout(toastTimer);
    listeners.abort();
    timer.dispose?.();
    scene.traverse(object => {
      object.geometry?.dispose();
      for (const material of [].concat(object.material || [])) {
        for (const value of Object.values(material)) if (value?.isTexture) value.dispose();
        material.dispose();
      }
    });
    Object.values(textures).forEach(texture => texture.dispose());
    post.composer.dispose();
    renderer.dispose();
    renderer.domElement.remove();
    sound.dispose();
  }
  return { dispose };
}


// ---- go: let the loading dot paint first, then build the room
// (window.room.dispose() stops it and frees its memory)
if (THREE) {
  requestAnimationFrame(() => setTimeout(async () => {
    try {
      window.room = await startRoom();
    } catch (error) {
      showLoadError(error);
    }
  }, 30));
}
</script>
</body>
</html>
