      if (playing && drop && groove.dropAge < 4 && beat < 0.12) strobeK = 1;
      if (playing && build && groove.build > 0.5) { const rate = groove.build > 0.85 ? 8 : groove.build > 0.7 ? 4 : 2; if ((beats * rate) % 1 < 0.25) strobeK = (groove.build - 0.5) * 1.6; }
      strobeK = Math.max(strobeK, flash);
      STROBES.forEach((p, k) => glowCol.set([strobeK * 2.4, strobeK * 2.4, strobeK * 2.6], (H + 2 + k) * 3));
      strobe.intensity = strobeK * 140;
      // ---- the key light on the DJ and the wash over the floor
      rig.stageColor.copy(colA).lerp(colB, 0.5 + 0.5 * Math.sin(beats * 0.25));
      key.color.copy(rig.stageColor);
      key.intensity = 6 + playing * (6 + level * 10);
      wash.color.copy(colB).lerp(colA, 0.5 + 0.5 * Math.sin(t * 0.3));
      wash.intensity = mix(16, brk ? 12 : 22 + energy * 45 * (0.6 + 0.4 * Math.pow(1 - beat, 2)), playing);
      rig.stageLight = 0.35 + playing * energy * 0.9 + strobeK;
      beamMesh.instanceMatrix.needsUpdate = laserMesh.instanceMatrix.needsUpdate = spotMesh.instanceMatrix.needsUpdate = true;
      beamMesh.instanceColor.needsUpdate = laserMesh.instanceColor.needsUpdate = spotMesh.instanceColor.needsUpdate = true;
      glowGeometry.attributes.position.needsUpdate = glowGeometry.attributes.aColor.needsUpdate = glowGeometry.attributes.aSize.needsUpdate = true;
    },
  };
  for (let i = 0; i < H; i++) beamMesh.setColorAt(i, col.set(0, 0, 0));
  for (let i = 0; i < L; i++) laserMesh.setColorAt(i, col.set(0, 0, 0));
  for (let i = 0; i < SN; i++) spotMesh.setColorAt(i, col.set(0, 0, 0));
  rig.update(0, 0, 0, { section: 'groove', energy: 0, beats: 0, build: 0, dropAge: 99 }, new THREE.Color('#ff3fa8'), new THREE.Color('#7b3fd8'), 0, 0);
  return rig;
}


// soft additive glow sprites (lens flares, bulbs, the town's lights)
function glowMaterial(shared, fade = true) {
  return new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, fog: false,
    uniforms: { uScale: shared.uScale, ...shared.roomWave },
    vertexShader: /* glsl */`
      attribute vec3 aColor;
      attribute float aSize;
      uniform float uScale;
      varying vec3 vColor, vWorld;
      void main() {
        vec4 w = modelMatrix * vec4(position, 1.0);
        vWorld = w.xyz;
        vec4 mv = viewMatrix * w;
        vColor = aColor;
        gl_PointSize = clamp(aSize * uScale / max(-mv.z, 0.1), 0.0, 220.0);
        gl_Position = projectionMatrix * mv;
      }`,
    fragmentShader: WAVE_GLSL + /* glsl */`
      varying vec3 vColor, vWorld;
      void main() {
        if (waveCode(vWorld)) discard;
        float r = length(gl_PointCoord - 0.5) * 2.0;
        float a = exp(-r * r * 4.0) * (1.0 - smoothstep(0.8, 1.0, r));
        gl_FragColor = vec4(vColor, a);
      }`,
  });
}

// ---- haze: a low drift from the hazer at the back of the stage, and CO2 blasts on the drop
function buildHaze(scene, shared) {
  const N = IS_PHONE ? 140 : 260;
  const positions = new Float32Array(N * 3), ages = new Float32Array(N).fill(-1), sizes = new Float32Array(N);
  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geometry.setAttribute('aAge', new THREE.BufferAttribute(ages, 1));
  geometry.setAttribute('aSize', new THREE.BufferAttribute(sizes, 1));
  const material = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, fog: false,
    uniforms: { uScale: shared.uScale, uColor: { value: new THREE.Color('#ff6ad0') }, uLight: { value: 0.5 }, ...shared.roomWave },
    vertexShader: /* glsl */`
      attribute float aAge, aSize;
      uniform float uScale;
      varying float vAlpha;
      varying vec3 vWorld;
      void main() {
        vec4 w = modelMatrix * vec4(position, 1.0);
        vWorld = w.xyz;
        vec4 mv = viewMatrix * w;
        // fade out puffs right in front of you, so the screen never fills with smoke
        float nearFade = smoothstep(1.2, 3.5, -mv.z);
        vAlpha = aAge < 0.0 ? 0.0 : smoothstep(0.0, 0.08, aAge) * (1.0 - smoothstep(0.45, 1.0, aAge)) * nearFade;
        gl_PointSize = aAge < 0.0 ? 0.0 : clamp(aSize * (0.5 + aAge * 1.8) * uScale / max(-mv.z, 0.1), 0.0, 260.0);
        gl_Position = projectionMatrix * mv;
      }`,
    fragmentShader: WAVE_GLSL + /* glsl */`
      uniform vec3 uColor;
      uniform float uLight;
      varying float vAlpha;
      varying vec3 vWorld;
      void main() {
        if (waveCode(vWorld)) discard;
        float r = length(gl_PointCoord - 0.5);
        vec3 col = mix(vec3(0.7, 0.68, 0.8), uColor, 0.6) * (0.2 + uLight * 0.55);
        gl_FragColor = vec4(col, (1.0 - smoothstep(0.05, 0.5, r)) * vAlpha * 0.26);
      }`,
  });
  const points = new THREE.Points(geometry, material);
  points.frustumCulled = false;
  points.raycast = noRaycast;
  scene.add(points);
  const parts = Array.from({ length: N }, () => ({ p: new THREE.Vector3(), v: new THREE.Vector3(), age: -1, life: 1, drag: 1 }));
  let next = 0, clock = 0;
  const emit = (x, y, z, vx, vy, vz, size, life, drag) => {
    const q = parts[next]; sizes[next] = size; next = (next + 1) % N;
    q.p.set(x, y, z); q.v.set(vx, vy, vz); q.age = 0; q.life = life; q.drag = drag;
  };
  return {
    burst() {
      for (const x of [-4.4, 4.4]) for (let k = 0; k < (IS_PHONE ? 16 : 30); k++) {
        emit(x + (Math.random() - 0.5) * 0.2, STAGE.h + 0.1, -10.5, (Math.random() - 0.5) * 0.5, 3.2 + Math.random() * 2.2, 0.3 + Math.random() * 0.5, 0.28 + Math.random() * 0.18, 1.8 + Math.random() * 1.0, 1.8);
      }
    },
    update(dt, on, color, light) {
      material.uniforms.uColor.value.copy(color);
      material.uniforms.uLight.value = light;
      clock += dt * (0.4 + on * 0.6);
      while (clock > 0.22) {
        clock -= 0.22;
        emit(-2.8 + (Math.random() - 0.5) * 0.3, STAGE.h + 0.3, -13.2, (Math.random() - 0.3) * 0.5, 0.06 + Math.random() * 0.1, 0.5 + Math.random() * 0.4, 1.0 + Math.random() * 0.6, 9 + Math.random() * 5, 0.15);
      }
      for (let i = 0; i < N; i++) {
        const q = parts[i];
        if (q.age < 0) continue;
        q.age += dt / q.life;
        if (q.age >= 1) { q.age = -1; ages[i] = -1; continue; }
        q.v.multiplyScalar(Math.exp(-dt * q.drag));
        q.v.y += dt * 0.03;
        q.p.addScaledVector(q.v, dt);
        if (q.p.y > CLUB.h - 0.3) { q.p.y = CLUB.h - 0.3; q.v.y = 0; }
        positions[i * 3] = q.p.x; positions[i * 3 + 1] = q.p.y; positions[i * 3 + 2] = q.p.z;
        ages[i] = q.age;
      }
      geometry.attributes.position.needsUpdate = geometry.attributes.aAge.needsUpdate = geometry.attributes.aSize.needsUpdate = true;
    },
  };
}


// One part of an object (see the list at the top of ROOM).
function buildPart(part, textures, shared, animated) {
  const size = part.size || [];
  if (part.shape === 'light') {
    const light = new THREE.PointLight(part.color || '#ffffff', part.intensity ?? 3, part.distance ?? 0, 2);
    light.position.fromArray(part.offset || [0, 0, 0]);
    if (part.flicker) animated.push({ kind: 'flicker', object: light, base: light.intensity, amount: part.flicker });
    if (part.pulse) animated.push({ kind: 'pulse', object: light, base: light.intensity, amount: part.pulse });
    return light;
  }
  if (part.shape === 'string') return buildString(part, animated);
  if (part.shape === 'arm') return buildArm(part, textures, shared, animated);
  if (part.shape === 'marker') {
    const marker = new THREE.Object3D();
    marker.name = part.name || '';
    marker.position.fromArray(part.offset || [0, 0, 0]);
    return marker;
  }
  if (part.shape === 'neon') {
    const material = new THREE.MeshBasicMaterial({ map: textures.neon, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, color: '#ffffff', opacity: 0.62 * (part.brightness ?? 1) });
    material.userData.neon = true;
    material.userData.baseOpacity = material.opacity;
    const mesh = new THREE.Mesh(new THREE.PlaneGeometry(size[0], size[1]), material);
    mesh.position.fromArray(part.offset || [0, 0, 0]);
    mesh.userData.holoHide = true;
    return mesh;
  }
  if (part.shape === 'face') {
    // a painted face wrapped over the front of the head
    const geometry = new THREE.SphereGeometry(size[0], 40, 32, toRadians(40), toRadians(100), toRadians(50), toRadians(80));
    const [open, closed] = part.face === 'girl' ? [textures.girlFaceOpen, textures.girlFaceClosed] : [textures.faceOpen, textures.faceClosed];
    const material = new THREE.MeshBasicMaterial({ map: open, color: '#c4bad0', transparent: true, depthWrite: false, polygonOffset: true, polygonOffsetFactor: -2 });
    const mesh = new THREE.Mesh(geometry, material);
    mesh.position.fromArray(part.offset || [0, 0, 0]);
    if (part.scale) mesh.scale.fromArray(part.scale);
    mesh.userData.keepMaterial = true;
    mesh.userData.anim = 'blink';
    animated.push({ kind: 'blinkFace', object: mesh, period: part.period || 4, open, closed });
    return mesh;
  }
  if (part.shape === 'group') {
    const group = new THREE.Group();
    if (part.name) group.name = part.name;
    if (part.hotspot) group.userData.hotspot = part.hotspot;
    group.position.fromArray(part.offset || [0, 0, 0]);
    const [rx, ry, rz] = part.rotation || [0, 0, 0];
    group.rotation.set(toRadians(rx), toRadians(ry), toRadians(rz));
    if (part.scale) group.scale.fromArray(part.scale);
    for (const child of part.parts || []) group.add(buildPart(child, textures, shared, animated));
    if (part.anim) {
      const anim = typeof part.anim === 'string' ? { type: part.anim } : part.anim;
      group.userData.anim = anim.type;
      animated.push({ kind: anim.type, object: group, ...anim, base: { position: group.position.clone(), rotation: group.rotation.clone() } });
    }
    return group;
  }

  const deg = v => toRadians(v);
  let geometry, material;
  if (part.shape === 'screen') {
    geometry = new THREE.PlaneGeometry(size[0], size[1]);
    material = new THREE.MeshBasicMaterial({ map: textures.screen, color: '#ffffff' });
  } else if (part.basic) {
    geometry = new THREE.PlaneGeometry(size[0], size[1]);
    material = new THREE.MeshBasicMaterial({ map: textures[part.texture], color: '#ffffff', alphaTest: part.alphaTest || 0 });
  } else {
    if (part.shape === 'box') geometry = new THREE.BoxGeometry(size[0], size[1], size[2]);
    else if (part.shape === 'cylinder') geometry = new THREE.CylinderGeometry(size[0], size[1], size[2], part.segments ?? 24, 1, !!part.open, deg(size[3] ?? 0), deg(size[4] ?? 360));
    else if (part.shape === 'sphere') geometry = new THREE.SphereGeometry(size[0], 28, 18, deg(size[1] ?? 0), deg(size[2] ?? 360), deg(size[3] ?? 0), deg(size[4] ?? 180));
    else if (part.shape === 'disc') geometry = new THREE.CircleGeometry(size[0], 48).rotateX(-Math.PI / 2);
    else if (part.shape === 'cone') geometry = new THREE.ConeGeometry(size[0], size[1], part.segments ?? 20);
    else if (part.shape === 'torus') geometry = new THREE.TorusGeometry(size[0], size[1], 10, 32, deg(size[2] ?? 360));
    else if (part.shape === 'plane') geometry = new THREE.PlaneGeometry(size[0], size[1]);
    else if (part.shape === 'limb') geometry = new THREE.CapsuleGeometry(part.radius, Math.max(0.001, new THREE.Vector3().fromArray(part.from).distanceTo(new THREE.Vector3().fromArray(part.to))), 6, 14);
    else if (part.shape === 'cable') geometry = new THREE.TubeGeometry(new THREE.CatmullRomCurve3(part.points.map(p => new THREE.Vector3().fromArray(p))), part.points.length * 10, part.radius, 6, false);
    else throw new Error(`Unknown part shape: ${part.shape}`);
    if (part.segments && part.segments <= 6) { geometry = geometry.toNonIndexed(); geometry.computeVertexNormals(); }   // faceted: flat shading
    if (part.uv) { const uv = geometry.attributes.uv, [u0, v0, u1, v1] = part.uv; for (let i = 0; i < uv.count; i++) uv.setXY(i, u0 + uv.getX(i) * (u1 - u0), v0 + uv.getY(i) * (v1 - v0)); }
    const doubleSided = part.open || part.shape === 'cloth' || part.alphaTest || (part.shape === 'sphere' && size[4] != null);
    material = new THREE.MeshStandardMaterial({
      color: part.texture ? '#ffffff' : (part.color || '#888888'),
      map: part.texture ? textures[part.texture] : null,
      roughness: part.roughness ?? 0.85,
      metalness: part.metalness ?? 0,
      emissive: part.emissive || '#000000',
      emissiveIntensity: part.emissiveIntensity ?? 1,
      transparent: !!part.transparent,
      opacity: part.opacity ?? 1,
      side: doubleSided ? THREE.DoubleSide : THREE.FrontSide,
      alphaTest: part.alphaTest || 0,
    });
    if (part.glowMap) { material.emissive.set('#ffffff'); material.emissiveMap = material.map; material.emissiveIntensity = part.glowMap; }
  }
  const mesh = new THREE.Mesh(geometry, material);
  if (part.shape === 'limb') {
    const a = new THREE.Vector3().fromArray(part.from), b = new THREE.Vector3().fromArray(part.to);
    mesh.position.copy(a).lerp(b, 0.5);
    mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), b.clone().sub(a).normalize());
  } else {
    mesh.position.fromArray(part.offset || [0, 0, 0]);
    const [rx, ry, rz] = part.rotation || [0, 0, 0];
    mesh.rotation.set(toRadians(rx), toRadians(ry), toRadians(rz));
  }
  if (part.scale) mesh.scale.fromArray(part.scale);
  if (part.name) mesh.name = part.name;
  if (part.keep) mesh.userData.keepMaterial = true;
  if (part.hidden) mesh.visible = false;
  if (part.spin) animated.push({ kind: 'spin', object: mesh, speed: part.spin });
  if (part.pulse) animated.push({ kind: 'pulse', object: mesh, base: material.emissiveIntensity, amount: part.pulse });
  return mesh;
}

// A strand of little bulbs hanging between two points, gently twinkling.
function buildString(part, animated) {
  const group = new THREE.Group();
  const from = new THREE.Vector3().fromArray(part.from), to = new THREE.Vector3().fromArray(part.to);
  const count = part.count || 20, points = [];
  for (let i = 0; i <= 40; i++) {
    const t = i / 40;
    points.push(from.clone().lerp(to, t).add(new THREE.Vector3(0, -part.sag * 4 * t * (1 - t), 0)));
  }
  group.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(points), new THREE.LineBasicMaterial({ color: '#1a1714' })));

  const bulbs = new THREE.InstancedMesh(new THREE.SphereGeometry(0.028, 10, 8), new THREE.MeshBasicMaterial({ color: '#ffffff' }), count);
  const matrix = new THREE.Matrix4(), color = new THREE.Color(part.color || '#ffcf8a');
  for (let i = 0; i < count; i++) {
    const t = (i + 0.5) / count;
    const p = from.clone().lerp(to, t).add(new THREE.Vector3(0, -part.sag * 4 * t * (1 - t) - 0.03, 0));
    bulbs.setMatrixAt(i, matrix.makeTranslation(p.x, p.y, p.z));
    bulbs.setColorAt(i, color);
  }
  group.add(bulbs);
  // one soft light in the middle so the wall picks up the glow
  if (part.glow !== 0) {
    const glow = new THREE.PointLight(part.color || '#ffcf8a', part.glow ?? 5, 8, 2);
    glow.position.copy(from.clone().lerp(to, 0.5)).add(new THREE.Vector3(0, -part.sag - 0.1, 0.3));
    group.add(glow);
  }
  animated.push({ kind: 'twinkle', object: bulbs, color, count });
  return group;
}

// Every object in ROOM.objects: a group of parts, maybe a hotspot, maybe solid.
function buildObjects(scene, textures, shared, animated, colliders, raycastTargets, hotspots) {
  const built = [];
  for (const spec of ROOM.objects) {
    const group = new THREE.Group();
    group.name = spec.id || '';
    group.position.fromArray(spec.position || [0, 0, 0]);
    group.rotation.y = toRadians(spec.rotationY);
    for (const part of spec.parts || []) group.add(buildPart(part, textures, shared, animated));
    if (spec.instanced) group.add(buildInstanced(spec, textures, shared));
    if (spec.rods) group.add(buildRods(spec.rods));
    if (spec.style === 'toon') toonify(group);
    scene.add(group);
    registerObject(group, spec, colliders, raycastTargets, hotspots);
    built.push({ group, spec });
  }
  return built;
}

// Shared by built objects and loaded models: collisions, clickability.
function registerObject(group, spec, colliders, raycastTargets, hotspots) {
  if (spec.outside) group.userData.city = true;     // turns to code in Mix mode, like the city
  group.updateMatrixWorld(true);
  group.traverse(child => { if (child.isMesh && !child.isInstancedMesh) raycastTargets.push(child); });
  if (spec.hotspot) {
    group.userData.hotspot = spec.hotspot;
    hotspots.push(group);
  }
  if (spec.colliders) {
    // [x, z, width, depth, level]: level 0 downstairs, 1 upstairs (default: whichever floor the object stands on)
    for (const [cx, cz, w, d, level = levelOf(spec.position?.[1] || 0)] of spec.colliders) colliders.push({ minX: cx - w / 2, maxX: cx + w / 2, minZ: cz - d / 2, maxZ: cz + d / 2, level });
  } else if (spec.collide !== false) {
    const box = new THREE.Box3().setFromObject(group);
    if (box.min.y < SETTINGS.eyeHeight) colliders.push({ minX: box.min.x, maxX: box.max.x, minZ: box.min.z, maxZ: box.max.z });
  }
}

// GLB models listed in ROOM.models (the loader is only downloaded if there are any).
async function loadModels(scene, manager, colliders, raycastTargets, hotspots) {
  if (!ROOM.models?.length) return;
  const { GLTFLoader } = await import('three/addons/loaders/GLTFLoader.js');
  const loader = new GLTFLoader(manager);
  await Promise.all(ROOM.models.map(async spec => {
    try {
      const gltf = await loader.loadAsync(spec.url);
      const model = gltf.scene;
      model.position.fromArray(spec.position || [0, 0, 0]);
      model.rotation.y = toRadians(spec.rotationY);
      model.scale.setScalar(spec.scale ?? 1);
      scene.add(model);
      registerObject(model, spec, colliders, raycastTargets, hotspots);
    } catch (error) {
      console.warn(`Room: couldn't load model ${spec.url}`, error);
    }
  }));
}

// Floating dust in the room, drifting slowly (frozen while paused).
function buildDust(scene, rand, shared) {
  const { width, depth, height } = ROOM.size, count = SETTINGS.dustCount;
  const positions = new Float32Array(count * 3), seeds = new Float32Array(count);
  for (let i = 0; i < count; i++) {
    positions.set([(rand() - 0.5) * width, rand() * height, (rand() - 0.5) * depth], i * 3);
    seeds[i] = rand();
  }
  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geometry.setAttribute('aSeed', new THREE.BufferAttribute(seeds, 1));
  const dust = new THREE.Points(geometry, new THREE.ShaderMaterial({
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
    uniforms: { uTime: shared.uTime, uScale: shared.uScale, uRoom: { value: new THREE.Vector3(width, height, depth) } },
    vertexShader: /* glsl */`
      attribute float aSeed;
      uniform float uTime, uScale;
      uniform vec3 uRoom;
      varying float vAlpha;
      void main() {
        vec3 p = position + vec3(sin(uTime * 0.13 + aSeed * 20.0) * 0.4, uTime * (0.02 + aSeed * 0.04), cos(uTime * 0.11 + aSeed * 13.0) * 0.4);
        p.xz = mod(p.xz + uRoom.xz * 0.5, uRoom.xz) - uRoom.xz * 0.5;
        p.y = mod(p.y, uRoom.y);
        vec4 mv = modelViewMatrix * vec4(p, 1.0);
        float dist = -mv.z;
        vAlpha = (1.0 - smoothstep(1.5, 4.5, dist)) * smoothstep(0.3, 0.8, dist) * (0.3 + 0.7 * aSeed);
        gl_PointSize = clamp((0.004 + aSeed * 0.006) * uScale / max(dist, 0.01), 0.0, 4.0);
        gl_Position = projectionMatrix * mv;
      }`,
    fragmentShader: /* glsl */`
      varying float vAlpha;
      void main() {
        float r = length(gl_PointCoord - 0.5);
        gl_FragColor = vec4(vec3(1.0, 0.93, 0.82), (1.0 - smoothstep(0.0, 0.5, r)) * vAlpha * 0.28);
      }`,
  }));
  dust.frustumCulled = false;
  scene.add(dust);
  return dust;
}

function buildLights(scene) {
  for (const spec of ROOM.lights || []) {
    let light;
    if (spec.type === 'hemisphere') light = new THREE.HemisphereLight(spec.sky, spec.ground, spec.intensity);
    else if (spec.type === 'point') light = new THREE.PointLight(spec.color, spec.intensity, spec.distance ?? 0, 2);
    else if (spec.type === 'ambient') light = new THREE.AmbientLight(spec.color, spec.intensity);
    else if (spec.type === 'directional') light = new THREE.DirectionalLight(spec.color, spec.intensity);
    else continue;
    if (spec.position) light.position.fromArray(spec.position);
    scene.add(light);
  }
}


/* ---------------------------------------------------------------------
   7. Post-processing: film grain, a soft vignette and a faint split-RGB
   that grows a little while you run. (Same finish as The Garden.)
   --------------------------------------------------------------------- */
function showGraphicsNote(title, detail, reload = true) {
  const note = document.createElement('div');
  note.setAttribute('role', 'alert');
  note.style.cssText = 'position:fixed;inset:0;z-index:50;display:grid;place-content:center;gap:10px;text-align:center;padding:24px;background:rgba(10,8,16,0.86);color:#f5efe2;font:16px/1.5 system-ui,sans-serif;' + (reload ? 'cursor:pointer;' : '');
  note.innerHTML = `<strong style="font-size:20px">${title}</strong><span style="opacity:0.75">${detail}</span>`;
  if (reload) note.addEventListener('click', () => location.reload());
  document.body.appendChild(note);
}

function buildPostProcessing(renderer, scene, camera, pixelRatio) {
  const composer = new EffectComposer(renderer);
  composer.setPixelRatio(pixelRatio);
  composer.setSize(innerWidth, innerHeight);
  composer.addPass(new RenderPass(scene, camera));
  const finish = new ShaderPass({
    uniforms: { tDiffuse: { value: null }, uTime: { value: 0 }, uSpeed: { value: 0 }, uHolo: { value: 0 }, uGlitch: { value: 0 } },
    vertexShader: /* glsl */`
      varying vec2 vUv;
      void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
    fragmentShader: /* glsl */`
      uniform sampler2D tDiffuse;
      uniform float uTime, uSpeed, uHolo, uGlitch;
      varying vec2 vUv;
      float random(vec2 c) { return fract(sin(dot(c, vec2(12.9898, 78.233))) * 43758.5453); }
      void main() {
        vec2 uv = vUv;
        // glitch while switching views: torn horizontal bands
        float band = floor(vUv.y * 26.0), tick = floor(uTime * 30.0);
        uv.x += (random(vec2(band, tick)) - 0.5) * 0.08 * uGlitch * step(0.55, random(vec2(tick, band)));
        vec2 fromCentre = uv - 0.5;
        float amount = (0.0008 + uSpeed * 0.003 + uHolo * 0.0025 + uGlitch * 0.012) * (0.4 + length(fromCentre) * 1.8);
        vec2 offset = fromCentre * amount;
        vec3 color = vec3(texture2D(tDiffuse, uv + offset).r, texture2D(tDiffuse, uv).g, texture2D(tDiffuse, uv - offset).b);
        color += uHolo * vec3(0.35, 0.45, 1.0) * (sin(vUv.y * 900.0) * 0.5 + 0.5) * 0.025;
        color += (random(vUv * vec2(1717.0, 913.0) + fract(uTime * 7.0)) - 0.5) * 0.025;
        float d = length(fromCentre * vec2(1.0, 0.82));
        color *= 1.0 - smoothstep(0.38 - uSpeed * 0.08, 1.0 - uSpeed * 0.15, d) * 0.45;
        gl_FragColor = vec4(max(color, 0.0), 1.0);
      }`,
  });
  composer.addPass(finish);
  composer.addPass(new OutputPass());
  return { composer, uniforms: finish.uniforms };
}


/* ---------------------------------------------------------------------
   8. The room: input, walking, hotspots, frame loop, clean-up.
   Returns { dispose }.
   --------------------------------------------------------------------- */
async function startRoom() {
  page.roomName.textContent = ROOM.name;
  document.title = ROOM.name;

  let renderer;
  try {
    renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });   // the post pass replaces MSAA; saves a lot of GPU
  } catch (error) {
    showGraphicsNote('3D graphics are turned off in this browser right now.',
      'If Chrome blocked them after a crash, fully quit and reopen Chrome, then open this page again.', false);
    document.body.classList.add('no-webgl');
    page.loader.classList.add('gone');
    page.fade.classList.add('out');
    page.ui.classList.add('on');
    return { dispose() {} };
  }
  let pixelRatio = Math.min(devicePixelRatio || 1, SETTINGS.maxPixelRatio);
  renderer.setPixelRatio(pixelRatio);
  renderer.setSize(innerWidth, innerHeight);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.3;
  page.view.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(ROOM.fog?.color || '#000000');
  if (ROOM.fog) scene.fog = new THREE.FogExp2(ROOM.fog.color, ROOM.fog.density);
  const camera = new THREE.PerspectiveCamera(SETTINGS.fov, innerWidth / innerHeight, 0.05, 1500);
  camera.rotation.order = 'YXZ';   // turn left/right first, then look up/down

  // ---- build
  const rand = seededRandom(SETTINGS.layoutSeed);
  const shared = { uTime: { value: 0 }, uScale: { value: 1 }, uFlash: { value: 0 }, roomWave: makeWave(), cityWave: makeWave() };   // scene time (stops when paused), pixel scale
  const animated = [], colliders = [], raycastTargets = [], hotspots = [];
  const textures = makeTextures(rand);
  if (ROOM.posterImages) await loadPosterImages(textures, ROOM.posterImages);
  textures.screen = makeScreenTexture(textures);
  const { mergeGeometries } = await import('three/addons/utils/BufferGeometryUtils.js');
  shared.mergeGeometries = mergeGeometries;
  buildLights(scene);
  const built = buildObjects(scene, textures, shared, animated, colliders, raycastTargets, hotspots);
  const dustMotes = buildDust(scene, rand, shared);
  dustMotes.visible = false;            // no floating specks in the lofi view
  mergeStatic(scene, built, raycastTargets, mergeGeometries);
  for (const { group, spec } of built) if (spec.hotspot || spec.style) mergeLocal(group, raycastTargets, mergeGeometries);
  const crowdPeople = buildCrowd(scene, shared, mergeGeometries);
  const rig = buildClubLights(scene, shared);
  const haze = buildHaze(scene, shared);
  const mirrorBall = scene.getObjectByName('mirrorBall');
  const post = buildPostProcessing(renderer, scene, camera, pixelRatio);
  sound.prepareMusic();
  playlist.addShipped(ROOM.playlist);

  // models: show progress on the loading screen while they download
  const manager = new THREE.LoadingManager();
  manager.onProgress = (url, loaded, total) => {
    page.loaderNote.textContent = `Loading ${loaded} / ${total}`;
    page.loaderNote.hidden = false;
  };
  await loadModels(scene, manager, colliders, raycastTargets, hotspots);
  clearTimeout(slowTimer);
  page.loaderNote.hidden = true;

  // ---- listeners all go through `listen`, so dispose() removes them together
  const listeners = new AbortController();
  const listen = (target, type, handler, options = {}) =>
    target.addEventListener(type, handler, { ...options, signal: listeners.signal });

  function resize() {
    const w = innerWidth, h = innerHeight;
    camera.aspect = w / h;
    camera.fov = w < h ? 80 : SETTINGS.fov;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
    post.composer.setSize(w, h);
    shared.uScale.value = (h * pixelRatio) / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)));
  }
  listen(window, 'resize', resize);
  resize();

  // If frames run slow, render at a lower resolution (down to 0.6x) instead of pushing the graphics card
  // until the browser resets it.
  let slowTime = 0, fastTime = 0;
  function watchFrameTime(frameMs) {
    if (frameMs > 50) { slowTime += frameMs; fastTime = 0; } else { fastTime += frameMs; slowTime = Math.max(0, slowTime - frameMs * 0.5); }
    if (slowTime > 1500 && pixelRatio > 0.6) {
      pixelRatio = Math.max(0.6, +(pixelRatio - 0.2).toFixed(2));
      renderer.setPixelRatio(pixelRatio); post.composer.setPixelRatio(pixelRatio); resize();
      slowTime = 0;
    } else if (fastTime > 8000 && pixelRatio < Math.min(devicePixelRatio || 1, SETTINGS.maxPixelRatio) - 0.01) {
      pixelRatio = Math.min(Math.min(devicePixelRatio || 1, SETTINGS.maxPixelRatio), +(pixelRatio + 0.1).toFixed(2));
      renderer.setPixelRatio(pixelRatio); post.composer.setPixelRatio(pixelRatio); resize();
      fastTime = 0;
    }
  }

  // If the graphics card resets anyway, stop drawing and offer a reload rather than throwing errors.
  listen(renderer.domElement, 'webglcontextlost', e => {
    e.preventDefault();
    cancelAnimationFrame(frameId);
    showGraphicsNote('The graphics card took a break.', 'Click to reload the club');
  });
  listen(renderer.domElement, 'webglcontextrestored', () => location.reload());

  // ---- state
  const spawn = ROOM.spawn || { x: 0, z: 0, facing: 0 };
  const state = {
    time: 0,                 // scene time: stops while paused
    paused: false,
    recordOn: false,
    flash: 0,                // the white flash when the beat drops, fading out
    talkLine: 0,
    mode: 'lofi',            // lofi, mix (code city) or code
    glitch: 0,
    show: false, showLevel: 0, cheer: 0, chant: 0, chantAt: 7, chantFrom: null, chantLen: 0, bassSip: 0,
  };
  const player = {
    position: new THREE.Vector3(spawn.x, 0, spawn.z),
    velocity: new THREE.Vector3(),
    bob: 0,
    floor: floorAt(spawn.x, spawn.z),
    wheel: 0,                // forward push from the mouse wheel, fades out
  };
  const look = {
    yaw: toRadians(spawn.facing), pitch: 0,
    yawTarget: toRadians(spawn.facing), pitchTarget: 0,
    yawSpeed: 0, pitchSpeed: 0,
    drag: null, lastMove: 0, lastTap: 0,
  };
  const keys = new Set();
  const stick = { x: 0, y: 0, id: null };
  const twoFinger = { on: false, startX: 0, startY: 0, x: 0, y: 0 };   // two-finger walking on touch screens
  const mouse = { ndc: new THREE.Vector2(), inside: false };
  const PITCH_LIMIT = 1.2;
  const clampPitch = v => Math.max(-PITCH_LIMIT, Math.min(PITCH_LIMIT, v));
  const toNdc = (x, y, out) => out.set((x / innerWidth) * 2 - 1, -(y / innerHeight) * 2 + 1);

  // ---- messages
  let toastTimer = 0;
  function toast(text) {
    page.toast.textContent = text;
    page.toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => page.toast.classList.remove('show'), 2200);
  }
  const updateSoundButton = () => page.sound.setAttribute('aria-pressed', String(sound.on));

  // ---- what hotspots do. Add your own here and use them in ROOM: hotspot: { action: 'name' }
  const ACTIONS = {
    record() {
      state.recordOn = !state.recordOn;
      sound.setMusic(state.recordOn);
      updateSoundButton();
      updatePlayer();
      if (state.recordOn && state.paused) toast('Paused: press play to hear it');
      else toast(state.recordOn ? `♪ ${playlist.current.title} · here we go` : 'The set’s on hold');
    },
    talk(hotspot, group) {
      const lines = ROOM.talk || ['hey! you made it', 'this next one’s my favourite. wait for the drop'];
      toast(lines[state.talkLine++ % lines.length]);
      group.traverse(o => { if (o.userData.anim === 'nod') o.userData.lookUntil = state.time + 4; });
    },
    door(hotspot) {
      const href = (hotspot.href || '').trim();
      if (!href) return toast('The way out isn’t connected yet. Stay for the drop');
      let url;
      try { url = new URL(href, location.href); } catch { return toast('This door’s link isn’t a valid address'); }
      if (url.origin === location.origin) {
        // another room on the same site: walk straight through
        page.fade.classList.add('leaving');
        setTimeout(() => { location.href = url.href; }, 650);
      } else {
        // another site: a real link to click (pages in the viewer can't send you away by themselves)
        page.doorLink.href = url.href;
        page.doorTitle.textContent = hotspot.label && hotspot.label !== 'Door' ? hotspot.label : 'This door leads to';
        page.doorWhere.textContent = url.hostname.replace(/^www\./, '');
        page.doorCard.hidden = false;
        page.doorLink.focus();
      }
    },
    chime() {
      if (!sound.on) { sound.toggle(); updateSoundButton(); }
      sound.chime();
    },
    say(hotspot) { say(hotspot, hotspot.lines || []); },
    djTalk(hotspot, group) {
      say(hotspot, ROOM.talk || ['hey! you made it. grab a drink', 'shh, i’m mixing in the next one', 'wait for the drop. trust me', 'same hoodie as always. it’s lucky', 'the cat’s at home. she hates the bass']);
      group.traverse(o => { if (o.userData.anim === 'nod') o.userData.lookUntil = state.time + 4; });
    },
    barTalk(hotspot, group) {
      say(hotspot, ['what can i get you?', 'the DJ drinks water. all night. respect', 'tip jar’s by the lime wedges', 'no, the mirror ball isn’t for sale']);
      group.traverse(o => { if (o.userData.anim === 'nod') o.userData.lookUntil = state.time + 4; });
    },
    bouncerTalk(hotspot, group) {
      say(hotspot, ['you’re good. go on in', 'no flash on the dance floor', 'she plays till close. pace yourself', '…', 'nice shoes']);
      group.traverse(o => { if (o.userData.anim === 'nod') o.userData.lookUntil = state.time + 4; });
    },
  };
  function activate(group) {
    const hotspot = group.userData.hotspot;
    const action = ACTIONS[hotspot.action];
    if (action) action(hotspot, group);
    else console.warn(`Room: no action called "${hotspot.action}"`);
  }

  // ---- finding the hotspot under the cursor / screen centre / a tap
  const raycaster = new THREE.Raycaster();
  raycaster.far = SETTINGS.reach + 0.5;
  function hotspotAt(ndc) {
    raycaster.setFromCamera(ndc, camera);
    const hit = raycaster.intersectObjects(raycastTargets, false)[0];
    if (!hit || hit.distance > SETTINGS.reach) return null;
    for (let o = hit.object; o; o = o.parent) if (o.userData.hotspot) return o.userData.hotspot.onStage && !atStageFront() ? null : o;
    return null;
  }
  let focused = null;

  // ---- Lofi / Mix / Code: a scan wave sweeps out from you and turns the world over
  const glyphAtlas = makeGlyphAtlas();
  const holo = { room: makeHoloMaterial(shared, glyphAtlas, shared.roomWave), city: makeHoloMaterial(shared, glyphAtlas, shared.cityWave, 1.8) };
  const holoSky = makeHoloSky(shared, glyphAtlas, shared.cityWave);
  scene.add(holoSky);
  const lofiMaterials = makeCodeTwins(scene, { room: shared.roomWave, city: shared.cityWave }, holo);
  const waves = {
    room: { u: shared.roomWave, target: 0, running: false, t: 0 },
    city: { u: shared.cityWave, target: 0, running: false, t: 0 },
  };
  const MODES = {
    lofi: { room: 0, city: 0, label: 'Venue' },
    mix: { room: 0, city: 1, label: 'Mix: the crowd is dead and the sky is code' },
    code: { room: 1, city: 1, label: 'Code' },
  };
  const looks = { room: 'lofi', city: 'lofi' };
  crowdPeople.setAtlas(glyphAtlas);
  function showPart(part, look) {          // 'lofi', 'code', or 'both' while the wave is passing
    for (const m of lofiMaterials[part]) m.visible = look !== 'code';
    holo[part].visible = look !== 'lofi';
    if (part === 'city') holoSky.visible = look !== 'lofi';
    looks[part] = look;
    crowdPeople.setLook(looks.room, looks.city);       // the crowd: lofi, then bones (Mix), then code
  }
  function finishWave(part) {
    const w = waves[part];
    w.running = false;
    w.u.uWaveR.value = 1e6;
    showPart(part, w.target ? 'code' : 'lofi');
  }
  function updateWaves(dt) {
    for (const part of ['room', 'city']) {
      const w = waves[part];
      if (!w.running) continue;
      w.t += dt;
      w.u.uWaveR.value = 4 * w.t + 42 * w.t * w.t;     // slow around you, then racing out across the city
      if (w.u.uWaveR.value > 900) finishWave(part);
    }
  }
  function placeModeThumb() {
    const active = page.modes.querySelector('[aria-checked="true"]');
    if (!active) return;
    page.modesThumb.style.width = active.offsetWidth + 'px';
    page.modesThumb.style.transform = `translateX(${active.offsetLeft}px)`;
  }
  function setMode(mode, instant = false) {
    if (!MODES[mode]) return;
    state.mode = mode;
    for (const part of ['room', 'city']) {
      const w = waves[part], target = MODES[mode][part];
      if (w.target === target) continue;
      w.target = target;
      w.u.uWaveTarget.value = target;
      w.u.uWaveFrom.value.copy(camera.position);
      if (instant || REDUCED_MOTION) { finishWave(part); continue; }
      w.u.uWaveR.value = 0;
      w.t = 0;
      w.running = true;
      showPart(part, 'both');
    }
    dustMotes.visible = MODES[mode].room === 1;          // drifting bits of data in the code view
    if (!instant) state.glitch = 0.5;
    for (const b of page.modes.querySelectorAll('button')) b.setAttribute('aria-checked', String(b.dataset.mode === mode));
    placeModeThumb();
    if (!instant) { toast(MODES[mode].label); if (sound.on) sound.chime(); }
  }
  showPart('room', 'lofi');
  showPart('city', 'lofi');
  setMode('lofi', true);
  listen(page.modes, 'click', e => { const b = e.target.closest('button[data-mode]'); if (b) setMode(b.dataset.mode); });
  listen(window, 'resize', placeModeThumb);
  document.fonts?.ready.then(placeModeThumb);
  setTimeout(placeModeThumb, 900);
  const cycleMode = () => setMode({ lofi: 'mix', mix: 'code', code: 'lofi' }[state.mode]);

  // ---- music: the player under the title, the + button, dropping files on the room
  function updatePlayer() {
    const track = playlist.current;
    page.nowPlaying.textContent = track.artist && !track.builtin ? `${track.title} — ${track.artist}` : track.title;
    page.playSong.setAttribute('aria-pressed', String(state.recordOn));
    page.playSong.setAttribute('aria-label', state.recordOn ? 'Pause music' : 'Play music');
    page.removeSong.hidden = !track.mine;
  }
  function goToTrack(i, announce = true) {
    sound.selectTrack(i);
    updatePlayer();
    if (announce) toast(`♪ ${playlist.current.title}`);
  }
  sound.onEnded = () => goToTrack(playlist.index + 1, false);
  sound.onError = () => {
    if (playlist.current.builtin) return;
    toast(`Couldn’t play “${playlist.current.title}”`);
    setTimeout(() => goToTrack(playlist.index + 1, false), 400);
  };
  async function addSongs(files) {
    const added = await playlist.addFiles([...files]);
    if (!added.length) { toast('Those aren’t audio files'); return; }
    toast(added.length === 1 ? `Added “${playlist.tracks[added[0]].title}”` : `Added ${added.length} songs`);
    goToTrack(added[0], false);
    if (!state.recordOn) ACTIONS.record();
    else updatePlayer();
  }
  listen(page.playSong, 'click', () => ACTIONS.record());
  listen(page.prevSong, 'click', () => goToTrack(playlist.index - 1));
  listen(page.nextSong, 'click', () => goToTrack(playlist.index + 1));
  const volumeSlider = document.getElementById('musicVolume');
  volumeSlider.value = sound.volume;
  listen(volumeSlider, 'input', () => sound.setVolume(parseFloat(volumeSlider.value)));
  listen(volumeSlider, 'change', () => volumeSlider.blur());          // hand the keys back to walking
  for (const ev of ['pointerdown', 'keydown']) listen(volumeSlider, ev, e => e.stopPropagation());
  listen(page.songFile, 'change', () => { if (page.songFile.files.length) addSongs(page.songFile.files); page.songFile.value = ''; });
  listen(page.removeSong, 'click', async () => {
    const title = playlist.current.title;
    await playlist.remove(playlist.index);
    goToTrack(playlist.index, false);
    toast(`Removed “${title}”`);
  });
  listen(window, 'dragover', e => { if ([...(e.dataTransfer?.types || [])].includes('Files')) { e.preventDefault(); page.player.classList.add('drop'); } });
  listen(window, 'dragleave', e => { if (!e.relatedTarget) page.player.classList.remove('drop'); });
  listen(window, 'drop', e => {
    page.player.classList.remove('drop');
    if (!e.dataTransfer?.files.length) return;
    e.preventDefault();
    addSongs(e.dataTransfer.files);
  });
  playlist.loadSaved().then(added => { if (added.length) toast(`${added.length} of your songs are in the playlist`); updatePlayer(); });
  updatePlayer();

  // ---- the door card
  const closeDoorCard = () => { page.doorCard.hidden = true; };
  listen(page.doorStay, 'click', closeDoorCard);
  listen(page.doorLink, 'click', () => setTimeout(closeDoorCard, 200));
  listen(window, 'keydown', e => { if (e.key === 'Escape' && !page.doorCard.hidden) closeDoorCard(); });

  // ---- pause and sound buttons
  function setPaused(paused) {
    state.paused = paused;
    sound.setPaused(paused);
    page.pause.setAttribute('aria-pressed', String(paused));
    page.pause.setAttribute('aria-label', paused ? 'Play' : 'Pause');
    page.pausedChip.hidden = !paused;
    if (sound.on) crowd.setLevel(paused ? 0.06 : state.show ? 0.12 : 0.45, 0.5);
  }
  listen(page.pause, 'click', () => setPaused(!state.paused));
  listen(page.sound, 'click', () => { sound.toggle(); updateSoundButton(); });
  listen(page.crowdNoise, 'click', () => {
    sound.setCrowdNoise(!sound.crowdOn);
    page.crowdNoise.setAttribute('aria-pressed', String(sound.crowdOn));
    updateSoundButton();
    toast(sound.crowdOn ? 'Crowd noise on' : 'Crowd noise off');
  });
  listen(page.prompt, 'click', () => { if (focused) activate(focused); });

  // ---- keyboard: walk, run, pause, FPS
  listen(window, 'keydown', e => {
    if (e.key === 'p' || e.key === 'P') setPaused(!state.paused);
    else if (e.key === 'f' || e.key === 'F') toggleFps();
    else if (e.key === 'h' || e.key === 'H') cycleMode();
    else if (e.key === 'n' || e.key === 'N') goToTrack(playlist.index + 1);
    else if (e.key === 'b' || e.key === 'B') goToTrack(playlist.index - 1);
    else if (e.key === 'e' || e.key === 'E' || e.key === 'Enter') { if (focused && e.target === document.body) activate(focused); }
    else if (e.code === 'Space' && e.target === document.body) { e.preventDefault(); if (!e.repeat) spaceAction(); }
    keys.add(e.code);
    if (e.code.startsWith('Arrow') && e.target === document.body) e.preventDefault();
  });
  listen(window, 'keyup', e => keys.delete(e.code));
  listen(window, 'blur', () => keys.clear());

  // ---- mouse wheel: step forward / back
  listen(window, 'wheel', e => {
    e.preventDefault();
    const unit = e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? innerHeight : 1;
    player.wheel = Math.max(-4, Math.min(4, player.wheel - e.deltaY * unit * 0.01));
  }, { passive: false });

  // ---- drag to look (mouse or one finger); a quick flick glides; a click or tap uses things
  listen(window, 'pointermove', e => {
    if (e.pointerType === 'mouse') { toNdc(e.clientX, e.clientY, mouse.ndc); mouse.inside = true; }
  });
  listen(document.documentElement, 'pointerleave', () => { mouse.inside = false; });
  listen(window, 'pointerdown', e => {
    if (e.target.closest('a, button, .stick') || (e.pointerType === 'mouse' && e.button !== 0) || look.drag) return;
    look.drag = { id: e.pointerId, x: e.clientX, y: e.clientY, startX: e.clientX, startY: e.clientY, startTime: performance.now(), touch: e.pointerType === 'touch' };
    look.yawSpeed = look.pitchSpeed = 0;
    look.lastMove = performance.now();
    document.documentElement.classList.add('dragging');
    look.drag.yaw0 = look.yawTarget;                       // where the view was, in case this is just a click
    look.drag.pitch0 = look.pitchTarget;
  });
  listen(window, 'pointermove', e => {
    const drag = look.drag;
    if (!drag || e.pointerId !== drag.id) return;
    // a click wobbles a few pixels: don't turn until the pointer has clearly moved
    if (!drag.turning && Math.hypot(e.clientX - drag.startX, e.clientY - drag.startY) < 8) return;
    drag.turning = true;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    drag.x = e.clientX;
    drag.y = e.clientY;
    const perPixel = ((1.15 * Math.PI) / innerHeight) * (64 / 90) * 0.85 * (drag.touch ? 1.05 : 1);
    const now = performance.now(), seconds = Math.max(8, now - look.lastMove) / 1000;
    look.lastMove = now;
    look.yawTarget += dx * perPixel;
    look.pitchTarget = clampPitch(look.pitchTarget + dy * perPixel);
    look.yawSpeed += ((dx * perPixel) / seconds * 0.45 - look.yawSpeed) * 0.35;
    look.pitchSpeed += ((dy * perPixel) / seconds * 0.45 - look.pitchSpeed) * 0.35;
  });
  const endDrag = e => {
    const drag = look.drag;
    if (!drag || e.pointerId !== drag.id) return;
    if (performance.now() - look.lastMove > 60) look.yawSpeed = look.pitchSpeed = 0;
    // barely moved and quick: it was a click / tap, so use whatever is there
    const moved = Math.hypot(e.clientX - drag.startX, e.clientY - drag.startY);
    if (!drag.turning) {                                   // a click or tap never moves the view
      look.yawSpeed = look.pitchSpeed = 0;
      look.yawTarget = drag.yaw0;
      look.pitchTarget = drag.pitch0;
    }
    if (e.type === 'pointerup' && moved < 8 && performance.now() - drag.startTime < 400) {
      look.yawSpeed = look.pitchSpeed = 0;
      const target = hotspotAt(toNdc(e.clientX, e.clientY, new THREE.Vector2()));
      if (target) activate(target);
    }
    look.drag = null;
    document.documentElement.classList.remove('dragging');
  };
  listen(window, 'pointerup', endDrag);
  listen(window, 'pointercancel', endDrag);

  // ---- thumb joystick (touch screens)
  const STICK_RANGE = 46;
  const moveStick = e => {
    const box = page.stick.getBoundingClientRect();
    let x = e.clientX - (box.left + box.width / 2), y = e.clientY - (box.top + box.height / 2);
    const length = Math.hypot(x, y);
    if (length > STICK_RANGE) { x *= STICK_RANGE / length; y *= STICK_RANGE / length; }
    page.stickKnob.style.transform = `translate(${x}px, ${y}px)`;
    stick.x = x / STICK_RANGE;
    stick.y = y / STICK_RANGE;
  };
  listen(page.stick, 'pointerdown', e => {
    e.preventDefault();
    page.stick.setPointerCapture?.(e.pointerId);
    stick.id = e.pointerId;
    page.stick.classList.add('active');
    moveStick(e);
  });
  listen(page.stick, 'pointermove', e => { if (e.pointerId === stick.id) moveStick(e); });
  const releaseStick = e => {
    if (e.pointerId !== stick.id) return;
    stick.id = null;
    stick.x = stick.y = 0;
    page.stick.classList.remove('active');
    page.stickKnob.style.transform = '';
  };
  listen(page.stick, 'pointerup', releaseStick);
  listen(page.stick, 'pointercancel', releaseStick);
  listen(page.stick, 'lostpointercapture', releaseStick);

  // ---- two fingers on the scene: walk. Slide up to go forward, down to go back, sideways to step;
  //      the further from where they landed, the faster (like the joystick). Looking pauses meanwhile.
  const TWO_FINGER_RANGE = 70;   // pixels of slide for full speed
  const clampUnit = v => Math.max(-1, Math.min(1, v));
  const onSceneTouches = e => {
    const touches = Array.from(e.touches).filter(t => !(t.target.closest && t.target.closest('a, button, .stick')));
    if (touches.length >= 2) {
      const midX = (touches[0].clientX + touches[1].clientX) / 2, midY = (touches[0].clientY + touches[1].clientY) / 2;
      if (!twoFinger.on) {
        twoFinger.on = true;
        twoFinger.startX = midX;
        twoFinger.startY = midY;
        look.drag = null;                              // stop turning while walking with two fingers
        look.yawSpeed = look.pitchSpeed = 0;
        document.documentElement.classList.remove('dragging');
      }
      twoFinger.x = clampUnit((midX - twoFinger.startX) / TWO_FINGER_RANGE);
      twoFinger.y = clampUnit((midY - twoFinger.startY) / TWO_FINGER_RANGE);
    } else if (twoFinger.on) {
      twoFinger.on = false;
      twoFinger.x = twoFinger.y = 0;
    }
  };
  listen(window, 'touchstart', onSceneTouches, { passive: true });
  listen(window, 'touchmove', onSceneTouches, { passive: true });
  listen(window, 'touchend', onSceneTouches);
  listen(window, 'touchcancel', onSceneTouches);

  // ---- FPS readout: #fps in the address, or press F
  let fpsForced = false, fpsFrames = 0, fpsSince = performance.now();
  const updateFpsVisibility = () => { page.fps.hidden = !(fpsForced || location.hash === '#fps'); };
  function toggleFps() { fpsForced = !fpsForced; updateFpsVisibility(); }
  listen(window, 'hashchange', updateFpsVisibility);
  updateFpsVisibility();

  // ---- walking with collisions: walls, then furniture (pushed out the shortest way)
  // you can stand wherever a walkable area on your floor (shrunk by your radius) holds you; the stairs belong to both floors
  const onLevel = a => a.level === undefined || a.level === levelOf(player.floor);
  // and never off a ledge higher than a step down from the stage (0.8 m): the upstairs floors hold you
  const canStand = (x, z, r) => WALKABLE.some(a => onLevel(a) && x >= a.minX + r && x <= a.maxX - r && z >= a.minZ + r && z <= a.maxZ - r)
    && player.floor - floorAt(x, z, levelOf(player.floor)) < 0.8;
  function collide(position, prevX = position.x, prevZ = position.z) {
    const r = SETTINGS.playerRadius;
    if (!canStand(position.x, position.z, r)) {
      // slide along whatever is in the way: keep the part of the move that still fits
      if (canStand(position.x, prevZ, r)) position.z = prevZ;
      else if (canStand(prevX, position.z, r)) position.x = prevX;
      else { position.x = prevX; position.z = prevZ; }
      if (!canStand(position.x, position.z, r)) {           // still outside (e.g. on load): back onto the field
        const f = WALKABLE.find(a => a.level === levelOf(player.floor)) || WALKABLE[0];
        position.x = Math.max(f.minX + r, Math.min(f.maxX - r, position.x));
        position.z = Math.max(f.minZ + r, Math.min(f.maxZ - r, position.z));
      }
    }
    for (const box of colliders) {
      if (box.level !== undefined && box.level !== levelOf(player.floor)) continue;
      const minX = box.minX - r, maxX = box.maxX + r, minZ = box.minZ - r, maxZ = box.maxZ + r;
      if (position.x <= minX || position.x >= maxX || position.z <= minZ || position.z >= maxZ) continue;
      const left = position.x - minX, right = maxX - position.x, back = position.z - minZ, front = maxZ - position.z;
      const least = Math.min(left, right, back, front);
      if (least === left) position.x = minX;
      else if (least === right) position.x = maxX;
      else if (least === back) position.z = minZ;
      else position.z = maxZ;
    }
  }

  // ---- frame loop
  const timer = new THREE.Timer();
  timer.connect?.(document);
  const approach = (rate, dt) => 1 - Math.exp(-rate * dt);
  const forward = new THREE.Vector3(), right = new THREE.Vector3(), wish = new THREE.Vector3();
  const centre = new THREE.Vector2(0, 0);
  const twinkleColor = new THREE.Color();
  let firstFrame = true, uiTimer = 0, frameId = 0, screenClock = 0;
  const lookPoint = new THREE.Vector3();
  const armTarget = new THREE.Vector3(), armTmp = new THREE.Vector3(), armDir = new THREE.Vector3();


  // ---- the set: on while music really plays. Where we are in the track drives the DJ, the crowd, the lights.
  const groove = { beats: 0, bar: 0, section: 'groove', build: 0, energy: 0.5, dropAge: 99, chorus: false };
  let bandPlaying = false;
  const PALETTES = [['#ff3fa8', '#7b3fd8'], ['#36f1cd', '#7b3fd8'], ['#ff9f1c', '#ff3fa8'], ['#3a6bff', '#36f1cd']];
  const colA = new THREE.Color(PALETTES[0][0]), colB = new THREE.Color(PALETTES[0][1]), palA = new THREE.Color(), palB = new THREE.Color();
  const ENERGY = { groove: 0.55, groove2: 0.72, break: 0.15, build: 0.4, drop: 1 };
  const smooth = x => x * x * (3 - 2 * x);
  function musicPlaying() {
    if (!(state.recordOn && sound.on && !state.paused)) return false;
    return playlist.current.builtin ? !!sound.beatTimer : !sound.musicFile.paused;
  }
  function updateShow(dt) {
    if (state.paused) return;
    if (sound.on && sound.ctx && crowd.for !== sound.ctx && crowd.ready()) crowd.setLevel(state.show ? 0.1 : 0.4, 0.6);
    const on = musicPlaying();
    if (on !== state.show) {
      state.show = on;
      if (!on && sound.on) crowd.cheer(0.6, 3);              // a little applause, arms stay down
      if (sound.on) crowd.setLevel(on ? 0.1 : 0.4, 1.5);
    }
    state.showLevel += ((on ? 1 : 0) - state.showLevel) * approach(on ? 2.5 : 0.7, dt);
    const was = groove.section;
    const step = on && playlist.current.builtin ? sound.stepNow() : null;
    if (step != null) {
      const s = Math.floor(step) % 1024;
      groove.beats = step / 4;
      groove.bar = Math.floor(s / 16) % 64;
      groove.section = sound.section(s);
      groove.build = groove.section === 'build' ? ((groove.bar - 40) * 16 + (s % 16)) / 128 : 0;
    } else if (on) {
      // someone else's song: a steady 122, and the parts guessed from how loud it is
      groove.beats += dt * 122 / 60;
      groove.bar = Math.floor(groove.beats / 4) % 64;
      const target = sound.level > 0.62 ? 'drop' : sound.level < 0.18 ? 'break' : 'groove2';
      if (target !== groove.section && Math.floor(groove.beats) % 16 === 0) groove.section = target;
      groove.build = 0;
    }
    groove.chorus = groove.section === 'drop';
    groove.energy += (ENERGY[groove.section] + (groove.section === 'build' ? groove.build * 0.5 : 0) - groove.energy) * approach(1.5, dt);
    groove.dropAge = groove.section === 'drop' ? groove.dropAge + dt * 122 / 60 : 99;
    if (groove.section === 'drop' && was !== 'drop' && on) {
      groove.dropAge = 0;
      state.flash = 1;
      state.cheer = 1;
      haze.burst();
      if (sound.on) crowd.cheer(1.3, 5);
    }
    bandPlaying = on;
    state.cheer = Math.max(0, state.cheer - dt * 0.3);
    state.chant = 0;
    const pal = PALETTES[Math.floor(groove.beats / 32) % PALETTES.length];
    colA.lerp(palA.set(pal[0]), approach(2.5, dt));
    colB.lerp(palB.set(pal[1]), approach(2.5, dt));
  }

  // ---- talking: each hotspot cycles through its own lines
  const said = new WeakMap();
  function say(hotspot, lines) {
    if (!lines.length) return;
    const i = said.get(hotspot) || 0;
    toast(lines[i % lines.length]);
    said.set(hotspot, i + 1);
  }
  const lookAtYou = (o, out) => {
    o.parent.updateMatrixWorld();
    lookPoint.copy(camera.position);
    o.parent.worldToLocal(lookPoint);
    lookPoint.sub(o.position);
    out.yaw = Math.max(-1.15, Math.min(1.15, Math.atan2(lookPoint.x, lookPoint.z)));
    out.pitch = -Math.atan2(lookPoint.y, Math.hypot(lookPoint.x, lookPoint.z)) * 0.6;
    return out;
  };
  const headAim = { yaw: 0, pitch: 0 };

  function spaceAction() { ACTIONS.record(); }

  // everything the set moves each frame (nothing changes while paused)
  function updateClub(dt) {
    if (state.paused) return;
    const level = sound.level, show = state.showLevel;
    rig.update(state.time, show, level, groove, colA, colB, state.flash, mirrorBall ? mirrorBall.rotation.y : 0);
    haze.update(dt, show, rig.stageColor, rig.stageLight);
    const u = crowdPeople.uniforms;
    u.uBeat.value = groove.beats;
    u.uShow.value = show * (0.3 + 0.7 * groove.energy);
    u.uLevel.value = level * (0.4 + 0.6 * groove.energy);
    u.uChant.value = 0;
    u.uCheer.value += (Math.min(1, state.cheer * 1.5) - u.uCheer.value) * approach(3, dt);
    u.uPlayer.value.set(player.position.x, levelOf(player.floor) ? 0 : 1, player.position.z);
    u.uStageColor.value.copy(rig.stageColor);
    u.uStageLight.value = rig.stageLight;
  }

  // groups that move: breathing, nodding along, playing, blinking
  function animateGroup(item, dt) {
    const o = item.object, t = state.time, base = item.base;
    if (state.paused && item.kind !== 'nod') return;
    const music = bandPlaying;
    if (item.kind === 'breathe') {
      o.scale.y = 1 + Math.sin(t * 1.7) * 0.012;
      o.scale.x = o.scale.z = 1 + Math.sin(t * 1.7) * 0.006;
    } else if (item.kind === 'nod') {
      if (state.paused) return;
      let yaw = (item.yaw || 0) + Math.sin(t * 0.21) * 0.1 + Math.sin(t * 0.07) * 0.08;
      let pitch = base.rotation.x;
      if (o.userData.lookUntil > t) {
        o.parent.updateMatrixWorld();
        lookPoint.copy(camera.position);
        o.parent.worldToLocal(lookPoint);
        lookPoint.sub(o.position);
        yaw = Math.max(-1.15, Math.min(1.15, Math.atan2(lookPoint.x, lookPoint.z)));
        pitch = -Math.atan2(lookPoint.y, Math.hypot(lookPoint.x, lookPoint.z)) * 0.6;
      } else if (music) {
        pitch += Math.pow(Math.abs(Math.sin(groove.beats * Math.PI)), 2) * (item.bang ?? 0.08) * (0.7 + sound.level * 0.6);
      } else {
        if (item.look) yaw += Math.sin(t * 0.31 + 1) * item.look;          // looking out at the crowd
        if (item.sip) pitch -= state.bassSip * 0.45;                       // head back for a sip
      }
      const k = approach(4, dt);
      o.rotation.y += (yaw - o.rotation.y) * k;
      o.rotation.x += (pitch - o.rotation.x) * approach(music ? 14 : 4, dt);
    } else if (item.kind === 'tap') {
      const typing = Math.sin(t * 0.45 + item.phase * 0.2) > -0.3 ? 1 : 0;
      o.position.y = base.position.y + Math.max(0, Math.sin(t * 11 + item.phase)) * 0.011 * typing;
    } else if (item.kind === 'blink') {
      const period = item.period || 4;
      const phase = (t / period + (item.period || 0) * 0.37) % 1;
      const closed = o.userData.closedUntil > t;
      const target = closed ? 0.12 : phase < 0.035 ? 0.1 : 1;
      o.scale.y += (target - o.scale.y) * approach(closed ? 10 : 40, dt);
    } else if (item.kind === 'blinkFace') {
      const phase = (t / item.period + 0.31) % 1;
      const closed = phase < 0.03 || o.userData.closedUntil > t;
      o.material.map = closed ? item.closed : item.open;
    } else if (item.kind === 'bounce') {
      // a whole player bouncing on the beat
      o.position.y = base.position.y + (music ? (item.amount || 0.02) * Math.abs(Math.sin(groove.beats * Math.PI)) : 0);
    } else if (item.kind === 'djArm') {
      // her hands on the decks: riding the jog wheels and the mixer in time; every so often the right
      // hand holds the headphone to her ear to cue the next track; on the drop the left goes up in the air
      const right = item.arm.part.side < 0, beats = groove.beats;
      if (!music) {
        armTarget.fromArray(right ? DECKS.restR : DECKS.restL);
        armTarget.y += Math.sin(t * 0.8 + (right ? 0 : 2)) * 0.008;
      } else if (right && Math.floor(beats / 16) % 3 === 1 && beats % 16 < 6) {
        armTarget.fromArray(DECKS.cup);
      } else if (!right && groove.section === 'drop' && groove.dropAge < 8) {
        armTarget.fromArray(DECKS.up);
        armTarget.x += Math.sin(beats * Math.PI) * 0.05;
        armTarget.y += Math.abs(Math.sin(beats * Math.PI)) * 0.05;
      } else if (Math.floor(beats / 4 + (right ? 0 : 2)) % 3 === 0) {
        armTarget.fromArray(right ? DECKS.mixR : DECKS.mixL);
        armTarget.z += Math.sin(t * 2.2) * 0.04;
      } else {
        const a = t * (right ? 3.1 : 2.4);
        armTarget.fromArray(right ? DECKS.jogR : DECKS.jogL);
        armTarget.x += Math.cos(a) * 0.05; armTarget.z += Math.sin(a) * 0.05;
      }
      if (!item.cur) item.cur = armTarget.clone();
      item.cur.lerp(armTarget, approach(music ? 9 : 4, dt));
      solveArm(item.arm, item.cur, null);
    } else if (item.kind === 'look') {
      o.rotation.y = (item.yaw || 0) + Math.sin(t * 0.37) * 0.2 + Math.sin(t * 0.11) * 0.12;
      o.rotation.z = Math.sin(t * 0.29) * 0.08;
    }
  }

  const FRAME_MS = 1000 / 30;          // cap at 30 frames a second
  let lastFrameAt = -Infinity;
  let lastDrawAt = 0;
  function frame(now) {
    frameId = requestAnimationFrame(frame);
    if (now - lastFrameAt < FRAME_MS - 1.5) return;
    lastFrameAt = Math.max(lastFrameAt + FRAME_MS, now - FRAME_MS);
    if (lastDrawAt && !document.hidden) watchFrameTime(Math.min(now - lastDrawAt, 400));
    lastDrawAt = now;
    timer.update(now);
    const dt = Math.min(timer.getDelta(), 0.05);
    if (!state.paused) state.time += dt;
    shared.uTime.value = state.time;

    // look (with the glide after a flick)
    if (!look.drag && (look.yawSpeed || look.pitchSpeed)) {
      look.yawTarget += look.yawSpeed * dt;
      look.pitchTarget = clampPitch(look.pitchTarget + look.pitchSpeed * dt);
      const friction = Math.exp(-dt * 7.5);
      look.yawSpeed *= friction;
      look.pitchSpeed *= friction;
      if (Math.abs(look.yawSpeed) + Math.abs(look.pitchSpeed) < 0.01) look.yawSpeed = look.pitchSpeed = 0;
    }
    const follow = approach(look.drag ? 22 : 12, dt);
    look.yaw += (look.yawTarget - look.yaw) * follow;
    look.pitch += (look.pitchTarget - look.pitch) * follow;

    // walking direction from keys, joystick and wheel (relative to where you face)
    const ahead = (keys.has('KeyW') || keys.has('ArrowUp') ? 1 : 0) - (keys.has('KeyS') || keys.has('ArrowDown') ? 1 : 0) - stick.y - twoFinger.y;
    const across = (keys.has('KeyD') || keys.has('ArrowRight') ? 1 : 0) - (keys.has('KeyA') || keys.has('ArrowLeft') ? 1 : 0) + stick.x + twoFinger.x;
    const running = keys.has('ShiftLeft') || keys.has('ShiftRight') || Math.hypot(stick.x, stick.y) > 0.95 || Math.hypot(twoFinger.x, twoFinger.y) > 0.95;
    forward.set(-Math.sin(look.yaw), 0, -Math.cos(look.yaw));
    right.set(Math.cos(look.yaw), 0, -Math.sin(look.yaw));
    wish.set(0, 0, 0).addScaledVector(forward, ahead).addScaledVector(right, across);
    if (wish.lengthSq() > 1) wish.normalize();
    wish.multiplyScalar(running ? SETTINGS.runSpeed : SETTINGS.walkSpeed).addScaledVector(forward, player.wheel);
    player.wheel *= Math.exp(-dt * 5);
    player.velocity.lerp(wish, approach(10, dt));
    const prevX = player.position.x, prevZ = player.position.z;
    player.position.addScaledVector(player.velocity, dt);
    collide(player.position, prevX, prevZ);
    // your height glides to the floor under you (the stage, the steps, the riser), with no bob
    player.floor += (floorAt(player.position.x, player.position.z, levelOf(player.floor)) - player.floor) * approach(9, dt);

    // camera at eye height with a little head bob while walking
    const speed = player.velocity.length();
    player.bob += dt * speed * 5.5;
    const bob = 0;   // no head bob: walking is perfectly smooth
    camera.position.set(player.position.x, player.floor + SETTINGS.eyeHeight + bob, player.position.z);
    camera.rotation.set(look.pitch, look.yaw, 0);
    camera.updateMatrixWorld();

    // what you're pointing at (mouse) or looking at (centre of the screen on touch)
    const next = look.drag ? null : hotspotAt(!IS_TOUCH && mouse.inside ? mouse.ndc : centre);
    if (next !== focused) {
      focused = next;
      page.prompt.hidden = !focused;
      if (focused) page.prompt.innerHTML = `${focused.userData.hotspot.label}<b>${IS_TOUCH ? 'Tap' : 'Click'}</b>`;
      document.documentElement.classList.toggle('can-use', !!focused && !IS_TOUCH);
      page.reticle.classList.toggle('on', !!focused);
    }

    // things that move (frozen while paused)
    sound.update(dt);
    updateShow(dt);
    for (const item of animated) {
      if (item.kind === 'spin' && state.recordOn && !state.paused) item.object.rotation.y -= item.speed * dt;
      else if (item.kind === 'pulse') {
        if (item.object.isLight) { if (!item.object.parent?.userData.off) item.object.intensity = item.base + sound.level * item.amount; }
        else item.object.material.emissiveIntensity = item.base + sound.level * item.amount;
      }

      else if (item.kind === 'flicker') {
        const t = state.time;
        item.object.intensity = item.base * (1 - item.amount + item.amount * (Math.sin(t * 13.1) * Math.sin(t * 7.7 + 1.3) * 0.5 + 0.5));
      } else if (item.kind === 'twinkle') {
        for (let i = 0; i < item.count; i++) {
          const k = 0.75 + 0.25 * Math.sin(state.time * (0.8 + (i % 5) * 0.37) + i * 1.7);
          item.object.setColorAt(i, twinkleColor.copy(item.color).multiplyScalar(k * 1.6));
        }
        item.object.instanceColor.needsUpdate = true;
      } else if (item.kind !== 'spin') animateGroup(item, dt);
    }

    updateClub(dt);

    if (!state.paused) state.flash *= Math.exp(-dt * 3.2);
    const flash = state.flash * (0.55 + 0.45 * Math.abs(Math.sin(state.time * 31.0)));
    shared.uFlash.value = flash;

    // the LED wall, about 12 times a second
    if (!state.paused) screenClock += dt;
    if (screenClock > 1 / 12) {
      screenClock = 0;
      const live = state.showLevel > 0.5;
      textures.screen.userData.update(state.time, sound.level, live, groove.beats, ['#' + colA.getHexString(), '#' + colB.getHexString()], groove.section, groove.build);
    }

    state.glitch = Math.max(0, state.glitch - dt * 2.2);
    post.uniforms.uGlitch.value = state.glitch;
    updateWaves(dt);
    const holoAmount = MODES[state.mode].room ? 1 : MODES[state.mode].city ? 0.25 : 0;
    post.uniforms.uHolo.value += (holoAmount - post.uniforms.uHolo.value) * approach(6, dt);
    post.uniforms.uTime.value = state.time;
    post.uniforms.uSpeed.value = Math.min(1, speed / SETTINGS.runSpeed);
    post.composer.render();

    // FPS readout, twice a second
    fpsFrames++;
    if (now - fpsSince >= 500) {
      if (!page.fps.hidden) page.fps.textContent = Math.round((fpsFrames * 1000) / (now - fpsSince)) + ' FPS';
      fpsFrames = 0;
      fpsSince = now;
    }

    // first frame: drop the loader, fade in from black, then show the interface
    if (firstFrame) {
      firstFrame = false;
      requestAnimationFrame(() => {
        page.loader.classList.add('gone');
        page.fade.classList.add('out');
        uiTimer = setTimeout(() => {
          page.ui.classList.add('on');
          toast(IS_TOUCH ? 'Tap ▶ to start the set · slide two fingers to walk' : 'Press ▶ or Space to start the set · steps up to the stage on the right');
        }, 700);
      });
    }
  }
  frameId = requestAnimationFrame(frame);

  // coming back with the browser's Back button after leaving through a door
  listen(window, 'pageshow', e => { if (e.persisted) page.fade.classList.remove('leaving'); });

  // ---- clean-up: stop everything and free graphics memory
  function dispose() {
    cancelAnimationFrame(frameId);
    clearTimeout(uiTimer);
    clearTimeout(toastTimer);
    listeners.abort();
    timer.dispose?.();
    scene.traverse(object => {
      object.geometry?.dispose();
      for (const material of [].concat(object.material || [])) {
        for (const value of Object.values(material)) if (value?.isTexture) value.dispose();
        material.dispose();
      }
    });
    Object.values(textures).forEach(texture => texture.dispose());
    post.composer.dispose();
    renderer.dispose();
    renderer.domElement.remove();
    sound.dispose();
  }
  return { dispose };
}


// ---- go: let the loading dot paint first, then build the room
// (window.room.dispose() stops it and frees its memory)
if (THREE) {
  requestAnimationFrame(() => setTimeout(async () => {
    try {
      window.room = await startRoom();
    } catch (error) {
      showLoadError(error);
    }
  }, 30));
}
</script>
</body>
</html>
