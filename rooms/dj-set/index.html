<!DOCTYPE html>
<!--
  DJ SET  (three.js r186, built on Room Template v2)
  A small house club at night. The girl from the lofi bedroom is on the decks in her hoodie; walk in
  past the bouncer, get a drink at the bar, sink into the lounge, or walk up the steps onto the stage
  behind her. Press play: a deep house track with a breakdown, a build-up and a drop that the lights,
  the LED wall and the crowd all follow. Venue / Mix / Code views: in Mix the dancers turn to skeletons and the walls to falling code.
  A room.json next to this page can set: title, venue, djName, doors, playlist, posters, dj, bartender, bouncer.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DJ Set</title>
<meta name="description" content="A small house club at night: a DJ on the decks, a bar, a lounge, lasers and a mirror ball. Press play to start the set.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500&display=swap" rel="stylesheet">

<style>
/* ===================================================================
   Base
   =================================================================== */
:root {
  --u: min(calc(100vw / 1600), calc(100vh / 900));   /* 1u = 1px on a 1600×900 screen; scales with the window */
  --cream: #f5efe2;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
[hidden] { display: none !important; }

html, body {
  height: 100%;
  background: #000;
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-user-select: none;
  user-select: none;
}
html { cursor: grab; }
html.dragging { cursor: grabbing; }
html.can-use { cursor: pointer; }
body {
  color: var(--cream);
  font-family: Manrope, system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
  touch-action: none;              /* the page handles all touch gestures itself */
}
body.no-webgl { background: radial-gradient(120% 80% at 50% 100%, #2a1f2e 0%, #100c12 45%, #000 80%); }

a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
a:focus-visible, button:focus-visible { outline: 2px solid var(--cream); outline-offset: 3px; }

/* ===================================================================
   3D view and the black fade used for the intro and for doors
   =================================================================== */
#view { position: fixed; inset: 0; }
#view canvas { display: block; width: 100% !important; height: 100% !important; }
#fade { position: fixed; inset: 0; z-index: 5; background: #000; pointer-events: none; transition: opacity 1.2s ease; }
#fade.out { opacity: 0; }
#fade.leaving { opacity: 1; transition-duration: 0.6s; }

/* ===================================================================
   Interface layer (fades in after the intro)
   =================================================================== */
.ui {
  position: fixed;
  inset: 0;
  z-index: 2;
  pointer-events: none;            /* clicks pass through to the 3D view... */
  opacity: 0;
  transition: opacity 1.2s ease;
}
.ui.on { opacity: 1; }
.ui a, .ui button, .stick {
  pointer-events: auto;            /* ...except on links, buttons and the joystick */
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;     /* no long-press menu on phones */
  -webkit-tap-highlight-color: transparent;
  touch-action: none;
}

header {
  position: absolute;
  top: env(safe-area-inset-top, 0);
  left: 0;
  right: 0;
  padding: calc(24 * var(--u)) calc(44 * var(--u)) 0;
}
.logo { display: block; width: fit-content; font-size: calc(26 * var(--u)); font-weight: 500; letter-spacing: -0.02em; }

/* "Paused" chip and short messages, top centre */
.chip {
  position: absolute;
  top: calc(28 * var(--u) + env(safe-area-inset-top, 0px));
  left: 50%;
  transform: translateX(-50%);
  padding: 7px 14px;
  border-radius: 99px;
  background: rgba(0, 0, 0, 0.5);
  border: 1px solid rgba(245, 239, 226, 0.25);
  font-size: 12px;
  font-weight: 500;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  transition: opacity 0.4s;
}
#toast { top: calc(72 * var(--u) + env(safe-area-inset-top, 0px)); letter-spacing: 0.04em; text-transform: none; font-size: 13px; opacity: 0; }
#toast.show { opacity: 1; }

/* Label for the thing you're looking at / pointing at; tap it on a phone to use it */
.prompt {
  position: absolute;
  left: 50%;
  bottom: calc(120 * var(--u) + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%);
  padding: 9px 16px;
  border-radius: 99px;
  background: rgba(0, 0, 0, 0.55);
  border: 1px solid rgba(245, 239, 226, 0.35);
  font-size: 14px;
  font-weight: 500;
  white-space: nowrap;
}
.prompt b { font-weight: 500; opacity: 0.6; margin-left: 8px; }

/* Centre dot on touch screens: what's under it can be used */
.reticle {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 6px;
  height: 6px;
  margin: -3px 0 0 -3px;
  border-radius: 50%;
  background: rgba(245, 239, 226, 0.55);
  transition: transform 0.2s, background 0.2s;
  display: none;
}
.reticle.on { transform: scale(2.2); background: var(--cream); }

/* Bottom right: hints, pause and sound */
.corner {
  position: absolute;
  right: calc(44 * var(--u));
  bottom: calc(44 * var(--u) + env(safe-area-inset-bottom, 0px));
  display: flex;
  align-items: center;
  gap: calc(18 * var(--u));
  font-size: calc(12.5 * var(--u));
  font-weight: 500;
  letter-spacing: 0.16em;
  text-transform: uppercase;
}
.corner i { width: 1px; height: calc(26 * var(--u)); background: rgba(245, 239, 226, 0.45); }
.icon-btn { display: grid; place-items: center; width: calc(28 * var(--u)); height: calc(28 * var(--u)); }
.icon-btn svg { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.icon-btn svg .solid { fill: currentColor; stroke: none; }
.sound .waves, .sound .cross { transition: opacity 0.3s; }
.sound[aria-pressed="false"] .waves { opacity: 0; }
.sound[aria-pressed="true"] .cross { opacity: 0; }
.pause[aria-pressed="false"] .play { display: none; }
/* the card a door shows for a link to another site */
.door-card {
  position: fixed;
  left: 50%; top: 50%;
  transform: translate(-50%, -50%);
  z-index: 30;
  min-width: 260px;
  padding: 22px 24px 18px;
  border-radius: 18px;
  background: rgba(18, 12, 34, 0.86);
  border: 1px solid rgba(245, 239, 226, 0.18);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  color: #f5efe2;
  text-align: center;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
}
.door-card[hidden] { display: none; }
.door-title { margin: 0; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: rgba(245, 239, 226, 0.6); }
.door-where { margin: 8px 0 18px; font-size: 20px; font-weight: 600; word-break: break-all; }
.door-actions { display: flex; gap: 10px; justify-content: center; }
.door-go, .door-stay { padding: 9px 18px; border-radius: 999px; font: inherit; font-size: 14px; cursor: pointer; text-decoration: none; }
.door-go { background: linear-gradient(135deg, #8c4fe3, #4f6bff); color: #fff; border: 0; }
.door-stay { background: none; color: rgba(245, 239, 226, 0.8); border: 1px solid rgba(245, 239, 226, 0.25); }
/* music player, under the title */
.player {
  display: flex;
  width: fit-content;
  align-items: center;
  gap: 6px;
  margin-top: calc(12 * var(--u));
  padding: 5px 8px 5px 6px;
  max-width: min(440px, 70vw);
  border-radius: 999px;
  background: rgba(18, 12, 34, 0.55);
  border: 1px solid rgba(245, 239, 226, 0.16);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  pointer-events: auto;
}
.player .icon-btn { width: 26px; height: 26px; padding: 4px; border: 0; background: none; color: inherit; cursor: pointer; border-radius: 50%; }
.player .icon-btn:hover { background: rgba(245, 239, 226, 0.1); }
.player label.icon-btn { pointer-events: auto; }
#playSong[aria-pressed="false"] .bars, #playSong[aria-pressed="true"] .play { display: none; }
.player .now {
  min-width: 0;
  padding: 0 6px;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
  font-size: 13px;
  color: rgba(245, 239, 226, 0.85);
}
.player.drop { outline: 2px dashed #b9c4ff; outline-offset: 3px; }
#musicVolume { width: 70px; flex: none; margin: 0 4px 0 2px; accent-color: #b9a4ff; cursor: pointer; pointer-events: auto; }
/* Lofi / Mix / Code switch, top right */
.modes {
  position: absolute;
  top: calc(18 * var(--u));
  right: calc(44 * var(--u));
  display: flex;
  padding: 4px;
  border-radius: 999px;
  background: rgba(18, 12, 34, 0.55);
  border: 1px solid rgba(245, 239, 226, 0.16);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}
.modes button {
  position: relative;
  z-index: 1;
  padding: 7px 15px;
  border: 0;
  border-radius: 999px;
  background: none;
  color: rgba(245, 239, 226, 0.7);
  font: inherit;
  font-size: 13px;
  letter-spacing: 0.04em;
  cursor: pointer;
  transition: color 0.3s;
}
.modes button[aria-checked="true"] { color: #fff; }
.modes button:focus-visible { outline: 2px solid #b9c4ff; outline-offset: 1px; }
.modes-thumb {
  position: absolute;
  top: 4px; bottom: 4px; left: 0;
  width: 0;
  border-radius: 999px;
  background: linear-gradient(135deg, #8c4fe3, #4f6bff);
  box-shadow: 0 0 14px rgba(140, 79, 227, 0.55);
  transition: transform 0.4s cubic-bezier(.3,.7,.2,1), width 0.4s cubic-bezier(.3,.7,.2,1);
}
.crowd-noise .drops, .crowd-noise .cross { transition: opacity 0.3s; }
.crowd-noise[aria-pressed="false"] .drops { opacity: 0; }
.crowd-noise[aria-pressed="true"] .cross { opacity: 0; }
.pause[aria-pressed="true"] .bars { display: none; }

/* Thumb joystick (touch screens only) */
.stick {
  position: absolute;
  left: calc(26px + env(safe-area-inset-left, 0px));
  bottom: calc(26px + env(safe-area-inset-bottom, 0px));
  width: 124px;
  height: 124px;
  border-radius: 50%;
  border: 1.5px solid rgba(245, 239, 226, 0.35);
  background: rgba(0, 0, 0, 0.22);
  display: none;
}
.stick-knob {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 50px;
  height: 50px;
  margin: -25px 0 0 -25px;
  border-radius: 50%;
  background: rgba(245, 239, 226, 0.85);
  transition: transform 0.18s ease;
}
.stick.active .stick-knob { transition: none; }

.hint-touch { display: none; }
@media (hover: none) and (pointer: coarse) {
  .hint-desk { display: none !important; }
  .hint-touch { display: inline; }
  .stick, .reticle { display: block; }
}

/* ===================================================================
   Loading screen (with progress for models, and a message if three.js can't load)
   =================================================================== */
.loader {
  position: fixed;
  inset: 0;
  z-index: 6;
  display: grid;
  place-items: center;
  background: #000;
  transition: opacity 0.8s ease;
  pointer-events: none;
}
.loader.gone { opacity: 0; }
.loader.failed { pointer-events: auto; }
.loader.failed .loader-dot { display: none; }
.loader-dot {
  width: calc(9 * var(--u));
  height: calc(9 * var(--u));
  min-width: 6px;
  min-height: 6px;
  border-radius: 50%;
  background: var(--cream);
  animation: pulse 1.2s ease-in-out infinite;
}
@keyframes pulse { 50% { transform: scale(0.4); opacity: 0.4; } }
.loader-note {
  position: absolute;
  top: calc(50% + 26px);
  left: 0;
  right: 0;
  text-align: center;
  font-size: 13px;
  letter-spacing: 0.04em;
  opacity: 0.6;
}
.loader-error { display: grid; gap: 8px; justify-items: center; padding: 0 24px; text-align: center; font-size: 15px; }
.loader-error .sub { font-size: 13px; opacity: 0.65; }
.loader-error button {
  margin-top: 10px;
  height: 40px;
  padding: 0 20px;
  border-radius: 99px;
  background: var(--cream);
  color: #151510;
  font-weight: 500;
}

/* Frames-per-second readout */
#fps {
  position: fixed;
  z-index: 4;
  top: calc(70 * var(--u) + env(safe-area-inset-top, 0px));
  right: calc(44 * var(--u));
  padding: 6px 9px;
  border-radius: 6px;
  background: rgba(0, 0, 0, 0.45);
  color: var(--cream);
  font: 500 12px/1 ui-monospace, Menlo, monospace;
  letter-spacing: 0.06em;
  pointer-events: none;
}

/* ===================================================================
   Phones and narrow windows
   =================================================================== */
@media (max-width: 820px) {
  :root { --u: 1px; }
  header { padding: 18px 18px 0; }
  .corner { right: 20px; bottom: calc(30px + env(safe-area-inset-bottom)); font-size: 11px; }
  .icon-btn { width: 30px; height: 30px; }
  .prompt { bottom: calc(170px + env(safe-area-inset-bottom)); }
  #fps { top: calc(64px + env(safe-area-inset-top, 0px)); right: 18px; }
}
@media (prefers-reduced-motion: reduce) {
  .loader-dot { animation: none; }
}
</style>

<script type="module">
/* =====================================================================
   Contents
     1. The room (data: edit this to make a new room)
     2. Settings and page elements
     3. Loading three.js and room.json
     4. Sound: room tone, music file or built-in beat, chimes, level meter
     5. Randomness and textures
     6. Building the room from the description
     7. Post-processing
     8. The room: input, walking, hotspots, frame loop, clean-up
   ===================================================================== */


/* ---------------------------------------------------------------------
   1. The room
   Units are metres. Positions are [x, y, z]: x left/right, y up, z toward
   you (the far wall is at negative z). Angles are in degrees.
   Parts: box [w, h, d] · cylinder [radiusTop, radiusBottom, height, thetaStart?, thetaLength?] ·
          sphere [radius, phiStart?, phiLength?, thetaStart?, thetaLength?] · disc [radius] ·
          cone [radius, height] · torus [radius, tube, arcDegrees?] · plane [w, h] ·
          limb { from, to, radius } (a capsule between two points) ·
          screen [w, h] (a big stage screen) · cable { points, radius } · arm (two-bone, aims at a hand) ·
          light (point light) · string (a strand of little bulbs) ·
          group { parts, anim } (moves its parts together: breathe, nod, tap, blink, tail, look).
   Part extras: color, emissive, emissiveIntensity, roughness, metalness, scale [x, y, z],
          texture (a texture name), spin, pulse (glows with the music), flicker, open (hollow).
   --------------------------------------------------------------------- */

// ---- Your copy's settings. A room.json next to this page can change the songs, posters, the band's
//      looks, the doors and what they say. Anything left out
//      keeps this showcase's look. A room.json that has "objects" replaces the whole room instead.
let CUSTOM = {};
try {
  const response = await fetch('room.json', { cache: 'no-cache' });
  if (response.ok) CUSTOM = await response.json();
} catch { /* no room.json: the showcase room */ }
const LOOK = { dj: { ...CUSTOM.dj }, bartender: { ...CUSTOM.bartender }, bouncer: { ...CUSTOM.bouncer } };
// a colour set to the showcase's own value counts as unchanged (keeps the exact hand-picked shades)
for (const [key, value] of [['hair', '#7b3fd8'], ['eyes', '#90b0ea']]) if (String(LOOK.dj[key] || '').toLowerCase() === value) delete LOOK.dj[key];

// Lighten (amount > 0) or darken (amount < 0) a #rrggbb colour.
function shade(hex, amount) {
  const n = parseInt(String(hex).replace('#', ''), 16);
  const mix = c => Math.round(amount >= 0 ? c + (255 - c) * amount : c * (1 + amount));
  return '#' + [n >> 16 & 255, n >> 8 & 255, n & 255].map(c => mix(c).toString(16).padStart(2, '0')).join('');
}

// the DJ (the girl from the lofi bedroom, out for the night) and her painted face
const C = {

// Flip a list of parts left-to-right.
function mirrorX(parts) {
  return parts.map(p => {
    const q = { ...p };
    if (p.offset) q.offset = [-p.offset[0], p.offset[1], p.offset[2]];
    if (p.from) q.from = [-p.from[0], p.from[1], p.from[2]];
    if (p.to) q.to = [-p.to[0], p.to[1], p.to[2]];
    if (p.rotation) q.rotation = [p.rotation[0], -p.rotation[1], -p.rotation[2]];
    if (p.parts) q.parts = mirrorX(p.parts);
    return q;
  });
}

const levelOf = y => (y > BAL.y / 2 ? 1 : 0);
function floorAt(x, z, level = 0) {
  const S = STAGE, ax = Math.abs(x), clamp01 = v => Math.min(1, Math.max(0, v));
  if (z >= S.z0 && z <= S.z1) {
    if (x >= S.x0 && x <= S.x1) return S.h;
    // the steps up the right side of the stage: you glide up a smooth slope over them
    if (x > S.x1 && x <= S.stepX[1]) return S.h * clamp01((S.stepX[1] - x + 0.1) / (S.stepX[1] - S.x1));
  }
  // upstairs: the back floor, the galleries, the side balconies (checked first, so you never drop through to the stairs below)
  if (level === 1) {
    if (z >= MEZZ.z0 - 0.06 && (ax < GAL.x1 || z >= MEZZ.z0 + 0.3)) return BAL.y;   // above the stairs it stops you short of the railing
    if (ax >= GAL.x0 - 0.06 && ax <= GAL.x1 + 0.06 && z >= BAL.z1 - 0.1) return BAL.y;
    if (ax >= BAL.x && z >= BAL.z0 && z <= BAL.z1 + 0.06) return BAL.y;
  }
  // the stairs up each side wall, from the front of the room up to the balcony
  if (ax >= STAIRS.x && z > STAIRS.top && z <= STAIRS.foot + 0.6) return BAL.y * clamp01((STAIRS.foot - z) / (STAIRS.foot - STAIRS.top));

  return 0;
}

/* ---- Truss: square-section aluminium truss as straight rods (chords and zig-zag lacing), drawn as instances. */
function trussRods(a, b, w = 0.3, r = 0.022) {
  const rods = [];
  const d = [b[0] - a[0], b[1] - a[1], b[2] - a[2]], len = Math.hypot(...d), ax = d.map(v => v / len);
  let u, v;
  if (Math.abs(ax[1]) > 0.9) { u = [1, 0, 0]; v = [0, 0, 1]; }
  else { u = [0, 1, 0]; v = [ax[2], 0, -ax[0]]; const n = Math.hypot(...v); v = v.map(c => c / n); }
  const corner = (p, i) => { const su = (i & 1 ? 0.5 : -0.5) * w, sv = (i & 2 ? 0.5 : -0.5) * w; return [p[0] + u[0] * su + v[0] * sv, p[1] + u[1] * su + v[1] * sv, p[2] + u[2] * su + v[2] * sv]; };
  const at = t => [a[0] + d[0] * t, a[1] + d[1] * t, a[2] + d[2] * t];
  for (let i = 0; i < 4; i++) rods.push([corner(a, i), corner(b, i), r]);
  const n = Math.max(1, Math.round(len / w));
  const faces = [[0, 1], [1, 3], [3, 2], [2, 0]];
  for (let k = 0; k < n; k++) {
    const p0 = at(k / n), p1 = at((k + 1) / n);
    for (const [i, j] of faces) rods.push(k % 2 ? [corner(p0, i), corner(p1, j), r * 0.45] : [corner(p0, j), corner(p1, i), r * 0.45]);
  }
  return rods;
}

function seededRandomData(seed) {
  return () => {
    seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function balconyParts(s) {

  for (let k = 0; k < 5; k++) p.push(CY([0.06, 0.06, 0.01], [s * 8.9, BAL.y - BAL.t - 0.006, BAL.z0 + 1 + k * (len - 2) / 4], '#fff2dc', { emissive: '#ffd6a8', emissiveIntensity: 1.6 }));

function applyCustom(room, c) {
  if (c.title) room.name = c.title;
  if (Array.isArray(c.playlist)) room.playlist = c.playlist;
  if (c.colors) Object.assign(room.colors, c.colors);
  if (Array.isArray(c.talk) && c.talk.length) room.talk = c.talk;
  if (c.posters) room.posterImages = c.posters;
  const drop = id => { room.objects = room.objects.filter(o => o.id !== id); };
  for (const [id, value] of Object.entries(c.doors || {})) {
    const door = room.objects.find(o => o.id === id && o.hotspot);
    if (!door) { console.warn(`room.json: no door with id "${id}"`); continue; }
    const set = typeof value === 'string' ? { href: value } : value || {};
    door.hotspot = { ...door.hotspot, action: 'door', ...(set.href !== undefined && { href: set.href }), ...(set.label && { label: set.label }) };
  }
  if (c.dj?.show === false) { drop('dj'); }
  if (c.bartender?.show === false) drop('bartender');
  if (c.bouncer?.show === false) drop('bouncer');
}

/* ---------------------------------------------------------------------
   4. Sound
   - Room tone: a quiet, low hum of air, always there while sound is on.
   - Music: a playlist (see `playlist` above). Track 1 is a small built-in
     beat (kick, snare, hats and chords) made live, so music always works.
   - Everything musical goes through a level meter (`sound.level`, 0–1)
     so lights and objects can pulse with it.
   - Pause stops the music; muting pauses the whole audio engine.
   --------------------------------------------------------------------- */
/* ---------------------------------------------------------------------
   Playlist: the built-in beat is always track 1 (it's made live, so it
   works with no files at all). After it come the songs listed in
   ROOM.playlist (files shipped next to the page), then any songs you add
   with the + button or by dropping audio files on the room. Songs you add
   are remembered in this browser only. Titles, artists and cover art are
   read from the files' tags when they have them.
   --------------------------------------------------------------------- */
const playlist = {
  tracks: [{ title: 'after hours', artist: `${DJ_NAME} · live at ${VENUE}`, builtin: true }],
  index: 0,
  db: null,

  add(track) { this.tracks.push(track); return this.tracks.length - 1; },
  get current() { return this.tracks[this.index]; },

  // songs that ship with the room
  addShipped(list = []) {
    for (const item of list) {
      const entry = typeof item === 'string' ? { src: item } : item;
      const track = { src: entry.src, title: entry.title || titleFromName(entry.src), artist: entry.artist || '', shipped: true };
      this.add(track);
      if (!entry.title || !entry.artist) {
        fetch(entry.src).then(r => (r.ok ? r.blob() : null)).then(blob => blob && readTags(blob)).then(tags => {
          if (!tags) return;
          if (!entry.title && tags.title) track.title = tags.title;
          if (!entry.artist && tags.artist) track.artist = tags.artist;
          if (tags.art) track.art = tags.art;
        }).catch(() => {});
      }
    }
  },

  // songs you add: kept as blob URLs, and saved in this browser if it lets us
  async addFiles(files, save = true) {
    const added = [];
    for (const file of files) {
      if (!file.type.startsWith('audio/') && !/\.(mp3|m4a|aac|ogg|oga|opus|wav|flac|webm)$/i.test(file.name)) continue;
      const tags = await readTags(file).catch(() => null);
      const track = {
        src: URL.createObjectURL(file), mine: true, id: file.id,
        title: tags?.title || titleFromName(file.name),
        artist: tags?.artist || 'your music',
        art: tags?.art || null,
      };
      if (save && !file.id) this.save(file).then(id => { track.id = id; });   // remembered in this browser, in the background
      added.push(this.add(track));
    }
    return added;
  },

  async openDb() {
    if (this.db) return this.db;
    this.db = await new Promise((resolve, reject) => {
      const request = indexedDB.open('dj-set', 1);
      request.onupgradeneeded = () => request.result.createObjectStore('songs', { keyPath: 'id', autoIncrement: true });
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error);
    });
    return this.db;
  },
  async save(file) {
    try {
      const db = await this.openDb();
      return await new Promise((resolve, reject) => {
        const tx = db.transaction('songs', 'readwrite');
        const request = tx.objectStore('songs').add({ name: file.name, type: file.type, blob: file });
        request.onsuccess = () => resolve(request.result);
        tx.onerror = () => reject(tx.error);
      });
    } catch { return undefined; }
  },
  async loadSaved() {
    try {
      const db = await this.openDb();
      const rows = await new Promise((resolve, reject) => {
        const request = db.transaction('songs').objectStore('songs').getAll();
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
      const files = rows.map(row => Object.assign(new File([row.blob], row.name, { type: row.type }), { id: row.id }));
      return await this.addFiles(files, false);
    } catch { return []; }
  },
  async remove(i) {
    const track = this.tracks[i];
    if (!track?.mine) return;
    URL.revokeObjectURL(track.src);
    this.tracks.splice(i, 1);
    if (this.index >= i) this.index = Math.max(0, this.index - 1);
    try {
      const db = await this.openDb();
      db.transaction('songs', 'readwrite').objectStore('songs').delete(track.id);
    } catch { /* nothing saved */ }
  },
};

function titleFromName(name = '') {
  return decodeURIComponent(name.split('/').pop()).replace(/\.[a-z0-9]+$/i, '').replace(/[_]+/g, ' ').trim() || 'untitled';
}

// Reads title, artist and cover art from an MP3's ID3v2 tags (other formats just use the file name).
async function readTags(blob) {
  const head = new Uint8Array(await blob.slice(0, 10).arrayBuffer());
  if (head[0] !== 0x49 || head[1] !== 0x44 || head[2] !== 0x33) return null;          // "ID3"
  const version = head[3];
  const size = (head[6] << 21) | (head[7] << 14) | (head[8] << 7) | head[9];
  const bytes = new Uint8Array(await blob.slice(10, 10 + Math.min(size, 4e6)).arrayBuffer());
  const out = {};
  const text = (b, encoding) => {
    const label = encoding === 0 ? 'latin1' : encoding === 1 ? 'utf-16' : encoding === 2 ? 'utf-16be' : 'utf-8';
    return new TextDecoder(label).decode(b).replace(/\0+$/, '').replace(/\0/g, ' / ').trim();
  };
  let p = 0;
  while (p + 10 < bytes.length) {
    const id = String.fromCharCode(bytes[p], bytes[p + 1], bytes[p + 2], bytes[p + 3]);
    if (!/^[A-Z0-9]{4}$/.test(id)) break;
    const frameSize = version === 4
      ? (bytes[p + 4] << 21) | (bytes[p + 5] << 14) | (bytes[p + 6] << 7) | bytes[p + 7]
      : ((bytes[p + 4] << 24) | (bytes[p + 5] << 16) | (bytes[p + 6] << 8) | bytes[p + 7]) >>> 0;
    const body = bytes.subarray(p + 10, p + 10 + frameSize);
    if (id === 'TIT2') out.title = text(body.subarray(1), body[0]);
    else if (id === 'TPE1') out.artist = text(body.subarray(1), body[0]);
    else if (id === 'APIC' && !out.art) {
      const encoding = body[0];
      let q = 1;
      while (q < body.length && body[q] !== 0) q++;                   // mime type
      const mime = new TextDecoder('latin1').decode(body.subarray(1, q)) || 'image/jpeg';
      q += 2;                                                         // the null and the picture type
      if (encoding === 1 || encoding === 2) { while (q + 1 < body.length && (body[q] || body[q + 1])) q += 2; q += 2; }
      else { while (q < body.length && body[q] !== 0) q++; q += 1; }
      try { out.art = await createImageBitmap(new Blob([body.subarray(q)], { type: mime.includes('/') ? mime : 'image/' + mime })); } catch { /* no art */ }
    }
    if (frameSize <= 0) break;
    p += 10 + frameSize;
  }
  return out;
}


const sound = {

  volume: (() => { try { const v = parseFloat(localStorage.getItem('djSetVolume')); return v >= 0 && v <= 1 ? v : 0.8; } catch { return 0.8; } })(),

  // One <audio> element plays every song in the playlist (it only plays after a click).
  prepareMusic() {

    audio.addEventListener('ended', () => this.onEnded?.());
    audio.addEventListener('error', () => { if (audio.getAttribute('src')) this.onError?.(); });

  // switch to track i of the playlist (keeps playing if music was on)
  selectTrack(i) {

    this.musicFile.pause();

    if (!AudioContext) return false;

    const compressor = ctx.createDynamicsCompressor();
    compressor.threshold.value = -16;
    compressor.ratio.value = 3;

  setMusic(on) {

  setPaused(paused) {

  // ---- built-in track: "after hours", deep house at 122 bpm, 64 bars on a loop (a little over two minutes).
  //      16 bars of groove, 16 with the pad and open hats, an 8-bar breakdown, an 8-bar build-up, a 16-bar drop.
  //      Am9 · Fmaj9 · Dm9 · Em9, two bars each. beatRef lets the DJ and the lights know where in the track we are.

  section(step) {

  },
  startBeat() {

  },
  stopBeat() {

  },
  // where the built-in track is right now, in 16th steps (or null when it isn't playing)
  stepNow() {

  },
  // the mix: chords through a filter (opened by the build) and a dotted-eighth echo; a pad; the bass; a little room reverb
  houseChains() {
    if (this.house?.ctx === this.ctx) return this.house;
    const c = this.ctx, bus = this.musicBus;
    const filter = (type, f, q = 0.7) => { const b = c.createBiquadFilter(); b.type = type; b.frequency.value = f; b.Q.value = q; return b; };
    const gain = v => { const g = c.createGain(); g.gain.value = v; return g; };
    const verb = c.createConvolver(), len = Math.floor(c.sampleRate * 2.2), ir = c.createBuffer(2, len, c.sampleRate);
    for (let ch = 0; ch < 2; ch++) { const d = ir.getChannelData(ch); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3); }

    pad.connect(padFilter); padFilter.connect(bus); padFilter.connect(verb);
    const bass = gain(0.36), bassFilter = filter('lowpass', 420, 1.1);
    bass.connect(bassFilter); bassFilter.connect(bus);

  // the pad's voices run while the track plays: two detuned saws per note, retuned at each chord change
  padStart() {

      const o = c.createOscillator(); o.type = 'sawtooth'; o.frequency.value = f; o.detune.value = cents; o.connect(H.pad); o.start(); return o;

  padStop() {

    H.riser.gain.cancelScheduledValues(t); H.riser.gain.setTargetAtTime(0, t, 0.05);

  playStep(step, t) {

    const full = sec === 'groove' || sec === 'groove2' || sec === 'drop';
    // drums: four on the floor, clap on two and four, offbeat hats (open in the second groove and the drop)
    if (full && b % 4 === 0) this.kick(t, 1);
    if (sec === 'build' && inSec >= 4 && b % 4 === 0) this.kick(t, 0.55);
    if (full && (b === 4 || b === 12)) this.clap(t);
    if (full || sec === 'build') {
      if (b % 4 === 2) this.hat(t, sec === 'groove' ? 0.06 : 0.08, sec !== 'groove' && sec !== 'build');
      else if (sec !== 'groove' && b % 2 === 1) this.hat(t + 0.014, 0.028, false);       // shuffled sixteenths
    }

      if (b === 2 || b === 6 || b === 10 || b === 14) this.bassNote(t, chord.bass, 0.2);
      if (b === 7 || b === 15) this.bassNote(t, chord.bass * 2, 0.09);
      if (sec === 'drop' && b === 0) this.bassNote(t, chord.bass, 0.12);

    // chord stabs on the offbeats (filtered right down in the breakdown, gone for the end of the build)
    const stabs = sec === 'groove' ? [3, 10] : [3, 6, 10, 13];
    if (stabs.includes(b) && !(sec === 'build' && inSec >= 6)) this.stab(t, chord.notes, sec === 'break' ? 0.7 : 1);

      H.pad.gain.setTargetAtTime(padLevel, t, 0.6);
      H.padFilter.frequency.setTargetAtTime(sec === 'break' ? 1300 : 800, t, 1);
      if (H.voices) chord.notes.slice(0, 4).forEach((n, i) => { for (let k = 0; k < 2; k++) H.voices[i * 2 + k].frequency.setTargetAtTime(n, t, 0.08); });

      H.riserFilter.frequency.setTargetAtTime(sec === 'build' ? 500 + (inSec / 8) * 7000 : 500, t, 0.8);
    }

  kick(t, volume = 1) {

    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.38);
    osc.connect(gain); gain.connect(this.musicBus);

  clap(t) {

    }
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.linearRampToValueAtTime(0.2, t + 0.002);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.2);

  snare(t, volume = 0.1) {
    const noise = this.ctx.createBufferSource(), band = this.ctx.createBiquadFilter(), gain = this.ctx.createGain();

    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
    noise.connect(band); band.connect(gain); gain.connect(this.house.clapBus);

  hat(t, volume, open = false) {
    const noise = this.ctx.createBufferSource(), band = this.ctx.createBiquadFilter(), gain = this.ctx.createGain();

    band.type = 'highpass'; band.frequency.value = open ? 6500 : 8000;

    gain.gain.setValueAtTime(volume, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + len);
    noise.connect(band); band.connect(gain); gain.connect(this.musicBus);
    noise.start(t, Math.random()); noise.stop(t + len + 0.02);
  },
  crash(t) {
    const noise = this.ctx.createBufferSource(), band = this.ctx.createBiquadFilter(), gain = this.ctx.createGain();
    noise.buffer = this.noise;

    gain.gain.setValueAtTime(0.09, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 1.8);
    noise.connect(band); band.connect(gain); gain.connect(this.house.clapBus);
    noise.start(t, Math.random()); noise.stop(t + 1.9);

  // a round bass: sine with a little triangle on top, and a sub an octave down
  bassNote(t, f, length) {

    for (const f of notes) for (const [type, det] of [['square', -6], ['sawtooth', 6]]) {
      const o = c.createOscillator(); o.type = type; o.frequency.value = f; o.detune.value = det;

    envelope.connect(this.master);
    [[1, 1], [2.76, 0.25]].forEach(([ratio, volume]) => {

      gain.gain.value = volume;
      osc.connect(gain);

      osc.start(t);
      osc.stop(t + 2.6);
    });
  },

  // read the level meter (bass-heavy), once per frame
  update(dt) {
    if (this.paused) return;            // the level holds still while paused, so everything it moves does too
    let target = 0;

  dispose() {
    this.stopBeat();
    clearTimeout(this.suspendTimer);
    this.musicFile?.pause();
    this.ctx?.close();
    this.ctx = null;
  },
};




/* ---------------------------------------------------------------------
   The crowd, made live: a murmur of many voices (bands of filtered noise
   that swell and fade), "STUMPS! STUMPS!" chants (a chorus of buzzing
   voices through vowel filters, with the "st" and the "s"), cheers,
   whistles, applause (thousands of tiny claps baked into one buffer) and
   the cheer on the drop. It plays through the crowd-noise switch,
   so it can be turned off on its own.
   --------------------------------------------------------------------- */
const crowd = {
  for: null,
  ready() {
    if (!sound.ctx || !sound.crowdBus) return false;
    if (this.for === sound.ctx) return true;
    const c = sound.ctx;
    this.for = c;
    this.murmur = c.createGain();
    this.murmur.gain.value = 0;
    this.murmur.connect(sound.crowdBus);
    for (const [f, q, g, rate] of [[320, 0.8, 0.5, 0.11], [820, 1.1, 0.34, 0.17], [1700, 1.4, 0.16, 0.23], [2900, 2, 0.06, 0.31]]) {
      const src = c.createBufferSource(), bp = c.createBiquadFilter(), level = c.createGain(), lfo = c.createOscillator(), depth = c.createGain();
      src.buffer = sound.noise; src.loop = true;
      bp.type = 'bandpass'; bp.frequency.value = f; bp.Q.value = q;
      level.gain.value = g; depth.gain.value = g * 0.4; lfo.frequency.value = rate;
      lfo.connect(depth); depth.connect(level.gain); lfo.start();
      src.connect(bp); bp.connect(level); level.connect(this.murmur); src.start(0, Math.random() * 1.5);
    }
    // applause: claps scattered through 4 seconds, thick at first, thinning out
    const sr = c.sampleRate, len = Math.floor(sr * 4), buf = c.createBuffer(2, len, sr);
    for (let ch = 0; ch < 2; ch++) {
      const d = buf.getChannelData(ch);
      for (let k = 0; k < 2600; k++) {
        const at = Math.floor(Math.pow(Math.random(), 1.6) * (len - 400)), amp = 0.25 + Math.random() * 0.5, decay = 0.0008 + Math.random() * 0.0012;
        let prev = 0;
        for (let i = 0; i < 300; i++) { const v = (Math.random() * 2 - 1) * amp * Math.exp(-i / (decay * sr)); d[at + i] += v - prev * 0.6; prev = v; }
      }
    }
    this.applauseBuffer = buf;
    return true;
  },
  setLevel(v, time = 1.2) {
    if (!this.ready()) return;
    const t = sound.ctx.currentTime;
    this.murmur.gain.cancelScheduledValues(t);
    this.murmur.gain.setTargetAtTime(v, t, time);
  },
  // cheering: rising "woo"s, whistles and applause
  cheer(strength = 1, length = 4) {
    if (!this.ready()) return;
    const c = sound.ctx, t = c.currentTime + 0.02;
    const voices = c.createGain(), lp = c.createBiquadFilter();
    lp.type = 'lowpass'; lp.frequency.value = 1400;
    voices.gain.setValueAtTime(0.0001, t);
    voices.gain.exponentialRampToValueAtTime(0.03 * strength, t + 0.3);
    voices.gain.setTargetAtTime(0.0001, t + length * 0.45, length * 0.25);
    voices.connect(lp); lp.connect(sound.crowdBus);
    for (let i = 0; i < 14; i++) {
      const o = c.createOscillator(), at = t + Math.random() * 0.8, f0 = 260 + Math.random() * 280;
      o.type = 'triangle';
      o.frequency.setValueAtTime(f0, at); o.frequency.exponentialRampToValueAtTime(f0 * (1.4 + Math.random() * 0.5), at + 0.5 + Math.random() * 0.6);
      o.connect(voices); o.start(at); o.stop(t + length);
    }
    for (let i = 0; i < 3; i++) {
      const o = c.createOscillator(), g = c.createGain(), at = t + 0.3 + Math.random() * 1.5, f0 = 1900 + Math.random() * 900;
      o.frequency.setValueAtTime(f0, at); o.frequency.exponentialRampToValueAtTime(f0 * 1.35, at + 0.35);
      g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(0.012 * strength, at + 0.06); g.gain.exponentialRampToValueAtTime(0.0001, at + 0.6);
      o.connect(g); g.connect(sound.crowdBus); o.start(at); o.stop(at + 0.65);
    }
    const clap = c.createBufferSource(), cg = c.createGain(), hp = c.createBiquadFilter();
    clap.buffer = this.applauseBuffer;
    hp.type = 'bandpass'; hp.frequency.value = 2200; hp.Q.value = 0.5;
    cg.gain.value = 0.22 * strength;
    clap.connect(hp); hp.connect(cg); cg.connect(sound.crowdBus);
    clap.start(t + 0.2);
  },

/* ---------------------------------------------------------------------
   5. Randomness and textures
   --------------------------------------------------------------------- */
// Seeded random numbers: the same seed always gives the same result.
function seededRandom(seed) {
  return () => {
    seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// Draw a texture on a canvas.
function canvasTexture(size, draw, repeat = [1, 1]) {
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = size;
  draw(canvas.getContext('2d'), size);
  const texture = new THREE.CanvasTexture(canvas);

// Swap posters for pictures (room.json "posters": { "posterMoon": "posters/mine.jpg", ... }).
async function loadPosterImages(textures, posters) {
  const loader = new THREE.TextureLoader();
  await Promise.all(Object.entries(posters).map(async ([name, path]) => {
    const old = textures[name];
    if (!old || !path) return;
    try {
      const texture = await loader.loadAsync(path);
      texture.colorSpace = THREE.SRGBColorSpace;
      texture.anisotropy = 8;
      const want = old.image.width / old.image.height, have = texture.image.width / texture.image.height;
      if (have > want) { texture.repeat.x = want / have; texture.offset.x = (1 - texture.repeat.x) / 2; }
      else { texture.repeat.y = have / want; texture.offset.y = (1 - texture.repeat.y) / 2; }
      textures[name] = texture;
      old.dispose();
    } catch { console.warn(`Poster image not found: ${path}`); }
  }));
}

// A canvas texture that isn't square (posters, photos).
function sizedTexture(w, h, draw) {
  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  draw(canvas.getContext('2d'), w, h);
  const texture = new THREE.CanvasTexture(canvas);
  texture.colorSpace = THREE.SRGBColorSpace;
  texture.anisotropy = 8;
  return texture;
}

// (the LED wall: see makeScreenTexture)
//
// it starts (the stump logo pulsing in rings of colour, a level meter, LIVE). Redrawn ~12 times a second.
// The LED wall behind the DJ: between tracks the venue's name; with music, visuals that follow the track.
function makeScreenTexture(textures) {
  const W = 768, H = 304;
  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  const g = canvas.getContext('2d');
  const texture = new THREE.CanvasTexture(canvas);
  texture.colorSpace = THREE.SRGBColorSpace;
  const bars = new Float32Array(48);
  const fit = (text, max, px, weight = 900) => { do { g.font = `${weight} ${px}px "Arial Black", Impact, system-ui, sans-serif`; px -= 4; } while (g.measureText(text).width > max && px > 12); };
  texture.userData.update = (t, level, live, beats, colors, section = 'groove', build = 0) => {
    g.textAlign = 'center'; g.textBaseline = 'middle';
    if (!live) {
      const grad = g.createLinearGradient(0, 0, W, H);
      grad.addColorStop(0, '#120a22'); grad.addColorStop(1, '#22091a');
      g.fillStyle = grad; g.fillRect(0, 0, W, H);
      g.fillStyle = '#f4ecff'; fit(VENUE, 620, 120); g.fillText(VENUE, W / 2, H * 0.44);
      g.fillStyle = 'rgba(244,236,255,0.6)'; g.font = '700 24px system-ui, sans-serif';
      g.fillText(`${DJ_NAME} · ${(t % 1.6) < 1.1 ? 'PRESS PLAY' : ' '}`, W / 2, H * 0.72);
    } else {
      const [a, b] = colors;
      const drop = section === 'drop', brk = section === 'break', bld = section === 'build';
      g.fillStyle = brk ? '#05030c' : '#030308'; g.fillRect(0, 0, W, H);
      const pulse = Math.pow(1 - (beats % 1), 3);
      if (brk) {
        // the breakdown: slow drifting rings of colour
        for (let k = 0; k < 6; k++) {
          const r = 40 + k * 50 + Math.sin(t * 0.6 + k) * 12;
          g.strokeStyle = k % 2 ? a : b; g.globalAlpha = 0.35 - k * 0.04; g.lineWidth = 10;
          g.beginPath(); g.ellipse(W / 2, H / 2, r * 1.5, r, 0, 0, Math.PI * 2); g.stroke();
        }
        g.globalAlpha = 1;
      } else {
        // a tunnel of squares rushing toward you on the beat
        for (let k = 9; k >= 0; k--) {
          const z = (k + (beats % 1)) / 10, s = Math.pow(z, 2.2);
          const ww = 40 + s * W * 1.3, hh = 20 + s * H * 1.3;
          g.strokeStyle = k % 2 ? a : b; g.globalAlpha = Math.min(1, 0.2 + s * (drop ? 1.2 : 0.8)); g.lineWidth = 3 + s * (drop ? 22 : 10);
          g.strokeRect(W / 2 - ww / 2, H / 2 - hh / 2, ww, hh);
        }
        g.globalAlpha = 1;
      }
      // the bars across the bottom
      for (let i = 0; i < bars.length; i++) {
        const wave = 0.5 + 0.5 * Math.sin(t * (3 + (i % 7)) + i * 1.3);
        const target = 0.08 + level * 0.92 * (0.35 + 0.65 * wave) * (1 - Math.abs(i - 24) / 30);
        bars[i] += (target - bars[i]) * 0.4;
        g.fillStyle = i % 2 ? a : b; g.globalAlpha = brk ? 0.4 : 0.9;
        g.fillRect(i * 16 + 2, H - bars[i] * 80, 12, bars[i] * 80);
      }
      g.globalAlpha = 1;
      // the name, punched in on the beat
      const s = 1 + pulse * (drop ? 0.08 : 0.03);
      g.save(); g.translate(W / 2, H * 0.46); g.scale(s, s);
      g.fillStyle = '#ffffff'; g.globalAlpha = brk ? 0.55 : 0.92; fit(drop ? VENUE : DJ_NAME, 560, 92); g.fillText(drop ? VENUE : DJ_NAME, 0, 0);
      g.restore(); g.globalAlpha = 1;
      if (bld) {                                     // the build: a bar filling up, and the white flashes getting faster
        g.fillStyle = 'rgba(255,255,255,0.85)'; g.fillRect(W * 0.2, H * 0.72, W * 0.6 * build, 8);
        if (((beats * (build > 0.75 ? 4 : build > 0.4 ? 2 : 1)) % 1) < 0.12) { g.fillStyle = `rgba(255,255,255,${0.25 + build * 0.4})`; g.fillRect(0, 0, W, H); }
      }
      if (drop && pulse > 0.85) { g.fillStyle = 'rgba(255,255,255,0.35)'; g.fillRect(0, 0, W, H); }

  };
  texture.userData.update(0, 0, false, 0, ['#ff2a6d', '#05d9e8']);

}


/* ---------------------------------------------------------------------
   6. Building the room from the description
   --------------------------------------------------------------------- */
const toRadians = degrees => (degrees || 0) * Math.PI / 180;







// The scan wave shared by every Lofi/Mix/Code shader: where the code shows, and the glow at its edge.
const WAVE_GLSL = /* glsl */`
  uniform vec3 uWaveFrom;
  uniform float uWaveR, uWaveTarget;
  bool waveCode(vec3 w) {                       // true where this point shows code right now
    bool inside = distance(w, uWaveFrom) < uWaveR;
    return uWaveTarget > 0.5 ? inside : !inside;
  }
  float waveEdge(vec3 w) {                      // a bright band riding the front of the wave
    return 1.0 - smoothstep(0.0, 0.18 + uWaveR * 0.012, abs(distance(w, uWaveFrom) - uWaveR));
  }`;


// ---- Lofi-anime look: flat toon shading in three steps, with a dark ink outline.
let toonGradient = null, outlineMaterial = null;
function toonify(root) {
  if (!toonGradient) {
    toonGradient = new THREE.DataTexture(new Uint8Array([85, 160, 220]), 3, 1, THREE.RedFormat);
    toonGradient.minFilter = toonGradient.magFilter = THREE.NearestFilter;
    toonGradient.needsUpdate = true;
    outlineMaterial = new THREE.MeshBasicMaterial({ color: '#120c1a', side: THREE.BackSide });
    outlineMaterial.onBeforeCompile = shader => {
      shader.vertexShader = shader.vertexShader.replace('#include <begin_vertex>', 'vec3 transformed = position + normal * 0.0055;');
    };
  }
  const meshes = [];
  root.traverse(o => { if (o.isMesh && !o.userData.outline) meshes.push(o); });
  for (const mesh of meshes) {
    const m = mesh.material;
    if (mesh.userData.keepMaterial || !m.isMeshStandardMaterial) continue;
    mesh.material = new THREE.MeshToonMaterial({
      color: m.color, map: m.map, gradientMap: toonGradient,
      emissive: m.emissive, emissiveIntensity: m.emissiveIntensity,
      transparent: m.transparent, opacity: m.opacity, side: m.side,
    });
    m.dispose();
    mesh.geometry.computeBoundingSphere();
    if (mesh.geometry.boundingSphere.radius > 0.02 && !m.transparent) {
      const outline = new THREE.Mesh(mesh.geometry, outlineMaterial);
      outline.userData.outline = true;
      outline.raycast = () => {};
      mesh.add(outline);
    }
  }
}

// ---- An arm that can reach: shoulder, elbow and hand found each frame (two-bone IK).
const UP = new THREE.Vector3(0, 1, 0), FORWARD = new THREE.Vector3(0, 0, 1);
function buildArm(part, textures, shared, animated) {
  const group = new THREE.Group();
  const mat = color => new THREE.MeshStandardMaterial({ color, roughness: 0.9 });
  const [r1, r2] = part.radius || [0.055, 0.05];
  const upper = new THREE.Mesh(new THREE.CapsuleGeometry(r1, part.upper, 6, 14), mat(part.color));
  const lower = new THREE.Mesh(new THREE.CapsuleGeometry(r2, part.lower, 6, 14), mat(part.color));
  const hand = new THREE.Mesh(new THREE.SphereGeometry(0.04, 20, 14), mat(part.handColor));
  hand.scale.set(0.8, 0.95, 1.2);
  group.add(upper, lower, hand);
  const arm = { part, upper, lower, hand, held: null };
  if (part.stick) {
    // a drumstick held in the fist, pointing on along the forearm and a little down
    const stick = new THREE.Mesh(new THREE.CylinderGeometry(0.0075, 0.0055, 0.4, 8), new THREE.MeshStandardMaterial({ color: '#d8b886', roughness: 0.6 }));
    stick.rotation.x = toRadians(118);
    stick.position.set(0, -0.06, 0.09);
    stick.scale.set(1 / 0.8, 1 / 0.95, 1 / 1.2);
    hand.add(stick);
  }
  if (part.holds === 'can') {
    const can = new THREE.Mesh(new THREE.CylinderGeometry(0.034, 0.034, 0.12, 12), new THREE.MeshStandardMaterial({ color: '#d6303a', metalness: 0.4, roughness: 0.4 }));
    can.position.set(0, 0.035, 0.03);
    can.scale.set(1 / 0.8, 1 / 0.95, 1 / 1.2);
    hand.add(can);
    arm.held = can;
  }
  group.userData.arm = arm;
  solveArm(arm, new THREE.Vector3().fromArray(part.hand));
  if (part.anim) animated.push({ kind: part.anim, object: group, arm });

}

const ik = { S: new THREE.Vector3(), E: new THREE.Vector3(), H: new THREE.Vector3(), dir: new THREE.Vector3(), pole: new THREE.Vector3(), tmp: new THREE.Vector3() };
function placeBone(mesh, a, b) {
  mesh.position.copy(a).lerp(b, 0.5);
  mesh.quaternion.setFromUnitVectors(UP, ik.tmp.copy(b).sub(a).normalize());
}
function solveArm(arm, target) {
  const { part } = arm, L1 = part.upper, L2 = part.lower;
  const S = ik.S.fromArray(part.shoulder);
  const dir = ik.dir.copy(target).sub(S);
  let d = dir.length();
  dir.divideScalar(d || 1);
  d = Math.min(Math.max(d, Math.abs(L1 - L2) + 0.01), (L1 + L2) * 0.999);
  const a = (L1 * L1 - L2 * L2 + d * d) / (2 * d), h = Math.sqrt(Math.max(0, L1 * L1 - a * a));
  const pole = ik.pole.fromArray(part.pole);
  pole.addScaledVector(dir, -pole.dot(dir)).normalize();
  const E = ik.E.copy(S).addScaledVector(dir, a).addScaledVector(pole, h);
  const H = ik.H.copy(S).addScaledVector(dir, d);
  placeBone(arm.upper, S, E);
  placeBone(arm.lower, E, H);
  arm.hand.position.copy(H);
  arm.hand.quaternion.setFromUnitVectors(FORWARD, ik.tmp.copy(H).sub(E).normalize());
}


/* ---------------------------------------------------------------------
   Hologram view: the whole room (and the city) turns into falling code.
   Every surface gets the same shader: columns of glyphs raining down in
   blue, purple and white, glowing edges, a faint grid and a scan line.
   The lofi materials are kept and put back when you switch back.
   --------------------------------------------------------------------- */
function makeGlyphAtlas() {
  const chars = 'アイウカキクサシスタチツナニハヒマミムヤラリワン' + 'ABCDEFGHIJKLMNOPQRSTUVWXYZ' + '0123456789' + '<>=+';   // 24 + 26 + 10 + 4 = 64
  const size = 512, cell = 64;
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = size;
  const g = canvas.getContext('2d');
  g.fillStyle = '#000';
  g.fillRect(0, 0, size, size);
  g.fillStyle = '#fff';
  g.font = '600 44px ui-monospace, "SF Mono", Menlo, Consolas, "Hiragino Kaku Gothic Pro", "Yu Gothic", "Noto Sans JP", monospace';
  g.textAlign = 'center';
  g.textBaseline = 'middle';
  for (let i = 0; i < 64; i++) {
    g.save();
    g.translate((i % 8) * cell + cell / 2, Math.floor(i / 8) * cell + cell / 2 + 2);
    if (i < 24 && i % 2 === 1) g.scale(-1, 1);       // some katakana mirrored, like the films
    g.fillText(chars[i % chars.length], 0, 0);
    g.restore();
  }
  const texture = new THREE.CanvasTexture(canvas);
  texture.generateMipmaps = false;
  texture.minFilter = THREE.LinearFilter;
  texture.magFilter = THREE.LinearFilter;
  return texture;
}

const HOLO_GLSL = /* glsl */`
  uniform float uTime;
  uniform sampler2D uAtlas;
  float hhash(vec2 p) { p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
  // x: the falling trail, y: the bright white head of each column
  vec2 codeRain(vec2 uv, float cell, float seed) {
    vec2 g = uv / cell;
    vec2 c = floor(g), f = fract(g);
    float colSeed = hhash(vec2(c.x, seed));
    float speed = 3.0 + colSeed * 8.0;
    float len = 5.0 + colSeed * 14.0;
    float period = len * 3.2 + 8.0;
    float colOn = step(0.35, hhash(vec2(c.x, seed + 3.3)));     // about a third of the columns are empty
    float k = fract((c.y + uTime * speed) / period + colSeed) * period;
    float trail = k < len ? 1.0 - k / len : 0.0;
    float head = step(k, 1.0);
    float gi = floor(hhash(c + floor(uTime * (1.5 + colSeed * 5.0) + hhash(c) * 10.0)) * 64.0);
    vec2 a = vec2(mod(gi, 8.0), floor(gi / 8.0));
    vec2 fu = clamp(f, 0.06, 0.94);
    float m = texture2D(uAtlas, vec2((a.x + fu.x) / 8.0, 1.0 - (a.y + 1.0 - fu.y) / 8.0)).r;
    return vec2(m * trail * trail, m * head) * colOn;
  }`;

function makeHoloMaterial(shared, atlas, wave, boost = 1) {
  return new THREE.ShaderMaterial({
    side: THREE.DoubleSide,
    uniforms: { uTime: shared.uTime, uAtlas: { value: atlas }, uBoost: { value: boost }, ...wave },
    vertexShader: /* glsl */`
      varying vec3 vWorld, vNormal;
      void main() {
        vec4 local = vec4(position, 1.0);
        vec3 n = normal;
        #ifdef USE_INSTANCING
          local = instanceMatrix * local;
          n = mat3(instanceMatrix) * n;
        #endif
        vec4 world = modelMatrix * local;
        vWorld = world.xyz;
        vNormal = normalize(mat3(modelMatrix) * n);
        gl_Position = projectionMatrix * viewMatrix * world;
      }`,
    fragmentShader: HOLO_GLSL + WAVE_GLSL + /* glsl */`
      uniform float uBoost;
      varying vec3 vWorld, vNormal;
      void main() {
        if (!waveCode(vWorld)) discard;
        vec3 n = normalize(vNormal) * (gl_FrontFacing ? 1.0 : -1.0);
        vec3 V = normalize(cameraPosition - vWorld);
        float dist = length(cameraPosition - vWorld);
        // glyphs stay about the same size on screen: they step up in size with distance
        float cell = 0.045 * exp2(floor(log2(max(dist, 1.0) * 0.9)));
        vec3 an = abs(n);
        vec2 uv; float seed;
        if (an.y > an.x && an.y > an.z) { uv = vWorld.xz; seed = 1.0; }
        else if (an.x > an.z) { uv = vec2(-vWorld.z * sign(n.x), vWorld.y); seed = 2.0; }
        else { uv = vec2(vWorld.x * sign(n.z), vWorld.y); seed = 3.0; }
        vec2 rain = codeRain(uv, cell, seed);
        float hue = hhash(vec2(floor(uv.x / cell), seed + 7.0));
        vec3 rainColor = mix(vec3(0.28, 0.42, 1.0), vec3(0.68, 0.3, 1.0), hue);
        float facing = abs(dot(n, V));
        float rim = pow(1.0 - facing, 5.0) * smoothstep(0.0, 0.6, facing + 0.2);
        vec3 col = vec3(0.004, 0.005, 0.018) + vec3(0.01, 0.012, 0.04) * (an.x * 0.6 + max(n.y, 0.0) + an.z * 0.3);
        col += rainColor * rain.x * 1.2 + vec3(0.85, 0.9, 1.0) * rain.y * 1.8;
        col += vec3(0.42, 0.48, 1.0) * rim * 0.3;
        // a faint grid, like a wireframe
        vec2 gp = uv / (cell * 8.0);
        vec2 gw = abs(fract(gp - 0.5) - 0.5) / max(fwidth(gp), vec2(1e-4));
        col += vec3(0.3, 0.32, 0.85) * (1.0 - min(min(gw.x, gw.y), 1.0)) * 0.1;
        col += vec3(0.75, 0.82, 1.0) * waveEdge(vWorld) * 1.6;      // the glowing front of the scan wave
        col *= exp(-dist * 0.0032 / uBoost) * uBoost;
        gl_FragColor = vec4(col, 1.0);
      }`,
  });
}

// The void behind the city in hologram view: dim code falling across the whole sky.
function makeHoloSky(shared, atlas, wave) {
  const sky = new THREE.Mesh(new THREE.SphereGeometry(650, 32, 16), new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false,
    uniforms: { uTime: shared.uTime, uAtlas: { value: atlas }, ...wave },
    vertexShader: /* glsl */`
      varying vec3 vWorld;
      void main() { vec4 w = modelMatrix * vec4(position, 1.0); vWorld = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }`,
    fragmentShader: HOLO_GLSL + WAVE_GLSL + /* glsl */`
      varying vec3 vWorld;
      void main() {

        vec3 dir = normalize(vWorld - cameraPosition);
        // tall columns of glyphs filling the dome: a fine near layer and a bigger, dimmer one behind it
        vec2 uv = vec2(atan(dir.z, dir.x) / 6.2832 * 300.0, asin(clamp(dir.y, -1.0, 1.0)) * 95.0);
        vec2 rain = codeRain(uv, 1.0, 9.0) * step(0.45, hhash(vec2(floor(uv.x), 21.0)));            // fewer columns
        vec2 far = codeRain(uv * 0.55 + vec2(0.37, 0.0), 1.0, 4.0) * step(0.6, hhash(vec2(floor(uv.x * 0.55 + 0.37), 23.0)));
        float hue = hhash(vec2(floor(uv.x), 16.0)), hue2 = hhash(vec2(floor(uv.x * 0.55 + 0.37), 3.0));
        vec3 col = vec3(0.004, 0.005, 0.02)

          + mix(vec3(0.2, 0.3, 0.9), vec3(0.5, 0.22, 0.9), hue2) * far.x * 0.35 + vec3(0.8) * far.y * 0.45;
        col *= 0.3 + 0.7 * smoothstep(-0.15, 0.3, dir.y);
        col += vec3(0.75, 0.82, 1.0) * waveEdge(vWorld) * 0.8;
        gl_FragColor = vec4(col, 1.0);
      }`,
  }));
  sky.renderOrder = -10;
  sky.frustumCulled = false;
  sky.visible = false;
  sky.userData.holoSkip = true;
  return sky;
}

/* ---------------------------------------------------------------------
   Lofi / Mix / Code views, and the scan wave between them.
   The world is in two parts, the room and the city. Each part has a wave:
   a sphere that grows outward from where you stand. Inside it, that part
   shows its new look; outside, the old one. Every lofi surface has a code
   twin (same shape, code material) and each hides wherever the other shows.
   --------------------------------------------------------------------- */
function makeWave() {
  return { uWaveFrom: { value: new THREE.Vector3() }, uWaveR: { value: 1e6 }, uWaveTarget: { value: 0 } };
}


// Teach a built-in material (standard, toon, basic) to step aside where its part of the world is code.
function patchLofi(material, wave) {
  if (material.userData.wavePatched) return;
  material.userData.wavePatched = true;
  const previous = material.onBeforeCompile;
  material.onBeforeCompile = (shader, renderer) => {
    previous.call(material, shader, renderer);
    Object.assign(shader.uniforms, wave);
    shader.vertexShader = 'varying vec3 vWaveWorld;\n' + shader.vertexShader.replace('#include <project_vertex>', `#include <project_vertex>
      #ifdef USE_INSTANCING
        vWaveWorld = (modelMatrix * instanceMatrix * vec4(transformed, 1.0)).xyz;
      #else
        vWaveWorld = (modelMatrix * vec4(transformed, 1.0)).xyz;
      #endif`);
    shader.fragmentShader = 'varying vec3 vWaveWorld;\n' + WAVE_GLSL + '\n' + shader.fragmentShader.replace(
      '#include <clipping_planes_fragment>', '#include <clipping_planes_fragment>\n  if (waveCode(vWaveWorld)) discard;');
  };
  const previousKey = previous.toString();
  material.customProgramCacheKey = () => 'wave|' + previousKey;
  material.needsUpdate = true;
}

// Give every surface a code twin and wire both to their wave. Returns the materials to show/hide.
function makeCodeTwins(scene, waves, holo) {
  const lofi = { room: new Set(), city: new Set() };
  const meshes = [];
  scene.traverse(o => { if (o.isMesh && !o.userData.holoTwin && !o.userData.holoSkip) meshes.push(o); });
  for (const o of meshes) {
    let part = 'room';
    for (let p = o; p; p = p.parent) if (p.userData.city) { part = 'city'; break; }
    const m = o.material;
    if (!m.isShaderMaterial) { patchLofi(m, waves[part]); lofi[part].add(m); }
    else if (m.uniforms?.uWaveR) lofi[part].add(m);
    // things that only exist in the lofi look get no twin
    if (o.userData.outline || o.userData.keepMaterial || o.userData.holoHide || (m.isShaderMaterial && m.transparent)) continue;
    const twin = o.isInstancedMesh ? new THREE.InstancedMesh(o.geometry, holo[part], o.count) : new THREE.Mesh(o.geometry, holo[part]);
    if (o.isInstancedMesh) twin.instanceMatrix = o.instanceMatrix;
    twin.userData.holoTwin = true;
    twin.raycast = () => {};
    twin.frustumCulled = o.frustumCulled;
    o.add(twin);
  }

}

// Static clutter (books, papers, furniture without hotspots) baked into a few meshes, like the city's instancing:
// fewer separate things for the graphics card to draw.
function mergeStatic(scene, built, raycastTargets, mergeGeometries) {
  const buckets = new Map(), merged = [];
  const keep = new Set(['position', 'normal', 'uv']);
  for (const { group, spec } of built) {
    if (spec.hotspot || spec.style || spec.outside || spec.instanced || spec.rods) continue;
    group.updateMatrixWorld(true);
    const take = [];
    group.traverse(o => {
      if (!o.isMesh || o.isInstancedMesh || o.children.length) return;
      const m = o.material;
      if (!m.isMeshStandardMaterial || m.transparent || m.alphaTest || !o.visible) return;
      if (m.emissive.getHex() !== 0 && m.emissiveIntensity > 0) return;
      for (let p = o.parent; p && p !== group; p = p.parent) if (p.userData.anim) return;
      take.push(o);
    });
    for (const o of take) {
      const m = o.material;
      let g = o.geometry.clone().applyMatrix4(o.matrixWorld);
      if (g.index) g = g.toNonIndexed();
      for (const name of Object.keys(g.attributes)) if (!keep.has(name)) g.deleteAttribute(name);
      const n = g.attributes.position.count;
      if (!g.attributes.uv) g.setAttribute('uv', new THREE.BufferAttribute(new Float32Array(n * 2), 2));
      const colors = new Float32Array(n * 3);
      for (let i = 0; i < n; i++) colors.set([m.color.r, m.color.g, m.color.b], i * 3);
      g.setAttribute('color', new THREE.BufferAttribute(colors, 3));
      const rough = Math.min(1, Math.max(0.25, Math.round(m.roughness * 4) / 4)), metal = m.metalness >= 0.35 ? 0.55 : 0;
      const key = `${rough}|${metal}|${m.side}|${m.map ? m.map.uuid : ''}`;
      if (!buckets.has(key)) buckets.set(key, { roughness: rough, metalness: metal, side: m.side, map: m.map, list: [] });
      buckets.get(key).list.push(g);
      o.parent.remove(o);
      o.geometry.dispose();
      m.dispose();
      const at = raycastTargets.indexOf(o);
      if (at >= 0) raycastTargets.splice(at, 1);
    }
  }
  for (const { roughness, metalness, side, map, list } of buckets.values()) {
    const geometry = mergeGeometries(list, false);
    list.forEach(g => g.dispose());
    const mesh = new THREE.Mesh(geometry, new THREE.MeshStandardMaterial({ vertexColors: true, roughness, metalness, side, map }));
    mesh.name = 'merged';
    scene.add(mesh);
    raycastTargets.push(mesh);
    merged.push(mesh);
  }
  return merged;
}



/* ---------------------------------------------------------------------
   The club's own pieces
     buildInstanced    { instanced: { parts, at } }: one object's parts, repeated as GPU instances
     buildRods         { rods: { list } }: truss tubes as instances of one cylinder
     buildCrowd        the dancers, posed in the vertex shader, with skeletons for Mix
     buildClubLights   moving heads, lasers, the mirror ball's spots, strobes, the key light and the wash
     buildHaze         haze from the stage's hazer, and CO2 blasts on the drop
   --------------------------------------------------------------------- */
const noRaycast = () => {};

// Things you can click (and their moving parts) can't be baked into the big static meshes, but their
// still parts can be baked together: one mesh per object (or per moving part) and per kind of surface.
function mergeLocal(root, raycastTargets, mergeGeometries) {
  const containers = [root];
  root.traverse(o => { if (o !== root && !o.isMesh && (o.userData.anim || o.userData.arm || o.name)) containers.push(o); });
  const isContainer = new Set(containers);
  const keep = new Set(['position', 'normal', 'uv']);
  const relative = new THREE.Matrix4(), inverse = new THREE.Matrix4();
  root.updateMatrixWorld(true);
  for (const c of containers) {
    if (c.userData.arm) continue;
    inverse.copy(c.matrixWorld).invert();
    const buckets = new Map(), take = [];
    c.traverse(o => {
      if (!o.isMesh || o.isInstancedMesh || o.name || o.userData.outline || o.userData.keepMaterial && !o.material.isMeshStandardMaterial) return;
      if (o.children.some(ch => !ch.userData.outline)) return;
      for (let p = o.parent; p && p !== c; p = p.parent) if (isContainer.has(p)) return;
      const m = o.material, toon = m.isMeshToonMaterial;
      if (!(m.isMeshStandardMaterial || toon) || m.map || m.transparent) return;
      if (m.emissive.getHex() !== 0 && m.emissiveIntensity > 0) return;
      take.push(o);
    });
    if (take.length < 2) continue;
    for (const o of take) {

      relative.multiplyMatrices(inverse, o.matrixWorld);
      let g = o.geometry.clone().applyMatrix4(relative);
      if (g.index) g = g.toNonIndexed();
      for (const name of Object.keys(g.attributes)) if (!keep.has(name)) g.deleteAttribute(name);
      const n = g.attributes.position.count;
      if (!g.attributes.uv) g.setAttribute('uv', new THREE.BufferAttribute(new Float32Array(n * 2), 2));
      const colors = new Float32Array(n * 3);
      for (let i = 0; i < n; i++) colors.set([m.color.r, m.color.g, m.color.b], i * 3);
      g.setAttribute('color', new THREE.BufferAttribute(colors, 3));
      const key = toon ? `toon|${m.side}` : `${m.roughness.toFixed(2)}|${m.metalness.toFixed(2)}|${m.side}`;
      if (!buckets.has(key)) buckets.set(key, { toon, roughness: m.roughness, metalness: m.metalness, side: m.side, list: [] });
      buckets.get(key).list.push(g);
      o.parent.remove(o);
      for (const ch of o.children) ch.geometry === o.geometry || ch.geometry.dispose();
      o.geometry.dispose();
      m.dispose();
      const at = raycastTargets.indexOf(o);
      if (at >= 0) raycastTargets.splice(at, 1);
    }
    for (const { toon, roughness, metalness, side, list } of buckets.values()) {
      const geometry = mergeGeometries(list, false);
      list.forEach(g => g.dispose());
      const material = toon
        ? new THREE.MeshToonMaterial({ vertexColors: true, gradientMap: toonGradient, side })
        : new THREE.MeshStandardMaterial({ vertexColors: true, roughness, metalness, side });
      const mesh = new THREE.Mesh(geometry, material);

// ---- one object's parts as GPU instances: { instanced: { parts, at: [[x, y, z, turn?, scale?, color?], ...] } }
function buildInstanced(spec, textures, shared) {

// ---- truss and scaffold: every tube is an instance of one open cylinder
function buildRods(spec) {
  const list = spec.list;
  const geometry = new THREE.CylinderGeometry(1, 1, 1, 6, 1, true);
  const mesh = new THREE.InstancedMesh(geometry, new THREE.MeshStandardMaterial({ color: spec.color || '#3a3c42', metalness: spec.metalness ?? 0.6, roughness: spec.roughness ?? 0.45 }), list.length);

/* ---------------------------------------------------------------------
   The crowd. Every person is an instance of one low-poly figure (or, in
   Mix, of one skeleton), posed in the vertex shader from their own seeds:
   swaying and glancing about before the show; jumping, head-banging,
   fists and arms up during it. They step
   aside as you walk through them, and raise their hands to carry you when
   you crowd-surf. Everything reads uTime, the beat and the show level,
   which all stop while paused. Three looks share one set of instances:
   lofi (toon colours), skeleton (Mix) and code (Code view).
   Parts: 0 legs and hips · 1 torso · 2 head · 3 left arm · 4 right arm · 5 jaw

    { const g = new THREE.CapsuleGeometry(0.165, 0.3, 1, 7); g.scale(1.1, 1, 0.72); g.translate(0, 1.17, 0); push(g, 1, 1); }
    { const g = new THREE.CylinderGeometry(0.045, 0.05, 0.12, 6); g.translate(0, 1.46, 0); push(g, 1, 0); }

    ball(0.116, [0, 1.612, -0.006], 2, 3, [0.95, 1.0, 1.0], 10, 5, Math.PI * 0.52);
    box([0.2, 0.24, 0.06], [0, 1.5, -0.085], 2, 8);
    box([0.21, 0.36, 0.05], [0, 1.37, -0.095], 2, 12);                       // long hair down the back
    for (const s of [-1, 1]) box([0.045, 0.27, 0.07], [0.1 * s, 1.47, 0.0], 2, 12);  // and either side of the face

    for (const s of [-1, 1]) {
