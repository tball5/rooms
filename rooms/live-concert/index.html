/* ---------------------------------------------------------------------
   6. Building the room from the description
   --------------------------------------------------------------------- */
const toRadians = degrees => (degrees || 0) * Math.PI / 180;







// The scan wave shared by every Lofi/Mix/Code shader: where the code shows, and the glow at its edge.
const WAVE_GLSL = /* glsl */`
  uniform vec3 uWaveFrom;
  uniform float uWaveR, uWaveTarget;
  bool waveCode(vec3 w) {                       // true where this point shows code right now
    bool inside = distance(w, uWaveFrom) < uWaveR;
    return uWaveTarget > 0.5 ? inside : !inside;
  }
  float waveEdge(vec3 w) {                      // a bright band riding the front of the wave
    return 1.0 - smoothstep(0.0, 0.18 + uWaveR * 0.012, abs(distance(w, uWaveFrom) - uWaveR));
  }`;


// ---- Lofi-anime look: flat toon shading in three steps, with a dark ink outline.
let toonGradient = null, outlineMaterial = null;
function toonify(root) {
  if (!toonGradient) {
    toonGradient = new THREE.DataTexture(new Uint8Array([85, 160, 220]), 3, 1, THREE.RedFormat);
    toonGradient.minFilter = toonGradient.magFilter = THREE.NearestFilter;
    toonGradient.needsUpdate = true;
    outlineMaterial = new THREE.MeshBasicMaterial({ color: '#120c1a', side: THREE.BackSide });
    outlineMaterial.onBeforeCompile = shader => {
      shader.vertexShader = shader.vertexShader.replace('#include <begin_vertex>', 'vec3 transformed = position + normal * 0.0055;');
    };
  }
  const meshes = [];
  root.traverse(o => { if (o.isMesh && !o.userData.outline) meshes.push(o); });
  for (const mesh of meshes) {
    const m = mesh.material;
    if (mesh.userData.keepMaterial || !m.isMeshStandardMaterial) continue;
    mesh.material = new THREE.MeshToonMaterial({
      color: m.color, map: m.map, gradientMap: toonGradient,
      emissive: m.emissive, emissiveIntensity: m.emissiveIntensity,
      transparent: m.transparent, opacity: m.opacity, side: m.side,
    });
    m.dispose();
    mesh.geometry.computeBoundingSphere();
    if (mesh.geometry.boundingSphere.radius > 0.02 && !m.transparent) {
      const outline = new THREE.Mesh(mesh.geometry, outlineMaterial);
      outline.userData.outline = true;
      outline.raycast = () => {};
      mesh.add(outline);
    }
  }
}

// ---- An arm that can reach: shoulder, elbow and hand found each frame (two-bone IK).
const UP = new THREE.Vector3(0, 1, 0), FORWARD = new THREE.Vector3(0, 0, 1);
function buildArm(part, textures, shared, animated) {
  const group = new THREE.Group();
  const mat = color => new THREE.MeshStandardMaterial({ color, roughness: 0.9 });
  const [r1, r2] = part.radius || [0.055, 0.05];
  const upper = new THREE.Mesh(new THREE.CapsuleGeometry(r1, part.upper, 6, 14), mat(part.color));
  const lower = new THREE.Mesh(new THREE.CapsuleGeometry(r2, part.lower, 6, 14), mat(part.color));
  const hand = new THREE.Mesh(new THREE.SphereGeometry(0.04, 20, 14), mat(part.handColor));
  hand.scale.set(0.8, 0.95, 1.2);
  group.add(upper, lower, hand);
  const arm = { part, upper, lower, hand, held: null };
  if (part.stick) {
    // a drumstick held in the fist, pointing on along the forearm and a little down
    const stick = new THREE.Mesh(new THREE.CylinderGeometry(0.0075, 0.0055, 0.4, 8), new THREE.MeshStandardMaterial({ color: '#d8b886', roughness: 0.6 }));
    stick.rotation.x = toRadians(118);
    stick.position.set(0, -0.06, 0.09);
    stick.scale.set(1 / 0.8, 1 / 0.95, 1 / 1.2);
    hand.add(stick);
  }
  if (part.holds === 'can') {
    const can = new THREE.Mesh(new THREE.CylinderGeometry(0.034, 0.034, 0.12, 12), new THREE.MeshStandardMaterial({ color: '#d6303a', metalness: 0.4, roughness: 0.4 }));
    can.position.set(0, 0.035, 0.03);
    can.scale.set(1 / 0.8, 1 / 0.95, 1 / 1.2);
    hand.add(can);
    arm.held = can;
  }
  group.userData.arm = arm;
  solveArm(arm, new THREE.Vector3().fromArray(part.hand));
  if (part.anim) animated.push({ kind: part.anim, object: group, arm });
  return group;
}

const ik = { S: new THREE.Vector3(), E: new THREE.Vector3(), H: new THREE.Vector3(), dir: new THREE.Vector3(), pole: new THREE.Vector3(), tmp: new THREE.Vector3() };
function placeBone(mesh, a, b) {
  mesh.position.copy(a).lerp(b, 0.5);
  mesh.quaternion.setFromUnitVectors(UP, ik.tmp.copy(b).sub(a).normalize());
}
function solveArm(arm, target) {
  const { part } = arm, L1 = part.upper, L2 = part.lower;
  const S = ik.S.fromArray(part.shoulder);
  const dir = ik.dir.copy(target).sub(S);
  let d = dir.length();
  dir.divideScalar(d || 1);
  d = Math.min(Math.max(d, Math.abs(L1 - L2) + 0.01), (L1 + L2) * 0.999);
  const a = (L1 * L1 - L2 * L2 + d * d) / (2 * d), h = Math.sqrt(Math.max(0, L1 * L1 - a * a));
  const pole = ik.pole.fromArray(part.pole);
  pole.addScaledVector(dir, -pole.dot(dir)).normalize();
  const E = ik.E.copy(S).addScaledVector(dir, a).addScaledVector(pole, h);
  const H = ik.H.copy(S).addScaledVector(dir, d);
  placeBone(arm.upper, S, E);
  placeBone(arm.lower, E, H);
  arm.hand.position.copy(H);
  arm.hand.quaternion.setFromUnitVectors(FORWARD, ik.tmp.copy(H).sub(E).normalize());
}


/* ---------------------------------------------------------------------
   Hologram view: the whole room (and the city) turns into falling code.
   Every surface gets the same shader: columns of glyphs raining down in
   blue, purple and white, glowing edges, a faint grid and a scan line.
   The lofi materials are kept and put back when you switch back.
   --------------------------------------------------------------------- */
function makeGlyphAtlas() {
  const chars = 'アイウカキクサシスタチツナニハヒマミムヤラリワン' + 'ABCDEFGHIJKLMNOPQRSTUVWXYZ' + '0123456789' + '<>=+';   // 24 + 26 + 10 + 4 = 64
  const size = 512, cell = 64;
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = size;
  const g = canvas.getContext('2d');
  g.fillStyle = '#000';
  g.fillRect(0, 0, size, size);
  g.fillStyle = '#fff';
  g.font = '600 44px ui-monospace, "SF Mono", Menlo, Consolas, "Hiragino Kaku Gothic Pro", "Yu Gothic", "Noto Sans JP", monospace';
  g.textAlign = 'center';
  g.textBaseline = 'middle';
  for (let i = 0; i < 64; i++) {
    g.save();
    g.translate((i % 8) * cell + cell / 2, Math.floor(i / 8) * cell + cell / 2 + 2);
    if (i < 24 && i % 2 === 1) g.scale(-1, 1);       // some katakana mirrored, like the films
    g.fillText(chars[i % chars.length], 0, 0);
    g.restore();
  }
  const texture = new THREE.CanvasTexture(canvas);
  texture.generateMipmaps = false;
  texture.minFilter = THREE.LinearFilter;
  texture.magFilter = THREE.LinearFilter;
  return texture;
}

const HOLO_GLSL = /* glsl */`
  uniform float uTime;
  uniform sampler2D uAtlas;
  float hhash(vec2 p) { p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
  // x: the falling trail, y: the bright white head of each column
  vec2 codeRain(vec2 uv, float cell, float seed) {
    vec2 g = uv / cell;
    vec2 c = floor(g), f = fract(g);
    float colSeed = hhash(vec2(c.x, seed));
    float speed = 3.0 + colSeed * 8.0;
    float len = 5.0 + colSeed * 14.0;
    float period = len * 3.2 + 8.0;
    float colOn = step(0.35, hhash(vec2(c.x, seed + 3.3)));     // about a third of the columns are empty
    float k = fract((c.y + uTime * speed) / period + colSeed) * period;
    float trail = k < len ? 1.0 - k / len : 0.0;
    float head = step(k, 1.0);
    float gi = floor(hhash(c + floor(uTime * (1.5 + colSeed * 5.0) + hhash(c) * 10.0)) * 64.0);
    vec2 a = vec2(mod(gi, 8.0), floor(gi / 8.0));
    vec2 fu = clamp(f, 0.06, 0.94);
    float m = texture2D(uAtlas, vec2((a.x + fu.x) / 8.0, 1.0 - (a.y + 1.0 - fu.y) / 8.0)).r;
    return vec2(m * trail * trail, m * head) * colOn;
  }`;

function makeHoloMaterial(shared, atlas, wave, boost = 1) {
  return new THREE.ShaderMaterial({
    side: THREE.DoubleSide,
    uniforms: { uTime: shared.uTime, uAtlas: { value: atlas }, uBoost: { value: boost }, ...wave },
    vertexShader: /* glsl */`
      varying vec3 vWorld, vNormal;
      void main() {
        vec4 local = vec4(position, 1.0);
        vec3 n = normal;
        #ifdef USE_INSTANCING
          local = instanceMatrix * local;
          n = mat3(instanceMatrix) * n;
        #endif
        vec4 world = modelMatrix * local;
        vWorld = world.xyz;
        vNormal = normalize(mat3(modelMatrix) * n);
        gl_Position = projectionMatrix * viewMatrix * world;
      }`,
    fragmentShader: HOLO_GLSL + WAVE_GLSL + /* glsl */`
      uniform float uBoost;
      varying vec3 vWorld, vNormal;
      void main() {
        if (!waveCode(vWorld)) discard;
        vec3 n = normalize(vNormal) * (gl_FrontFacing ? 1.0 : -1.0);
        vec3 V = normalize(cameraPosition - vWorld);
        float dist = length(cameraPosition - vWorld);
        // glyphs stay about the same size on screen: they step up in size with distance
        float cell = 0.045 * exp2(floor(log2(max(dist, 1.0) * 0.9)));
        vec3 an = abs(n);
        vec2 uv; float seed;
        if (an.y > an.x && an.y > an.z) { uv = vWorld.xz; seed = 1.0; }
        else if (an.x > an.z) { uv = vec2(-vWorld.z * sign(n.x), vWorld.y); seed = 2.0; }
        else { uv = vec2(vWorld.x * sign(n.z), vWorld.y); seed = 3.0; }
        vec2 rain = codeRain(uv, cell, seed);
        float hue = hhash(vec2(floor(uv.x / cell), seed + 7.0));
        vec3 rainColor = mix(vec3(0.28, 0.42, 1.0), vec3(0.68, 0.3, 1.0), hue);
        float facing = abs(dot(n, V));
        float rim = pow(1.0 - facing, 5.0) * smoothstep(0.0, 0.6, facing + 0.2);
        vec3 col = vec3(0.004, 0.005, 0.018) + vec3(0.01, 0.012, 0.04) * (an.x * 0.6 + max(n.y, 0.0) + an.z * 0.3);
        col += rainColor * rain.x * 1.2 + vec3(0.85, 0.9, 1.0) * rain.y * 1.8;
        col += vec3(0.42, 0.48, 1.0) * rim * 0.3;
        // a faint grid, like a wireframe
        vec2 gp = uv / (cell * 8.0);
        vec2 gw = abs(fract(gp - 0.5) - 0.5) / max(fwidth(gp), vec2(1e-4));
        col += vec3(0.3, 0.32, 0.85) * (1.0 - min(min(gw.x, gw.y), 1.0)) * 0.1;
        col += vec3(0.75, 0.82, 1.0) * waveEdge(vWorld) * 1.6;      // the glowing front of the scan wave
        col *= exp(-dist * 0.0032 / uBoost) * uBoost;
        gl_FragColor = vec4(col, 1.0);
      }`,
  });
}

// The void behind the city in hologram view: dim code falling across the whole sky.
function makeHoloSky(shared, atlas, wave) {
  const sky = new THREE.Mesh(new THREE.SphereGeometry(650, 32, 16), new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false,
    uniforms: { uTime: shared.uTime, uAtlas: { value: atlas }, ...wave },
    vertexShader: /* glsl */`
      varying vec3 vWorld;
      void main() { vec4 w = modelMatrix * vec4(position, 1.0); vWorld = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }`,
    fragmentShader: HOLO_GLSL + WAVE_GLSL + /* glsl */`
      varying vec3 vWorld;
      void main() {
        if (!waveCode(vWorld)) discard;
        vec3 dir = normalize(vWorld - cameraPosition);
        // tall columns of glyphs filling the dome: a fine near layer and a bigger, dimmer one behind it
        vec2 uv = vec2(atan(dir.z, dir.x) / 6.2832 * 300.0, asin(clamp(dir.y, -1.0, 1.0)) * 95.0);
        vec2 rain = codeRain(uv, 1.0, 9.0) * step(0.45, hhash(vec2(floor(uv.x), 21.0)));            // fewer columns
        vec2 far = codeRain(uv * 0.55 + vec2(0.37, 0.0), 1.0, 4.0) * step(0.6, hhash(vec2(floor(uv.x * 0.55 + 0.37), 23.0)));
        float hue = hhash(vec2(floor(uv.x), 16.0)), hue2 = hhash(vec2(floor(uv.x * 0.55 + 0.37), 3.0));
        vec3 col = vec3(0.004, 0.005, 0.02)
          + mix(vec3(0.25, 0.4, 1.0), vec3(0.65, 0.28, 1.0), hue) * rain.x * 0.95 + vec3(0.9, 0.93, 1.0) * rain.y * 1.25
          + mix(vec3(0.2, 0.3, 0.9), vec3(0.5, 0.22, 0.9), hue2) * far.x * 0.35 + vec3(0.8) * far.y * 0.45;
        col *= 0.3 + 0.7 * smoothstep(-0.15, 0.3, dir.y);
        col += vec3(0.75, 0.82, 1.0) * waveEdge(vWorld) * 0.8;
        gl_FragColor = vec4(col, 1.0);
      }`,
  }));
  sky.renderOrder = -10;
  sky.frustumCulled = false;
  sky.visible = false;
  sky.userData.holoSkip = true;
  return sky;
}

/* ---------------------------------------------------------------------
   Lofi / Mix / Code views, and the scan wave between them.
   The world is in two parts, the room and the city. Each part has a wave:
   a sphere that grows outward from where you stand. Inside it, that part
   shows its new look; outside, the old one. Every lofi surface has a code
   twin (same shape, code material) and each hides wherever the other shows.
   --------------------------------------------------------------------- */
function makeWave() {
  return { uWaveFrom: { value: new THREE.Vector3() }, uWaveR: { value: 1e6 }, uWaveTarget: { value: 0 } };
}


// Teach a built-in material (standard, toon, basic) to step aside where its part of the world is code.
function patchLofi(material, wave) {
  if (material.userData.wavePatched) return;
  material.userData.wavePatched = true;
  const previous = material.onBeforeCompile;
  material.onBeforeCompile = (shader, renderer) => {
    previous.call(material, shader, renderer);
    Object.assign(shader.uniforms, wave);
    shader.vertexShader = 'varying vec3 vWaveWorld;\n' + shader.vertexShader.replace('#include <project_vertex>', `#include <project_vertex>
      #ifdef USE_INSTANCING
        vWaveWorld = (modelMatrix * instanceMatrix * vec4(transformed, 1.0)).xyz;
      #else
        vWaveWorld = (modelMatrix * vec4(transformed, 1.0)).xyz;
      #endif`);
    shader.fragmentShader = 'varying vec3 vWaveWorld;\n' + WAVE_GLSL + '\n' + shader.fragmentShader.replace(
      '#include <clipping_planes_fragment>', '#include <clipping_planes_fragment>\n  if (waveCode(vWaveWorld)) discard;');
  };
  const previousKey = previous.toString();
  material.customProgramCacheKey = () => 'wave|' + previousKey;
  material.needsUpdate = true;
}

// Give every surface a code twin and wire both to their wave. Returns the materials to show/hide.
function makeCodeTwins(scene, waves, holo) {
  const lofi = { room: new Set(), city: new Set() };
  const meshes = [];
  scene.traverse(o => { if (o.isMesh && !o.userData.holoTwin && !o.userData.holoSkip) meshes.push(o); });
  for (const o of meshes) {
    let part = 'room';
    for (let p = o; p; p = p.parent) if (p.userData.city) { part = 'city'; break; }
    const m = o.material;
    if (!m.isShaderMaterial) { patchLofi(m, waves[part]); lofi[part].add(m); }
    else if (m.uniforms?.uWaveR) lofi[part].add(m);
    // things that only exist in the lofi look get no twin
    if (o.userData.outline || o.userData.keepMaterial || o.userData.holoHide || (m.isShaderMaterial && m.transparent)) continue;
    const twin = o.isInstancedMesh ? new THREE.InstancedMesh(o.geometry, holo[part], o.count) : new THREE.Mesh(o.geometry, holo[part]);
    if (o.isInstancedMesh) twin.instanceMatrix = o.instanceMatrix;
    twin.userData.holoTwin = true;
    twin.raycast = () => {};
    twin.frustumCulled = o.frustumCulled;
    o.add(twin);
  }
  return lofi;
}

// Static clutter (books, papers, furniture without hotspots) baked into a few meshes, like the city's instancing:
// fewer separate things for the graphics card to draw.
function mergeStatic(scene, built, raycastTargets, mergeGeometries) {
  const buckets = new Map(), merged = [];
  const keep = new Set(['position', 'normal', 'uv']);
  for (const { group, spec } of built) {
    if (spec.hotspot || spec.style || spec.outside || spec.instanced || spec.rods) continue;
    group.updateMatrixWorld(true);
    const take = [];
    group.traverse(o => {
      if (!o.isMesh || o.isInstancedMesh || o.children.length) return;
      const m = o.material;
      if (!m.isMeshStandardMaterial || m.transparent || m.alphaTest || !o.visible) return;
      if (m.emissive.getHex() !== 0 && m.emissiveIntensity > 0) return;
      for (let p = o.parent; p && p !== group; p = p.parent) if (p.userData.anim) return;
      take.push(o);
    });
    for (const o of take) {
      const m = o.material;
      let g = o.geometry.clone().applyMatrix4(o.matrixWorld);
      if (g.index) g = g.toNonIndexed();
      for (const name of Object.keys(g.attributes)) if (!keep.has(name)) g.deleteAttribute(name);
      const n = g.attributes.position.count;
      if (!g.attributes.uv) g.setAttribute('uv', new THREE.BufferAttribute(new Float32Array(n * 2), 2));
      const colors = new Float32Array(n * 3);
      for (let i = 0; i < n; i++) colors.set([m.color.r, m.color.g, m.color.b], i * 3);
      g.setAttribute('color', new THREE.BufferAttribute(colors, 3));
      const rough = Math.min(1, Math.max(0.25, Math.round(m.roughness * 4) / 4)), metal = m.metalness >= 0.35 ? 0.55 : 0;
      const key = `${rough}|${metal}|${m.side}|${m.map ? m.map.uuid : ''}`;
      if (!buckets.has(key)) buckets.set(key, { roughness: rough, metalness: metal, side: m.side, map: m.map, list: [] });
      buckets.get(key).list.push(g);
      o.parent.remove(o);
      o.geometry.dispose();
      m.dispose();
      const at = raycastTargets.indexOf(o);
      if (at >= 0) raycastTargets.splice(at, 1);
    }
  }
  for (const { roughness, metalness, side, map, list } of buckets.values()) {
    const geometry = mergeGeometries(list, false);
    list.forEach(g => g.dispose());
    const mesh = new THREE.Mesh(geometry, new THREE.MeshStandardMaterial({ vertexColors: true, roughness, metalness, side, map }));
    mesh.name = 'merged';
    scene.add(mesh);
    raycastTargets.push(mesh);
    merged.push(mesh);
  }
  return merged;
}



/* ---------------------------------------------------------------------
   The festival's own pieces
     buildGround       the trampled field, the land beyond the fence, hills on the horizon
     buildNightSky     stars, the Milky Way, a moon, a faint town glow (outside: Mix turns it to code)
     buildInstanced    { instanced: { parts, at } }: one object's parts, repeated as GPU instances
     buildRods         { rods: { list } }: truss tubes and scaffold as instances of one cylinder
     buildCrowd        hundreds of people, posed in the vertex shader, with a skeleton look for Mix
     buildStageRig     moving heads with beams, PAR cans, blinders, the two stage lights
     buildStageSmoke   the CO2 burst when the show starts and the haze that hangs about
     buildGlowPoints   soft glows on lamps and bulbs, and the far-off town's lights
     buildSurfHands    hands holding you up while you crowd-surf
   --------------------------------------------------------------------- */
const noRaycast = () => {};

// Things you can click (and their moving parts) can't be baked into the big static meshes, but their
// still parts can be baked together: one mesh per object (or per moving part) and per kind of surface.
function mergeLocal(root, raycastTargets, mergeGeometries) {
  const containers = [root];
  root.traverse(o => { if (o !== root && !o.isMesh && (o.userData.anim || o.userData.arm || o.name)) containers.push(o); });
  const isContainer = new Set(containers);
  const keep = new Set(['position', 'normal', 'uv']);
  const relative = new THREE.Matrix4(), inverse = new THREE.Matrix4();
  root.updateMatrixWorld(true);
  for (const c of containers) {
    if (c.userData.arm) continue;
    inverse.copy(c.matrixWorld).invert();
    const buckets = new Map(), take = [];
    c.traverse(o => {
      if (!o.isMesh || o.isInstancedMesh || o.name || o.userData.outline || o.userData.keepMaterial && !o.material.isMeshStandardMaterial) return;
      if (o.children.some(ch => !ch.userData.outline)) return;
      for (let p = o.parent; p && p !== c; p = p.parent) if (isContainer.has(p)) return;
      const m = o.material, toon = m.isMeshToonMaterial;
      if (!(m.isMeshStandardMaterial || toon) || m.map || m.transparent) return;
      if (m.emissive.getHex() !== 0 && m.emissiveIntensity > 0) return;
      take.push(o);
    });
    if (take.length < 2) continue;
    for (const o of take) {
      const m = o.material, toon = !!m.isMeshToonMaterial;
      relative.multiplyMatrices(inverse, o.matrixWorld);
      let g = o.geometry.clone().applyMatrix4(relative);
      if (g.index) g = g.toNonIndexed();
      for (const name of Object.keys(g.attributes)) if (!keep.has(name)) g.deleteAttribute(name);
      const n = g.attributes.position.count;
      if (!g.attributes.uv) g.setAttribute('uv', new THREE.BufferAttribute(new Float32Array(n * 2), 2));
      const colors = new Float32Array(n * 3);
      for (let i = 0; i < n; i++) colors.set([m.color.r, m.color.g, m.color.b], i * 3);
      g.setAttribute('color', new THREE.BufferAttribute(colors, 3));
      const key = toon ? `toon|${m.side}` : `${m.roughness.toFixed(2)}|${m.metalness.toFixed(2)}|${m.side}`;
      if (!buckets.has(key)) buckets.set(key, { toon, roughness: m.roughness, metalness: m.metalness, side: m.side, list: [] });
      buckets.get(key).list.push(g);
      o.parent.remove(o);
      for (const ch of o.children) ch.geometry === o.geometry || ch.geometry.dispose();
      o.geometry.dispose();
      m.dispose();
      const at = raycastTargets.indexOf(o);
      if (at >= 0) raycastTargets.splice(at, 1);
    }
    for (const { toon, roughness, metalness, side, list } of buckets.values()) {
      const geometry = mergeGeometries(list, false);
      list.forEach(g => g.dispose());
      const material = toon
        ? new THREE.MeshToonMaterial({ vertexColors: true, gradientMap: toonGradient, side })
        : new THREE.MeshStandardMaterial({ vertexColors: true, roughness, metalness, side });
      const mesh = new THREE.Mesh(geometry, material);
      if (toon) {
        const outline = new THREE.Mesh(geometry, outlineMaterial);
        outline.userData.outline = true;
        outline.raycast = noRaycast;
        mesh.add(outline);
      }
      c.add(mesh);
      raycastTargets.push(mesh);
    }
  }
}

// ---- the ground: grass worn to mud where the crowd stands, paths to the tents; land and hills beyond
function buildGround(scene, textures, raycastTargets) {
  const size = 360, seg = 120;
  const geometry = new THREE.PlaneGeometry(size, size, seg, seg).rotateX(-Math.PI / 2);
  const pos = geometry.attributes.position, colors = new Float32Array(pos.count * 3);
  const R = seededRandom(2718), mud = new THREE.Color('#8a6a4a'), grass = new THREE.Color('#c8d4b0'), dark = new THREE.Color('#6a7a5a'), c = new THREE.Color();
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), z = pos.getZ(i);
    const half = 9 + Math.max(0, z + 12) * 0.42;
    let worn = z > -12.5 && z < 30 ? (1 - THREE.MathUtils.smoothstep(Math.abs(x), half - 3, half + 2)) * (1 - THREE.MathUtils.smoothstep(z, 12, 30)) : 0;
    worn = Math.max(worn, 1 - THREE.MathUtils.smoothstep(Math.abs(z - 4), 0, 2.2 + Math.abs(x) * 0.02) * (Math.abs(x) < 30 ? 1 : 0) * 0.9);   // the path across to the tents
    worn = Math.max(worn, (1 - THREE.MathUtils.smoothstep(Math.abs(x), 0, 3)) * THREE.MathUtils.smoothstep(z, 14, 18) * (z < 45 ? 0.8 : 0));   // to the gate
    if (Math.abs(x) < 10.5 && z < -12 && z > -23) worn = 1;
    const outside = Math.abs(x) > 38.4 || z > 44.5 || z < -30.2;
    c.copy(outside ? dark : grass).lerp(mud, Math.min(1, worn * (0.75 + R() * 0.25)));
    c.multiplyScalar(0.85 + R() * 0.15);
    colors.set([c.r, c.g, c.b], i * 3);
  }
  geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  textures.grass.repeat.set(size / 3.5, size / 3.5);
  const ground = new THREE.Mesh(geometry, new THREE.MeshStandardMaterial({ map: textures.grass, vertexColors: true, roughness: 1 }));
  scene.add(ground);
  raycastTargets.push(ground);
  // hills on the horizon: two rings of dark silhouettes against the sky (no fog: they stay crisp)
  for (const [r0, r1, hMin, hMax, color, seed] of [[200, 240, 8, 30, '#0b111c', 3], [260, 300, 18, 52, '#0f1626', 7]]) {
    const n = 96, verts = [], hr = seededRandom(seed);
    const heights = Array.from({ length: n + 1 }, (_, i) => hMin + (hMax - hMin) * (0.5 + 0.3 * Math.sin(i * 0.37 + seed) + 0.2 * Math.sin(i * 1.13 + seed * 2)) * (0.8 + hr() * 0.2));
    heights[n] = heights[0];
    for (let i = 0; i < n; i++) {
      const a0 = i / n * Math.PI * 2, a1 = (i + 1) / n * Math.PI * 2;
      const p = (a, r, h) => [Math.cos(a) * r, h, Math.sin(a) * r];
      const A = p(a0, r0, -2), Bq = p(a1, r0, -2), Cq = p(a1, r1, heights[i + 1]), D = p(a0, r1, heights[i]);
      verts.push(...A, ...Cq, ...Bq, ...A, ...D, ...Cq);
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(verts), 3));
    g.computeVertexNormals();
    const hills = new THREE.Mesh(g, new THREE.MeshBasicMaterial({ color, fog: false, side: THREE.DoubleSide }));
    hills.raycast = noRaycast;
    scene.add(hills);
  }
}

// ---- the sky: deep night blue, thousands of stars, the Milky Way, a moon with a halo, a town's glow
const MOON_DIR = new THREE.Vector3(-0.42, 0.4, -0.81).normalize();
function buildNightSky(scene, shared) {
  const group = new THREE.Group();
  group.userData.city = true;                               // the outside part of the world: code in Mix
  const sky = new THREE.Mesh(new THREE.SphereGeometry(600, 48, 24), new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false, fog: false,
    uniforms: { uTime: shared.uTime, uMoon: { value: MOON_DIR }, ...shared.cityWave },
    vertexShader: /* glsl */`
      varying vec3 vWorld;
      void main() { vec4 w = modelMatrix * vec4(position, 1.0); vWorld = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }`,
    fragmentShader: WAVE_GLSL + /* glsl */`
      uniform float uTime;
      uniform vec3 uMoon;
      varying vec3 vWorld;
      float hash(vec2 p) { p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
      float noise(vec2 p) { vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
        return mix(mix(hash(i), hash(i + vec2(1, 0)), f.x), mix(hash(i + vec2(0, 1)), hash(i + vec2(1, 1)), f.x), f.y); }
      float stars(vec3 dir, float k, float thresh, float seed) {
        vec2 sp = vec2(atan(dir.z, dir.x) * k * 0.5, asin(clamp(dir.y, -1.0, 1.0)) * k * 0.5);
        vec2 cell = floor(sp), f = fract(sp) - 0.5;
        float h = hash(cell + seed);
        vec2 off = vec2(hash(cell + seed + 1.7), hash(cell + seed + 4.1)) - 0.5;
        float s = step(thresh, h) * smoothstep(0.18, 0.02, length(f - off * 0.6));
        return s * (0.65 + 0.35 * sin(uTime * (1.5 + h * 4.0) + h * 60.0)) * (0.4 + 0.6 * fract(h * 13.7));
      }
      void main() {
        if (waveCode(vWorld)) discard;
        vec3 dir = normalize(vWorld - cameraPosition);
        float y = dir.y;
        vec3 col = mix(vec3(0.03, 0.04, 0.085), vec3(0.003, 0.005, 0.016), smoothstep(-0.02, 0.55, y));
        // a town over the hills, off to the right of the stage
        vec2 h2 = normalize(dir.xz + 1e-4);
        col += vec3(0.16, 0.07, 0.03) * exp(-max(y, 0.0) * 10.0) * pow(max(dot(h2, normalize(vec2(0.75, -0.66))), 0.0), 5.0);
        // the Milky Way: a soft band across the sky
        float band = dot(dir, normalize(vec3(0.55, 0.62, 0.55)));
        float mw = exp(-band * band * 16.0) * (0.5 + 0.5 * noise(dir.xz * 7.0 + dir.y * 3.0)) * (0.6 + 0.4 * noise(dir.xy * 19.0));
        float up = smoothstep(0.02, 0.3, y);
        col += vec3(0.07, 0.075, 0.11) * mw * up;
        // stars: a dense faint layer and a sparse bright one, thicker in the Milky Way
        float s = stars(dir, 420.0, 0.93 - mw * 0.08, 0.0) * 0.5 + stars(dir, 160.0, 0.975, 7.0) * 1.3;
        col += vec3(0.85, 0.88, 1.0) * s * up;
        // the moon
        float md = dot(dir, uMoon);
        float disc = smoothstep(0.99935, 0.99952, md);
        float crater = noise(dir.xy * 900.0) * 0.25 + noise(dir.yz * 2400.0) * 0.12;
        col = mix(col, vec3(0.92, 0.9, 0.82) * (1.0 - crater), disc);
        col += vec3(0.25, 0.28, 0.4) * exp((md - 1.0) * 220.0) * 0.5 + vec3(0.06, 0.07, 0.11) * exp((md - 1.0) * 18.0);
        col = mix(col, vec3(0.025, 0.03, 0.05), step(y, -0.01));
        gl_FragColor = vec4(col, 1.0);
      }`,
  }));
  sky.renderOrder = -10;
  sky.frustumCulled = false;
  sky.userData.holoHide = true;
  sky.raycast = noRaycast;
  group.add(sky);
  scene.add(group);
  return group;
}

// ---- one object's parts as GPU instances: { instanced: { parts, at: [[x, y, z, turn?, scale?, color?], ...] } }
function buildInstanced(spec, textures, shared) {
  const { parts, at } = spec.instanced, mergeGeometries = shared.mergeGeometries;
  const group = new THREE.Group(), tmp = new THREE.Group();
  for (const part of parts) tmp.add(buildPart(part, textures, shared, []));
  tmp.updateMatrixWorld(true);
  const buckets = new Map(), keep = new Set(['position', 'normal', 'uv']);
  tmp.traverse(o => {
    if (!o.isMesh || o.isInstancedMesh) return;
    const m = o.material, glow = m.isMeshBasicMaterial || (m.emissive && m.emissive.getHex() !== 0 && m.emissiveIntensity > 0);
    let g = o.geometry.clone().applyMatrix4(o.matrixWorld);
    if (g.index) g = g.toNonIndexed();
    for (const name of Object.keys(g.attributes)) if (!keep.has(name)) g.deleteAttribute(name);
    const n = g.attributes.position.count;
    if (!g.attributes.uv) g.setAttribute('uv', new THREE.BufferAttribute(new Float32Array(n * 2), 2));
    const c = glow && !m.isMeshBasicMaterial ? m.emissive.clone().multiplyScalar(m.emissiveIntensity) : m.color;
    const colors = new Float32Array(n * 3);
    for (let i = 0; i < n; i++) colors.set([c.r, c.g, c.b], i * 3);
    g.setAttribute('color', new THREE.BufferAttribute(colors, 3));
    const key = `${m.map ? m.map.uuid : ''}|${glow}|${m.alphaTest}|${m.side}|${m.metalness ?? 0}`;
    if (!buckets.has(key)) buckets.set(key, { glow, map: m.map, alphaTest: m.alphaTest, side: m.side, roughness: m.roughness ?? 1, metalness: m.metalness ?? 0, list: [] });
    buckets.get(key).list.push(g);
  });
  tmp.traverse(o => { o.geometry?.dispose(); o.material?.dispose?.(); });
  const matrix = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler(), p = new THREE.Vector3(), s = new THREE.Vector3(), col = new THREE.Color();
  for (const b of buckets.values()) {
    const geometry = mergeGeometries(b.list, false);
    b.list.forEach(g => g.dispose());
    const material = b.glow
      ? new THREE.MeshBasicMaterial({ vertexColors: true, map: b.map, alphaTest: b.alphaTest, side: b.side })
      : new THREE.MeshStandardMaterial({ vertexColors: true, map: b.map, alphaTest: b.alphaTest, side: b.side, roughness: b.roughness, metalness: b.metalness });
    const mesh = new THREE.InstancedMesh(geometry, material, at.length);
    at.forEach(([x, y, z, turn = 0, scale = 1, color], i) => {
      mesh.setMatrixAt(i, matrix.compose(p.set(x, y, z), q.setFromEuler(e.set(0, turn * D2R, 0)), s.set(scale, scale, scale)));
      mesh.setColorAt(i, color == null ? col.set('#ffffff') : col.set(color));
    });
    mesh.computeBoundingSphere();
    group.add(mesh);
  }
  return group;
}

// ---- truss and scaffold: every tube is an instance of one open cylinder
function buildRods(spec) {
  const list = spec.list;
  const geometry = new THREE.CylinderGeometry(1, 1, 1, 6, 1, true);
  const mesh = new THREE.InstancedMesh(geometry, new THREE.MeshStandardMaterial({ color: spec.color || '#3a3c42', metalness: spec.metalness ?? 0.6, roughness: spec.roughness ?? 0.45 }), list.length);
  const a = new THREE.Vector3(), b = new THREE.Vector3(), mid = new THREE.Vector3(), dir = new THREE.Vector3(), q = new THREE.Quaternion(), s = new THREE.Vector3(), m = new THREE.Matrix4(), up = new THREE.Vector3(0, 1, 0);
  list.forEach(([from, to, r], i) => {
    a.fromArray(from); b.fromArray(to);
    const len = a.distanceTo(b);
    dir.copy(b).sub(a).normalize();
    mesh.setMatrixAt(i, m.compose(mid.copy(a).lerp(b, 0.5), q.setFromUnitVectors(up, dir), s.set(r, len, r)));
  });
  mesh.computeBoundingSphere();
  return mesh;
}

/* ---------------------------------------------------------------------
   The crowd. Every person is an instance of one low-poly figure (or, in
   Mix, of one skeleton), posed in the vertex shader from their own seeds:
   swaying and glancing about before the show; jumping, head-banging,
   fists and arms up during it. They step
   aside as you walk through them, and raise their hands to carry you when
   you crowd-surf. Everything reads uTime, the beat and the show level,

        col += vec3(0.42, 0.48, 1.0) * pow(1.0 - abs(dot(n, V)), 4.0) * 0.4;
        col *= exp(-dist * 0.0032);
        gl_FragColor = vec4(col, 1.0);
      }`,
  });
  const meshes = {
    lofi: new THREE.Mesh(bodyGeometry, lofiMaterial),
    skeleton: new THREE.Mesh(boneGeometry, skeletonMaterial),
    code: new THREE.Mesh(bodyGeometry, codeMaterial),
  };
  for (const mesh of Object.values(meshes)) {
    mesh.frustumCulled = false;
    mesh.userData.holoSkip = true;                 // the crowd brings its own looks
    mesh.raycast = noRaycast;
    scene.add(mesh);
  }
  meshes.skeleton.visible = meshes.code.visible = false;
  return {
    count: N, uniforms, meshes,
    setAtlas(atlas) { codeMaterial.uniforms.uAtlas.value = atlas; },
    // the crowd belongs to the outside: lofi until the outside wave turns it, then bones; code with the room
    setLook(room, city) {
      meshes.lofi.visible = city !== 'code' && room !== 'code';
      meshes.skeleton.visible = city !== 'lofi' && room !== 'code';
      meshes.code.visible = room !== 'lofi';
    },
  };
}

/* ---------------------------------------------------------------------
   The lights: moving heads on the roof truss and on the deck (each with a
   soft beam through the haze), PAR cans that pulse with the music,
   blinders, the key light on the band and the backlight behind them.
   --------------------------------------------------------------------- */
function buildStageRig(scene, shared) {
  const S = STAGE, Y = S.trussY - 0.42, heads = [], pars = [];
  const nFront = IS_PHONE ? 5 : 9;
  for (let i = 0; i < nFront; i++) heads.push({ p: new THREE.Vector3(-8.4 + i * 16.8 / (nFront - 1), Y, S.front), up: false });
  if (!IS_PHONE) for (const x of [-6, -2, 2, 6]) heads.push({ p: new THREE.Vector3(x, Y, -18.0), up: false });
  for (const x of [-7.4, -4.8, 4.8, 7.4]) heads.push({ p: new THREE.Vector3(x, S.h + 0.3, -21.2), up: true });
  for (let i = 0; i < 9; i++) pars.push({ p: new THREE.Vector3(-8 + i * 2, S.trussY - 0.35, S.back), aim: new THREE.Vector3(-8 + i * 2, 1.4, -17) });
  for (let i = 0; i < 8; i++) pars.push({ p: new THREE.Vector3(-7.35 + i * 2.1, S.trussY - 0.35, S.front), aim: new THREE.Vector3((-7.35 + i * 2.1) * 0.5, 1.6, -17.5) });
  const blinders = [new THREE.Vector3(-9.2, 8.0, -13.95), new THREE.Vector3(9.2, 8.0, -13.95)];
  const H = heads.length, P = pars.length;
  const DOWN = new THREE.Vector3(0, -1, 0);
  // fixture bodies
  const headGeometry = new THREE.BoxGeometry(0.34, 0.42, 0.34).translate(0, -0.05, 0);
  const headMesh = new THREE.InstancedMesh(headGeometry, new THREE.MeshStandardMaterial({ color: '#16161a', roughness: 0.5, metalness: 0.3 }), H);
  const parGeometry = new THREE.CylinderGeometry(0.15, 0.13, 0.36, 10).translate(0, 0.08, 0);
  const parMesh = new THREE.InstancedMesh(parGeometry, new THREE.MeshStandardMaterial({ color: '#1a1a1e', roughness: 0.5, metalness: 0.4 }), P);
  // lenses: glowing discs, recoloured every frame
  const lensGeometry = new THREE.CircleGeometry(0.13, 14).rotateX(Math.PI / 2).translate(0, -0.27, 0);
  const lensMesh = new THREE.InstancedMesh(lensGeometry, new THREE.MeshBasicMaterial({ color: '#ffffff', side: THREE.DoubleSide }), H + P);
  // beams: an open cone from the lens, additive, brightest along its axis, fading with length
  const beamGeometry = new THREE.CylinderGeometry(0.04, 1, 1, 16, 1, true).translate(0, -0.5, 0);
  const beamMaterial = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide, fog: false,
    uniforms: { uTime: shared.uTime, ...shared.roomWave },
    vertexShader: /* glsl */`
      varying float vAlong;
      varying vec3 vWorld, vNw, vColor;
      void main() {
        vec4 local = vec4(position, 1.0);
        vec3 n = normal;
        #ifdef USE_INSTANCING
          local = instanceMatrix * local;
          n = mat3(instanceMatrix) * n;
        #endif
        vec4 w = modelMatrix * local;
        vWorld = w.xyz;
        vNw = normalize(mat3(modelMatrix) * n);
        vAlong = -position.y;
        #ifdef USE_INSTANCING_COLOR
          vColor = instanceColor;
        #else
          vColor = vec3(1.0);
        #endif
        gl_Position = projectionMatrix * viewMatrix * w;
      }`,
    fragmentShader: WAVE_GLSL + /* glsl */`
      uniform float uTime;
      varying float vAlong;
      varying vec3 vWorld, vNw, vColor;
      void main() {
        if (waveCode(vWorld)) discard;
        vec3 V = normalize(cameraPosition - vWorld);
        float facing = abs(dot(normalize(vNw), V));
        float fall = pow(1.0 - clamp(vAlong, 0.0, 1.0), 1.6) * smoothstep(0.0, 0.03, vAlong);
        float haze = 0.7 + 0.3 * sin(vWorld.y * 1.3 + uTime * 0.8 + vWorld.x * 0.7) * sin(vWorld.z * 0.9 - uTime * 0.5);
        float near = smoothstep(0.5, 3.0, distance(vWorld, cameraPosition));
        gl_FragColor = vec4(vColor, pow(facing, 2.2) * fall * haze * near * 0.5);
      }`,
  });
  const beamMesh = new THREE.InstancedMesh(beamGeometry, beamMaterial, H);
  beamMesh.frustumCulled = false;
  beamMesh.renderOrder = 4;
  // glows: a soft additive sprite on every lens
  const G = H + P + blinders.length * 4;
  const glowPos = new Float32Array(G * 3), glowCol = new Float32Array(G * 3), glowSize = new Float32Array(G);
  const glowGeometry = new THREE.BufferGeometry();
  glowGeometry.setAttribute('position', new THREE.BufferAttribute(glowPos, 3));
  glowGeometry.setAttribute('aColor', new THREE.BufferAttribute(glowCol, 3));
  glowGeometry.setAttribute('aSize', new THREE.BufferAttribute(glowSize, 1));
  const glowPoints = new THREE.Points(glowGeometry, glowMaterial(shared));
  glowPoints.frustumCulled = false;
  const blinderMesh = new THREE.InstancedMesh(new THREE.BoxGeometry(0.9, 0.9, 0.2), new THREE.MeshStandardMaterial({ color: '#141418', roughness: 0.5 }), 2);
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), s = new THREE.Vector3(1, 1, 1), dir = new THREE.Vector3(), tmp = new THREE.Vector3(), col = new THREE.Color(), one = new THREE.Vector3(1, 1, 1);
  blinders.forEach((b, i) => blinderMesh.setMatrixAt(i, m.makeTranslation(b.x, b.y, b.z - 0.12)));
  pars.forEach((par, i) => {
    q.setFromUnitVectors(DOWN, dir.copy(par.aim).sub(par.p).normalize());
    parMesh.setMatrixAt(i, m.compose(par.p, q, one));
    lensMesh.setMatrixAt(H + i, m.compose(tmp.copy(par.p).addScaledVector(dir, 0.0), q, one));
    tmp.copy(par.p).addScaledVector(dir, 0.3).toArray(glowPos, (H + i) * 3);
    glowSize[H + i] = 0.9;
  });
  blinders.forEach((b, k) => { for (let j = 0; j < 4; j++) { glowPos.set([b.x + (j % 2 ? 0.2 : -0.2), b.y + (j < 2 ? 0.2 : -0.2), b.z + 0.02], (H + P + k * 4 + j) * 3); glowSize[H + P + k * 4 + j] = 1.0; } });
  for (let i = 0; i < H; i++) { beamMesh.setColorAt(i, col.set(0, 0, 0)); lensMesh.setColorAt(i, col); }
  for (let i = 0; i < P; i++) lensMesh.setColorAt(H + i, col.set(0, 0, 0));
  for (const mesh of [headMesh, parMesh, lensMesh, beamMesh, blinderMesh]) { mesh.raycast = noRaycast; scene.add(mesh); }
  scene.add(glowPoints);
  // the real lights: one on the band from the front, one behind them
  const key = new THREE.PointLight('#ffd2a0', 30, 30, 2);
  key.position.set(0, 7.5, -10.5);
  const back = new THREE.PointLight('#6a7aff', 10, 18, 2);
  back.position.set(0, 7, -21.2);
  scene.add(key, back);
  const stageColor = new THREE.Color('#ffd2a0'), warm = new THREE.Color('#ffd2a0'), cA = new THREE.Color(), cB = new THREE.Color();
  const rig = {
    stageColor, stageLight: 0.4,
    update(t, show, level, beats, colA, colB, chorus, flash) {
      const pattern = Math.floor(beats / 32) % 3;
      for (let i = 0; i < H; i++) {
        const h = heads[i], k = i / Math.max(1, H - 1) - 0.5;
        let pan, tilt, len, bright;
        if (!h.up) {
          if (pattern === 0) { pan = k * 1.3 + Math.sin(t * 0.9) * 0.5; tilt = 0.8 + Math.sin(t * 1.3 + i * 0.6) * 0.3; }
          else if (pattern === 1) { pan = Math.sin(t * 1.1 + i * 0.7) * 0.9; tilt = 0.6 + 0.3 * Math.sin(t * 0.7 + i); }
          else { pan = (i % 2 ? 1 : -1) * (0.3 + 0.4 * Math.sin(t * 1.6)); tilt = 1.25 + 0.3 * Math.sin(t * 2.1 + i * 0.3); }
          dir.set(Math.sin(pan) * Math.sin(tilt), -Math.cos(tilt), Math.cos(pan) * Math.sin(tilt));
          len = 24; bright = show * (0.45 + 0.9 * level) * (chorus && (Math.floor(beats * 2) + i) % 2 ? 0.35 : 1);
          col.copy(i % 2 ? colA : colB);
        } else {
          // the deck heads search the sky slowly before the show, then fan up with it
          const sx = Math.sign(h.p.x);
          pan = mix(sx * 0.35 + Math.sin(t * 0.21 + i) * 0.5, sx * 0.4 + Math.sin(t * 0.9 + i * 1.3) * 0.6, show);
          tilt = mix(0.22 + 0.12 * Math.sin(t * 0.17 + i * 2), 0.35 + 0.3 * Math.sin(t * 1.2 + i), show);
          dir.set(Math.sin(pan) * Math.sin(tilt), Math.cos(tilt), Math.cos(pan) * Math.sin(tilt));
          len = 34; bright = mix(0.3, 0.55 + 0.8 * level, show);
          col.copy(cA.set('#a8c0ff')).lerp(i % 2 ? colB : colA, show);
        }
        q.setFromUnitVectors(DOWN, dir);
        headMesh.setMatrixAt(i, m.compose(h.p, q, one));
        lensMesh.setMatrixAt(i, m.compose(h.p, q, one));
        beamMesh.setMatrixAt(i, m.compose(h.p, q, s.set(len * 0.055, len, len * 0.055)));
        beamMesh.setColorAt(i, cB.copy(col).multiplyScalar(bright));
        lensMesh.setColorAt(i, cB.copy(col).multiplyScalar(0.3 + bright * 2.5));
        tmp.copy(h.p).addScaledVector(dir, 0.32).toArray(glowPos, i * 3);
        cB.copy(col).multiplyScalar(bright * 1.6).toArray(glowCol, i * 3);
        glowSize[i] = 1.3;
      }
      const beat = Math.floor(beats) % 2;
      for (let i = 0; i < P; i++) {
        const pulse = show * (0.2 + level * 1.4) * ((i % 2) === beat ? 1 : 0.35) + (1 - show) * 0.04;
        col.copy(i % 3 === 0 ? colB : colA).multiplyScalar(pulse);
        lensMesh.setColorAt(H + i, cB.copy(col).multiplyScalar(2.5).addScalar(0.02));
        col.multiplyScalar(1.5).toArray(glowCol, (H + i) * 3);
      }
      const blind = Math.min(1.5, flash * 1.5 + show * (chorus && level > 0.62 ? 0.6 : 0));
      for (let j = 0; j < 8; j++) glowCol.set([blind * 1.6, blind * 1.3, blind * 0.9], (H + P + j) * 3);
      headMesh.instanceMatrix.needsUpdate = lensMesh.instanceMatrix.needsUpdate = beamMesh.instanceMatrix.needsUpdate = true;
      beamMesh.instanceColor.needsUpdate = lensMesh.instanceColor.needsUpdate = true;
      glowGeometry.attributes.position.needsUpdate = glowGeometry.attributes.aColor.needsUpdate = glowGeometry.attributes.aSize.needsUpdate = true;
      // the key light: warm and dim before the show, the palette and the beat during it
      stageColor.copy(warm).lerp(cA.copy(colA).lerp(colB, 0.5 + 0.5 * Math.sin(beats * 0.5)), show * 0.7);
      key.color.copy(stageColor);
      key.intensity = mix(55, 170 + level * 220, show) + flash * 400;
      back.color.copy(cB.set('#6a7aff')).lerp(colB, show);
      back.intensity = mix(16, 90 + level * 160, show);
      rig.stageLight = mix(0.45, 0.8 + level * 0.9, show) + flash;
    },
  };
  const mix = (a, b, k) => a + (b - a) * k;
  rig.update(0, 0, 0, 0, new THREE.Color('#ff2a6d'), new THREE.Color('#05d9e8'), false, 0);
  return rig;
}

// soft additive glow sprites (lens flares, bulbs, the town's lights)
function glowMaterial(shared, fade = true) {
  return new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, fog: false,
    uniforms: { uScale: shared.uScale, ...shared.roomWave },
    vertexShader: /* glsl */`
      attribute vec3 aColor;
      attribute float aSize;
      uniform float uScale;
      varying vec3 vColor, vWorld;
      void main() {
        vec4 w = modelMatrix * vec4(position, 1.0);
        vWorld = w.xyz;
        vec4 mv = viewMatrix * w;
        vColor = aColor;
        gl_PointSize = clamp(aSize * uScale / max(-mv.z, 0.1), 0.0, 220.0);
        gl_Position = projectionMatrix * mv;
      }`,
    fragmentShader: WAVE_GLSL + /* glsl */`
      varying vec3 vColor, vWorld;
      void main() {
        if (waveCode(vWorld)) discard;
        float r = length(gl_PointCoord - 0.5) * 2.0;
        float a = exp(-r * r * 4.0) * (1.0 - smoothstep(0.8, 1.0, r));
        gl_FragColor = vec4(vColor, a);
      }`,
  });
}
// the still glows: bulbs, lamps, signs, the light towers, and the far-off town
function buildGlowPoints(scene, shared) {
  const list = [];
  const add = (x, y, z, hex, k, size) => { const c = new THREE.Color(hex).multiplyScalar(k); list.push([x, y, z, c.r, c.g, c.b, size]); };
  for (let i = 0; i < 6; i++) add(-31.6 + 0.62, 2.4, 14.4 + i * 1.42, '#fff0c8', 0.8, 0.7);         // porta-potty bulbs
  for (const [x, z, r] of [[-33.5, 39.5, 30], [33.5, 39.5, -30]]) {                                       // light towers
    const a = (r + 180) * D2R;
    for (const [dx, y] of [[-0.55, 6.85], [0.55, 6.85], [-0.55, 6.35], [0.55, 6.35]]) add(x + dx * Math.cos(a) + 0.15 * Math.sin(a), y, z - dx * Math.sin(a) + 0.15 * Math.cos(a), '#e8f0ff', 0.9, 1.6);
  }
  for (const x of [-1.6, 0, 1.6]) add(24.2 - 0.2, 2.25, 20 + x, '#ffb860', 0.6, 1.0);                     // bar lanterns
  add(0, 4.35, 43.95, '#3aff8a', 0.35, 2.0);                                                              // the exit sign
  add(-24 + 1.8, 2.0, 4, '#ffb060', 0.35, 3.0);                                                           // the taco truck's window
  add(0, 1.5, 12.7, '#7aa8ff', 0.25, 2.2);                                                                // the mixing desk
  const R = seededRandom(99);
  for (let i = 0; i < (IS_PHONE ? 60 : 140); i++) {                                                      // a town beyond the hills
    const a = -0.72 + (R() - 0.5) * 0.5, d = 230 + R() * 40;
    add(Math.cos(a) * d, 4 + R() * 9 + Math.pow(R(), 4) * 20, Math.sin(a) * d, R() < 0.8 ? '#ffc890' : '#e8f0ff', 0.25 + R() * 0.4, 1.4 + R() * 1.5);
  }
  const n = list.length, pos = new Float32Array(n * 3), col = new Float32Array(n * 3), size = new Float32Array(n);
  list.forEach(([x, y, z, r, g, b, s], i) => { pos.set([x, y, z], i * 3); col.set([r, g, b], i * 3); size[i] = s; });
  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geometry.setAttribute('aColor', new THREE.BufferAttribute(col, 3));
  geometry.setAttribute('aSize', new THREE.BufferAttribute(size, 1));
  const points = new THREE.Points(geometry, glowMaterial(shared));
  points.frustumCulled = false;
  points.raycast = noRaycast;
  scene.add(points);
  return points;
}

// ---- the stage smoke: CO2 jets that blast up when the show starts, and a low haze while it plays
function buildStageSmoke(scene, shared) {
  const N = IS_PHONE ? 160 : 320;
  const positions = new Float32Array(N * 3), ages = new Float32Array(N).fill(-1), sizes = new Float32Array(N);
  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geometry.setAttribute('aAge', new THREE.BufferAttribute(ages, 1));
  geometry.setAttribute('aSize', new THREE.BufferAttribute(sizes, 1));
  const material = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, fog: false,
    uniforms: { uScale: shared.uScale, uColor: { value: new THREE.Color('#ffd2a0') }, uLight: { value: 0.5 }, ...shared.roomWave },
    vertexShader: /* glsl */`
      attribute float aAge, aSize;
      uniform float uScale;
      varying float vAlpha;
      varying vec3 vWorld;
      void main() {
        vec4 w = modelMatrix * vec4(position, 1.0);
        vWorld = w.xyz;
        vec4 mv = viewMatrix * w;
        vAlpha = aAge < 0.0 ? 0.0 : smoothstep(0.0, 0.06, aAge) * (1.0 - smoothstep(0.4, 1.0, aAge));
        gl_PointSize = aAge < 0.0 ? 0.0 : clamp(aSize * (0.4 + aAge * 2.2) * uScale / max(-mv.z, 0.1), 0.0, 400.0);
        gl_Position = projectionMatrix * mv;
      }`,
    fragmentShader: WAVE_GLSL + /* glsl */`
      uniform vec3 uColor;
      uniform float uLight;
      varying float vAlpha;
      varying vec3 vWorld;
      void main() {
        if (waveCode(vWorld)) discard;
        float r = length(gl_PointCoord - 0.5);
        vec3 col = mix(vec3(0.8, 0.82, 0.9), uColor, 0.55) * (0.25 + uLight * 0.6);
        gl_FragColor = vec4(col, (1.0 - smoothstep(0.05, 0.5, r)) * vAlpha * 0.3);
      }`,
  });
  const points = new THREE.Points(geometry, material);
  points.frustumCulled = false;
  points.raycast = noRaycast;
  scene.add(points);
  const parts = Array.from({ length: N }, () => ({ p: new THREE.Vector3(), v: new THREE.Vector3(), age: -1, life: 1, drag: 1 }));
  let next = 0, clock = 0;
  const emit = (x, y, z, vx, vy, vz, size, life, drag) => {
    const q = parts[next]; sizes[next] = size; next = (next + 1) % N;
    q.p.set(x, y, z); q.v.set(vx, vy, vz); q.age = 0; q.life = life; q.drag = drag;
  };
  return {
    burst() {
      for (const x of [-7.6, -3.4, 3.4, 7.6]) for (let k = 0; k < (IS_PHONE ? 22 : 40); k++) {
        emit(x + (Math.random() - 0.5) * 0.2, STAGE.h + 0.1, -14.5, (Math.random() - 0.5) * 0.8, 6 + Math.random() * 5, (Math.random() - 0.3) * 0.8, 0.5 + Math.random() * 0.4, 2.5 + Math.random() * 1.5, 1.6);
      }
    },
    update(dt, show, color, light) {
      material.uniforms.uColor.value.copy(color);
      material.uniforms.uLight.value = light;
      clock += dt * show;
      while (clock > 0.16) {
        clock -= 0.16;
        emit(-8 + Math.random() * 16, STAGE.h + 0.15, -21 + Math.random() * 5, (Math.random() - 0.5) * 0.2, 0.05 + Math.random() * 0.1, 0.25 + Math.random() * 0.2, 1.2 + Math.random() * 0.8, 7 + Math.random() * 4, 0.2);
      }
      for (let i = 0; i < N; i++) {
        const q = parts[i];
        if (q.age < 0) continue;
        q.age += dt / q.life;
        if (q.age >= 1) { q.age = -1; ages[i] = -1; continue; }
        q.v.multiplyScalar(Math.exp(-dt * q.drag));
        q.v.y += dt * 0.05;
        q.v.z += dt * 0.08;
        q.p.addScaledVector(q.v, dt);
        positions[i * 3] = q.p.x; positions[i * 3 + 1] = q.p.y; positions[i * 3 + 2] = q.p.z;
        ages[i] = q.age;
      }
      geometry.attributes.position.needsUpdate = geometry.attributes.aAge.needsUpdate = geometry.attributes.aSize.needsUpdate = true;
    },
  };
}

// ---- hands reaching up around you while you crowd-surf
function buildSurfHands(scene) {
  const group = new THREE.Group();
  const SK = ['#f1d0b5', '#d29b74', '#8a5a3c', '#e6b896', '#b07a52', '#f1d0b5'];
  const hands = SK.map((hex, i) => {
    const material = new THREE.MeshStandardMaterial({ color: hex, roughness: 0.8 });
    const arm = new THREE.Group();
    const fore = new THREE.Mesh(new THREE.CapsuleGeometry(0.04, 0.5, 2, 8).translate(0, -0.3, 0), new THREE.MeshStandardMaterial({ color: i % 2 ? '#1c1c22' : hex, roughness: 0.9 }));
    const palm = new THREE.Mesh(new THREE.SphereGeometry(0.05, 10, 8).scale(1, 1.15, 0.5), material);
    arm.add(fore, palm);
    for (let f = 0; f < 4; f++) {
      const finger = new THREE.Mesh(new THREE.CapsuleGeometry(0.011, 0.05, 2, 6), material);
      finger.position.set(-0.03 + f * 0.02, 0.07, 0);
      finger.rotation.z = (f - 1.5) * 0.12;
      arm.add(finger);
    }
    group.add(arm);
    return { arm, a: i / SK.length * Math.PI * 2 + 0.4, r: 0.42 + (i % 3) * 0.1, phase: i * 1.7 };
  });
  group.visible = false;
  scene.add(group);
  return {
    group,
    place(pos, yaw, t, amount) {
      group.visible = amount > 0.01;
      if (!group.visible) return;
      for (const h of hands) {
        const a = yaw + h.a, dy = (0.18 + 0.12 * Math.sin(t * 2.3 + h.phase)) * amount - (1 - amount) * 0.8;
        h.arm.position.set(pos.x + Math.sin(a) * h.r, pos.y + dy, pos.z + Math.cos(a) * h.r);
        h.arm.rotation.set(Math.sin(t * 1.7 + h.phase) * 0.25, a, Math.cos(t * 1.3 + h.phase) * 0.25);
      }
    },
  };
}

// One part of an object (see the list at the top of ROOM).
function buildPart(part, textures, shared, animated) {
  const size = part.size || [];
  if (part.shape === 'light') {
    const light = new THREE.PointLight(part.color || '#ffffff', part.intensity ?? 3, part.distance ?? 0, 2);
    light.position.fromArray(part.offset || [0, 0, 0]);
    if (part.flicker) animated.push({ kind: 'flicker', object: light, base: light.intensity, amount: part.flicker });
    if (part.pulse) animated.push({ kind: 'pulse', object: light, base: light.intensity, amount: part.pulse });
    return light;
  }
  if (part.shape === 'string') return buildString(part, animated);
  if (part.shape === 'arm') return buildArm(part, textures, shared, animated);
  if (part.shape === 'marker') {
    const marker = new THREE.Object3D();
    marker.name = part.name || '';
    marker.position.fromArray(part.offset || [0, 0, 0]);
    return marker;
  }
  if (part.shape === 'neon') {
    const material = new THREE.MeshBasicMaterial({ map: textures.neon, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, color: '#ffffff', opacity: 0.62 * (part.brightness ?? 1) });
    material.userData.neon = true;
    material.userData.baseOpacity = material.opacity;
    const mesh = new THREE.Mesh(new THREE.PlaneGeometry(size[0], size[1]), material);
    mesh.position.fromArray(part.offset || [0, 0, 0]);
    mesh.userData.holoHide = true;
    return mesh;
  }
  if (part.shape === 'face') {
    // a painted face wrapped over the front of the head
    const geometry = new THREE.SphereGeometry(size[0], 40, 32, toRadians(40), toRadians(100), toRadians(50), toRadians(80));
    const material = new THREE.MeshBasicMaterial({ map: textures.faceOpen, color: '#c4bad0', transparent: true, depthWrite: false, polygonOffset: true, polygonOffsetFactor: -2 });
    const mesh = new THREE.Mesh(geometry, material);
    mesh.position.fromArray(part.offset || [0, 0, 0]);
    if (part.scale) mesh.scale.fromArray(part.scale);
    mesh.userData.keepMaterial = true;
    mesh.userData.anim = 'blink';
    animated.push({ kind: 'blinkFace', object: mesh, period: part.period || 4, open: textures.faceOpen, closed: textures.faceClosed });
    return mesh;
  }
  if (part.shape === 'group') {
    const group = new THREE.Group();
    if (part.name) group.name = part.name;
    if (part.hotspot) group.userData.hotspot = part.hotspot;
    group.position.fromArray(part.offset || [0, 0, 0]);
    const [rx, ry, rz] = part.rotation || [0, 0, 0];
    group.rotation.set(toRadians(rx), toRadians(ry), toRadians(rz));
    if (part.scale) group.scale.fromArray(part.scale);
    for (const child of part.parts || []) group.add(buildPart(child, textures, shared, animated));
    if (part.anim) {
      const anim = typeof part.anim === 'string' ? { type: part.anim } : part.anim;
      group.userData.anim = anim.type;
      animated.push({ kind: anim.type, object: group, ...anim, base: { position: group.position.clone(), rotation: group.rotation.clone() } });
    }
    return group;
  }

  const deg = v => toRadians(v);
  let geometry, material;
  if (part.shape === 'screen') {
    geometry = new THREE.PlaneGeometry(size[0], size[1]);
    material = new THREE.MeshBasicMaterial({ map: textures.screen, color: '#ffffff' });
  } else if (part.basic) {
    geometry = new THREE.PlaneGeometry(size[0], size[1]);
    material = new THREE.MeshBasicMaterial({ map: textures[part.texture], color: '#ffffff', alphaTest: part.alphaTest || 0 });
  } else {
    if (part.shape === 'box') geometry = new THREE.BoxGeometry(size[0], size[1], size[2]);
    else if (part.shape === 'cylinder') geometry = new THREE.CylinderGeometry(size[0], size[1], size[2], part.segments ?? 24, 1, !!part.open, deg(size[3] ?? 0), deg(size[4] ?? 360));
    else if (part.shape === 'sphere') geometry = new THREE.SphereGeometry(size[0], 28, 18, deg(size[1] ?? 0), deg(size[2] ?? 360), deg(size[3] ?? 0), deg(size[4] ?? 180));
    else if (part.shape === 'disc') geometry = new THREE.CircleGeometry(size[0], 48).rotateX(-Math.PI / 2);
    else if (part.shape === 'cone') geometry = new THREE.ConeGeometry(size[0], size[1], part.segments ?? 20);
    else if (part.shape === 'torus') geometry = new THREE.TorusGeometry(size[0], size[1], 10, 32, deg(size[2] ?? 360));
    else if (part.shape === 'plane') geometry = new THREE.PlaneGeometry(size[0], size[1]);
    else if (part.shape === 'limb') geometry = new THREE.CapsuleGeometry(part.radius, Math.max(0.001, new THREE.Vector3().fromArray(part.from).distanceTo(new THREE.Vector3().fromArray(part.to))), 6, 14);
    else if (part.shape === 'cable') geometry = new THREE.TubeGeometry(new THREE.CatmullRomCurve3(part.points.map(p => new THREE.Vector3().fromArray(p))), part.points.length * 10, part.radius, 6, false);
    else throw new Error(`Unknown part shape: ${part.shape}`);
    if (part.segments && part.segments <= 6) { geometry = geometry.toNonIndexed(); geometry.computeVertexNormals(); }   // faceted: flat shading
    if (part.uv) { const uv = geometry.attributes.uv, [u0, v0, u1, v1] = part.uv; for (let i = 0; i < uv.count; i++) uv.setXY(i, u0 + uv.getX(i) * (u1 - u0), v0 + uv.getY(i) * (v1 - v0)); }
    const doubleSided = part.open || part.shape === 'cloth' || part.alphaTest || (part.shape === 'sphere' && size[4] != null);
    material = new THREE.MeshStandardMaterial({
      color: part.texture ? '#ffffff' : (part.color || '#888888'),
      map: part.texture ? textures[part.texture] : null,
      roughness: part.roughness ?? 0.85,
      metalness: part.metalness ?? 0,
      emissive: part.emissive || '#000000',
      emissiveIntensity: part.emissiveIntensity ?? 1,
      transparent: !!part.transparent,
      opacity: part.opacity ?? 1,
      side: doubleSided ? THREE.DoubleSide : THREE.FrontSide,
      alphaTest: part.alphaTest || 0,
    });
    if (part.glowMap) { material.emissive.set('#ffffff'); material.emissiveMap = material.map; material.emissiveIntensity = part.glowMap; }
  }
  const mesh = new THREE.Mesh(geometry, material);
  if (part.shape === 'limb') {
    const a = new THREE.Vector3().fromArray(part.from), b = new THREE.Vector3().fromArray(part.to);
    mesh.position.copy(a).lerp(b, 0.5);
    mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), b.clone().sub(a).normalize());
  } else {
    mesh.position.fromArray(part.offset || [0, 0, 0]);
    const [rx, ry, rz] = part.rotation || [0, 0, 0];
    mesh.rotation.set(toRadians(rx), toRadians(ry), toRadians(rz));
  }
  if (part.scale) mesh.scale.fromArray(part.scale);
  if (part.name) mesh.name = part.name;
  if (part.keep) mesh.userData.keepMaterial = true;
  if (part.hidden) mesh.visible = false;
  if (part.spin) animated.push({ kind: 'spin', object: mesh, speed: part.spin });
  if (part.pulse) animated.push({ kind: 'pulse', object: mesh, base: material.emissiveIntensity, amount: part.pulse });
  return mesh;
}

// A strand of little bulbs hanging between two points, gently twinkling.
function buildString(part, animated) {
  const group = new THREE.Group();
  const from = new THREE.Vector3().fromArray(part.from), to = new THREE.Vector3().fromArray(part.to);
  const count = part.count || 20, points = [];
  for (let i = 0; i <= 40; i++) {
    const t = i / 40;
    points.push(from.clone().lerp(to, t).add(new THREE.Vector3(0, -part.sag * 4 * t * (1 - t), 0)));
  }
  group.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(points), new THREE.LineBasicMaterial({ color: '#1a1714' })));

  const bulbs = new THREE.InstancedMesh(new THREE.SphereGeometry(0.028, 10, 8), new THREE.MeshBasicMaterial({ color: '#ffffff' }), count);
  const matrix = new THREE.Matrix4(), color = new THREE.Color(part.color || '#ffcf8a');
  for (let i = 0; i < count; i++) {
    const t = (i + 0.5) / count;
    const p = from.clone().lerp(to, t).add(new THREE.Vector3(0, -part.sag * 4 * t * (1 - t) - 0.03, 0));
    bulbs.setMatrixAt(i, matrix.makeTranslation(p.x, p.y, p.z));
    bulbs.setColorAt(i, color);
  }
  group.add(bulbs);
  // one soft light in the middle so the wall picks up the glow
  if (part.glow !== 0) {
    const glow = new THREE.PointLight(part.color || '#ffcf8a', part.glow ?? 5, 8, 2);
    glow.position.copy(from.clone().lerp(to, 0.5)).add(new THREE.Vector3(0, -part.sag - 0.1, 0.3));
    group.add(glow);
  }
  animated.push({ kind: 'twinkle', object: bulbs, color, count });
  return group;
}

// Every object in ROOM.objects: a group of parts, maybe a hotspot, maybe solid.
function buildObjects(scene, textures, shared, animated, colliders, raycastTargets, hotspots) {
  const built = [];
  for (const spec of ROOM.objects) {
    const group = new THREE.Group();
    group.name = spec.id || '';
    group.position.fromArray(spec.position || [0, 0, 0]);
    group.rotation.y = toRadians(spec.rotationY);
    for (const part of spec.parts || []) group.add(buildPart(part, textures, shared, animated));
    if (spec.instanced) group.add(buildInstanced(spec, textures, shared));
    if (spec.rods) group.add(buildRods(spec.rods));
    if (spec.style === 'toon') toonify(group);
    scene.add(group);
    registerObject(group, spec, colliders, raycastTargets, hotspots);
    built.push({ group, spec });
  }
  return built;
}

// Shared by built objects and loaded models: collisions, clickability.
function registerObject(group, spec, colliders, raycastTargets, hotspots) {
  if (spec.outside) group.userData.city = true;     // turns to code in Mix mode, like the city
  group.updateMatrixWorld(true);
  group.traverse(child => { if (child.isMesh && !child.isInstancedMesh) raycastTargets.push(child); });
  if (spec.hotspot) {
    group.userData.hotspot = spec.hotspot;
    hotspots.push(group);
  }
  if (spec.colliders) {
    for (const [cx, cz, w, d] of spec.colliders) colliders.push({ minX: cx - w / 2, maxX: cx + w / 2, minZ: cz - d / 2, maxZ: cz + d / 2 });
  } else if (spec.collide !== false) {
    const box = new THREE.Box3().setFromObject(group);
    if (box.min.y < SETTINGS.eyeHeight) colliders.push({ minX: box.min.x, maxX: box.max.x, minZ: box.min.z, maxZ: box.max.z });
  }
}

// GLB models listed in ROOM.models (the loader is only downloaded if there are any).
async function loadModels(scene, manager, colliders, raycastTargets, hotspots) {
  if (!ROOM.models?.length) return;
  const { GLTFLoader } = await import('three/addons/loaders/GLTFLoader.js');
  const loader = new GLTFLoader(manager);
  await Promise.all(ROOM.models.map(async spec => {
    try {
      const gltf = await loader.loadAsync(spec.url);
      const model = gltf.scene;
      model.position.fromArray(spec.position || [0, 0, 0]);
      model.rotation.y = toRadians(spec.rotationY);
      model.scale.setScalar(spec.scale ?? 1);
      scene.add(model);
      registerObject(model, spec, colliders, raycastTargets, hotspots);
    } catch (error) {
      console.warn(`Room: couldn't load model ${spec.url}`, error);
    }
  }));
}

// Floating dust in the room, drifting slowly (frozen while paused).
function buildDust(scene, rand, shared) {
  const { width, depth, height } = ROOM.size, count = SETTINGS.dustCount;
  const positions = new Float32Array(count * 3), seeds = new Float32Array(count);
  for (let i = 0; i < count; i++) {
    positions.set([(rand() - 0.5) * width, rand() * height, (rand() - 0.5) * depth], i * 3);
    seeds[i] = rand();
  }
  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geometry.setAttribute('aSeed', new THREE.BufferAttribute(seeds, 1));
  const dust = new THREE.Points(geometry, new THREE.ShaderMaterial({
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
    uniforms: { uTime: shared.uTime, uScale: shared.uScale, uRoom: { value: new THREE.Vector3(width, height, depth) } },
    vertexShader: /* glsl */`
      attribute float aSeed;
      uniform float uTime, uScale;
      uniform vec3 uRoom;
      varying float vAlpha;
      void main() {
        vec3 p = position + vec3(sin(uTime * 0.13 + aSeed * 20.0) * 0.4, uTime * (0.02 + aSeed * 0.04), cos(uTime * 0.11 + aSeed * 13.0) * 0.4);
        p.xz = mod(p.xz + uRoom.xz * 0.5, uRoom.xz) - uRoom.xz * 0.5;
        p.y = mod(p.y, uRoom.y);
        vec4 mv = modelViewMatrix * vec4(p, 1.0);
        float dist = -mv.z;
        vAlpha = (1.0 - smoothstep(1.5, 4.5, dist)) * smoothstep(0.3, 0.8, dist) * (0.3 + 0.7 * aSeed);
        gl_PointSize = clamp((0.004 + aSeed * 0.006) * uScale / max(dist, 0.01), 0.0, 4.0);
        gl_Position = projectionMatrix * mv;
      }`,
    fragmentShader: /* glsl */`
      varying float vAlpha;
      void main() {
        float r = length(gl_PointCoord - 0.5);
        gl_FragColor = vec4(vec3(1.0, 0.93, 0.82), (1.0 - smoothstep(0.0, 0.5, r)) * vAlpha * 0.28);
      }`,
  }));
  dust.frustumCulled = false;
  scene.add(dust);
  return dust;
}

function buildLights(scene) {
  for (const spec of ROOM.lights || []) {
    let light;
    if (spec.type === 'hemisphere') light = new THREE.HemisphereLight(spec.sky, spec.ground, spec.intensity);
    else if (spec.type === 'point') light = new THREE.PointLight(spec.color, spec.intensity, spec.distance ?? 0, 2);
    else if (spec.type === 'ambient') light = new THREE.AmbientLight(spec.color, spec.intensity);
    else if (spec.type === 'directional') light = new THREE.DirectionalLight(spec.color, spec.intensity);
    else continue;
    if (spec.position) light.position.fromArray(spec.position);
    scene.add(light);
  }
}


/* ---------------------------------------------------------------------
   7. Post-processing: film grain, a soft vignette and a faint split-RGB
   that grows a little while you run. (Same finish as The Garden.)
   --------------------------------------------------------------------- */
function showGraphicsNote(title, detail, reload = true) {
  const note = document.createElement('div');
  note.setAttribute('role', 'alert');
  note.style.cssText = 'position:fixed;inset:0;z-index:50;display:grid;place-content:center;gap:10px;text-align:center;padding:24px;background:rgba(10,8,16,0.86);color:#f5efe2;font:16px/1.5 system-ui,sans-serif;' + (reload ? 'cursor:pointer;' : '');
  note.innerHTML = `<strong style="font-size:20px">${title}</strong><span style="opacity:0.75">${detail}</span>`;
  if (reload) note.addEventListener('click', () => location.reload());
  document.body.appendChild(note);
}

function buildPostProcessing(renderer, scene, camera, pixelRatio) {
  const composer = new EffectComposer(renderer);
  composer.setPixelRatio(pixelRatio);
  composer.setSize(innerWidth, innerHeight);
  composer.addPass(new RenderPass(scene, camera));
  const finish = new ShaderPass({
    uniforms: { tDiffuse: { value: null }, uTime: { value: 0 }, uSpeed: { value: 0 }, uHolo: { value: 0 }, uGlitch: { value: 0 } },
    vertexShader: /* glsl */`
      varying vec2 vUv;
      void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
    fragmentShader: /* glsl */`
      uniform sampler2D tDiffuse;
      uniform float uTime, uSpeed, uHolo, uGlitch;
      varying vec2 vUv;
      float random(vec2 c) { return fract(sin(dot(c, vec2(12.9898, 78.233))) * 43758.5453); }
      void main() {
        vec2 uv = vUv;
        // glitch while switching views: torn horizontal bands
        float band = floor(vUv.y * 26.0), tick = floor(uTime * 30.0);
        uv.x += (random(vec2(band, tick)) - 0.5) * 0.08 * uGlitch * step(0.55, random(vec2(tick, band)));
        vec2 fromCentre = uv - 0.5;
        float amount = (0.0008 + uSpeed * 0.003 + uHolo * 0.0025 + uGlitch * 0.012) * (0.4 + length(fromCentre) * 1.8);
        vec2 offset = fromCentre * amount;
        vec3 color = vec3(texture2D(tDiffuse, uv + offset).r, texture2D(tDiffuse, uv).g, texture2D(tDiffuse, uv - offset).b);
        color += uHolo * vec3(0.35, 0.45, 1.0) * (sin(vUv.y * 900.0) * 0.5 + 0.5) * 0.025;
        color += (random(vUv * vec2(1717.0, 913.0) + fract(uTime * 7.0)) - 0.5) * 0.025;
        float d = length(fromCentre * vec2(1.0, 0.82));
        color *= 1.0 - smoothstep(0.38 - uSpeed * 0.08, 1.0 - uSpeed * 0.15, d) * 0.45;
        gl_FragColor = vec4(max(color, 0.0), 1.0);
      }`,
  });
  composer.addPass(finish);
  composer.addPass(new OutputPass());
  return { composer, uniforms: finish.uniforms };
}


/* ---------------------------------------------------------------------
   8. The room: input, walking, hotspots, frame loop, clean-up.
   Returns { dispose }.
   --------------------------------------------------------------------- */
async function startRoom() {
  page.roomName.textContent = ROOM.name;
  document.title = ROOM.name;

  let renderer;
  try {
    renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });   // the post pass replaces MSAA; saves a lot of GPU
  } catch (error) {
    showGraphicsNote('3D graphics are turned off in this browser right now.',
      'If Chrome blocked them after a crash, fully quit and reopen Chrome, then open the concert again.', false);
    document.body.classList.add('no-webgl');
    page.loader.classList.add('gone');
    page.fade.classList.add('out');
    page.ui.classList.add('on');
    return { dispose() {} };
  }
  let pixelRatio = Math.min(devicePixelRatio || 1, SETTINGS.maxPixelRatio);
  renderer.setPixelRatio(pixelRatio);
  renderer.setSize(innerWidth, innerHeight);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.3;
  page.view.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(ROOM.fog?.color || '#000000');
  if (ROOM.fog) scene.fog = new THREE.FogExp2(ROOM.fog.color, ROOM.fog.density);
  const camera = new THREE.PerspectiveCamera(SETTINGS.fov, innerWidth / innerHeight, 0.05, 1500);
  camera.rotation.order = 'YXZ';   // turn left/right first, then look up/down

  // ---- build
  const rand = seededRandom(SETTINGS.layoutSeed);
  const shared = { uTime: { value: 0 }, uScale: { value: 1 }, uFlash: { value: 0 }, roomWave: makeWave(), cityWave: makeWave() };   // scene time (stops when paused), pixel scale
  const animated = [], colliders = [], raycastTargets = [], hotspots = [];
  const textures = makeTextures(rand);
  if (ROOM.posterImages) await loadPosterImages(textures, ROOM.posterImages);
  textures.screen = makeScreenTexture(textures);
  textures.boothScreen = makeBoothScreen();
  const { mergeGeometries } = await import('three/addons/utils/BufferGeometryUtils.js');
  shared.mergeGeometries = mergeGeometries;
  buildGround(scene, textures, raycastTargets);
  buildLights(scene);
  const built = buildObjects(scene, textures, shared, animated, colliders, raycastTargets, hotspots);
  const dustMotes = buildDust(scene, rand, shared);
  dustMotes.visible = false;            // no floating specks in the lofi view
  mergeStatic(scene, built, raycastTargets, mergeGeometries);
  for (const { group, spec } of built) if (spec.hotspot || spec.style) mergeLocal(group, raycastTargets, mergeGeometries);
  buildNightSky(scene, shared);
  const crowdPeople = buildCrowd(scene, shared, mergeGeometries);
  const rig = buildStageRig(scene, shared);
  const stageSmoke = buildStageSmoke(scene, shared);
  buildGlowPoints(scene, shared);
  const surfHands = buildSurfHands(scene);
  const flashLight = new THREE.PointLight('#e8ecff', 0, 40, 2);    // the strobe when the show kicks in
  flashLight.position.set(0, 8.5, -12.5);
  scene.add(flashLight);
  const post = buildPostProcessing(renderer, scene, camera, pixelRatio);
  sound.prepareMusic();
  playlist.addShipped(ROOM.playlist);
  // real songs shipped with the room play first; "builtinSong": false in room.json drops the built-in one
  if (playlist.tracks.length > 1) {
    const builtin = playlist.tracks.shift();
    if (ROOM.builtinSong !== false) playlist.tracks.push(builtin);
  }

  // models: show progress on the loading screen while they download
  const manager = new THREE.LoadingManager();
  manager.onProgress = (url, loaded, total) => {
    page.loaderNote.textContent = `Loading ${loaded} / ${total}`;
    page.loaderNote.hidden = false;
  };
  await loadModels(scene, manager, colliders, raycastTargets, hotspots);
  clearTimeout(slowTimer);
  page.loaderNote.hidden = true;

  // ---- listeners all go through `listen`, so dispose() removes them together
  const listeners = new AbortController();
  const listen = (target, type, handler, options = {}) =>
    target.addEventListener(type, handler, { ...options, signal: listeners.signal });

  function resize() {
    const w = innerWidth, h = innerHeight;
    camera.aspect = w / h;
    camera.fov = w < h ? 80 : SETTINGS.fov;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
    post.composer.setSize(w, h);
    shared.uScale.value = (h * pixelRatio) / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)));
  }
  listen(window, 'resize', resize);
  resize();

  // If frames run slow, render at a lower resolution (down to 0.6x) instead of pushing the graphics card
  // until the browser resets it.
  let slowTime = 0, fastTime = 0;
  function watchFrameTime(frameMs) {
    if (frameMs > 50) { slowTime += frameMs; fastTime = 0; } else { fastTime += frameMs; slowTime = Math.max(0, slowTime - frameMs * 0.5); }
    if (slowTime > 1500 && pixelRatio > 0.6) {
      pixelRatio = Math.max(0.6, +(pixelRatio - 0.2).toFixed(2));
      renderer.setPixelRatio(pixelRatio); post.composer.setPixelRatio(pixelRatio); resize();
      slowTime = 0;
    } else if (fastTime > 8000 && pixelRatio < Math.min(devicePixelRatio || 1, SETTINGS.maxPixelRatio) - 0.01) {
      pixelRatio = Math.min(Math.min(devicePixelRatio || 1, SETTINGS.maxPixelRatio), +(pixelRatio + 0.1).toFixed(2));
      renderer.setPixelRatio(pixelRatio); post.composer.setPixelRatio(pixelRatio); resize();
      fastTime = 0;
    }
  }

  // If the graphics card resets anyway, stop drawing and offer a reload rather than throwing errors.
  listen(renderer.domElement, 'webglcontextlost', e => {
    e.preventDefault();
    cancelAnimationFrame(frameId);
    showGraphicsNote('The graphics card took a break.', 'Click to reload the concert');
  });
  listen(renderer.domElement, 'webglcontextrestored', () => location.reload());

  // ---- state
  const spawn = ROOM.spawn || { x: 0, z: 0, facing: 0 };
  const state = {
    time: 0,                 // scene time: stops while paused
    paused: false,
    recordOn: false,
    flash: 0,                // the white flash when the show kicks off, fading out
    talkLine: 0,
    mode: 'lofi',            // lofi, mix (code city) or code
    glitch: 0,
    show: false, showLevel: 0, cheer: 0, chant: 0, chantAt: 7, chantFrom: null, chantLen: 0, bassSip: 0,
  };
  const player = {
    position: new THREE.Vector3(spawn.x, 0, spawn.z),
    velocity: new THREE.Vector3(),
    bob: 0,
    floor: floorAt(spawn.x, spawn.z),
    wheel: 0,                // forward push from the mouse wheel, fades out
  };
  const look = {
    yaw: toRadians(spawn.facing), pitch: 0,
    yawTarget: toRadians(spawn.facing), pitchTarget: 0,
    yawSpeed: 0, pitchSpeed: 0,
    drag: null, lastMove: 0, lastTap: 0,
  };
  const keys = new Set();
  const stick = { x: 0, y: 0, id: null };
  const twoFinger = { on: false, startX: 0, startY: 0, startGap: 0, x: 0, y: 0 };   // two-finger walking on touch screens
  const mouse = { ndc: new THREE.Vector2(), inside: false };
  const PITCH_LIMIT = 1.2;
  const clampPitch = v => Math.max(-PITCH_LIMIT, Math.min(PITCH_LIMIT, v));
  const toNdc = (x, y, out) => out.set((x / innerWidth) * 2 - 1, -(y / innerHeight) * 2 + 1);

  // ---- messages
  let toastTimer = 0;
  function toast(text) {
    page.toast.textContent = text;
    page.toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => page.toast.classList.remove('show'), 2200);
  }
  const updateSoundButton = () => page.sound.setAttribute('aria-pressed', String(sound.on));

  // ---- what hotspots do. Add your own here and use them in ROOM: hotspot: { action: 'name' }
  const ACTIONS = {
    record() {

    talk(hotspot, group) {

    chime() {

    say(hotspot) { say(hotspot, hotspot.lines || []); },
    drummerTalk(hotspot, group) {
      say(hotspot, ['don’t touch the kit. i mean it. hi', 'i’ve broken two sticks and a heart tonight', 'the hairspray’s holding. barely', 'one, two, one two three four!', 'that crowd is LOUD. i love it']);

      group.traverse(o => { if (o.userData.anim === 'nod') o.userData.lookUntil = state.time + 4; });

    engineerTalk(hotspot, group) {
      say(hotspot, ['the desk’s right there. “start the show”. go on, i dare you', 'they’re loud. i made them louder', 'don’t lean on the barrier, it squeaks on the recording', 'i’ve been mixing since four. please bring me a taco']);
      group.traverse(o => { if (o.userData.anim === 'nod') o.userData.lookUntil = state.time + 4; });
    },
    dive() { startDive(); },
  };
  function activate(group) {
    const hotspot = group.userData.hotspot;
