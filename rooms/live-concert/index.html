<!DOCTYPE html>
<!--
  LIVE CONCERT  (three.js r186, built on Room Template v2)
  The Stumps headline the main stage of an outdoor festival at night. Walk the field, get up on the
  stage, press play to start the show, stage-dive into the crowd. Lofi / Mix / Code views as ever:
  in Mix the crowd turns to skeletons and the sky to falling code.
  A room.json next to this page can set: title, doors, playlist, posters, band, guitarist, bassist, drummer.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Live Concert</title>
<meta name="description" content="The Stumps live on the main stage of a night-time festival: a packed field, a truss stage, lights, tents. Press play to start the show.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500&display=swap" rel="stylesheet">

<style>
/* ===================================================================
   Base
   =================================================================== */
:root {
  --u: min(calc(100vw / 1600), calc(100vh / 900));   /* 1u = 1px on a 1600×900 screen; scales with the window */
  --cream: #f5efe2;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
[hidden] { display: none !important; }

html, body {
  height: 100%;
  background: #000;
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-user-select: none;
  user-select: none;
}
html { cursor: grab; }
html.dragging { cursor: grabbing; }
html.can-use { cursor: pointer; }
body {
  color: var(--cream);
  font-family: Manrope, system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
  touch-action: none;              /* the page handles all touch gestures itself */
}
body.no-webgl { background: radial-gradient(120% 80% at 50% 100%, #2a1f2e 0%, #100c12 45%, #000 80%); }

a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
a:focus-visible, button:focus-visible { outline: 2px solid var(--cream); outline-offset: 3px; }

/* ===================================================================
   3D view and the black fade used for the intro and for doors
   =================================================================== */
#view { position: fixed; inset: 0; }
#view canvas { display: block; width: 100% !important; height: 100% !important; }
#fade { position: fixed; inset: 0; z-index: 5; background: #000; pointer-events: none; transition: opacity 1.2s ease; }
#fade.out { opacity: 0; }
#fade.leaving { opacity: 1; transition-duration: 0.6s; }

/* ===================================================================
   Interface layer (fades in after the intro)
   =================================================================== */
.ui {
  position: fixed;
  inset: 0;
  z-index: 2;
  pointer-events: none;            /* clicks pass through to the 3D view... */
  opacity: 0;
  transition: opacity 1.2s ease;
}
.ui.on { opacity: 1; }
.ui a, .ui button, .stick {
  pointer-events: auto;            /* ...except on links, buttons and the joystick */
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;     /* no long-press menu on phones */
  -webkit-tap-highlight-color: transparent;
  touch-action: none;
}

header {
  position: absolute;
  top: env(safe-area-inset-top, 0);
  left: 0;
  right: 0;
  padding: calc(24 * var(--u)) calc(44 * var(--u)) 0;
}
.logo { display: block; width: fit-content; font-size: calc(26 * var(--u)); font-weight: 500; letter-spacing: -0.02em; }

/* "Paused" chip and short messages, top centre */
.chip {
  position: absolute;
  top: calc(28 * var(--u) + env(safe-area-inset-top, 0px));
  left: 50%;
  transform: translateX(-50%);
  padding: 7px 14px;
  border-radius: 99px;
  background: rgba(0, 0, 0, 0.5);
  border: 1px solid rgba(245, 239, 226, 0.25);
  font-size: 12px;
  font-weight: 500;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  transition: opacity 0.4s;
}
#toast { top: calc(72 * var(--u) + env(safe-area-inset-top, 0px)); letter-spacing: 0.04em; text-transform: none; font-size: 13px; opacity: 0; }
#toast.show { opacity: 1; }

/* Label for the thing you're looking at / pointing at; tap it on a phone to use it */
.prompt {
  position: absolute;
  left: 50%;
  bottom: calc(120 * var(--u) + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%);
  padding: 9px 16px;
  border-radius: 99px;
  background: rgba(0, 0, 0, 0.55);
  border: 1px solid rgba(245, 239, 226, 0.35);
  font-size: 14px;
  font-weight: 500;
  white-space: nowrap;
}
.prompt b { font-weight: 500; opacity: 0.6; margin-left: 8px; }

/* Centre dot on touch screens: what's under it can be used */
.reticle {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 6px;
  height: 6px;
  margin: -3px 0 0 -3px;
  border-radius: 50%;
  background: rgba(245, 239, 226, 0.55);
  transition: transform 0.2s, background 0.2s;
  display: none;
}
.reticle.on { transform: scale(2.2); background: var(--cream); }

/* Bottom right: hints, pause and sound */
.corner {
  position: absolute;
  right: calc(44 * var(--u));
  bottom: calc(44 * var(--u) + env(safe-area-inset-bottom, 0px));
  display: flex;
  align-items: center;
  gap: calc(18 * var(--u));
  font-size: calc(12.5 * var(--u));
  font-weight: 500;
  letter-spacing: 0.16em;
  text-transform: uppercase;
}
.corner i { width: 1px; height: calc(26 * var(--u)); background: rgba(245, 239, 226, 0.45); }
.icon-btn { display: grid; place-items: center; width: calc(28 * var(--u)); height: calc(28 * var(--u)); }
.icon-btn svg { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.icon-btn svg .solid { fill: currentColor; stroke: none; }
.sound .waves, .sound .cross { transition: opacity 0.3s; }
.sound[aria-pressed="false"] .waves { opacity: 0; }
.sound[aria-pressed="true"] .cross { opacity: 0; }
.pause[aria-pressed="false"] .play { display: none; }
/* the card a door shows for a link to another site */
.door-card {
  position: fixed;
  left: 50%; top: 50%;
  transform: translate(-50%, -50%);
  z-index: 30;
  min-width: 260px;
  padding: 22px 24px 18px;
  border-radius: 18px;
  background: rgba(18, 12, 34, 0.86);
  border: 1px solid rgba(245, 239, 226, 0.18);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  color: #f5efe2;
  text-align: center;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
}
.door-card[hidden] { display: none; }
.door-title { margin: 0; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: rgba(245, 239, 226, 0.6); }
.door-where { margin: 8px 0 18px; font-size: 20px; font-weight: 600; word-break: break-all; }
.door-actions { display: flex; gap: 10px; justify-content: center; }
.door-go, .door-stay { padding: 9px 18px; border-radius: 999px; font: inherit; font-size: 14px; cursor: pointer; text-decoration: none; }
.door-go { background: linear-gradient(135deg, #8c4fe3, #4f6bff); color: #fff; border: 0; }
.door-stay { background: none; color: rgba(245, 239, 226, 0.8); border: 1px solid rgba(245, 239, 226, 0.25); }
/* music player, under the title */
.player {
  display: flex;
  width: fit-content;
  align-items: center;
  gap: 6px;
  margin-top: calc(12 * var(--u));
  padding: 5px 8px 5px 6px;
  max-width: min(440px, 70vw);
  border-radius: 999px;
  background: rgba(18, 12, 34, 0.55);
  border: 1px solid rgba(245, 239, 226, 0.16);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  pointer-events: auto;
}
.player .icon-btn { width: 26px; height: 26px; padding: 4px; border: 0; background: none; color: inherit; cursor: pointer; border-radius: 50%; }
.player .icon-btn:hover { background: rgba(245, 239, 226, 0.1); }
.player label.icon-btn { pointer-events: auto; }
#playSong[aria-pressed="false"] .bars, #playSong[aria-pressed="true"] .play { display: none; }
.player .now {
  min-width: 0;
  padding: 0 6px;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
  font-size: 13px;
  color: rgba(245, 239, 226, 0.85);
}
.player.drop { outline: 2px dashed #b9c4ff; outline-offset: 3px; }
#musicVolume { width: 70px; flex: none; margin: 0 4px 0 2px; accent-color: #b9a4ff; cursor: pointer; pointer-events: auto; }
/* Lofi / Mix / Code switch, top right */
.modes {
  position: absolute;
  top: calc(18 * var(--u));
  right: calc(44 * var(--u));
  display: flex;
  padding: 4px;
  border-radius: 999px;
  background: rgba(18, 12, 34, 0.55);
  border: 1px solid rgba(245, 239, 226, 0.16);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}
.modes button {
  position: relative;
  z-index: 1;
  padding: 7px 15px;
  border: 0;
  border-radius: 999px;
  background: none;
  color: rgba(245, 239, 226, 0.7);
  font: inherit;
  font-size: 13px;
  letter-spacing: 0.04em;
  cursor: pointer;
  transition: color 0.3s;
}
.modes button[aria-checked="true"] { color: #fff; }
.modes button:focus-visible { outline: 2px solid #b9c4ff; outline-offset: 1px; }
.modes-thumb {
  position: absolute;
  top: 4px; bottom: 4px; left: 0;
  width: 0;
  border-radius: 999px;
  background: linear-gradient(135deg, #8c4fe3, #4f6bff);
  box-shadow: 0 0 14px rgba(140, 79, 227, 0.55);
  transition: transform 0.4s cubic-bezier(.3,.7,.2,1), width 0.4s cubic-bezier(.3,.7,.2,1);
}
.crowd-noise .drops, .crowd-noise .cross { transition: opacity 0.3s; }
.crowd-noise[aria-pressed="false"] .drops { opacity: 0; }
.crowd-noise[aria-pressed="true"] .cross { opacity: 0; }
.pause[aria-pressed="true"] .bars { display: none; }

/* Arrow pad (touch screens only): up and down walk, left and right turn; slide between them */
.stick {
  position: absolute;
  left: calc(22px + env(safe-area-inset-left, 0px));
  bottom: calc(22px + env(safe-area-inset-bottom, 0px));
  width: 138px;
  height: 138px;
  display: none;
  touch-action: none;
}
.stick-knob { display: none; }
.pad-arrow {
  position: absolute;
  width: 46px;
  height: 46px;
  padding: 9px;
  border-radius: 12px;
  background: rgba(10, 10, 12, 0.42);
  border: 1px solid rgba(245, 239, 226, 0.28);
  fill: none;
  stroke: rgba(245, 239, 226, 0.92);
  stroke-width: 2.4;
  stroke-linecap: round;
  stroke-linejoin: round;
  transition: background .12s, border-color .12s;
}
.pad-arrow[data-dir="up"] { left: 46px; top: 0; }
.pad-arrow[data-dir="down"] { left: 46px; bottom: 0; }
.pad-arrow[data-dir="left"] { left: 0; top: 46px; }
.pad-arrow[data-dir="right"] { right: 0; top: 46px; }
.stick.up .pad-arrow[data-dir="up"], .stick.down .pad-arrow[data-dir="down"],
.stick.left .pad-arrow[data-dir="left"], .stick.right .pad-arrow[data-dir="right"] { background: rgba(245, 239, 226, 0.3); border-color: rgba(245, 239, 226, 0.7); }

.hint-touch { display: none; }
@media (hover: none) and (pointer: coarse) {
  .hint-desk { display: none !important; }
  .hint-touch { display: inline; }
  .stick, .reticle { display: block; }
}

/* ===================================================================
   Loading screen (with progress for models, and a message if three.js can't load)
   =================================================================== */
.loader {
  position: fixed;
  inset: 0;
  z-index: 6;
  display: grid;
  place-items: center;
  background: #000;
  transition: opacity 0.8s ease;
  pointer-events: none;
}
.loader.gone { opacity: 0; }
.loader.failed { pointer-events: auto; }
.loader.failed .loader-dot { display: none; }
.loader-dot {
  width: calc(9 * var(--u));
  height: calc(9 * var(--u));
  min-width: 6px;
  min-height: 6px;
  border-radius: 50%;
  background: var(--cream);
  animation: pulse 1.2s ease-in-out infinite;
}
@keyframes pulse { 50% { transform: scale(0.4); opacity: 0.4; } }
.loader-note {
  position: absolute;
  top: calc(50% + 26px);
  left: 0;
  right: 0;
  text-align: center;
  font-size: 13px;
  letter-spacing: 0.04em;
  opacity: 0.6;
}
.loader-error { display: grid; gap: 8px; justify-items: center; padding: 0 24px; text-align: center; font-size: 15px; }
.loader-error .sub { font-size: 13px; opacity: 0.65; }
.loader-error button {
  margin-top: 10px;
  height: 40px;
  padding: 0 20px;
  border-radius: 99px;
  background: var(--cream);
  color: #151510;
  font-weight: 500;
}

/* Frames-per-second readout */
#fps {
  position: fixed;
  z-index: 4;
  top: calc(70 * var(--u) + env(safe-area-inset-top, 0px));
  right: calc(44 * var(--u));
  padding: 6px 9px;
  border-radius: 6px;
  background: rgba(0, 0, 0, 0.45);
  color: var(--cream);
  font: 500 12px/1 ui-monospace, Menlo, monospace;
  letter-spacing: 0.06em;
  pointer-events: none;
}

/* ===================================================================
   Phones and narrow windows
   =================================================================== */
@media (max-width: 820px) {
  :root { --u: 1px; }
  header { padding: 18px 18px 0; }
  .corner { right: 20px; bottom: calc(30px + env(safe-area-inset-bottom)); font-size: 11px; }
  .icon-btn { width: 30px; height: 30px; }
  .prompt { bottom: calc(170px + env(safe-area-inset-bottom)); }
  #fps { top: calc(64px + env(safe-area-inset-top, 0px)); right: 18px; }
}
/* ===================================================================
   Touch screens: a clean screen. No instructions on top of the room (the showcase page has them);
   a small title, the view switch top right, just the buttons bottom right.
   =================================================================== */
@media (hover: none) and (pointer: coarse) {
  .hint-touch, .corner > i, .prompt, .reticle, #musicVolume { display: none !important; }
  header { padding: 12px calc(12px + env(safe-area-inset-right, 0px)) 0 calc(14px + env(safe-area-inset-left, 0px)); }
  .logo { font-size: 15px; font-weight: 500; letter-spacing: -0.01em; }
  .player { margin-top: 10px; max-width: calc(100vw - 28px); }
  .modes { top: 8px; right: calc(10px + env(safe-area-inset-right, 0px)); padding: 3px; }
  .modes button { padding: 5px 10px; font-size: 12px; }
  #pausedChip { top: calc(84px + env(safe-area-inset-top, 0px)); }
  #toast { top: calc(84px + env(safe-area-inset-top, 0px)); font-size: 12px; max-width: calc(100vw - 40px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .corner { right: calc(12px + env(safe-area-inset-right, 0px)); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); gap: 4px; }
  .corner .icon-btn { width: 30px; height: 30px; }
  .corner { gap: 10px; }
  .stick { left: calc(18px + env(safe-area-inset-left, 0px)); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); }
}
/* Inside the Shaden showcase page: the page around the room has the player, the view switch and the tips,
   so the room shows none of its own controls; messages sit at the bottom. (Fullscreen brings the controls back.) */
html.embedded .logo, html.embedded .player, html.embedded .corner, html.embedded #pausedChip { display: none !important; }
html.embedded:not(.modes-inside) .modes { display: none !important; }   /* on phones the page shows it above the window */
html.embedded #toast { top: auto !important; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); }
html.embedded .prompt { bottom: calc(56px + env(safe-area-inset-bottom, 0px)); }
/* on a phone, inside the showcase: nothing but the room and the arrow pad */
html.embedded.embed-phone #toast, html.embedded.embed-phone .prompt, html.embedded.embed-phone .reticle, html.embedded.embed-phone .hint-touch { display: none !important; }
@media (prefers-reduced-motion: reduce) {
  .loader-dot { animation: none; }
}
</style>

<!-- three.js (keep these addresses identical in every room so phones reuse the cached copy) -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/"
  }
}
</script>
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js">
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.core.js">
</head>

<body>
<div id="view" aria-hidden="true"></div>

<div class="ui" id="ui">
  <header>
    <a class="logo" href="#" id="roomName">Room</a>
    <div class="player" id="player" aria-label="Music">
      <button class="icon-btn" id="prevSong" aria-label="Previous song (B)">
        <svg viewBox="0 0 24 24"><path class="solid" d="M17 6.5v11a.7.7 0 0 1-1.1.6L9 12.6a.7.7 0 0 1 0-1.2l6.9-5.5a.7.7 0 0 1 1.1.6Z"/><path d="M7 6v12"/></svg>
      </button>
      <button class="icon-btn" id="playSong" aria-pressed="false" aria-label="Play music">
        <svg viewBox="0 0 24 24">
          <path class="play solid" d="M8 6.2v11.6a.8.8 0 0 0 1.2.7l9.2-5.8a.8.8 0 0 0 0-1.4L9.2 5.5A.8.8 0 0 0 8 6.2Z"/>
          <g class="bars"><rect class="solid" x="7" y="6" width="3.2" height="12" rx="1"/><rect class="solid" x="13.8" y="6" width="3.2" height="12" rx="1"/></g>
        </svg>
      </button>
      <button class="icon-btn" id="nextSong" aria-label="Next song (N)">
        <svg viewBox="0 0 24 24"><path class="solid" d="M7 6.5v11a.7.7 0 0 0 1.1.6l6.9-5.5a.7.7 0 0 0 0-1.2L8.1 5.9A.7.7 0 0 0 7 6.5Z"/><path d="M17 6v12"/></svg>
      </button>
      <span class="now" id="nowPlaying">low ceiling (live)</span>
      <label class="icon-btn add" for="songFile" title="Add songs, or drop MP3s anywhere in the room" aria-label="Add songs">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      </label>
      <button class="icon-btn" id="removeSong" aria-label="Remove this song from the playlist" title="Remove this song" hidden>
        <svg viewBox="0 0 24 24"><path d="M5 7h14M10 7V5h4v2M7 7l1 12h8l1-12"/></svg>
      </button>
      <input type="file" id="songFile" accept="audio/*,.mp3,.m4a,.ogg,.wav,.flac" multiple hidden>
      <input type="range" id="musicVolume" min="0" max="1" step="0.01" aria-label="Music volume" title="Music volume">
    </div>
    <div class="modes" id="modes" role="radiogroup" aria-label="View (H to switch)">
      <span class="modes-thumb" id="modesThumb"></span>
      <button role="radio" aria-checked="true" data-mode="lofi">Concert</button>
      <button role="radio" aria-checked="false" data-mode="mix">Mix</button>
      <button role="radio" aria-checked="false" data-mode="code">Code</button>
    </div>
  </header>

  <div class="chip" id="pausedChip" hidden>Paused</div>
  <div class="chip" id="toast" role="status"></div>
  <div class="reticle" id="reticle"></div>
  <button class="prompt" id="prompt" hidden></button>

  <div class="stick" id="stick" aria-label="Walk: up and down to walk, left and right to turn"><div class="stick-knob" id="stickKnob"></div><svg class="pad-arrow" data-dir="up" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 14.5 12 9.5l5 5" transform="rotate(0 12 12)"/></svg><svg class="pad-arrow" data-dir="right" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 14.5 12 9.5l5 5" transform="rotate(90 12 12)"/></svg><svg class="pad-arrow" data-dir="down" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 14.5 12 9.5l5 5" transform="rotate(180 12 12)"/></svg><svg class="pad-arrow" data-dir="left" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 14.5 12 9.5l5 5" transform="rotate(270 12 12)"/></svg></div>

  <div class="corner">
    <span class="hint-desk">WASD to walk</span><i class="hint-desk"></i><span class="hint-desk">Drag to look</span><i class="hint-desk"></i><span class="hint-desk">Space: start the show</span><i class="hint-desk"></i><span class="hint-desk">H to switch view</span><i class="hint-desk"></i><span class="hint-desk">Drop an MP3 to play it</span>
    <span class="hint-touch">Drag to look · ▶ starts the show</span>
    <i></i>
    <button class="icon-btn crowd-noise" id="crowdNoise" aria-pressed="true" aria-label="Crowd noise" title="Crowd noise">
      <svg viewBox="0 0 24 24">
        <circle cx="8" cy="9" r="2.4"/><circle cx="15.5" cy="9.5" r="2.2"/>
        <path d="M3.5 19c0-3 2-4.8 4.5-4.8s4.5 1.8 4.5 4.8M11.6 19c.2-2.7 1.8-4.3 3.9-4.3 2.3 0 4 1.7 4 4.3"/>
        <path class="drops" d="M5 4.5 6 6M11.5 3.5v1.8M18 4.5l-1 1.5"/>
        <path class="cross" d="m17 15.5 4 4m0-4-4 4"/>
      </svg>
    </button>
    <button class="icon-btn pause" id="pause" aria-pressed="false" aria-label="Pause">
      <svg viewBox="0 0 24 24">
        <g class="bars"><rect class="solid" x="7" y="6" width="3.2" height="12" rx="1"/><rect class="solid" x="13.8" y="6" width="3.2" height="12" rx="1"/></g>
        <path class="play solid" d="M8 6.2v11.6a.8.8 0 0 0 1.2.7l9.2-5.8a.8.8 0 0 0 0-1.4L9.2 5.5A.8.8 0 0 0 8 6.2Z"/>
      </svg>
    </button>
    <button class="icon-btn sound" id="sound" aria-pressed="false" aria-label="Sound">
      <svg viewBox="0 0 24 24">
        <path d="M4 9.5v5h3.5L12 18V6L7.5 9.5Z"/>
        <path class="waves" d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/>
        <path class="cross" d="m16 10 4 4m0-4-4 4"/>
      </svg>
    </button>
  </div>
</div>

<div id="fade"></div>

<div class="door-card" id="doorCard" role="dialog" aria-label="Door" hidden>
  <p class="door-title" id="doorTitle">This door leads to</p>

<script type="module">
/* =====================================================================
   Contents
     1. The room (data: edit this to make a new room)
     2. Settings and page elements
     3. Loading three.js and room.json
     4. Sound: room tone, music file or built-in beat, chimes, level meter
     5. Randomness and textures
     6. Building the room from the description
     7. Post-processing
     8. The room: input, walking, hotspots, frame loop, clean-up
   ===================================================================== */


/* ---------------------------------------------------------------------
   1. The room
   Units are metres. Positions are [x, y, z]: x left/right, y up, z toward
   you (the far wall is at negative z). Angles are in degrees.
   Parts: box [w, h, d] · cylinder [radiusTop, radiusBottom, height, thetaStart?, thetaLength?] ·
          sphere [radius, phiStart?, phiLength?, thetaStart?, thetaLength?] · disc [radius] ·
          cone [radius, height] · torus [radius, tube, arcDegrees?] · plane [w, h] ·
          limb { from, to, radius } (a capsule between two points) ·
          screen [w, h] (a big stage screen) · cable { points, radius } · arm (two-bone, aims at a hand) ·
          light (point light) · string (a strand of little bulbs) ·
          group { parts, anim } (moves its parts together: breathe, nod, tap, blink, tail, look).
   Part extras: color, emissive, emissiveIntensity, roughness, metalness, scale [x, y, z],
          texture (a texture name), spin, pulse (glows with the music), flicker, open (hollow).
   --------------------------------------------------------------------- */

// ---- Your copy's settings. A room.json next to this page can change the songs, posters, the band's
//      looks, the doors and what they say. Anything left out
//      keeps this showcase's look. A room.json that has "objects" replaces the whole room instead.
let CUSTOM = {};
try {
  const response = await fetch('room.json', { cache: 'no-cache' });
  if (response.ok) CUSTOM = await response.json();
} catch { /* no room.json: the showcase room */ }
const LOOK = { guitarist: { ...CUSTOM.guitarist }, bassist: { ...CUSTOM.bassist }, drummer: { ...CUSTOM.drummer } };

// Lighten (amount > 0) or darken (amount < 0) a #rrggbb colour.
function shade(hex, amount) {
  const n = parseInt(String(hex).replace('#', ''), 16);
  const mix = c => Math.round(amount >= 0 ? c + (255 - c) * amount : c * (1 + amount));
  return '#' + [n >> 16 & 255, n >> 8 & 255, n & 255].map(c => mix(c).toString(16).padStart(2, '0')).join('');
}

// the guitarist (and the shared painted face)
const C = {
  skin: LOOK.guitarist.skin || '#dcbba6', shirt: LOOK.guitarist.flannel || '#8c3242', hair: LOOK.guitarist.hair || '#b09460',
  eyes: LOOK.guitarist.eyes || '#86b8c2', lips: '#6a3e3e', beanie: LOOK.guitarist.beanie || '#2f5a35',
  jeans: LOOK.guitarist.jeans || '#3e4c6a', guitar: LOOK.guitarist.guitar || '#b5121b', bass: LOOK.bassist.bass || '#25222c',
  black: '#121016', paper: '#ece8f2',
};
C.hairGlow = shade(C.hair, -0.55);
// the big bassist
const BS = {
  skin: LOOK.bassist.skin || '#e3b896', hair: LOOK.bassist.hair || '#4a3222', beard: LOOK.bassist.beard || '#5a3a24',
  shirt: LOOK.bassist.shirt || '#2a2a31', pants: LOOK.bassist.pants || '#4e5a66', cap: LOOK.bassist.cap || '#b8352a',

// the drummer
const DR = {
  skin: LOOK.drummer.skin || '#e6c2a6', hair: LOOK.drummer.hair || '#f1d35a', shirt: LOOK.drummer.shirt || '#141217',
  pants: LOOK.drummer.pants || '#2c2c33', gauges: LOOK.drummer.gauges || '#0e0e10',
};

// Flip a list of parts left-to-right (for furniture moved to the other wall).
function mirrorX(parts) {
  return parts.map(p => {
    const q = { ...p };
    if (p.offset) q.offset = [-p.offset[0], p.offset[1], p.offset[2]];
    if (p.from) q.from = [-p.from[0], p.from[1], p.from[2]];
    if (p.to) q.to = [-p.to[0], p.to[1], p.to[2]];
    if (p.rotation) q.rotation = [p.rotation[0], -p.rotation[1], -p.rotation[2]];
    if (p.parts) q.parts = mirrorX(p.parts);
    return q;
  });
}

/* THE STUMPS: LIVE. The Stumps (the basement band) headlining the main stage of an outdoor festival
   at night: a big truss stage, a packed field, tents to wander. Everything is invented: the band,
   the festival (Nightfield), the taco truck, the bar, the merch. */
const D2R = Math.PI / 180;
const BAND = String(CUSTOM.band || 'THE STUMPS').toUpperCase().slice(0, 18);
const BAND_TITLE = BAND.toLowerCase().replace(/(^|\s)\S/g, s => s.toUpperCase());
const FEST = 'NIGHTFIELD';

// Turn [x, y, z] about y (degrees) and shift it: used to lay out the kit and the gear.
function turnPoint([x, y, z], turn, at = [0, 0, 0]) {
  const a = turn * D2R;
  return [at[0] + x * Math.cos(a) + z * Math.sin(a), at[1] + y, at[2] - x * Math.sin(a) + z * Math.cos(a)];
}
// A point inside a group rotated [rx, ry, rz] degrees (three's XYZ order), scaled, then shifted.
function placePoint(p, rot = [0, 0, 0], at = [0, 0, 0], s = 1) {
  let [x, y, z] = [p[0] * s, p[1] * s, p[2] * s];
  const [a, b, c] = rot.map(v => v * D2R);
  [x, y] = [x * Math.cos(c) - y * Math.sin(c), x * Math.sin(c) + y * Math.cos(c)];
  [x, z] = [x * Math.cos(b) + z * Math.sin(b), -x * Math.sin(b) + z * Math.cos(b)];
  [y, z] = [y * Math.cos(a) - z * Math.sin(a), y * Math.sin(a) + z * Math.cos(a)];
  return [at[0] + x, at[1] + y, at[2] + z];
}

/* ---- The stage: a 20 × 8 m deck, 1.4 m up, its front edge at z = -14 facing the field (+z).
        A wing on stage-left (+x) with a landing, and 8 steps down to the ground beside the PA. */
const STAGE = {
  h: 1.4, x0: -10, x1: 10, z0: -22, z1: -14,
  wingX: 10, wingZ: -17.8, stairX: [12, 14.6], foot: -14.6, top: -17.8, run: 0.32, rise: 0.14, steps: 10,
  riser: { x0: -1.7, x1: 1.7, z0: -21.5, z1: -18.6, h: 0.4 },
  trussY: 9.6, front: -14.3, back: -21.7, towerX: 9.7,
};
const SPAWN = { x: 1.6, z: 3.2, facing: 0 };

// how high the floor is at any spot (the stage, the drum riser, the steps), and where you may walk
function floorAt(x, z) {
  const S = STAGE;
  // the steps: you glide up a smooth slope over them (no stutter step to step)
  if (x >= S.stairX[0] && x <= S.stairX[1] && z <= S.foot && z >= S.top) return S.h * Math.min(1, Math.max(0, (S.foot - z + 0.12) / (S.foot - S.top)));
  const deck = x >= S.x0 && x <= S.x1 && z >= S.z0 && z <= S.z1;
  const wing = x > S.x1 - 1.5 && x <= S.stairX[1] && z >= S.z0 && z <= S.wingZ;
  if (deck || wing) {
    const r = S.riser;
    return x >= r.x0 && x <= r.x1 && z >= r.z0 && z <= r.z1 ? S.h + r.h : S.h;
  }
  return 0;
}
const WALKABLE = [
  { minX: -37.5, maxX: 37.5, minZ: -11.6, maxZ: 43.5 },       // the field, up to the barricade
  { minX: -37.5, maxX: -12.3, minZ: -29, maxZ: -10.5 },       // round the left of the stage
  { minX: 13.6, maxX: 37.5, minZ: -29, maxZ: -10.5 },         // round the right of the stage
  { minX: 11.9, maxX: 14.7, minZ: -18.3, maxZ: -10.5 },      // the path beside the PA and up the wide steps
  { minX: 8.4, maxX: 14.7, minZ: -22, maxZ: -17.6 },          // the big landing, open onto the stage
  { minX: -10, maxX: 10, minZ: -22, maxZ: -14 },              // the stage
];

// ---- tiny part helpers
const B = (size, offset, color, x = {}) => ({ shape: 'box', size, offset, color, ...x });
const CY = (size, offset, color, x = {}) => ({ shape: 'cylinder', size, offset, color, ...x });
const SP = (size, offset, color, x = {}) => ({ shape: 'sphere', size, offset, color, ...x });
const LB = (from, to, radius, color, x = {}) => ({ shape: 'limb', from, to, radius, color, ...x });
const metal = { metalness: 0.55, roughness: 0.3 };
const ALU = '#a4a9b2', STEEL = '#2b2c31', BLACK = '#141417';

/* ---- The drum kit, on the riser at the back of the stage, facing the field. Kit space: the drummer
        sits at -z looking toward +z; their left hand is +x (hi-hat, crash), their right is -x. */
const KIT = { at: [0, STAGE.h + STAGE.riser.h, -19.75], turn: 0 };
const kitAt = (x, z) => turnPoint([x, 0, z], KIT.turn, KIT.at);
const SHELL = '#7c2a35', HEAD = '#ebe4d6', CHROME = '#b4bac6', BRASS = '#d0a650';

// a drum: shell, two hoops, a head on top and the lugs
function drumParts(r, depth, { logo = null, lugs = 8 } = {}) {
  const parts = [
    { shape: 'cylinder', size: [r, r, depth], color: SHELL, roughness: 0.32, metalness: 0.15, segments: 20 },
    { shape: 'cylinder', size: [r + 0.007, r + 0.007, 0.022], offset: [0, depth / 2 - 0.006, 0], color: CHROME, ...metal, open: true, segments: 20 },
    { shape: 'cylinder', size: [r + 0.007, r + 0.007, 0.022], offset: [0, -depth / 2 + 0.006, 0], color: CHROME, ...metal, open: true, segments: 20 },
    { shape: 'disc', size: [r + 0.001], offset: [0, depth / 2 + 0.003, 0], color: HEAD, roughness: 0.75, ...(logo && { texture: logo }) },
    { shape: 'disc', size: [r + 0.001], offset: [0, -depth / 2 - 0.003, 0], rotation: [180, 0, 0], color: '#d9d2c4', roughness: 0.8 },
  ];
  for (let i = 0; i < lugs; i++) {
    const a = (i + 0.5) / lugs * Math.PI * 2;
    parts.push({ shape: 'box', size: [0.016, depth * 0.42, 0.02], offset: [Math.cos(a) * (r + 0.009), 0, Math.sin(a) * (r + 0.009)], rotation: [0, -a / D2R, 0], color: CHROME, ...metal });
  }
  return parts;
}
// a cymbal: a shallow brass cone with a bell; it shivers while the band plays
function cymbalParts(r, tilt = -10, amp = 0.06) {
  return [{ shape: 'group', anim: { type: 'shimmer', amp }, rotation: [tilt, 0, 0], parts: [
    { shape: 'cylinder', size: [0.05, r, 0.022], color: BRASS, metalness: 0.5, roughness: 0.28, open: true, segments: 24 },
    { shape: 'sphere', size: [0.05, 0, 360, 0, 90], offset: [0, 0.009, 0], scale: [1, 0.7, 1], color: BRASS, metalness: 0.5, roughness: 0.28 },
    { shape: 'cylinder', size: [0.006, 0.006, 0.05], offset: [0, 0.03, 0], color: CHROME, ...metal },
  ]}];
}
// the stands, pedals and the throne (static: baked together), in kit space
function kitHardware() {
  const p = [];

    }
    p.push({ shape: 'limb', from: [x, h * 0.32, z], to: [x, h, z], radius: r + 0.003, color: CHROME, ...metal });
  };
  leg(0, -0.62, 0.42, 0.22, 0.01);                                        // throne
  p.push({ shape: 'cylinder', size: [0.18, 0.17, 0.09], offset: [0, 0.48, -0.62], color: '#18161a', roughness: 0.6 });

  p.push({ shape: 'limb', from: [0.62, 1.05, 0.32], to: [0.56, 1.1, 0.22], radius: 0.009, color: CHROME, ...metal });
  leg(-0.7, 0.08, 0.94, 0.2);                                             // ride

  p.push({ shape: 'limb', from: [-0.44, 1.1, 0.5], to: [-0.36, 1.15, 0.36], radius: 0.009, color: CHROME, ...metal });
  p.push({ shape: 'box', size: [0.08, 0.015, 0.22], offset: [0, 0.02, -0.18], rotation: [12, 0, 0], color: '#222026', ...metal });   // kick pedal
  p.push({ shape: 'limb', from: [0, 0.04, -0.1], to: [0, 0.2, -0.13], radius: 0.006, color: CHROME, ...metal });
  p.push({ shape: 'limb', from: [0.22, 0.2, 0.15], to: [0.36, 0.01, 0.18], radius: 0.008, color: CHROME, ...metal });

  p.push({ shape: 'limb', from: [-0.05, 0.56, 0.08], to: [-0.17, 0.72, 0.02], radius: 0.011, color: CHROME, ...metal });
  for (const [dx, dz] of [[0.16, 0.08], [-0.15, 0.1], [0.0, -0.18]]) p.push({ shape: 'limb', from: [-0.46 + dx, 0.36, -0.26 + dz], to: [-0.46 + dx * 1.2, 0.01, -0.26 + dz * 1.2], radius: 0.008, color: CHROME, ...metal });
  return p;
}
// where each drum is struck, in the drummer's own space (he sits 0.62 behind the kit's centre)
const HITS = {

/* ---- The heads, the same as in the basement. */

    { shape: 'sphere', size: [0.07], offset: [-0.035, 0.155, 0.112], rotation: [0, 0, 32], scale: [1.25, 0.5, 0.3], ...hair },
    { shape: 'sphere', size: [0.05], offset: [-0.075, 0.115, 0.098], rotation: [0, 0, 62], scale: [1.2, 0.45, 0.3], ...hair },

    { shape: 'sphere', size: [0.146, 0, 360, 0, 66], offset: [0, 0.158, 0.012], scale: [1, 1.08, 1], color: C.beanie, roughness: 1 },

  ];
}
function bassistHead() {

function drummerHead() {

/* ---- The red guitar (rounded double-cut, pointed headstock). Body centre near the origin, neck up +y, strings toward +z. */
function redGuitarParts() {
  const red = C.guitar;
  return [
    { shape: 'sphere', size: [0.17], offset: [0, 0.19, 0], scale: [1, 0.95, 0.13], color: red, roughness: 0.2, metalness: 0.1 },

/* ---- Truss: square-section aluminium truss as straight rods (chords and zig-zag lacing), drawn as instances. */
function trussRods(a, b, w = 0.3, r = 0.022) {
  const rods = [];
  const d = [b[0] - a[0], b[1] - a[1], b[2] - a[2]], len = Math.hypot(...d), ax = d.map(v => v / len);
  let u, v;
  if (Math.abs(ax[1]) > 0.9) { u = [1, 0, 0]; v = [0, 0, 1]; }
  else { u = [0, 1, 0]; v = [ax[2], 0, -ax[0]]; const n = Math.hypot(...v); v = v.map(c => c / n); }
  const corner = (p, i) => { const su = (i & 1 ? 0.5 : -0.5) * w, sv = (i & 2 ? 0.5 : -0.5) * w; return [p[0] + u[0] * su + v[0] * sv, p[1] + u[1] * su + v[1] * sv, p[2] + u[2] * su + v[2] * sv]; };
  const at = t => [a[0] + d[0] * t, a[1] + d[1] * t, a[2] + d[2] * t];
  for (let i = 0; i < 4; i++) rods.push([corner(a, i), corner(b, i), r]);
  const n = Math.max(1, Math.round(len / w));
  const faces = [[0, 1], [1, 3], [3, 2], [2, 0]];
  for (let k = 0; k < n; k++) {

function fencePlacements() {

  const run = (x0, z0, x1, z1, skip) => {

    }
  };

  run(-38.2, 44.3, 38.2, 44.3, x => Math.abs(x) < 4.2);
  run(-38.2, -30, 38.2, -30);
  return at;
}

function seededRandomData(seed) {

  for (const [id, value] of Object.entries(c.doors || {})) {

    door.hotspot = { ...door.hotspot, action: 'door', ...(set.href !== undefined && { href: set.href }), ...(set.label && { label: set.label }) };
  }
  if (c.guitarist?.show === false) { drop('guitarist'); }

/* ---------------------------------------------------------------------
   4. Sound
   - Room tone: a quiet, low hum of air, always there while sound is on.
   - Music: a playlist (see `playlist` above). Track 1 is a small built-in
     beat (kick, snare, hats and chords) made live, so music always works.
   - Everything musical goes through a level meter (`sound.level`, 0–1)
     so lights and objects can pulse with it.
   - Pause stops the music; muting pauses the whole audio engine.
   --------------------------------------------------------------------- */
/* ---------------------------------------------------------------------
   Playlist: the built-in beat is always track 1 (it's made live, so it
   works with no files at all). After it come the songs listed in
   ROOM.playlist (files shipped next to the page), then any songs you add
   with the + button or by dropping audio files on the room. Songs you add
   are remembered in this browser only. Titles, artists and cover art are
   read from the files' tags when they have them.
   --------------------------------------------------------------------- */
const playlist = {
  tracks: [{ title: 'low ceiling (live)', artist: `${BAND_TITLE} · live at ${FEST}`, builtin: true }],
  index: 0,
  db: null,

  add(track) { this.tracks.push(track); return this.tracks.length - 1; },
  get current() { return this.tracks[this.index]; },

  // songs that ship with the room
  addShipped(list = []) {
    for (const item of list) {
      const entry = typeof item === 'string' ? { src: item } : item;
      const track = { src: entry.src, title: entry.title || titleFromName(entry.src), artist: entry.artist || '', shipped: true };
      this.add(track);
      if (!entry.title || !entry.artist) {
        fetch(entry.src).then(r => (r.ok ? r.blob() : null)).then(blob => blob && readTags(blob)).then(tags => {
          if (!tags) return;
          if (!entry.title && tags.title) track.title = tags.title;
          if (!entry.artist && tags.artist) track.artist = tags.artist;
          if (tags.art) track.art = tags.art;
        }).catch(() => {});
      }
    }
  },

  // songs you add: kept as blob URLs, and saved in this browser if it lets us
  async addFiles(files, save = true) {
    const added = [];
    for (const file of files) {
      if (!file.type.startsWith('audio/') && !/\.(mp3|m4a|aac|ogg|oga|opus|wav|flac|webm)$/i.test(file.name)) continue;
      const tags = await readTags(file).catch(() => null);
      const track = {
        src: URL.createObjectURL(file), mine: true, id: file.id,
        title: tags?.title || titleFromName(file.name),
        artist: tags?.artist || 'your music',
        art: tags?.art || null,
      };
      if (save && !file.id) this.save(file).then(id => { track.id = id; });   // remembered in this browser, in the background
      added.push(this.add(track));
    }
    return added;
  },

  async openDb() {
    if (this.db) return this.db;
    this.db = await new Promise((resolve, reject) => {
      const request = indexedDB.open('the-stumps-live', 1);
      request.onupgradeneeded = () => request.result.createObjectStore('songs', { keyPath: 'id', autoIncrement: true });
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error);
    });
    return this.db;
  },
  async save(file) {
    try {
      const db = await this.openDb();
      return await new Promise((resolve, reject) => {
        const tx = db.transaction('songs', 'readwrite');
        const request = tx.objectStore('songs').add({ name: file.name, type: file.type, blob: file });
        request.onsuccess = () => resolve(request.result);
        tx.onerror = () => reject(tx.error);
      });
    } catch { return undefined; }
  },
  async loadSaved() {
    try {
      const db = await this.openDb();
      const rows = await new Promise((resolve, reject) => {
        const request = db.transaction('songs').objectStore('songs').getAll();
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
      const files = rows.map(row => Object.assign(new File([row.blob], row.name, { type: row.type }), { id: row.id }));
      return await this.addFiles(files, false);
    } catch { return []; }
  },
  async remove(i) {
    const track = this.tracks[i];
    if (!track?.mine) return;
    URL.revokeObjectURL(track.src);
    this.tracks.splice(i, 1);
    if (this.index >= i) this.index = Math.max(0, this.index - 1);
    try {
      const db = await this.openDb();
      db.transaction('songs', 'readwrite').objectStore('songs').delete(track.id);
    } catch { /* nothing saved */ }
  },
};

function titleFromName(name = '') {
  return decodeURIComponent(name.split('/').pop()).replace(/\.[a-z0-9]+$/i, '').replace(/[_]+/g, ' ').trim() || 'untitled';
}

// Reads title, artist and cover art from an MP3's ID3v2 tags (other formats just use the file name).
async function readTags(blob) {
  const head = new Uint8Array(await blob.slice(0, 10).arrayBuffer());
  if (head[0] !== 0x49 || head[1] !== 0x44 || head[2] !== 0x33) return null;          // "ID3"
  const version = head[3];
  const size = (head[6] << 21) | (head[7] << 14) | (head[8] << 7) | head[9];
  const bytes = new Uint8Array(await blob.slice(10, 10 + Math.min(size, 4e6)).arrayBuffer());
  const out = {};
  const text = (b, encoding) => {
    const label = encoding === 0 ? 'latin1' : encoding === 1 ? 'utf-16' : encoding === 2 ? 'utf-16be' : 'utf-8';
    return new TextDecoder(label).decode(b).replace(/\0+$/, '').replace(/\0/g, ' / ').trim();
  };
  let p = 0;
  while (p + 10 < bytes.length) {
    const id = String.fromCharCode(bytes[p], bytes[p + 1], bytes[p + 2], bytes[p + 3]);
    if (!/^[A-Z0-9]{4}$/.test(id)) break;
    const frameSize = version === 4
      ? (bytes[p + 4] << 21) | (bytes[p + 5] << 14) | (bytes[p + 6] << 7) | bytes[p + 7]
      : ((bytes[p + 4] << 24) | (bytes[p + 5] << 16) | (bytes[p + 6] << 8) | bytes[p + 7]) >>> 0;
    const body = bytes.subarray(p + 10, p + 10 + frameSize);
    if (id === 'TIT2') out.title = text(body.subarray(1), body[0]);
    else if (id === 'TPE1') out.artist = text(body.subarray(1), body[0]);
    else if (id === 'APIC' && !out.art) {
      const encoding = body[0];
      let q = 1;
      while (q < body.length && body[q] !== 0) q++;                   // mime type
      const mime = new TextDecoder('latin1').decode(body.subarray(1, q)) || 'image/jpeg';
      q += 2;                                                         // the null and the picture type
      if (encoding === 1 || encoding === 2) { while (q + 1 < body.length && (body[q] || body[q + 1])) q += 2; q += 2; }
      else { while (q < body.length && body[q] !== 0) q++; q += 1; }
      try { out.art = await createImageBitmap(new Blob([body.subarray(q)], { type: mime.includes('/') ? mime : 'image/' + mime })); } catch { /* no art */ }
    }
    if (frameSize <= 0) break;
    p += 10 + frameSize;
  }
  return out;
}


// ---- tempo: songs people add get their beat found (how fast, and where the beats land), so heads, dancers
//      and lights move in time with each song instead of a fixed clock. It runs once per song, in the background,
//      on a low-quality copy of the first two and a half minutes; until it knows, the room keeps its own steady beat.
const tempo = {
  found: new Map(),                       // song address -> { bpm, offset } (null while working, or if it can't tell)
  of(track) {
    if (!track || track.builtin || !track.src) return null;
    if (!this.found.has(track.src)) {
      this.found.set(track.src, null);
      this.find(track.src).then(r => this.found.set(track.src, r)).catch(() => {});
    }
    return this.found.get(track.src);
  },
  // beats counted from the start of the song at this playback time, or null until the tempo is known
  beats(track, time) {
    const f = this.of(track);
    return f ? (time - f.offset) * f.bpm / 60 : null;
  },
  async find(src) {
    // works in short slices so the room keeps drawing smoothly while it listens
    let since = performance.now();
    const breathe = async () => { if (performance.now() - since > 8) { await new Promise(r => setTimeout(r, 0)); since = performance.now(); } };
    const RATE = 22050, HOP = 256, FPS = RATE / HOP;
    const data = await (await fetch(src)).arrayBuffer();
    const Offline = window.OfflineAudioContext || window.webkitOfflineAudioContext;
    const audio = await new Promise((resolve, reject) => {
      const p = new Offline(1, RATE, RATE).decodeAudioData(data, resolve, reject);
      if (p && p.catch) p.catch(reject);
    });
    const n = Math.min(audio.length, RATE * 150), chans = audio.numberOfChannels;
    const a = audio.getChannelData(0), b = chans > 1 ? audio.getChannelData(1) : a;
    // onsets: how sharply the low end (kicks) and the top end (snares, hats) jump, frame by frame
    const frames = Math.floor(n / HOP), onset = new Float32Array(frames);
    let lp = 0, prevX = 0, prevLow = 0, prevHigh = 0;
    for (let f = 0; f < frames; f++) {
      if (f % 512 === 0) await breathe();
      let low = 0, high = 0;
      for (let i = f * HOP, end = i + HOP; i < end; i++) {
        const x = (a[i] + b[i]) * 0.5;
        lp += (x - lp) * 0.04;                            // ~150 Hz low-pass
        const hp = x - prevX; prevX = x;
        low += lp * lp; high += hp * hp;
      }
      low = Math.log1p(low * 400); high = Math.log1p(high * 100);
      onset[f] = Math.max(0, low - prevLow) + 0.6 * Math.max(0, high - prevHigh);
      prevLow = low; prevHigh = high;
    }
    // keep only the peaks above the local average
    const W = Math.round(FPS * 0.4), env = new Float32Array(frames);
    let sum = 0;
    for (let f = 0; f < frames; f++) {
      sum += onset[f] - (f >= W ? onset[f - W] : 0);
      env[f] = Math.max(0, onset[f] - sum / Math.min(f + 1, W));
    }
    if (frames < FPS * 8) return null;                    // too short to tell
    // rough tempo: which beat length repeats best (with a gentle pull towards dance tempos around 120)
    const score = bpm => {
      const lag = 60 * FPS / bpm, l0 = Math.floor(lag), t = lag - l0;
      let s = 0;
      for (let f = l0 + 1; f < frames; f++) s += env[f] * (env[f - l0] * (1 - t) + env[f - l0 - 1] * t);
      return s;
    };
    let best = 0, bestBpm = 120;
    for (let bpm = 60; bpm <= 190; bpm += 0.5) {
      await breathe();
      const prior = Math.exp(-0.5 * Math.pow(Math.log2(bpm / 120) / 0.6, 2));
      const s = (score(bpm) + 0.5 * score(bpm / 2)) * prior;
      if (s > best) { best = s; bestBpm = bpm; }
    }
    // fine tempo and where the beats land: line up a comb of beats with the onsets over the whole stretch
    let top = -1, out = null;
    for (let bpm = bestBpm * 0.985; bpm <= bestBpm * 1.015; bpm += 0.02) {
      await breathe();
      const period = 60 * FPS / bpm;
      for (let k = 0; k < 48; k++) {
        const phase = period * k / 48;
        let s = 0;
        for (let x = phase; x < frames - 1; x += period) { const i = Math.floor(x), t = x - i; s += env[i] * (1 - t) + env[i + 1] * t; }
        if (s > top) { top = s; out = { bpm, offset: (phase + 0.5) / FPS }; }
      }
    }
    while (out.bpm < 78) out.bpm *= 2;                    // keep it in a range people move to
    while (out.bpm > 180) out.bpm /= 2;
    return out;
  },
};

const sound = {
  ctx: null, master: null, musicBus: null, musicVolume: null, analyser: null, bins: null,
  volume: (() => { try { const v = parseFloat(localStorage.getItem('liveConcertVolume')); return v >= 0 && v <= 1 ? v : 0.8; } catch { return 0.8; } })(),
  setVolume(v) {
    this.volume = v;
    try { localStorage.setItem('liveConcertVolume', String(v)); } catch {}
    if (this.musicVolume) this.musicVolume.gain.setTargetAtTime(v * v, this.ctx.currentTime, 0.05);
  },
  on: false,              // sound switched on
  wantMusic: false,       // the record player is on
  paused: false,          // the scene is paused
  level: 0,               // how loud the music is right now, 0–1
  musicFile: null,        // <audio> that plays the playlist's songs
  musicSource: null,
  beatTimer: 0, step: 0, nextStepTime: 0,
  suspendTimer: 0,

  // One <audio> element plays every song in the playlist (it only plays after a click).
  prepareMusic() {
    const audio = new Audio();
    audio.preload = 'auto';
    audio.addEventListener('ended', () => this.onEnded?.());
    audio.addEventListener('error', () => { if (audio.getAttribute('src')) this.onError?.(); });
    this.musicFile = audio;
  },

  // switch to track i of the playlist (keeps playing if music was on)
  selectTrack(i) {
    const n = playlist.tracks.length;
    playlist.index = ((i % n) + n) % n;
    const track = playlist.current;
    this.musicFile.pause();
    if (track.builtin) this.musicFile.removeAttribute('src');
    else this.musicFile.src = track.src;
    this.refresh();
  },

  build() {
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    if (!AudioContext) return false;
    // phones: bigger audio buffers, so the 3D view can't make the music crackle
    const ctx = this.ctx = new AudioContext(IS_TOUCH ? { latencyHint: 'playback' } : undefined);

    this.master = ctx.createGain();
    this.master.gain.value = 0;
    const compressor = ctx.createDynamicsCompressor();
    compressor.threshold.value = -16;
    compressor.ratio.value = 3;
    this.master.connect(compressor);
    compressor.connect(ctx.destination);

    // music goes through the level meter on its way to the speakers
    this.musicBus = ctx.createGain();
    this.analyser = ctx.createAnalyser();
    this.analyser.fftSize = 256;
    this.bins = new Uint8Array(this.analyser.frequencyBinCount);
    this.musicBus.connect(this.analyser);
    this.musicVolume = ctx.createGain();
    this.musicVolume.gain.value = this.volume ** 2;               // feels even across the slider
    this.analyser.connect(this.musicVolume);
    this.musicVolume.connect(this.master);
    if (this.musicFile) {
      this.musicSource = ctx.createMediaElementSource(this.musicFile);
      this.musicSource.connect(this.musicBus);
    }

    this.noise = this.noiseBuffer(2);

    // room tone: low, filtered noise that slowly breathes
    const air = ctx.createBufferSource();
    air.buffer = this.noise;
    air.loop = true;
    const low = ctx.createBiquadFilter();
    low.type = 'lowpass';
    low.frequency.value = 240;
    const airLevel = ctx.createGain();
    airLevel.gain.value = 0.05;
    const breath = ctx.createOscillator(), breathDepth = ctx.createGain();
    breath.frequency.value = 0.08;
    breathDepth.gain.value = 0.015;
    breath.connect(breathDepth);
    breathDepth.connect(airLevel.gain);
    breath.start();
    air.connect(low);
    low.connect(airLevel);
    airLevel.connect(this.master);
    air.start();

    // the crowd's own switch: murmur, chants and cheers go through it
    this.crowdBus = ctx.createGain();
    this.crowdBus.gain.value = this.crowdOn ? 1 : 0;
    this.crowdBus.connect(this.master);
    // a field's worth of echo on the PA: a short, generated reverb tail
    const verb = ctx.createConvolver(), wet = ctx.createGain(), len = Math.floor(ctx.sampleRate * 1.8), ir = ctx.createBuffer(2, len, ctx.sampleRate);

  },




  noiseBuffer(seconds) {

    const buffer = this.ctx.createBuffer(1, length, this.ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < length; i++) data[i] = Math.random() * 2 - 1;

  // Start or stop the music so it matches: sound on, record on, not paused.
  refresh() {
    const play = this.on && this.wantMusic && !this.paused;

    if (play && !track.builtin) {
      this.stopBeat();
      if (this.musicFile.getAttribute('src') !== track.src) this.musicFile.src = track.src;
      this.musicFile.play().catch(() => {});

      this.musicFile.pause();

  // crowd noise on/off (turning it on also turns sound on)

  setCrowdNoise(on) {

  setPaused(paused) {
    this.paused = paused;

  // ---- built-in track: "low ceiling (live)", The Stumps' punk song at 172 bpm (from the basement).
  //      Eight bars: a palm-muted verse (E E G A) that builds into an open, crashing chorus (C D E E).
  //      Plucked-string guitars left and right through fuzz, a plucked bass, the drum kit.
  //      beatRef lets the band and the lights know exactly where in the song we are.
  AHEAD: IS_TOUCH ? 0.4 : 0.12,   // seconds of notes booked ahead (more on phones, where frames can be slow)
  startBeat() {
    if (this.beatTimer) return;
    jam.ready();
    this.punkChains();
    const stepLength = this.stepLength = 60 / 172 / 4;
    this.nextStepTime = this.ctx.currentTime + 0.06;
    this.beatRef = { step: this.step, time: this.nextStepTime };
    this.beatTimer = setInterval(() => {
      while (this.nextStepTime < this.ctx.currentTime + this.AHEAD) {
        this.playStep(this.step, this.nextStepTime);

  stopBeat() {

  // where the built-in song is right now, in 16th steps (or null when it isn't playing)
  stepNow() {
    if (!this.beatTimer || !this.beatRef || !this.ctx) return null;
    return this.beatRef.step + Math.max(0, this.ctx.currentTime - this.beatRef.time) / this.stepLength;
  },
  // two guitar rigs (left and right): fuzz → mid boost → speaker-cab rolloff → pan
  punkChains() {
    if (this.punk?.ctx === this.ctx) return this.punk;
    const c = this.ctx, n = 2048, curve = new Float32Array(n);
    for (let i = 0; i < n; i++) { const x = i * 2 / n - 1; curve[i] = Math.tanh(x * 9) * 0.85 + 0.1 * Math.tanh(x * 2); }
    const rig = pan => {
      const input = c.createGain(), high = c.createBiquadFilter(), shaper = c.createWaveShaper(), mid = c.createBiquadFilter(), cab = c.createBiquadFilter(), cab2 = c.createBiquadFilter(), out = c.createGain(), panner = c.createStereoPanner();
      input.gain.value = 4;
      high.type = 'highpass'; high.frequency.value = 110;
      shaper.curve = curve; shaper.oversample = '4x';
      mid.type = 'peaking'; mid.frequency.value = 1500; mid.gain.value = 4; mid.Q.value = 0.8;
      cab.type = 'lowpass'; cab.frequency.value = 4200; cab.Q.value = 0.9;
      cab2.type = 'lowpass'; cab2.frequency.value = 5500;
      out.gain.value = 0.075;
      panner.pan.value = pan;
      input.connect(high); high.connect(shaper); shaper.connect(mid); mid.connect(cab); cab.connect(cab2); cab2.connect(out); out.connect(panner); panner.connect(this.musicBus);
      return input;
    };
    const bassIn = c.createGain(), bassDrive = c.createWaveShaper(), bassLow = c.createBiquadFilter(), bassOut = c.createGain();
    const bc = new Float32Array(n);
    for (let i = 0; i < n; i++) { const x = i * 2 / n - 1; bc[i] = Math.tanh(x * 2.2); }
    bassDrive.curve = bc;
    bassIn.gain.value = 1.6;
    bassLow.type = 'lowpass'; bassLow.frequency.value = 900; bassLow.Q.value = 1.1;
    bassOut.gain.value = 0.27;
    bassIn.connect(bassDrive); bassDrive.connect(bassLow); bassLow.connect(bassOut); bassOut.connect(this.musicBus);
    return (this.punk = { ctx: c, left: rig(-0.55), right: rig(0.55), bass: bassIn });
  },
  // a power chord (root, fifth, octave) picked on plucked strings; muted = a palm-muted chug
  guitarHit(t, root, length, muted) {
    const c = this.ctx;
    for (const [rig, detune, delay] of [[this.punk.left, 1, 0], [this.punk.right, 1.004, 0.009]]) {
      const tone = c.createBiquadFilter(), g = c.createGain();
      tone.type = 'lowpass';
      tone.frequency.value = muted ? 1100 : 7000;

      g.gain.setValueAtTime(0.0001, at);
      g.gain.linearRampToValueAtTime(1, at + 0.003);
      g.gain.setTargetAtTime(muted ? 0.25 : 0.6, at + 0.01, muted ? 0.05 : length * 0.8);
      g.gain.setTargetAtTime(0.0001, at + length, 0.015);

  bassHit(t, root, length) {

    g.gain.setTargetAtTime(0.0001, t + length * 0.95, 0.015);

  },
  playStep(step, t) {
    const s = step % 128, bar = Math.floor(s / 16) % 4, b = s % 16, chorus = s >= 64;
    const E = 82.41, G = 98.0, A = 110.0, C = 65.41, D = 73.42;
    const root = chorus ? [C, D, E, E][bar] : [E, E, G, A][bar];

      if (s >= 56 && b % 2 === 0) jam.snare(t);

      if (b % 4 === 0 || b === 6 || b === 14) jam.kick(t);
      if (b === 4 || b === 12) jam.snare(t);

    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.32);

    gain.connect(this.musicBus);

    osc.stop(t + 0.35);

  snare(t) {

    band.type = 'highpass';
    band.frequency.value = 1400;

    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.16);
    noise.connect(band);
    band.connect(gain);
    gain.connect(this.musicBus);
    noise.start(t, Math.random());
    noise.stop(t + 0.2);
  },
  hat(t, volume) {
    const noise = this.ctx.createBufferSource(), band = this.ctx.createBiquadFilter(), gain = this.ctx.createGain();
    noise.buffer = this.noise;
    band.type = 'highpass';
    band.frequency.value = 7000;
    gain.gain.setValueAtTime(volume, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.045);
    noise.connect(band);
    band.connect(gain);
    gain.connect(this.musicBus);
    noise.start(t, Math.random());
    noise.stop(t + 0.06);
  },

  // a soft bell, for small interactions
  chime() {
    if (!this.ctx) return;
    const t = this.ctx.currentTime, envelope = this.ctx.createGain();
    envelope.gain.setValueAtTime(0, t);
    envelope.gain.linearRampToValueAtTime(0.06, t + 0.01);
    envelope.gain.exponentialRampToValueAtTime(0.0001, t + 2.5);
    envelope.connect(this.master);

      osc.frequency.value = 880 * ratio;
      gain.gain.value = volume;
      osc.connect(gain);
      gain.connect(envelope);
      osc.start(t);
      osc.stop(t + 2.6);
    });
  },

  // read the level meter (bass-heavy), once per frame
  update(dt) {
    if (this.paused) return;            // the level holds still while paused, so everything it moves does too
    let target = 0;
    if (this.analyser && this.on && !this.paused) {
      this.analyser.getByteFrequencyData(this.bins);
      let sum = 0;
      for (let i = 0; i < 10; i++) sum += this.bins[i];

  dispose() {
    this.stopBeat();
    clearTimeout(this.suspendTimer);
    this.musicFile?.pause();
    this.ctx?.close();
    this.ctx = null;
  },
};



/* ---------------------------------------------------------------------
   The band's drum kit and plucked strings for the built-in song, made live
   with Web Audio (no sound files), the same as in the basement. Here the
   instruments aren't playable: only the song uses them.
   --------------------------------------------------------------------- */
const jam = {
  chainFor: null,
  get ctx() { return sound.ctx; },
  ready() {
    if (!sound.ctx) return false;
    if (this.chainFor === sound.ctx) return true;
    const c = sound.ctx;
    this.chainFor = c;
    this.ks = new Map();
    this.drums = c.createGain();
    this.drums.gain.value = 0.85;
    this.drums.connect(sound.musicBus);
    return true;
  },
  env(g, t, peak, decay, attack = 0.002) {
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t + decay);
  },
  noiseHit(t, type, frequency, peak, decay, { q = 0.7, attack = 0.001, out = this.drums } = {}) {
    const c = this.ctx, src = c.createBufferSource(), filter = c.createBiquadFilter(), g = c.createGain();
    src.buffer = sound.noise;
    filter.type = type; filter.frequency.value = frequency; filter.Q.value = q;
    this.env(g, t, peak, decay, attack);
    src.connect(filter); filter.connect(g); g.connect(out);
    src.start(t, Math.random() * 1.5); src.stop(t + decay + 0.05);
  },
  tone(t, type, f0, f1, glide, peak, decay, out = this.drums) {
    const c = this.ctx, osc = c.createOscillator(), g = c.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(f0, t);
    osc.frequency.exponentialRampToValueAtTime(f1, t + glide);
    this.env(g, t, peak, decay);
    osc.connect(g); g.connect(out);
    osc.start(t); osc.stop(t + decay + 0.05);
  },
  metal(t, peak, decay, highpass) {           // six detuned squares: the classic metallic cymbal
    const c = this.ctx, band = c.createBiquadFilter(), high = c.createBiquadFilter(), g = c.createGain();
    band.type = 'bandpass'; band.frequency.value = 10000; band.Q.value = 0.8;
    high.type = 'highpass'; high.frequency.value = highpass;
    this.env(g, t, peak, decay, 0.001);
    band.connect(high); high.connect(g); g.connect(this.drums);
    for (const ratio of [2, 3, 4.16, 5.43, 6.79, 8.21]) {
      const osc = c.createOscillator();
      osc.type = 'square'; osc.frequency.value = 40 * ratio;
      osc.connect(band); osc.start(t); osc.stop(t + decay + 0.05);
    }
  },
  kick(t) { this.tone(t, 'sine', 165, 46, 0.12, 1.0, 0.5); this.noiseHit(t, 'highpass', 2600, 0.32, 0.02); },
  snare(t) {
    this.tone(t, 'triangle', 240, 180, 0.08, 0.38, 0.12);
    this.noiseHit(t, 'bandpass', 3200, 0.55, 0.22, { q: 0.6 });
    this.noiseHit(t, 'highpass', 6500, 0.22, 0.14);
  },
  hat(t) { this.metal(t, 0.16, 0.06, 7200); this.noiseHit(t, 'highpass', 9000, 0.08, 0.04); },
  crash(t) {
    this.metal(t, 0.16, 2.2, 4500);
    this.noiseHit(t, 'highpass', 5200, 0.28, 1.9, { attack: 0.003 });
    this.noiseHit(t, 'bandpass', 2500, 0.08, 0.6);
  },
  ride(t) {
    this.metal(t, 0.09, 1.6, 6200);
    this.tone(t, 'sine', 2350, 2300, 0.4, 0.07, 1.2);
    this.noiseHit(t, 'bandpass', 7500, 0.12, 0.08, { q: 1.4 });
  },
  tomHit(t, f0) { this.tone(t, 'sine', f0, f0 * 0.62, 0.28, 0.85, 0.6); this.noiseHit(t, 'bandpass', f0 * 3, 0.18, 0.05, { q: 1.2 }); },
  // a plucked string: a burst of noise fed round a short delay loop that softens each pass (Karplus-Strong)
  string(freq) {
    const key = Math.round(freq * 10);
    if (this.ks.has(key)) return this.ks.get(key);
    const c = this.ctx, sr = c.sampleRate, length = Math.floor(sr * 2.4);
    const buffer = c.createBuffer(1, length, sr), out = buffer.getChannelData(0);

      ring[p] = (a + b) * keep;
      p = (p + 1) % period;
    }
    this.ks.set(key, buffer);
    return buffer;
  },
};

/* ---------------------------------------------------------------------
   The crowd, made live: a murmur of many voices (bands of filtered noise
   that swell and fade), "STUMPS! STUMPS!" chants (a chorus of buzzing
   voices through vowel filters, with the "st" and the "s"), cheers,
   whistles, applause (thousands of tiny claps baked into one buffer) and
   the whoosh of a stage dive. It plays through the crowd-noise switch,
   so it can be turned off on its own.
   --------------------------------------------------------------------- */
const crowd = {
  for: null,
  ready() {
    if (!sound.ctx || !sound.crowdBus) return false;
    if (this.for === sound.ctx) return true;
    const c = sound.ctx;
    this.for = c;
    this.murmur = c.createGain();
    this.murmur.gain.value = 0;
    this.murmur.connect(sound.crowdBus);
    for (const [f, q, g, rate] of [[320, 0.8, 0.5, 0.11], [820, 1.1, 0.34, 0.17], [1700, 1.4, 0.16, 0.23], [2900, 2, 0.06, 0.31]]) {
      const src = c.createBufferSource(), bp = c.createBiquadFilter(), level = c.createGain(), lfo = c.createOscillator(), depth = c.createGain();
      src.buffer = sound.noise; src.loop = true;
      bp.type = 'bandpass'; bp.frequency.value = f; bp.Q.value = q;
      level.gain.value = g; depth.gain.value = g * 0.4; lfo.frequency.value = rate;
      lfo.connect(depth); depth.connect(level.gain); lfo.start();
      src.connect(bp); bp.connect(level); level.connect(this.murmur); src.start(0, Math.random() * 1.5);
    }
    // applause: claps scattered through 4 seconds, thick at first, thinning out
    const sr = c.sampleRate, len = Math.floor(sr * 4), buf = c.createBuffer(2, len, sr);
    for (let ch = 0; ch < 2; ch++) {
      const d = buf.getChannelData(ch);
      for (let k = 0; k < 2600; k++) {
        const at = Math.floor(Math.pow(Math.random(), 1.6) * (len - 400)), amp = 0.25 + Math.random() * 0.5, decay = 0.0008 + Math.random() * 0.0012;
        let prev = 0;
        for (let i = 0; i < 300; i++) { const v = (Math.random() * 2 - 1) * amp * Math.exp(-i / (decay * sr)); d[at + i] += v - prev * 0.6; prev = v; }
      }
    }
    this.applauseBuffer = buf;
    return true;
  },
  setLevel(v, time = 1.2) {
    if (!this.ready()) return;
    const t = sound.ctx.currentTime;
    this.murmur.gain.cancelScheduledValues(t);
    this.murmur.gain.setTargetAtTime(v, t, time);
  },
  // many voices shouting one word together
  shout(t, gain = 0.03) {
    const c = sound.ctx, out = c.createGain(), f1 = c.createBiquadFilter(), f2 = c.createBiquadFilter(), mix = c.createGain();
    f1.type = 'bandpass'; f1.frequency.value = 640; f1.Q.value = 3;
    f2.type = 'bandpass'; f2.frequency.value = 1190; f2.Q.value = 5;
    out.gain.setValueAtTime(0.0001, t);
    out.gain.exponentialRampToValueAtTime(gain, t + 0.05);
    out.gain.setValueAtTime(gain, t + 0.16);
    out.gain.exponentialRampToValueAtTime(0.0001, t + 0.34);
    mix.connect(f1); mix.connect(f2); f1.connect(out); f2.connect(out); out.connect(sound.crowdBus);
    for (let i = 0; i < 9; i++) {
      const o = c.createOscillator(), f0 = 130 + Math.random() * 140, at = t + Math.random() * 0.05;
      o.type = 'sawtooth';
      o.frequency.setValueAtTime(f0 * 1.06, at); o.frequency.linearRampToValueAtTime(f0 * 0.94, at + 0.3);
      o.connect(mix); o.start(at); o.stop(at + 0.4);
    }
    jam.ready();
    jam.noiseHit(t - 0.02, 'highpass', 4200, gain * 3, 0.07, { out: sound.crowdBus });            // "st"
    jam.noiseHit(t + 0.27, 'highpass', 5200, gain * 2.4, 0.11, { out: sound.crowdBus });          // "s"
  },
  // "STUMPS! STUMPS! STUMPS!" (count times, every beat seconds); returns how long it lasts
  chant(count = 6, beat = 0.72) {
    if (!this.ready()) return 0;
    const t = sound.ctx.currentTime + 0.05;
    for (let i = 0; i < count; i++) this.shout(t + i * beat, 0.024 + i * 0.002);
    return count * beat;
  },
  // cheering: rising "woo"s, whistles and applause
  cheer(strength = 1, length = 4) {
    if (!this.ready()) return;
    const c = sound.ctx, t = c.currentTime + 0.02;
    const voices = c.createGain(), lp = c.createBiquadFilter();
    lp.type = 'lowpass'; lp.frequency.value = 1400;
    voices.gain.setValueAtTime(0.0001, t);
    voices.gain.exponentialRampToValueAtTime(0.03 * strength, t + 0.3);
    voices.gain.setTargetAtTime(0.0001, t + length * 0.45, length * 0.25);
    voices.connect(lp); lp.connect(sound.crowdBus);
    for (let i = 0; i < 14; i++) {
      const o = c.createOscillator(), at = t + Math.random() * 0.8, f0 = 260 + Math.random() * 280;
      o.type = 'triangle';
      o.frequency.setValueAtTime(f0, at); o.frequency.exponentialRampToValueAtTime(f0 * (1.4 + Math.random() * 0.5), at + 0.5 + Math.random() * 0.6);
      o.connect(voices); o.start(at); o.stop(t + length);
    }
    for (let i = 0; i < 3; i++) {
      const o = c.createOscillator(), g = c.createGain(), at = t + 0.3 + Math.random() * 1.5, f0 = 1900 + Math.random() * 900;

// Seeded random numbers: the same seed always gives the same result.
function seededRandom(seed) {
  return () => {
    seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// Draw a texture on a canvas.
function canvasTexture(size, draw, repeat = [1, 1]) {
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = size;
  draw(canvas.getContext('2d'), size);
  const texture = new THREE.CanvasTexture(canvas);
  texture.colorSpace = THREE.SRGBColorSpace;
  texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
  texture.repeat.set(repeat[0], repeat[1]);
  texture.anisotropy = 8;
  return texture;
}

  // Sleepy, half-lidded eyes, a little eyeliner, a plaster on the cheek (the basement's face).
  function drawFace(g, w, h, closed) {

    }

}

// Swap posters for pictures (room.json "posters": { "posterMoon": "posters/mine.jpg", ... }).
async function loadPosterImages(textures, posters) {
  const loader = new THREE.TextureLoader();
  await Promise.all(Object.entries(posters).map(async ([name, path]) => {
    const old = textures[name];
    if (!old || !path) return;
    try {
      const texture = await loader.loadAsync(path);
      texture.colorSpace = THREE.SRGBColorSpace;
      texture.anisotropy = 8;
      const want = old.image.width / old.image.height, have = texture.image.width / texture.image.height;
      if (have > want) { texture.repeat.x = want / have; texture.offset.x = (1 - texture.repeat.x) / 2; }
      else { texture.repeat.y = have / want; texture.offset.y = (1 - texture.repeat.y) / 2; }
      textures[name] = texture;
      old.dispose();
    } catch { console.warn(`Poster image not found: ${path}`); }
  }));
}

// A canvas texture that isn't square (posters, photos).
function sizedTexture(w, h, draw) {
  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  draw(canvas.getContext('2d'), w, h);
  const texture = new THREE.CanvasTexture(canvas);
  texture.colorSpace = THREE.SRGBColorSpace;
  texture.anisotropy = 8;
  return texture;
}

// The big screens either side of the stage: "THE STUMPS · SOON" before the show, a live visual once
// it starts (the stump logo pulsing in rings of colour, a level meter, LIVE). Redrawn ~12 times a second.
function makeScreenTexture(textures) {
  const W = 640, H = 360;
  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  const g = canvas.getContext('2d');
  const texture = new THREE.CanvasTexture(canvas);
  texture.colorSpace = THREE.SRGBColorSpace;
  const bars = new Float32Array(40);
  const fit = (text, max, px) => { do { g.font = `900 ${px}px Impact, "Arial Black", system-ui, sans-serif`; px -= 4; } while (g.measureText(text).width > max && px > 12); };
  texture.userData.update = (t, level, live, beats, colors) => {
    g.textAlign = 'center'; g.textBaseline = 'middle';
    if (!live) {
      const grad = g.createLinearGradient(0, 0, 0, H);
      grad.addColorStop(0, '#0a0d1e'); grad.addColorStop(1, '#1a0c18');
      g.fillStyle = grad; g.fillRect(0, 0, W, H);
      g.globalAlpha = 0.18;
      const logo = textures.screenLogo.image;
      g.drawImage(logo, W / 2 - 170, H / 2 - 170, 340, 340);
      g.globalAlpha = 1;
      g.fillStyle = '#f4ece0'; fit(BAND, 560, 110); g.fillText(BAND, W / 2, H * 0.42);
      g.fillStyle = (t % 1.6) < 1.1 ? '#ff5a7a' : 'rgba(255,90,122,0.25)';
      g.font = '800 44px system-ui, sans-serif'; g.fillText('·  S O O N  ·', W / 2, H * 0.66);
      g.fillStyle = 'rgba(244,236,224,0.55)'; g.font = '600 18px system-ui, sans-serif';
      g.fillText(`${FEST} · MAIN STAGE`, W / 2, H - 28);
      for (let y = (t * 40) % 6; y < H; y += 6) { g.fillStyle = 'rgba(0,0,0,0.18)'; g.fillRect(0, y, W, 2); }
    } else {
      const [a, b] = colors;
      g.fillStyle = '#05050a'; g.fillRect(0, 0, W, H);
      const pulse = 0.5 + 0.5 * Math.pow(1 - (beats % 1), 3);
      for (let k = 7; k >= 0; k--) {
        const r = (k + ((beats * 0.5) % 1)) * 46 + level * 30;
        g.strokeStyle = k % 2 ? a : b; g.globalAlpha = 0.55 - k * 0.05; g.lineWidth = 16 + level * 18;
        g.beginPath(); g.ellipse(W / 2, H / 2, r * 1.2, r, 0, 0, Math.PI * 2); g.stroke();
      }
      g.globalAlpha = 1;
      const s = 230 + pulse * 30 + level * 40;
      g.drawImage(textures.screenLogo.image, W / 2 - s / 2, H / 2 - s / 2 - 10, s, s);
      for (let i = 0; i < bars.length; i++) {
        const wave = 0.5 + 0.5 * Math.sin(t * (3 + (i % 7)) + i * 1.3);
        const target = 0.1 + level * 0.9 * (0.35 + 0.65 * wave) * (1 - Math.abs(i - 20) / 26);
        bars[i] += (target - bars[i]) * 0.4;
        g.fillStyle = i % 2 ? a : b;
        g.fillRect(i * 16 + 2, H - bars[i] * 90, 12, bars[i] * 90);
      }
      g.fillStyle = '#ff2a2a'; g.beginPath(); g.arc(30, 30, 9, 0, Math.PI * 2); g.globalAlpha = (t % 1) < 0.6 ? 1 : 0.3; g.fill(); g.globalAlpha = 1;
      g.fillStyle = '#ffffff'; g.font = '800 20px system-ui, sans-serif'; g.textAlign = 'left'; g.fillText('LIVE', 46, 31);
      g.textAlign = 'right'; g.fillText(FEST, W - 20, 31);
      if (level > 0.93 && (t * 3) % 1 < 0.15) {                  // a brief glitch tear now and then on the loudest hits
        for (let k = 0; k < 2; k++) { const y = Math.floor(((t * 7.3 + k * 0.37) % 1) * H); g.drawImage(canvas, 0, y, W, 8, (k % 2 ? 1 : -1) * 8, y, W, 8); }
      }
    }
    texture.needsUpdate = true;
  };
  texture.userData.update(0, 0, false, 0, ['#ff2a6d', '#05d9e8']);
  return texture;
}
