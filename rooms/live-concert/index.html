  }

  // ---- finding the hotspot under the cursor / screen centre / a tap
  const raycaster = new THREE.Raycaster();
  raycaster.far = SETTINGS.reach + 0.5;
  function hotspotAt(ndc) {
    raycaster.setFromCamera(ndc, camera);
    const hit = raycaster.intersectObjects(raycastTargets, false)[0];
    if (!hit || hit.distance > SETTINGS.reach) return null;
    for (let o = hit.object; o; o = o.parent) if (o.userData.hotspot) return o.userData.hotspot.onStage && !atStageFront() ? null : o;
    return null;
  }
  let focused = null;

  // ---- Lofi / Mix / Code: a scan wave sweeps out from you and turns the world over
  const glyphAtlas = makeGlyphAtlas();
  const holo = { room: makeHoloMaterial(shared, glyphAtlas, shared.roomWave), city: makeHoloMaterial(shared, glyphAtlas, shared.cityWave, 1.8) };
  const holoSky = makeHoloSky(shared, glyphAtlas, shared.cityWave);
  scene.add(holoSky);
  const lofiMaterials = makeCodeTwins(scene, { room: shared.roomWave, city: shared.cityWave }, holo);
  const waves = {
    room: { u: shared.roomWave, target: 0, running: false, t: 0 },
    city: { u: shared.cityWave, target: 0, running: false, t: 0 },
  };
  const MODES = {
    lofi: { room: 0, city: 0, label: 'Concert' },
    mix: { room: 0, city: 1, label: 'Mix: the crowd is dead and the sky is code' },
    code: { room: 1, city: 1, label: 'Code' },
  };
  const looks = { room: 'lofi', city: 'lofi' };
  crowdPeople.setAtlas(glyphAtlas);
  function showPart(part, look) {          // 'lofi', 'code', or 'both' while the wave is passing
    for (const m of lofiMaterials[part]) m.visible = look !== 'code';
    holo[part].visible = look !== 'lofi';
    if (part === 'city') holoSky.visible = look !== 'lofi';
    looks[part] = look;
    crowdPeople.setLook(looks.room, looks.city);       // the crowd: lofi, then bones (Mix), then code
  }
  function finishWave(part) {
    const w = waves[part];
    w.running = false;
    w.u.uWaveR.value = 1e6;
    showPart(part, w.target ? 'code' : 'lofi');
  }
  function updateWaves(dt) {
    for (const part of ['room', 'city']) {
      const w = waves[part];
      if (!w.running) continue;
      w.t += dt;
      w.u.uWaveR.value = 4 * w.t + 42 * w.t * w.t;     // slow around you, then racing out across the city
      if (w.u.uWaveR.value > 900) finishWave(part);
    }
  }
  function placeModeThumb() {
    const active = page.modes.querySelector('[aria-checked="true"]');
    if (!active) return;
    page.modesThumb.style.width = active.offsetWidth + 'px';
    page.modesThumb.style.transform = `translateX(${active.offsetLeft}px)`;
  }
  function setMode(mode, instant = false) {
    if (!MODES[mode]) return;
    state.mode = mode;
    for (const part of ['room', 'city']) {
      const w = waves[part], target = MODES[mode][part];
      if (w.target === target) continue;
      w.target = target;
      w.u.uWaveTarget.value = target;
      w.u.uWaveFrom.value.copy(camera.position);
      if (instant || REDUCED_MOTION) { finishWave(part); continue; }
      w.u.uWaveR.value = 0;
      w.t = 0;
      w.running = true;
      showPart(part, 'both');
    }
    dustMotes.visible = MODES[mode].room === 1;          // drifting bits of data in the code view
    if (!instant) state.glitch = 0.5;
    for (const b of page.modes.querySelectorAll('button')) b.setAttribute('aria-checked', String(b.dataset.mode === mode));
    placeModeThumb();
    if (!instant) { toast(MODES[mode].label); if (sound.on) sound.chime(); }
  }
  showPart('room', 'lofi');
  showPart('city', 'lofi');
  setMode('lofi', true);
  listen(page.modes, 'click', e => { const b = e.target.closest('button[data-mode]'); if (b) setMode(b.dataset.mode); });
  listen(window, 'resize', placeModeThumb);
  document.fonts?.ready.then(placeModeThumb);
  setTimeout(placeModeThumb, 900);
  const cycleMode = () => setMode({ lofi: 'mix', mix: 'code', code: 'lofi' }[state.mode]);

  // ---- music: the player under the title, the + button, dropping files on the room
  function updatePlayer() {
    const track = playlist.current;
    page.nowPlaying.textContent = track.artist && !track.builtin ? `${track.title} — ${track.artist}` : track.title;
    page.playSong.setAttribute('aria-pressed', String(state.recordOn));
    page.playSong.setAttribute('aria-label', state.recordOn ? 'Pause music' : 'Play music');
    page.removeSong.hidden = !track.mine;
    const desk = scene.getObjectByName('soundDesk');
    if (desk) desk.userData.hotspot.label = state.recordOn ? 'Stop the show' : 'Start the show';
    if (focused === desk && desk) page.prompt.innerHTML = `${desk.userData.hotspot.label}<b>${IS_TOUCH ? 'Tap' : 'Click'}</b>`;
  }
  function goToTrack(i, announce = true) {
    sound.selectTrack(i);
    updatePlayer();
    if (announce) toast(`♪ ${playlist.current.title}`);
  }
  sound.onEnded = () => goToTrack(playlist.index + 1, false);
  sound.onError = () => {
    if (playlist.current.builtin) return;
    toast(`Couldn’t play “${playlist.current.title}”`);
    setTimeout(() => goToTrack(playlist.index + 1, false), 400);
  };
  async function addSongs(files) {
    const added = await playlist.addFiles([...files]);
    if (!added.length) { toast('Those aren’t audio files'); return; }
    toast(added.length === 1 ? `Added “${playlist.tracks[added[0]].title}”` : `Added ${added.length} songs`);
    goToTrack(added[0], false);
    if (!state.recordOn) ACTIONS.record();
    else updatePlayer();
  }
  listen(page.playSong, 'click', () => ACTIONS.record());
  listen(page.prevSong, 'click', () => goToTrack(playlist.index - 1));
  listen(page.nextSong, 'click', () => goToTrack(playlist.index + 1));
  const volumeSlider = document.getElementById('musicVolume');
  volumeSlider.value = sound.volume;
  listen(volumeSlider, 'input', () => sound.setVolume(parseFloat(volumeSlider.value)));
  listen(volumeSlider, 'change', () => volumeSlider.blur());          // hand the keys back to walking
  for (const ev of ['pointerdown', 'keydown']) listen(volumeSlider, ev, e => e.stopPropagation());
  listen(page.songFile, 'change', () => { if (page.songFile.files.length) addSongs(page.songFile.files); page.songFile.value = ''; });

  // ---- inside the Shaden showcase page (?embed in the address): the page around the room shows the player, the view
  //      switch and the tips, so the room keeps a clean screen. The room tells the page what its controls show, and the
  //      page passes taps back. In fullscreen the page asks for the room's own controls again.
  (() => {
    let inShowcase = false;
    try { inShowcase = window.parent !== window && new URLSearchParams(location.search).has('embed'); } catch { /* not in a frame */ }
    if (!inShowcase) return;
    const root = document.documentElement;
    root.classList.add('embedded');
    const button = el => ({ id: el.id, cls: el.className, label: el.getAttribute('aria-label') || el.title || '', pressed: el.getAttribute('aria-pressed'), icon: el.querySelector('svg')?.outerHTML || '' });
    const state = () => ({
      type: 'shaden-room',
      room: page.roomName?.textContent || document.title,
      song: page.nowPlaying.textContent,
      playing: page.playSong.getAttribute('aria-pressed') === 'true',
      canRemove: !page.removeSong.hidden,
      volume: +(document.getElementById('musicVolume')?.value ?? 1),
      modes: [...page.modes.querySelectorAll('button')].map(b => ({ mode: b.dataset.mode, label: b.textContent.trim(), on: b.getAttribute('aria-checked') === 'true' })),
      extras: [...document.querySelectorAll('.corner button')].map(button),
    });
    let last = '';
    const send = () => {
      const now = state(), text = JSON.stringify(now);
      if (text !== last) { last = text; window.parent.postMessage(now, '*'); }
    };
    new MutationObserver(send).observe(page.ui || document.getElementById('ui'), { subtree: true, childList: true, characterData: true, attributes: true, attributeFilter: ['aria-pressed', 'aria-checked', 'hidden'] });
    const ids = new Set(['prevSong', 'playSong', 'nextSong', 'removeSong', ...state().extras.map(b => b.id)]);
    // the page calls this directly (same site, so a tap there still counts as a tap here) or posts the same thing
    const command = m => {
      if (!m || typeof m !== 'object') return;
      if (m.click && ids.has(m.click)) document.getElementById(m.click)?.click();
      if (m.mode) page.modes.querySelector(`[data-mode="${CSS.escape(m.mode)}"]`)?.click();
      if (m.files?.length) addSongs(m.files);
      if (typeof m.volume === 'number') {
        const v = document.getElementById('musicVolume');
        if (v) { v.value = m.volume; v.dispatchEvent(new Event('input', { bubbles: true })); }
      }
      if ('fullscreen' in m) root.classList.toggle('embedded', !m.fullscreen);
      if ('modesInside' in m) root.classList.toggle('modes-inside', !!m.modesInside);
      if ('phone' in m) root.classList.toggle('embed-phone', !!m.phone);
      if (m.hello) last = '';
      send();
    };
    window.shadenRoom = { command };
    listen(window, 'message', e => { if (e.source === window.parent && e.data?.type === 'shaden-cmd') command(e.data); });
    send();
  })();
  listen(page.removeSong, 'click', async () => {
    const title = playlist.current.title;
    await playlist.remove(playlist.index);
    goToTrack(playlist.index, false);
    toast(`Removed “${title}”`);
  });
  listen(window, 'dragover', e => { if ([...(e.dataTransfer?.types || [])].includes('Files')) { e.preventDefault(); page.player.classList.add('drop'); } });
  listen(window, 'dragleave', e => { if (!e.relatedTarget) page.player.classList.remove('drop'); });
  listen(window, 'drop', e => {
    page.player.classList.remove('drop');
    if (!e.dataTransfer?.files.length) return;
    e.preventDefault();
    addSongs(e.dataTransfer.files);
  });
  playlist.loadSaved().then(added => { if (added.length) toast(`${added.length} of your songs are in the playlist`); updatePlayer(); });
  updatePlayer();

  // ---- the door card
  const closeDoorCard = () => { page.doorCard.hidden = true; };
  listen(page.doorStay, 'click', closeDoorCard);
  listen(page.doorLink, 'click', () => setTimeout(closeDoorCard, 200));
  listen(window, 'keydown', e => { if (e.key === 'Escape' && !page.doorCard.hidden) closeDoorCard(); });

  // ---- pause and sound buttons
  function setPaused(paused) {
    state.paused = paused;
    sound.setPaused(paused);
    page.pause.setAttribute('aria-pressed', String(paused));
    page.pause.setAttribute('aria-label', paused ? 'Play' : 'Pause');
    page.pausedChip.hidden = !paused;
    if (sound.on) crowd.setLevel(paused ? 0.06 : state.show ? 0.12 : 0.45, 0.5);
  }
  listen(page.pause, 'click', () => setPaused(!state.paused));
  listen(page.sound, 'click', () => { sound.toggle(); updateSoundButton(); });
  listen(page.crowdNoise, 'click', () => {
    sound.setCrowdNoise(!sound.crowdOn);
    page.crowdNoise.setAttribute('aria-pressed', String(sound.crowdOn));

    toast(sound.crowdOn ? 'Crowd noise on' : 'Crowd noise off');
  });
  listen(page.prompt, 'click', () => { if (focused) activate(focused); });

  // ---- keyboard: walk, run, pause, FPS
  listen(window, 'keydown', e => {
    if (e.key === 'p' || e.key === 'P') setPaused(!state.paused);
    else if (e.key === 'f' || e.key === 'F') toggleFps();
    else if (e.key === 'h' || e.key === 'H') cycleMode();
    else if (e.key === 'n' || e.key === 'N') goToTrack(playlist.index + 1);
    else if (e.key === 'b' || e.key === 'B') goToTrack(playlist.index - 1);
    else if (e.key === 'e' || e.key === 'E' || e.key === 'Enter') { if (focused && e.target === document.body && !dive.on) activate(focused); }
    else if (e.code === 'Space' && e.target === document.body) { e.preventDefault(); if (!e.repeat) spaceAction(); }
    keys.add(e.code);
    if (e.code.startsWith('Arrow') && e.target === document.body) e.preventDefault();
  });
  listen(window, 'keyup', e => keys.delete(e.code));
  listen(window, 'blur', () => keys.clear());

  // ---- mouse wheel: step forward / back
  listen(window, 'wheel', e => {
    e.preventDefault();
    const unit = e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? innerHeight : 1;
    player.wheel = Math.max(-4, Math.min(4, player.wheel - e.deltaY * unit * 0.01));
  }, { passive: false });

  // ---- drag to look (mouse or one finger); a quick flick glides; a click or tap uses things
  listen(window, 'pointermove', e => {
    if (e.pointerType === 'mouse') { toNdc(e.clientX, e.clientY, mouse.ndc); mouse.inside = true; }
  });
  listen(document.documentElement, 'pointerleave', () => { mouse.inside = false; });
  listen(window, 'pointerdown', e => {
    if (e.target.closest('a, button, .stick') || (e.pointerType === 'mouse' && e.button !== 0) || look.drag) return;
    look.drag = { id: e.pointerId, x: e.clientX, y: e.clientY, startX: e.clientX, startY: e.clientY, startTime: performance.now(), touch: e.pointerType === 'touch' };
    look.yawSpeed = look.pitchSpeed = 0;
    look.lastMove = performance.now();
    document.documentElement.classList.add('dragging');
    look.drag.yaw0 = look.yawTarget;                       // where the view was, in case this is just a click
    look.drag.pitch0 = look.pitchTarget;
  });
  listen(window, 'pointermove', e => {
    const drag = look.drag;
    if (!drag || e.pointerId !== drag.id) return;
    // a click wobbles a few pixels: don't turn until the pointer has clearly moved
    if (!drag.turning && Math.hypot(e.clientX - drag.startX, e.clientY - drag.startY) < 8) return;
    drag.turning = true;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    drag.x = e.clientX;
    drag.y = e.clientY;
    const perPixel = ((1.15 * Math.PI) / innerHeight) * (64 / 90) * 0.85 * (drag.touch ? 1.2 : 1);
    const now = performance.now(), seconds = Math.max(8, now - look.lastMove) / 1000;
    look.lastMove = now;
    look.yawTarget += dx * perPixel;
    look.pitchTarget = clampPitch(look.pitchTarget + dy * perPixel);
    look.yawSpeed += ((dx * perPixel) / seconds * 0.45 - look.yawSpeed) * 0.35;
    look.pitchSpeed += ((dy * perPixel) / seconds * 0.45 - look.pitchSpeed) * 0.35;
  });
  const endDrag = e => {
    const drag = look.drag;
    if (!drag || e.pointerId !== drag.id) return;
    if (performance.now() - look.lastMove > 60) look.yawSpeed = look.pitchSpeed = 0;
    // barely moved and quick: it was a click / tap, so use whatever is there
    const moved = Math.hypot(e.clientX - drag.startX, e.clientY - drag.startY);
    if (!drag.turning) {                                   // a click or tap never moves the view
      look.yawSpeed = look.pitchSpeed = 0;
      look.yawTarget = drag.yaw0;
      look.pitchTarget = drag.pitch0;
    }
    if (e.type === 'pointerup' && moved < 8 && performance.now() - drag.startTime < 400 && !dive.on) {
      look.yawSpeed = look.pitchSpeed = 0;
      const target = hotspotAt(toNdc(e.clientX, e.clientY, new THREE.Vector2()));
      if (target) activate(target);
    }
    look.drag = null;
    document.documentElement.classList.remove('dragging');
  };
  listen(window, 'pointerup', endDrag);
  listen(window, 'pointercancel', endDrag);

  // ---- arrow pad (touch screens): up and down walk, left and right turn. Press anywhere past the middle;
  //      slide your thumb between arrows, or press a corner to walk and turn together.
  const moveStick = e => {
    const box = page.stick.getBoundingClientRect();
    const x = e.clientX - (box.left + box.width / 2), y = e.clientY - (box.top + box.height / 2);
    const length = Math.hypot(x, y), dead = 12;
    if (length < dead) { stick.x = stick.y = 0; }
    else {
      const angle = Math.atan2(y, x), eighth = Math.round(angle / (Math.PI / 4));     // 8 directions
      stick.x = Math.round(Math.cos(eighth * Math.PI / 4));
      stick.y = Math.round(Math.sin(eighth * Math.PI / 4));
    }
    page.stick.classList.toggle('up', stick.y < 0); page.stick.classList.toggle('down', stick.y > 0);
    page.stick.classList.toggle('left', stick.x < 0); page.stick.classList.toggle('right', stick.x > 0);
  };
  listen(page.stick, 'pointerdown', e => {
    e.preventDefault();
    page.stick.setPointerCapture?.(e.pointerId);
    stick.id = e.pointerId;
    page.stick.classList.add('active');
    moveStick(e);
  });
  listen(page.stick, 'pointermove', e => { if (e.pointerId === stick.id) moveStick(e); });
  const releaseStick = e => {
    if (e.pointerId !== stick.id) return;
    stick.id = null;
    stick.x = stick.y = 0;
    page.stick.classList.remove('active', 'up', 'down', 'left', 'right');
  };
  listen(page.stick, 'pointerup', releaseStick);
  listen(page.stick, 'pointercancel', releaseStick);
  listen(page.stick, 'lostpointercapture', releaseStick);

  // ---- two fingers on the scene: walk. Spread them apart to go forward, pinch them together to back up,
  //      or slide them (up/down/sideways). The further from where they landed, the faster, like the joystick;
  //      hold still to keep going. Looking pauses meanwhile.
  const TWO_FINGER_RANGE = 45;   // pixels of slide for full speed
  const PINCH_RANGE = 30;        // pixels of spread (between the two fingers) for full speed
  const clampUnit = v => Math.max(-1, Math.min(1, v));
  const onSceneTouches = e => {
    const touches = Array.from(e.touches).filter(t => !(t.target.closest && t.target.closest('a, button, .stick')));
    if (touches.length >= 2) {
      const midX = (touches[0].clientX + touches[1].clientX) / 2, midY = (touches[0].clientY + touches[1].clientY) / 2;
      const gap = Math.hypot(touches[0].clientX - touches[1].clientX, touches[0].clientY - touches[1].clientY);
      if (!twoFinger.on) {
        twoFinger.on = true;
        twoFinger.startX = midX;
        twoFinger.startY = midY;
        twoFinger.startGap = gap;
        look.drag = null;                              // stop turning while walking with two fingers
        look.yawSpeed = look.pitchSpeed = 0;
        document.documentElement.classList.remove('dragging');
      }
      twoFinger.x = clampUnit((midX - twoFinger.startX) / TWO_FINGER_RANGE);
      twoFinger.y = clampUnit((midY - twoFinger.startY) / TWO_FINGER_RANGE - (gap - twoFinger.startGap) / PINCH_RANGE);
    } else if (twoFinger.on) {
      twoFinger.on = false;
      twoFinger.x = twoFinger.y = 0;
    }
  };
  listen(window, 'touchstart', onSceneTouches, { passive: true });
  listen(window, 'touchmove', onSceneTouches, { passive: true });
  listen(window, 'touchend', onSceneTouches);
  listen(window, 'touchcancel', onSceneTouches);
  listen(window, 'gesturestart', e => e.preventDefault(), { passive: false });   // iPhone: a pinch walks, it doesn't zoom the page

  // ---- FPS readout: #fps in the address, or press F
  let fpsForced = false, fpsFrames = 0, fpsSince = performance.now();
  const updateFpsVisibility = () => { page.fps.hidden = !(fpsForced || location.hash === '#fps'); };
  function toggleFps() { fpsForced = !fpsForced; updateFpsVisibility(); }
  listen(window, 'hashchange', updateFpsVisibility);
  updateFpsVisibility();

  // ---- walking with collisions: walls, then furniture (pushed out the shortest way)
  // you can stand wherever a walkable area (shrunk by your radius) holds you: the field, the stage, the steps
  const canStand = (x, z, r) => WALKABLE.some(a => x >= a.minX + r && x <= a.maxX - r && z >= a.minZ + r && z <= a.maxZ - r);
  function collide(position, prevX = position.x, prevZ = position.z) {
    const r = SETTINGS.playerRadius;

      focused = next;
      page.prompt.hidden = !focused;
      if (focused) page.prompt.innerHTML = `${focused.userData.hotspot.label}<b>${IS_TOUCH ? 'Tap' : 'Click'}</b>`;
      document.documentElement.classList.toggle('can-use', !!focused && !IS_TOUCH);
      page.reticle.classList.toggle('on', !!focused);
    }

    // things that move (frozen while paused)
    sound.update(dt);
    updateShow(dt);
    for (const item of animated) {
      if (item.kind === 'spin' && state.recordOn && !state.paused) item.object.rotation.y -= item.speed * dt;
      else if (item.kind === 'pulse') {
        if (item.object.isLight) { if (!item.object.parent?.userData.off) item.object.intensity = item.base + sound.level * item.amount; }
        else item.object.material.emissiveIntensity = item.base + sound.level * item.amount;
      }

      else if (item.kind === 'flicker') {
        const t = state.time;
        item.object.intensity = item.base * (1 - item.amount + item.amount * (Math.sin(t * 13.1) * Math.sin(t * 7.7 + 1.3) * 0.5 + 0.5));
      } else if (item.kind === 'twinkle') {
        for (let i = 0; i < item.count; i++) {
          const k = 0.75 + 0.25 * Math.sin(state.time * (0.8 + (i % 5) * 0.37) + i * 1.7);
          item.object.setColorAt(i, twinkleColor.copy(item.color).multiplyScalar(k * 1.6));
        }
        item.object.instanceColor.needsUpdate = true;
      } else if (item.kind !== 'spin') animateGroup(item, dt);
    }

    updateFestival(dt);

    if (!state.paused) state.flash *= Math.exp(-dt * 3.2);
    const flash = state.flash * (0.55 + 0.45 * Math.abs(Math.sin(state.time * 31.0)));
    shared.uFlash.value = flash;
    flashLight.intensity = flash * 40 + state.flash * 600;

    // the big stage screens, about 24 times a second
    if (!state.paused) screenClock += dt;
    if (screenClock > 1 / 12) {
      screenClock = 0;
      const live = state.showLevel > 0.5;
      textures.screen.userData.update(state.time, sound.level, live, groove.beats, ['#' + colA.getHexString(), '#' + colB.getHexString()]);
      textures.boothScreen.userData.update(state.time, sound.level, live);
    }

    state.glitch = Math.max(0, state.glitch - dt * 2.2);
    post.uniforms.uGlitch.value = state.glitch;
    updateWaves(dt);
    const holoAmount = MODES[state.mode].room ? 1 : MODES[state.mode].city ? 0.25 : 0;
    post.uniforms.uHolo.value += (holoAmount - post.uniforms.uHolo.value) * approach(6, dt);
    post.uniforms.uTime.value = state.time;
    post.uniforms.uSpeed.value = dive.on ? 0 : Math.min(1, speed / SETTINGS.runSpeed);
    post.composer.render();

    // FPS readout, twice a second
    fpsFrames++;
    if (now - fpsSince >= 500) {
      if (!page.fps.hidden) page.fps.textContent = Math.round((fpsFrames * 1000) / (now - fpsSince)) + ' FPS';
      fpsFrames = 0;
      fpsSince = now;
    }

    // first frame: drop the loader, fade in from black, then show the interface
    if (firstFrame) {
      firstFrame = false;
      requestAnimationFrame(() => {
        page.loader.classList.add('gone');
        page.fade.classList.add('out');
        uiTimer = setTimeout(() => {
          page.ui.classList.add('on');
          if (!IS_TOUCH) toast('Press ▶ or Space to start the show · steps up to the stage on the right');
        }, 700);
      });
    }
  }
  frameId = requestAnimationFrame(frame);

  // coming back with the browser's Back button after leaving through a door
  listen(window, 'pageshow', e => { if (e.persisted) page.fade.classList.remove('leaving'); });

  // ---- clean-up: stop everything and free graphics memory
  function dispose() {
    cancelAnimationFrame(frameId);
    clearTimeout(uiTimer);
    clearTimeout(toastTimer);
    listeners.abort();
    timer.dispose?.();
    scene.traverse(object => {
      object.geometry?.dispose();
      for (const material of [].concat(object.material || [])) {
        for (const value of Object.values(material)) if (value?.isTexture) value.dispose();
        material.dispose();
      }
    });
    Object.values(textures).forEach(texture => texture.dispose());
    post.composer.dispose();
    renderer.dispose();
    renderer.domElement.remove();
    sound.dispose();
  }
  return { dispose };
}


// ---- go: let the loading dot paint first, then build the room
// (window.room.dispose() stops it and frees its memory)
if (THREE) {
  requestAnimationFrame(() => setTimeout(async () => {
    try {
      window.room = await startRoom();
    } catch (error) {
      showLoadError(error);
    }
  }, 30));
}
</script>
</body>
</html>
